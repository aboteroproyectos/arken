name: ARKEN PRECIOS

# Pruebas de ARKEN PRECIOS (carpeta precios/): el núcleo de cálculo, el Investigador IA con la
# API de Claude simulada (nunca con una clave real), el motor de recolección y sus conectores con
# sitios de prueba locales (nunca los sitios reales), el servidor opcional, la ida y vuelta con el
# programa/ARKEN_CONTROL.html real de este repositorio, la prueba de humo, la analítica completa
# (tablero, alertas, comparador y precio puesto en obra) y la capa de las apps en Chromium.
# También se comprueba que el SDK de Anthropic que va dentro del programa es el oficial, sin
# cambios. Corren también cuando cambia ARKEN CONTROL, porque el contrato de importación vive
# allí. Las apps se compilan y la de escritorio se prueba empacada en compilar-precios.yml.

on:
  push:
    branches: [main]
    paths:
      - 'precios/**'
      - 'programa/ARKEN_CONTROL.html'
      - '.github/workflows/precios.yml'
  pull_request:
    paths:
      - 'precios/**'
      - 'programa/ARKEN_CONTROL.html'
      - '.github/workflows/precios.yml'
  workflow_dispatch:

concurrency:
  group: precios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas de ARKEN PRECIOS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: precios
    env:
      CHROME_PATH: /usr/bin/google-chrome
      # Estas pruebas no abren Electron: la app empacada se prueba en compilar-precios.yml.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            precios/package-lock.json
            precios/herramientas/sdk/package-lock.json
      # Sin las dependencias opcionales de pdf.js (canvas): las pruebas solo leen el texto de los PDF.
      - run: npm ci --omit=optional
      # El SDK oficial y esbuild, con sus versiones fijas, para rehacer el bloque del SDK y compararlo.
      # Aquí sí van las dependencias opcionales: el binario de esbuild es una de ellas.
      - run: npm run sdk:instalar
      - name: El programa no trae datos de la empresa
        run: npm run verificar-sin-datos
      - name: El SDK incrustado es el oficial de Anthropic, sin cambios
        run: npm run sdk:comprobar
      - name: Núcleo de cálculo (formatos de precio, unidades, IVA, AIU, estadística, mano de obra)
        run: npm run prueba:unitarias
      - name: Investigador IA (verificación literal, bandejas, costo y clave) con la API simulada
        run: npm run prueba:investigador
      - name: Motor (robots.txt, ritmo por dominio, caché, salud y conectores) con sitios de prueba
        run: npm run prueba:motor
      - name: Recolección (emparejamiento, verificación de cada hallazgo y paquetes)
        run: npm run prueba:recoleccion
      - name: El motor dentro del programa (certificar, probar, activar y leer una fuente)
        run: npm run prueba:motor-navegador
      - name: Servidor de recolección opcional (token, programación y paquetes)
        run: npm run prueba:servidor
      - name: Ida y vuelta con ARKEN CONTROL real
        run: npm run prueba:ida-y-vuelta
      - name: Prueba de humo en Chromium (módulos, exportaciones, temas, densidades y 360 px)
        run: npm run prueba:humo
      - name: Analítica completa (tablero, IPC, canastas, alertas, comparador y precio puesto en obra)
        run: npm run prueba:analitica
      - name: Capa de las apps (copia interna, bóveda, Android simulado) en Chromium
        run: npm run prueba:app
