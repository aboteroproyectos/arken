name: Compilar ARKEN CONTROL

# Cada cambio en main compila las cuatro apps; los instaladores quedan en la pestaña Actions
# (sección «Artifacts» de cada ejecución) y se descargan tal cual, sin .zip. Una etiqueta
# vX.Y.Z publica además una versión en «Releases» con los cuatro instaladores.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── El programa, la capa de la app y la app de escritorio, probados en Linux ───
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: El programa no trae datos de la empresa
        run: npm run verificar-sin-datos
      - name: Preparar la app
        run: npm run preparar
      - name: Prueba de humo en Chromium (navegador, escritorio y Android simulados)
        run: npm run prueba
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Empaquetar la app de escritorio para Linux
        run: npx electron-builder --linux dir --publish never
      - name: Prueba de la app de escritorio empaquetada
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a npm run prueba:escritorio

  android:
    name: Android
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Versión
        id: version
        run: echo "nombre=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Preparar la app
        run: npm run preparar && npx cap sync android
      - name: Clave de firma
        id: firma
        env:
          ARKEN_FIRMA_CLAVE: ${{ secrets.ARKEN_FIRMA_CLAVE }}
        run: |
          if [ -z "$ARKEN_FIRMA_CLAVE" ]; then
            echo "::warning title=Falta la clave de firma::Sin el secreto ARKEN_FIRMA_CLAVE se compila Android para verificar, pero no se entrega el APK. Vea el README."
            echo "hay=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/firma/arken.jks.enc -out "$RUNNER_TEMP/arken.jks" -pass env:ARKEN_FIRMA_CLAVE
          echo "archivo=$RUNNER_TEMP/arken.jks" >> "$GITHUB_OUTPUT"
          echo "hay=si" >> "$GITHUB_OUTPUT"
      - name: Compilar el APK
        working-directory: android
        env:
          ARKEN_FIRMA_ARCHIVO: ${{ steps.firma.outputs.archivo }}
          ARKEN_FIRMA_CLAVE: ${{ secrets.ARKEN_FIRMA_CLAVE }}
          ARKEN_VERSION_CODE: ${{ github.run_number }}
          ARKEN_VERSION_NAME: ${{ steps.version.outputs.nombre }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Nombrar el APK
        if: steps.firma.outputs.hay == 'si'
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/ARKEN-CONTROL-${{ steps.version.outputs.nombre }}-Android.apk"
      - uses: actions/upload-artifact@v7
        if: steps.firma.outputs.hay == 'si'
        with:
          archive: false
          path: salida/*.apk
          if-no-files-found: error
      - name: Resumen
        if: steps.firma.outputs.hay != 'si'
        run: |
          {
            echo "### Android compilado, pero sin APK para instalar"
            echo "Falta el secreto **ARKEN_FIRMA_CLAVE**. Créelo en *Settings › Secrets and variables › Actions*"
            echo "con la clave de firma (vea el README) y vuelva a ejecutar esta compilación."
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS (sin firma)
    needs: pruebas
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versión
        id: version
        run: echo "nombre=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Preparar la app
        run: npm run preparar && npx cap sync ios
      - name: Compilar
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ steps.version.outputs.nombre }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build
      - name: Empaquetar (.ipa sin firma)
        run: |
          mkdir -p Payload salida
          cp -R build/ios/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "salida/ARKEN-CONTROL-${{ steps.version.outputs.nombre }}-iOS-sin-firma.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: salida/*.ipa
          if-no-files-found: error

  windows:
    name: Windows
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalador
        run: npm run preparar && npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/*.exe
          if-no-files-found: error

  mac:
    name: macOS
    needs: pruebas
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalador (Apple Silicon e Intel)
        run: npm run preparar && npx electron-builder --mac dmg --universal --publish never
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/*.dmg
          if-no-files-found: error

  # ─── Publicación: solo con una etiqueta de versión (vX.Y.Z) ───
  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: ARKEN CONTROL ${{ github.ref_name }}
          files: |
            instaladores/**/*.apk
            instaladores/**/*.exe
            instaladores/**/*.dmg
            instaladores/**/*.ipa
          fail_on_unmatched_files: true
          body: |
            **Android:** ARKEN-CONTROL-…-Android.apk · **Windows:** ARKEN-CONTROL-…-Windows.exe · **macOS:** ARKEN-CONTROL-…-macOS.dmg
            **iOS:** ARKEN-CONTROL-…-iOS-sin-firma.ipa (requiere firmarse para instalarse; vea el README).
