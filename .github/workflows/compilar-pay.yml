name: Compilar ARKEN PAY

# Cada cambio de ARKEN PAY (carpeta pay/) se prueba y compila el instalador de Windows. El .exe queda
# en la pestaña Actions (sección «Artifacts» de cada ejecución) y se descarga tal cual, sin .zip.
# Una etiqueta pay-vX.Y.Z publica además la versión en «Releases».

on:
  push:
    branches: [main]
    tags: ['pay-v*']
    paths:
      - 'pay/**'
      - '.github/workflows/compilar-pay.yml'
  pull_request:
    paths:
      - 'pay/**'
      - '.github/workflows/compilar-pay.yml'
  workflow_dispatch:

concurrency:
  group: compilar-pay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: pay

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pay/package-lock.json
      - run: npm ci
      - name: Núcleo, nube simulada e interfaz en Chromium
        run: npm run prueba
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: App de escritorio (Electron) con datos en disco
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run prueba:escritorio

  windows:
    name: Windows
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pay/package-lock.json
      - run: npm ci
      - name: Instalador
        run: npm run dist:windows
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: pay/dist/*.exe
          if-no-files-found: error

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/pay-v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: ARKEN PAY ${{ github.ref_name }}
          files: instaladores/**/*.exe
          fail_on_unmatched_files: true
