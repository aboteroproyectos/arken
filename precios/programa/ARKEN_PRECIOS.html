  /* ═══════════ PDF de la base por categorías (§10.3) ═══════════ */
  function documentoBase(op){
    const r = filas(Object.assign({}, op, { incluirDemo:op.incluirDemo !== false }));
    const ciudadNombre = Datos.nombreCiudad(op.ciudad);
    const visibles = r.filas.filter(f => !op.soloConPrecio || f.precio.valor > 0);
    const body = [];
    let g0 = null, c0 = null;
    visibles.slice().sort((a,b) => (a.ins.grupo < b.ins.grupo ? -1 : (a.ins.grupo > b.ins.grupo ? 1 : (a.ins.categoria < b.ins.categoria ? -1 : (a.ins.categoria > b.ins.categoria ? 1 : (a.ins.codigo < b.ins.codigo ? -1 : 1))))))
      .forEach(f => {
        if (f.ins.grupo !== g0){ g0 = f.ins.grupo; c0 = null; const g = Datos.grupo(g0); body.push({ _clase:'cap', celdas:[{ content:(g ? g.codigo + ' · ' + g.nombre : g0).toUpperCase(), colSpan:9 }] }); }
        if (f.ins.categoria !== c0){ c0 = f.ins.categoria; body.push({ _clase:'sub', celdas:[{ content:c0, colSpan:9 }] }); }
        const v = f.v || {};
        const etiqueta = f.precio.origen === 'adoptado' ? 'Adoptado' : (UI.NOMBRE_CONF[v.confianza] || 'Sin dato');
        body.push([f.ins.codigo, f.ins.descripcion + (v.dependeDemo ? ' [DEMO]' : ''), f.ins.unidad,
          { content:f.precio.valor > 0 ? money3(f.precio.valor) : '—', styles:{ halign:'right' } },
          { content:v.minimo > 0 ? money3(v.minimo) : '—', styles:{ halign:'right' } },
          { content:v.maximo > 0 ? money3(v.maximo) : '—', styles:{ halign:'right' } },
          { content:String(v.n || 0), styles:{ halign:'right' } }, etiqueta, v.fecha && !v.sinActualizar ? fmtFecha(v.fecha) : 'Sin actualizar']);
      });
    const conMercado = visibles.filter(f => f.v && f.v.n > 0).length, refs = visibles.filter(f => f.v && f.v.soloReferencia).length;
    const demo = visibles.some(f => f.v && f.v.dependeDemo);
    return {
      titulo:op.titulo || 'Base de precios · ' + ciudadNombre, documento:'Base de precios', orientacion:'l',
      contexto:ciudadNombre + ' · ' + (r.corte ? r.corte.nombre : 'precios vigentes'),
      subtitulo:(r.corte ? 'Corte «' + r.corte.nombre + '» del ' + fmtFecha(r.corte.fecha) + (r.corte.cerrado ? ' (cerrado)' : ' (abierto)') : 'Precios vigentes al ' + fmtFechaLarga(hoyISO())) +
        ' · precios por unidad, con IVA incluido.',
      nombre:nombreArchivoSeguro('ARKEN_PRECIOS_base_' + ciudadNombre + '_' + (r.corte ? r.corte.nombre : hoyISO())),
      bloques:[
        { t:'kv', cols:3, pares:[['Ciudad', ciudadNombre], ['Insumos', visibles.length], ['Con precio de mercado', conMercado],
          ['Solo referencia', refs], ['Precio mostrado', NOMBRE_PRECIO[op.precio || 'adoptado']], ['Categorías', op.descripcionAlcance || 'Todas']] },
        demo ? { t:'nota', txt:'ATENCIÓN: este documento incluye datos de demostración (sintéticos), marcados [DEMO]. No son precios de mercado.' } : null,
        { t:'nota', txt:'Precio recomendado: mediana ponderada de las observaciones válidas de los últimos ' + Consolidacion.parametros(Datos.config('consolidacion', {})).ventanaDias +
          ' días (confiabilidad de la fuente × frescura × tipo de precio), sin atípicos. «Referencia» es el precio de partida del catálogo de ARKEN, sin fecha de mercado.' },
        { t:'tabla', tam:6.8, head:[['Código','Descripción','Unidad','Precio con IVA','Mínimo','Máximo','n','Confianza','Fecha']], body,
          anchos:{ 0:{ cellWidth:17 }, 2:{ cellWidth:12 }, 3:{ cellWidth:24 }, 4:{ cellWidth:22 }, 5:{ cellWidth:22 }, 6:{ cellWidth:8 }, 7:{ cellWidth:18 }, 8:{ cellWidth:19 } } }
      ].filter(Boolean)
    };
  }

  return { NOMBRE_PRECIO, ciudadesConMercado, ciudadesPorDefecto, elegirPrecio, filas, filtroCategorias, renglonesArken, excelArken,
           intercambio, excelAnalisis, documentoBase, aBase64 };
})();

/* ══════════════════════════════════════════════════════════════════════════
   TABLERO: AGREGADOS EN EL WORKER (§13)
   La página manda las observaciones compactas una vez por cambio; cada
   consulta del tablero viaja solo con los filtros.
   ══════════════════════════════════════════════════════════════════════════ */
const Tablero = (function(){
  let version = -1, enviando = null;
  function invalidar(){ version = -1; }
  async function asegurar(){
    if (version === Datos.versionObs) return;
    if (enviando) return enviando;
    const v = Datos.versionObs;
    enviando = (async () => {
      const obs = [];
      Datos.obsTodas().forEach(o => { if (o.estado === 'válida' && o.tipoPrecio !== 'referencia' && o.precioConIva > 0 && o.tipoPrecio !== 'promoción' && !o.esDesde) obs.push(Agregados.compactar(o)); });
      const ins = {};
      Datos.insumos().forEach(i => { ins[i.id] = { g:i.grupo, c:i.categoria, a:i.categoriaArken }; });
      await Trabajador.pedir({ tipo:'agregados', obs, insumos:ins });
      version = v;
    })();
    try { await enviando; } finally { enviando = null; }
  }
  async function consultar(filtros){
    const t0 = performance.now();
    await asegurar();
    const r = await Trabajador.pedir({ tipo:'tablero', filtros });
    r.msTotal = Math.round(performance.now() - t0);
    return r;
  }
  return { invalidar, asegurar, consultar };
})();


/* ══════════════════════════════════════════════════════════════════════════
   APLICACIÓN: riel, cinta, navegación y apariencia
   ══════════════════════════════════════════════════════════════════════════ */
const Vistas = {};

const App = (function(){
  let pintando = false, pendienteCinta = null;

  /* ═══════════ Riel de módulos ═══════════ */
  function pintarRail(){
    $('#railList').innerHTML = MODULOS.map(m => '<button class="nav-item' + (m.id === Sesion.moduloActivo ? ' active' : '') +
      '" data-m="' + m.id + '" type="button"><span class="nav-n">' + m.id + '</span><span class="nav-t">' + esc(m.corto) + '</span></button>').join('');
    $$('#railList .nav-item').forEach(b => b.onclick = () => ir(b.dataset.m));
    const u = Sesion.usuario;
    $('#railUser').innerHTML = u ? '<b>' + esc(u.nombre || u.usuario) + '</b><br>' + esc(Permisos.rolNombre(u.rol)) +
      '<br><button class="btn xs ghost" id="btnMiClave" type="button" style="margin-top:4px">Cambiar mi contraseña</button>' : '';
    if ($('#btnMiClave')) $('#btnMiClave').onclick = () => Auth.cambiarPropia();
    $('#btnAdmin').style.display = Permisos.esAdmin() ? '' : 'none';
    $('#btnActualizar').style.display = Permisos.puede('actualizar') ? '' : 'none';
  }

  /* ═══════════ Cinta de totales ═══════════ */
  function resumen(){
    return Datos.memorizar('cinta', ['obs', 'cons', 'insumos', 'ejecuciones', 'cortes', 'configuracion', 'fuentes'], () => {
      const ref = Datos.ciudadReferencia();
      const cod = ref ? ref.codigoDivipola : '';
      const P = Consolidacion.parametros(Datos.config('consolidacion', {}));
      let mercado = 0, conMercado = 0, frescos = 0;
      Datos.obsTodas().forEach(o => { if (o.tipoPrecio !== 'referencia') mercado++; });
      const hoy = hoyISO();
      Datos.consolidados().forEach(c => {
        if (c.ciudad !== cod) return;
        if (c.n > 0){ conMercado++; if (diasEntre(c.fecha, hoy) <= P.diasDesactualizado) frescos++; }
      });
      const ejs = Datos.lista('ejecuciones').filter(e => e.fin).sort((a,b) => a.fin < b.fin ? 1 : -1);
      return { insumos:Datos.insumosActivos().length, mercado, conMercado, frescos, ciudad:ref ? ref.nombre : '—',
               ultima:ejs[0] ? ejs[0].fin : null, corte:Datos.corteActivo(), demo:Datos.lista('fuentes').some(f => f.esDemo) };
    });
  }
  function celda(lab, val, sub){
    return '<div class="ledger-cell"><div class="lab">' + esc(lab) + '</div><div class="val">' + val + '</div>' +
      (sub ? '<div class="lab" style="margin:2px 0 0;text-transform:none;letter-spacing:0">' + sub + '</div>' : '') + '</div>';
  }
  function pintarCinta(){
    const r = resumen();
    const cob = r.insumos ? Math.round(100 * r.conMercado / r.insumos) : 0;
    $('#ledger').innerHTML =
      celda('Insumos activos', String(r.insumos), 'Catálogo con su unidad') +
      celda('Observaciones', moneyPlano(r.mercado), 'Precios de mercado registrados') +
      '<div class="ledger-cell grow"><div class="lab">Con precio de mercado · ' + esc(r.ciudad) + '</div><div class="val">' + r.conMercado + ' de ' + r.insumos +
        '</div><div class="ledger-bar"><i style="width:' + cob + '%"></i></div></div>' +
      celda('Última actualización', r.ultima ? esc(fmtSello(r.ultima).slice(0, 10)) : 'Nunca', r.ultima ? r.frescos + ' frescos (≤ ' + Consolidacion.parametros(Datos.config('consolidacion', {})).diasDesactualizado + ' días)' : 'Use «Actualizar precios»') +
      '<div class="ledger-cell total"><div class="lab">Corte activo</div><div class="val">' + esc(r.corte ? r.corte.nombre : 'Sin corte') + '</div></div>';
    const ctx = r.ciudad + ' · ' + (r.corte ? r.corte.nombre + (r.corte.cerrado ? '' : ' (abierto)') : 'sin corte activo');
    $('#tbCtx').textContent = ctx;
    pintarBandas(r);
  }
  /** Banda de demostración: arriba de cada módulo mientras haya datos sintéticos. */
  function pintarBandas(r){
    const z = $('#bannerZona');
    const existe = $('#bandaDemo');
    if (r.demo && !existe){
      const d = document.createElement('div');
      d.className = 'banner'; d.id = 'bandaDemo';
      d.innerHTML = '<b>DEMOSTRACIÓN</b><span class="grow">Hay datos sintéticos de demostración cargados (rotulados DEMO). No son precios de mercado.</span>' +
        (Permisos.esAdmin() ? '<button class="btn sm" id="bdBorrar" type="button">Borrar la demostración</button>' : '');
      z.appendChild(d);
      const b = $('#bdBorrar'); if (b) b.onclick = () => Admin.borrarDemo();
    } else if (!r.demo && existe) existe.remove();
  }
  /** Repinta la cinta como mucho una vez por cuadro, aunque lleguen muchos cambios juntos. */
  function cintaLuego(){
    if (pendienteCinta || !Sesion.usuario) return;
    pendienteCinta = requestAnimationFrame(() => { pendienteCinta = null; try { pintarCinta(); } catch(e){ RegistroTecnico.anotar('Cinta', e); } });
  }

  /* ═══════════ Navegación ═══════════ */
  function ir(id, opciones){
    if (!MODULOS.some(m => m.id === id)) id = '00';
    if (Sesion.moduloActivo !== id && Sesion.salidaPendiente && Sesion.salidaPendiente() === false) return;
    Sesion.salidaPendiente = null;
    Sesion.moduloActivo = id;
    if (opciones) Sesion.opciones = opciones;
    pintarRail();
    render();
    window.scrollTo({ top:0, behavior:'instant' });
  }
  function render(){
    const fn = Vistas['m' + Sesion.moduloActivo];
    const st = $('#stage');
    if (pintando) return;
    pintando = true;
    const y = window.scrollY;
    try {
      if (!fn){ st.innerHTML = UI.vacio('◌', 'Módulo en blanco', 'No hay vista para este módulo.'); return; }
      const r = fn(st);
      if (r && r.catch) r.catch(e => falla(st, e));
      window.scrollTo(0, y);
    } catch(e){ falla(st, e); }
    finally { pintando = false; }
    try { pintarCinta(); } catch(e){ RegistroTecnico.anotar('Cinta', e); }
  }
  function falla(st, e){
    RegistroTecnico.anotar('Pintar módulo ' + Sesion.moduloActivo, e);
    st.innerHTML = '<div class="card"><div class="card-body"><div class="warn-box"><div class="ic">⚠</div><div><b>No fue posible pintar el módulo</b>' +
      '<div class="small">' + esc(e && e.message ? e.message : String(e)) + '</div><div class="small muted">El detalle quedó en Administración › Registro técnico.</div></div></div></div></div>';
  }
  function refrescar(){ render(); }

  /** Cabecera de módulo, idéntica a la de ARKEN. */
  function cabecera(num, titulo, sub, acciones){
    const m = MODULOS.find(x => x.id === num);
    return (Permisos.soloConsulta() && num !== '11' ? '<div class="banda-lectura">Rol de <b>consulta</b>: puede ver y exportar. Los cambios los hace un analista de costos o el administrador.</div>' : '') +
      '<div class="page-head"><div><div class="eyebrow">Módulo ' + num + '</div><h1>' + esc(titulo || (m ? m.nom : '')) + '</h1>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div><div class="head-actions">' + (acciones || '') + '</div></div>';
  }

  /* ═══════════ Apariencia ═══════════ */
  function aplicarConfig(){
    const a = Datos.config('apariencia', {}) || {};
    const raiz = document.documentElement;
    raiz.dataset.density = a.densidad || 'normal';
    raiz.dataset.tema = a.tema || 'claro';
    if (a.colorPrimario) raiz.style.setProperty('--ink', a.colorPrimario); else raiz.style.removeProperty('--ink');
    if (a.colorSecundario) raiz.style.setProperty('--brass', a.colorSecundario); else raiz.style.removeProperty('--brass');
    if (a.fuente) raiz.style.setProperty('--font-body', '"' + String(a.fuente).replace(/["\\]/g, '') + '",system-ui,sans-serif'); else raiz.style.removeProperty('--font-body');
    raiz.style.setProperty('--logo-escala', String((Number(a.escalaLogo) || 200) / 100));
    pintarLogoEmpresa();
  }
  function pintarLogoEmpresa(){
    const s = $('#logoEmpresa');
    const emp = Datos.config('empresa', {}) || {};
    const logo = /^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,/i.test(emp.logo || '') ? emp.logo : '';
    if (logo){ s.className = 'logo-slot has-logo'; s.innerHTML = '<img src="' + esc(logo) + '" alt="Logo de la empresa">'; }
    else { s.className = 'logo-slot'; s.textContent = 'Logo empresa'; }
  }

  /* ═══════════ Entrada al sistema ═══════════ */
  async function abrirSistema(){
    $('#gate').style.display = 'none';
    $('#topbar').style.display = ''; $('#ledger').style.display = ''; $('#shell').style.display = '';
    aplicarConfig();
    Sesion.moduloActivo = '00';
    Sesion.ultimaActividad = Date.now();
    pintarRail();
    render();
    Auth.vigilarInactividad();
    $('#btnSalir').onclick = () => Auth.salir();
    $('#btnCfg').onclick = () => ir('10');
    $('#btnAyuda').onclick = () => ir('11');
    $('#btnAdmin').onclick = () => Admin.abrir();
    $('#btnActualizar').onclick = () => ir('02');
    $('#logoEmpresa').onclick = () => { if (Permisos.esAdmin()){ Sesion.tabs['10'] = 'apariencia'; ir('10'); } };
    if (BD.backend === 'memoria') UI.bannerMemoria('El navegador no permitió usar la base local (IndexedDB).');
    if (Sesion.copiaPendiente && Permisos.esAdmin()){
      const emb = Sesion.copiaPendiente; Sesion.copiaPendiente = null;
      setTimeout(() => Arranque.ofrecerCopia(emb), 300);
    }
    const ult = Datos.config('ultimoRespaldo', null);
    if (Permisos.esAdmin() && Datos.totalObs() > 400 && (!ult || diasEntre(String(ult).slice(0,10), hoyISO()) > 15))
      UI.toast('Han pasado más de 15 días sin descargar un respaldo (Administración › Respaldos).', 'bad');
  }

  Eventos.on('cambio', cintaLuego);
  Eventos.on('observaciones', () => { Tablero.invalidar(); cintaLuego(); });
  Eventos.on('consolidados', cintaLuego);

  return { pintarRail, pintarCinta, ir, render, refrescar, cabecera, aplicarConfig, pintarLogoEmpresa, abrirSistema };
})();

/* ══════════════════════════════════════════════════════════════════════════
   ARRANQUE: base local, semilla y pantalla de bienvenida
   ══════════════════════════════════════════════════════════════════════════ */
const Arranque = (function(){
  /** Fuentes propias del programa: los precios que digita el usuario y el
      costo empresa calculado en Mano de obra. */
  function fuentesBase(ahora){
    const base = { urlBase:'', ciudades:[], categorias:[], configuracion:{}, limitePorMinuto:0, ultimaPrueba:null, esDemo:false, creado:ahora,
                   revisionLegal:{ robotsTxt:'', terminos:'', fecha:'', responsable:'', resultado:'no aplica' } };
    return [
      Object.assign({}, base, { id:'manual', nombre:'Precio registrado a mano', tipo:'manual', alcance:'ciudad', metodo:'manual', confiabilidad:0.7, salud:'activa',
        notas:'Precio que digita un usuario con su soporte (llamada, visita, factura). Queda con el usuario y la fecha.' }),
      Object.assign({}, base, { id:'costo-empresa', nombre:'Costo empresa de mano de obra (cálculo)', tipo:'cálculo', alcance:'ciudad', metodo:'cálculo', confiabilidad:0.9, salud:'activa',
        notas:'Costo para la empresa calculado en el módulo 05 con los parámetros laborales vigentes.' })
    ];
  }
  function taxonomiaSemilla(){
    return Semilla.TAXONOMIA.map(t => ({ codigo:t[0], nombre:t[1], categoriaArken:t[2], categorias:t[3].slice() }));
  }
  function cuadrillasSemilla(insumos){
    return Semilla.cuadrillas(insumos).map((c, i) => Object.assign({ id:'cua-' + String(i + 1).padStart(2, '0') }, c));
  }

  async function sembrar(){
    const ahora = ahoraISO();
    const insumos = Semilla.catalogo(ahora);
    const refs = Semilla.observacionesReferencia(insumos, ahora);
    const admin = await Auth.usuarioInicial();
    await BD.escribir({ poner:{
      taxonomia:taxonomiaSemilla(), insumos, equivalenciasArken:Semilla.equivalencias(insumos), ciudades:Semilla.ciudades(),
      fuentes:Semilla.fuentes(ahora).concat(fuentesBase(ahora)), parametros:Semilla.parametros(ahora), cuadrillas:cuadrillasSemilla(insumos),
      usuarios:[admin],
      configuracion:[{ id:'semillaVersion', valor:Semilla.VERSION, actualizado:ahora }, { id:'ciudadReferencia', valor:Semilla.CIUDAD_REFERENCIA, actualizado:ahora },
                     { id:'instalado', valor:ahora, actualizado:ahora }]
    } });
    for (let i = 0; i < refs.length; i += 2000) await BD.ponerVarios('observaciones', refs.slice(i, i + 2000));
    await Auditoria.registrar('instalación', 'Semilla ' + Semilla.VERSION + ': ' + insumos.length + ' insumos y ' + refs.length + ' precios de referencia de ARKEN');
  }

  /** Primera apertura de una copia con datos: se siembra desde lo que trae el archivo. */
  async function sembrarDesdeCopia(emb){
    const c = emb.contenido, ahora = ahoraISO();
    const insumos = c.insumos || [];
    const refs = Semilla.observacionesReferencia(insumos, ahora);
    const admin = await Auth.usuarioInicial();
    const cortes = (c.cortes || []).map(x => Object.assign({}, x, { cerrado:true, importado:ahora }));
    const fuentes = (c.fuentes || []).slice();
    fuentesBase(ahora).forEach(f => { if (!fuentes.some(x => x.id === f.id)) fuentes.push(f); });
    await BD.escribir({ poner:{
      taxonomia:c.taxonomia && c.taxonomia.length ? c.taxonomia : taxonomiaSemilla(), insumos, equivalenciasArken:c.equivalenciasArken || [],
      ciudades:c.ciudades && c.ciudades.length ? c.ciudades : Semilla.ciudades(), fuentes, parametros:c.parametros && c.parametros.length ? c.parametros : Semilla.parametros(ahora),
      cuadrillas:cuadrillasSemilla(insumos), cortes, usuarios:[admin],
      configuracion:(c.configuracion || []).concat([{ id:'semillaVersion', valor:Semilla.VERSION, actualizado:ahora }, { id:'instalado', valor:ahora, actualizado:ahora },
        { id:'copiaOrigen', valor:emb.hash, actualizado:ahora }]).concat(cortes[0] ? [{ id:'corteActivo', valor:cortes[0].id, actualizado:ahora }] : [])
    } });
    for (let i = 0; i < refs.length; i += 2000) await BD.ponerVarios('observaciones', refs.slice(i, i + 2000));
    await Auditoria.registrar('instalación desde copia', 'Copia del ' + fmtSello(emb.generado) + ': ' + insumos.length + ' insumos' + (cortes[0] ? ', corte ' + cortes[0].nombre : ''));
  }

  /** Lo mínimo que debe existir siempre, aunque venga de un respaldo viejo. */
  async function asegurarBasicos(){
    const ahora = ahoraISO();
    const fuentes = await BD.todos('fuentes');
    const faltan = fuentesBase(ahora).filter(f => !fuentes.some(x => x.id === f.id));
    if (faltan.length) await BD.ponerVarios('fuentes', faltan);
    const usuarios = await BD.todos('usuarios');
    if (!usuarios.some(u => u.rol === 'administrador' && u.activo !== false)) await BD.poner('usuarios', await Auth.usuarioInicial());
    if (!(await BD.obtener('configuracion', 'ciudadReferencia'))) await BD.poner('configuracion', { id:'ciudadReferencia', valor:Semilla.CIUDAD_REFERENCIA, actualizado:ahora });
    if (!(await BD.contar('taxonomia'))) await BD.ponerVarios('taxonomia', taxonomiaSemilla());
  }

  /** Copia con datos abierta sobre una base que ya tiene datos: revisión antes de importar. */
  async function ofrecerCopia(emb){
    const c = emb.contenido;
    const paquete = Formatos.envolver(Formatos.PAQUETE, { insumos:c.insumos || [], taxonomia:c.taxonomia || [], equivalenciasArken:c.equivalenciasArken || [],
      ciudades:c.ciudades || [], fuentes:c.fuentes || [], cortes:c.cortes || [] }, { programa:'ARKEN PRECIOS', descripcion:'Datos embebidos en este archivo (copia del ' + fmtSello(emb.generado) + ')' });
    await Datos.fijarConfig('copiaRevisada', emb.hash);
    await Respaldos.importarPaquete(paquete);
  }

  async function iniciar(){
    const backend = await BD.abrir();
    const emb = Respaldos.embebidos();
    const n = await BD.contar('insumos');
    if (!n){ if (emb) await sembrarDesdeCopia(emb); else await sembrar(); }
    await asegurarBasicos();
    await Datos.cargar();
    if (n && emb && Datos.config('copiaRevisada', null) !== emb.hash && Datos.config('copiaOrigen', null) !== emb.hash) Sesion.copiaPendiente = emb;
    Auth.conectar();
    UI.marcaGuardado();
    return backend;
  }
  return { iniciar, sembrar, ofrecerCopia, fuentesBase, taxonomiaSemilla, cuadrillasSemilla };
})();

/* ══════════════════════════════════════════════════════════════════════════
   PIEZAS COMUNES DE LAS VISTAS
   ══════════════════════════════════════════════════════════════════════════ */
const Piezas = (function(){
  /** Selector de ciudad (activas, la de referencia primero). */
  function opcionesCiudad(incluirInactivas){
    return (incluirInactivas ? Datos.ciudades() : Datos.ciudadesActivas()).map(c => ({ v:c.codigoDivipola, n:c.nombre + (c.esReferencia || c.codigoDivipola === (Datos.ciudadReferencia() || {}).codigoDivipola ? ' (referencia)' : '') }));
  }
  function ciudadActual(){
    const c = Sesion.ciudad && Datos.ciudad(Sesion.ciudad) ? Sesion.ciudad : (Datos.ciudadReferencia() || {}).codigoDivipola;
    Sesion.ciudad = c;
    return c;
  }
  function opcionesGrupo(){ return Datos.taxonomia().map(g => ({ v:g.codigo, n:g.codigo + ' · ' + g.nombre })); }
  function opcionesCorte(soloCerrados){
    return Datos.cortes().filter(c => !soloCerrados || c.cerrado).map(c => ({ v:c.id, n:c.nombre + ' · ' + fmtFecha(c.fecha) + (c.cerrado ? '' : ' (abierto)') + (c.incluyeDemo ? ' · DEMO' : '') }));
  }
  /** Precio con su rótulo pequeño (confianza, referencia, demostración, adoptado). */
  function precioHTML(valor, rotulos, boton){
    const v = valor > 0 ? money3(valor) : '—';
    const inner = '<span class="precio"><span class="v">' + v + '</span>' + (rotulos ? '<span class="s">' + rotulos + '</span>' : '') + '</span>';
    return boton ? '<button class="lnk-precio" type="button" ' + boton + '>' + inner + '</button>' : inner;
  }
  function rotulosPrecio(v, adoptado){
    const r = [];
    if (adoptado) r.push('<span class="tag adop">ADOPTADO</span>');
    if (!v) return r.join(' ');
    if (v.dependeDemo) r.push(UI.tagDemo());
    if (v.soloReferencia) r.push('<span class="tag ref" title="Precio de partida del catálogo de ARKEN, sin fecha de mercado">REF</span>');
    else r.push(UI.tagConfianza(v.confianza));
    return r.join(' ');
  }
  function enlace(url, texto){
    const u = urlSegura(url);
    return u ? '<a class="ext" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(texto || u) + '</a>' : '<span class="muted">—</span>';
  }
  function nombreInsumo(id){ const i = Datos.insumo(id); return i ? i.descripcion : id; }
  return { opcionesCiudad, ciudadActual, opcionesGrupo, opcionesCorte, precioHTML, rotulosPrecio, enlace, nombreInsumo };
})();

  /* ── Consulta y pintura ── */
  let ultimo = null;

    F.categorias.forEach(k => cats.push(k));
    const filtros = { desde:p.desde, hasta:p.hasta, ciudades:F.ciudades, categoriaArken:F.categoriaArken, grupos, categorias:cats, insumos:F.insumos,
      fuentes:F.fuentes, tipo:F.tipo, est:F.est, incluirDemo:hayDemo ? F.incluirDemo : true, referencia:ref ? ref.codigoDivipola : '', umbralAlza:0.05 };
    let r;
    try { r = await Tablero.consultar(filtros); }
    catch(e){ RegistroTecnico.anotar('Tablero', e); $('#t0Evol').innerHTML = '<div class="graf-vacia">No fue posible calcular el tablero: ' + esc(e.message || e) + '</div>'; return; }

  function pintarIndicadores(r){

    const ejs = Datos.lista('ejecuciones').filter(e => e.fin).sort((a,b) => a.fin < b.fin ? 1 : -1);
    $('#t0Ind').innerHTML =
      stat('Índice de la canasta', ind ? cant(ind.valor) : '—', ind ? 'Base 100 = ' + fmtMes(r.meses[0]) + ' · ' + ind.insumos + ' insumos' : 'Sin datos en el periodo', true) +
      stat('Variación mensual', ind ? UI.variacionHTML(ind.mensual) : '—', ind ? fmtMes(ind.mes) + ' frente al mes anterior' : '') +
      stat('Año corrido · 12 meses', ind ? UI.variacionHTML(ind.anio) + ' · ' + UI.variacionHTML(ind.doce) : '—', 'Frente a diciembre y al mismo mes del año anterior') +
      stat('Cobertura', r.conDato + ' de ' + r.nInsumos, 'Insumos con dato de menos de 30 días') +
      stat('Alzas mayores al 5 %', String(r.nAlza), 'En el periodo, frente a su primer mes') +
      stat('Fuentes', activas + ' activas · ' + caidas + ' caídas', ejs[0] ? 'Última actualización: ' + fmtSello(ejs[0].fin) : 'Sin actualizaciones todavía');
  }
  function stat(lab, val, foot, acento){
    return '<div class="stat' + (acento ? ' accent' : '') + '"><div class="lab">' + esc(lab) + '</div><div class="val">' + val + '</div>' + (foot ? '<div class="foot">' + esc(foot) + '</div>' : '') + '</div>';
  }
  function transformar(valor, base){
    if (F.vista === 'indice') return base > 0 ? valor / base * 100 : null;
    if (F.vista === 'variacion') return base > 0 ? (valor / base - 1) * 100 : null;
    return valor;
  }
  function pintarEvolucion(r){
    const c = $('#t0Evol');
    const e = r.evol;
    if (!e.series.length){
      c.innerHTML = '<div class="graf-vacia">No hay precios de mercado en el periodo y los filtros elegidos.<br>Registre cotizaciones o precios en el módulo 04, o cargue la demostración en Administración.</div>';
      $('#t0EvTit').textContent = 'Evolución de precios';
      return;
    }
    const varios = new Set(e.series.map(s => s.insumoId)).size > 1;
    const series = e.series.map((s, k) => {
      const base = s.puntos.length ? s.puntos[0].mediana : 0;
      const nombre = (varios ? Piezas.nombreInsumo(s.insumoId).slice(0, 38) + ' · ' : '') + Datos.nombreCiudad(s.ciudad);
      return { nombre, color:Graficas.color(k),
        puntos:s.puntos.map(p => ({ mes:p.mes, n:p.n, mediana:transformar(p.mediana, base), minimo:transformar(p.minimo, base), maximo:transformar(p.maximo, base) })),
        obs:e.puntos.filter(o => o.i === s.insumoId && o.c === s.ciudad).map(o => ({ id:o.id, i:o.i, f:o.f, p:transformar(o.p, base), d:o.d, fuente:Datos.nombreFuente(o.s) })) };
    });
    const formato = F.vista === 'indice' ? (v => cant(redondearDec(v, 1))) : (F.vista === 'variacion' ? (v => redondearDec(v, 1) + ' %') : null);
    const titulo = varios ? 'Evolución de ' + new Set(e.series.map(s => s.insumoId)).size + ' insumos' : 'Evolución: ' + Piezas.nombreInsumo(e.series[0].insumoId);
    $('#t0EvTit').textContent = titulo + (e.elegidoAuto ? ' (el más observado; busque otro arriba)' : '');
    const desc = series.map(s => {
      const a = s.puntos[0], b = s.puntos[s.puntos.length - 1];
      if (!a || !b) return '';
      return s.nombre + ': ' + (F.vista === 'valores' ? money3(a.mediana) + ' en ' + fmtMes(a.mes) + ' y ' + money3(b.mediana) + ' en ' + fmtMes(b.mes) :
        (formato(a.mediana) + ' → ' + formato(b.mediana))) + '.';
    }).filter(Boolean).join(' ');
    c.innerHTML = Graficas.evolucion({ meses:r.meses, series, titulo, desc, formato, base100:F.vista !== 'valores' }) +
      '<div class="legend" style="flex-direction:row;flex-wrap:wrap;max-height:none;margin-top:8px">' + series.map(s =>
        '<div class="li g8-leyenda"><span class="sw" style="background:' + s.color + '"></span><span class="nm">' + esc(s.nombre) + '</span></div>').join('') + '</div>' +
      '<div class="desc">' + esc(desc) + ' Cada punto es una observación: clic para abrirla con su enlace, texto literal y fecha.</div>';
    $$('circle.obs', c).forEach(el => el.onclick = () => Ficha.abrir(el.dataset.ins, null, 'obs', el.dataset.obs));
  }
  function pintarCiudades(r){
    const c = $('#t0Ciu');
    const items = r.comparacion.slice(0, 16).map(x => ({ nombre:Datos.nombreCiudad(x.ciudad), valor:x.diferencia, dato:x.ciudad, nota:x.insumos + ' insumos comparables' }));
    if (!items.length){ c.innerHTML = '<div class="graf-vacia">Hace falta precio en la ciudad de referencia (' + esc(ref ? ref.nombre : '—') + ') y en otra ciudad para comparar.</div>'; return; }
    const desc = 'Diferencia de precio frente a ' + (ref ? ref.nombre : 'la ciudad de referencia') + ' (media geométrica de los cocientes por insumo, último mes con dato). ' +
      items.slice(0, 3).map(x => x.nombre + ' ' + pctVar(x.valor)).join(', ') + '.';
    c.innerHTML = Graficas.divergentes(items, { titulo:'Comparación entre ciudades', desc, clase:'barra-ciudad', ml:150 }) +
      '<div class="desc">' + esc(desc) + ' Clic en una ciudad para filtrar el tablero.</div>';

  function pintarExtremos(r){
    const c = $('#t0Ext');
    const items = r.alzas.slice(0, 10).concat(r.bajas.slice(0, 10).reverse()).map(x => ({ nombre:Piezas.nombreInsumo(x.insumoId), valor:x.variacion, dato:x.insumoId,
      nota:fmtMes(x.desde) + ' → ' + fmtMes(x.hasta) }));
    if (!items.length){ c.innerHTML = '<div class="graf-vacia">Hacen falta al menos dos meses con dato para ver alzas y bajas.</div>'; return; }
    const desc = 'Variación de la mediana mensual entre el primer y el último mes con dato del periodo. ' +
      (r.alzas[0] ? 'Mayor alza: ' + Piezas.nombreInsumo(r.alzas[0].insumoId) + ' (' + pctVar(r.alzas[0].variacion) + '). ' : '') +
      (r.bajas[0] ? 'Mayor baja: ' + Piezas.nombreInsumo(r.bajas[0].insumoId) + ' (' + pctVar(r.bajas[0].variacion) + ').' : '');
    c.innerHTML = Graficas.divergentes(items, { titulo:'Mayores alzas y bajas', desc, clase:'barra-ciudad', ml:220 }) + '<div class="desc">' + esc(desc) + ' Clic en un insumo para ver su evolución.</div>';
    $$('.barra-ciudad', c).forEach(g => g.onclick = () => {
      const id = g.dataset.dato; if (!id) return;
      F.insumos = [id]; Sesion.filtros.tablero = F; App.render();
    });
  }
  async function pdfTablero(){
    if (!ultimo){ UI.toast('Espere a que termine el cálculo', 'bad'); return; }
    const imgs = [];
    for (const id of ['t0Evol', 't0Ciu', 't0Ext']){
      const s = $('#' + id + ' svg'); if (!s) continue;
      const im = await Documentos.svgAImagen(s, 2.2);
      if (im) imgs.push({ id, im, desc:($('#' + id + ' .desc') || {}).textContent || '' });
    }
    const r = ultimo.r, p = periodo(F);
    const anchoPagina = 257;

/** Fechas del periodo elegido. */
function periodo(F){
  const hasta = F.rango === 'pers' && F.hasta ? F.hasta : hoyISO();
  const dias = { '30d':30, '90d':90, '6m':182, '1a':365, '3a':1095 }[F.rango];
  const desde = F.rango === 'pers' ? (F.desde || '') : (dias ? sumaDias(hasta, -dias) : '');
  return { desde, hasta };
}

const BaseUI = (function(){
  const MOSTRAR = [
    { v:'', n:'Todos los insumos' }, { v:'mercado', n:'Con precio de mercado' }, { v:'referencia', n:'Solo con referencia de ARKEN' },
    { v:'sindato', n:'Sin dato' }, { v:'desactualizados', n:'Desactualizados' }, { v:'pendientes', n:'Con precios nuevos sin actualizar' },
    { v:'adoptados', n:'Con precio adoptado' }, { v:'arken', n:'Solo los que están en ARKEN' }, { v:'nuevos', n:'Solo los que no están en ARKEN' },
    { v:'campestre', n:'Casas campestres' }, { v:'noinv', n:'No investigables' }, { v:'demo', n:'Con datos de demostración' }
  ];
  function filtros(){
    const f = Object.assign({ q:'', grupo:'', catArken:'', conf:'', mostrar:'', pagina:1, fuente:'' }, Sesion.filtros.base || {});
    if (f.fuente && !Datos.corte(f.fuente)) f.fuente = '';
    Sesion.filtros.base = f;
    return f;
  }

  /** Filas visibles con todo lo que se pinta (sin la minigráfica, que se calcula solo para la página). */
  function filas(f, ciudad){
    const P = Consolidacion.parametros(Datos.config('consolidacion', {}));
    const hoy = hoyISO();
    const corte = f.fuente ? Datos.corte(f.fuente) : null;
    const porInsumo = corte ? new Map((corte.precios || []).filter(p => p.ciudad === ciudad).map(p => [p.insumoId, p])) : null;
    const q = normaliza(f.q).split(/\s+/).filter(Boolean);
    const out = [];
    Datos.insumosActivos().forEach(ins => {
      if (f.grupo && ins.grupo !== f.grupo) return;
      if (f.catArken && ins.categoriaArken !== f.catArken) return;
      if (q.length){
        const t = normaliza(ins.codigo + ' ' + ins.descripcion + ' ' + (ins.especificacion || '') + ' ' + (ins.sinonimos || []).join(' '));
        if (!q.every(p => t.indexOf(p) >= 0)) return;
      }
      const v = corte ? (porInsumo.get(ins.id) || null) : Precios.vigente(ins, ciudad);
      const ad = corte ? (v && v.adoptado) : Datos.adoptado(ins.id, ciudad);
      const eq = Datos.equivalencia(ins.id);
      const enArken = !!(eq && eq.estado === 'exacta');
      const conf = v ? (v.soloReferencia ? 'referencia' : v.confianza) : 'sin dato';
      const desact = !v || !v.n || (v.fecha && diasEntre(v.fecha, hoy) > P.diasDesactualizado) || !!v.sinActualizar;
      if (f.conf && conf !== f.conf) return;
      switch (f.mostrar){
        case 'mercado': if (!(v && v.n > 0)) return; break;
        case 'referencia': if (!(v && v.soloReferencia)) return; break;
        case 'sindato': if (v && v.recomendado > 0) return; break;
        case 'desactualizados': if (!(v && v.n > 0 && desact)) return; break;
        case 'pendientes': if (corte || !Precios.pendiente(ins.id, ciudad)) return; break;
        case 'adoptados': if (!ad) return; break;
        case 'arken': if (!enArken) return; break;
        case 'nuevos': if (enArken) return; break;
        case 'campestre': if ((ins.etiquetas || []).indexOf('campestre') < 0) return; break;
        case 'noinv': if (ins.investigable !== false) return; break;
        case 'demo': if (!(v && v.dependeDemo)) return; break;
      }
      out.push({ ins, v, ad, enArken, conf, desact });
    });
    return { filas:out, corte };
  }

  function pintar(c){
    const f = filtros();
    const ciudad = Piezas.ciudadActual();
    const { filas:fs, corte } = filas(f, ciudad);
    const total = fs.length;
    const paginas = Math.max(1, Math.ceil(total / POR_PAGINA_BASE));
    if (f.pagina > paginas) f.pagina = paginas;
    const pagina = fs.slice((f.pagina - 1) * POR_PAGINA_BASE, f.pagina * POR_PAGINA_BASE);
    const pend = corte ? [] : Precios.pendientes(ciudad);
    const conMercado = fs.filter(x => x.v && x.v.n > 0).length;

    c.innerHTML =
      (pend.length && Permisos.puede('actualizar') ? '<div class="alert info"><div class="ic">ℹ</div><div class="bd"><b>Hay ' + pend.length + ' insumo(s) con precios nuevos que todavía no entran a la base.</b>' +
        'Los precios registrados no cambian la base hasta que alguien actualiza esos insumos. <button class="btn xs" id="b1Pend" type="button" style="margin-left:6px">Actualizar estos insumos</button></div></div>' : '') +
      (corte ? '<div class="alert brass"><div class="ic">◆</div><div class="bd"><b>Viendo el corte «' + esc(corte.nombre) + '»</b>Precios congelados el ' + fmtFecha(corte.fecha) +
        (corte.cerrado ? ' (cerrado: no cambia nunca).' : ' (abierto).') + ' <button class="btn xs" id="b1Vigente" type="button" style="margin-left:6px">Volver a la base vigente</button></div></div>' : '') +
      '<div class="card"><div class="card-body">' +
        '<div class="toolbar">' +
          '<div class="field"><label for="b1Ciudad">Ciudad</label><select id="b1Ciudad">' + UI.selectOpts(Piezas.opcionesCiudad(), ciudad) + '</select></div>' +
          '<div class="field"><label for="b1Fuente">Precios de</label><select id="b1Fuente">' + UI.selectOpts(Piezas.opcionesCorte(false), f.fuente, 'La base vigente') + '</select></div>' +
          '<div class="field grow"><label for="b1Q">Buscar</label><input id="b1Q" type="search" value="' + esc(f.q) + '" placeholder="Código, descripción, especificación o sinónimo"></div>' +
          '<div class="field"><label for="b1Grupo">Grupo</label><select id="b1Grupo">' + UI.selectOpts(Piezas.opcionesGrupo(), f.grupo, 'Todos') + '</select></div>' +
          '<div class="field"><label for="b1Cat">Categoría ARKEN</label><select id="b1Cat">' + UI.selectOpts(CATEGORIAS_ARKEN, f.catArken, 'Todas') + '</select></div>' +
          '<div class="field"><label for="b1Conf">Confianza</label><select id="b1Conf">' + UI.selectOpts([{ v:'alta', n:'Alta' }, { v:'media', n:'Media' }, { v:'baja', n:'Baja' },
            { v:'referencia', n:'Referencia' }, { v:'sin dato', n:'Sin dato' }], f.conf, 'Todas') + '</select></div>' +
          '<div class="field"><label for="b1Mostrar">Mostrar</label><select id="b1Mostrar">' + UI.selectOpts(MOSTRAR, f.mostrar) + '</select></div>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap">' +
          '<span class="muted small">' + total + ' insumo(s) · ' + conMercado + ' con precio de mercado en ' + esc(Datos.nombreCiudad(ciudad)) + '. Clic en un precio para ver sus observaciones.</span>' +
          '<div class="btn-row"><button class="btn sm" id="b1Pdf" type="button">PDF</button><button class="btn sm" id="b1Imp" type="button">Imprimir</button>' +
          '<button class="btn sm" id="b1Xls" type="button">Excel de análisis</button></div></div>' +
      '</div>' +
      '<div class="tw"><table class="t" id="tBase"><thead><tr><th>Código</th><th>Insumo</th><th>Unidad</th><th>Cat. ARKEN</th><th class="n">Precio con IVA</th>' +
        '<th class="n">Mínimo – máximo</th><th class="n">n</th><th class="n">Var. 30 días</th><th class="n">Var. corte anterior</th><th data-no-orden>12 meses</th><th>Última observación</th></tr></thead><tbody>' +
        cuerpo(pagina, ciudad, corte) + '</tbody></table></div>' +
      UI.paginador(total, f.pagina, POR_PAGINA_BASE, p => { f.pagina = p; App.render(); }) + '</div>';

    const cambio = (k, v) => { f[k] = v; f.pagina = 1; App.render(); };
    $('#b1Ciudad').onchange = e => { Sesion.ciudad = e.target.value; f.pagina = 1; App.render(); };
    $('#b1Fuente').onchange = e => cambio('fuente', e.target.value);
    let t = null;
    $('#b1Q').oninput = e => { clearTimeout(t); t = setTimeout(() => { f.q = e.target.value; f.pagina = 1; App.render(); const i = $('#b1Q'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); };
    $('#b1Grupo').onchange = e => cambio('grupo', e.target.value);
    $('#b1Cat').onchange = e => cambio('catArken', e.target.value);
    $('#b1Conf').onchange = e => cambio('conf', e.target.value);
    $('#b1Mostrar').onchange = e => cambio('mostrar', e.target.value);
    if ($('#b1Pend')) $('#b1Pend').onclick = () => { Sesion.opciones = { alcance:'insumos', insumoIds:pend, ciudades:[ciudad] }; App.ir('02'); };
    if ($('#b1Vigente')) $('#b1Vigente').onclick = () => cambio('fuente', '');
    $$('[data-ficha]', c).forEach(b => b.onclick = () => Ficha.abrir(b.dataset.ficha, ciudad, b.dataset.tab || 'obs'));
    const filtroIns = new Set(fs.map(x => x.ins.id));
    const op = () => ({ ciudad, corteId:f.fuente || null, filtro:ins => filtroIns.has(ins.id), precio:'adoptado', descripcionAlcance:descripcion(f) });
    $('#b1Pdf').onclick = () => Documentos.previsualizar(Informes.documentoBase(op()));
    $('#b1Imp').onclick = () => Documentos.emitir(Informes.documentoBase(op()), 'imprimir');
    $('#b1Xls').onclick = () => intentar('generar el Excel de análisis', async () => {
      const r = Informes.excelAnalisis(Object.assign(op(), { ciudades:[ciudad] }));
      await Documentos.guardarLibro(r.wb, r.nombre);
    });
    UI.conectarOrden('#tBase');
  }
  function descripcion(f){
    const p = [];
    if (f.grupo){ const g = Datos.grupo(f.grupo); p.push(g ? g.nombre : f.grupo); }
    if (f.catArken) p.push('Categoría ARKEN ' + f.catArken);
    if (f.q) p.push('Búsqueda «' + f.q + '»');
    if (f.mostrar) p.push((MOSTRAR.find(x => x.v === f.mostrar) || {}).n);
    return p.join(' · ') || 'Toda la base';
  }

  function cuerpo(pagina, ciudad, corte){
    let h = '', g0 = null, c0 = null;
    pagina.forEach(x => {
      const ins = x.ins, v = x.v;
      if (ins.grupo !== g0){ g0 = ins.grupo; c0 = null; const g = Datos.grupo(g0); h += '<tr class="row-cap" data-fijo="1"><td colspan="11">' + esc(g ? g.codigo + ' · ' + g.nombre : g0) + '</td></tr>'; }
      if (ins.categoria !== c0){ c0 = ins.categoria; h += '<tr class="row-sub" data-fijo="1"><td colspan="11">' + esc(c0) + '</td></tr>'; }
      const precio = x.ad && x.ad.precio > 0 ? x.ad.precio : (v ? v.recomendado : null);
      const anterior = corte ? null : Precios.enCorteAnterior(ins.id, ciudad);
      const varCorte = anterior && precio > 0 && anterior.recomendado > 0 ? precio / anterior.recomendado - 1 : null;
      const ult = v && v.ultimaObservacion;
      h += '<tr><td class="cod">' + esc(ins.codigo) + '</td>' +
        '<td class="desc-ins">' + esc(ins.descripcion) + (ins.especificacion ? '<span class="es">' + esc(ins.especificacion) + '</span>' : '') + '</td>' +
        '<td>' + esc(ins.unidad) + '</td><td>' + UI.tagCategoria(ins.categoriaArken) + (x.enArken ? '' : ' <span class="tag sin" title="No está en el catálogo de ARKEN: entraría como insumo nuevo">nuevo</span>') + '</td>' +
        '<td class="n" data-v="' + (precio || 0) + '">' + Piezas.precioHTML(precio, Piezas.rotulosPrecio(v, x.ad) + (x.desact && v && v.n ? ' <span class="tag warn" title="Sin actualizar en los últimos días">desact.</span>' : ''),
          'data-ficha="' + esc(ins.id) + '" data-tab="obs" aria-label="Ver las observaciones de ' + esc(ins.descripcion) + '"') + '</td>' +
        '<td class="n">' + (v && v.minimo > 0 ? money3(v.minimo) + ' – ' + money3(v.maximo) : '<span class="muted">—</span>') + '</td>' +
        '<td class="n">' + (v ? (v.n || 0) : 0) + '</td>' +
        '<td class="n">' + UI.variacionHTML(v ? v.variacion30 : null) + '</td><td class="n">' + UI.variacionHTML(varCorte) + '</td>' +
        '<td>' + Graficas.sparkline(Precios.tendencia(ins.id, ciudad)) + '</td>' +
        '<td class="small">' + (ult ? esc(fmtFecha(ult.fecha)) + '<br><span class="muted">' + esc(Datos.nombreFuente(ult.fuenteId)) + '</span>' : '<span class="muted">—</span>') + '</td></tr>';
    });
    return h || '<tr><td colspan="11">' + UI.vacio('◇', 'Ningún insumo con estos filtros', 'Cambie la búsqueda o los filtros.') + '</td></tr>';
  }
  return { pintar, filas };
})();

            (Permisos.puede('cortes') && !k.cerrado ? '<button class="btn xs" data-cerrar="' + esc(k.id) + '" type="button">Cerrar</button>' : '') +
            '<button class="btn xs" data-comparar="' + esc(k.id) + '" type="button">Comparar</button>' +
            (Permisos.puede('cortes') && (!k.cerrado || k.incluyeDemo) ? '<button class="btn xs danger" data-borrar="' + esc(k.id) + '" type="button">Eliminar</button>' : '') +

        : UI.vacio('◇', 'Todavía no hay cortes', 'Actualice los precios y cree el primer corte con el botón «Crear corte».'));
    $$('[data-ver]', c).forEach(b => b.onclick = () => { Sesion.filtros.base = Object.assign({}, Sesion.filtros.base || {}, { fuente:b.dataset.ver, pagina:1 });

    $$('[data-cerrar]', c).forEach(b => b.onclick = () => cerrar(b.dataset.cerrar));

    const d = await UI.pedir({ titulo:'Crear corte', eyebrow:'Congelar los precios de hoy', ancho:'wide', cols:2,
