        '<div class="k">Ciudades</div><div class="v">' + Datos.ciudades().length + '</div><div class="k">Fuentes</div><div class="v">' + Datos.fuentes().filter(f => !f.esDemo).length + '</div>' +
        '<div class="k">Cortes</div><div class="v">' + (cortes.length ? cortes.map(x => esc(x.nombre) + ' (' + (x.precios || []).length + ' precios)').join('<br>') : 'Ninguno (solo catálogo)') + '</div></div>' +
        (cortes.some(x => x.incluyeDemo) ? '<div class="alert warn" style="margin-top:10px"><div class="ic">!</div><div class="bd">Un corte elegido incluye datos de demostración (sintéticos).</div></div>' : '') +
        '<p class="small muted" style="margin-top:10px">El paquete no lleva usuarios, contraseñas ni claves. Al importarlo en otro equipo solo se agrega lo que no existe.</p>';
      return;
    }
    if (W.tipo === 'respaldo'){
      z.innerHTML = '<h3 style="margin:0 0 10px">Contenido del respaldo</h3><div class="tw"><table class="t"><thead><tr><th>Datos</th><th class="n">Registros</th></tr></thead><tbody id="e8Alm"></tbody></table></div>' +
        '<p class="small muted" style="margin-top:10px">Incluye usuarios con sus contraseñas cifradas (PBKDF2), nunca claves de API. Guárdelo en un lugar seguro.</p>';
      (async () => { const tb = $('#e8Alm', z); for (const a of BD.ALMACENES){ const n = await BD.contar(a); if (tb && n) tb.insertAdjacentHTML('beforeend', '<tr><td>' + esc(a) + '</td><td class="n">' + n + '</td></tr>'); } })();
      W.resultado = {};
    }
  }
  function alertaLibreria(nombre){
    return '<div class="alert warn"><div class="ic">!</div><div class="bd"><b>No está disponible la librería ' + esc(nombre) + '.</b> Se carga de internet la primera vez; conéctese una vez y vuelva a abrir el programa.</div></div>';
  }

  /* ── Paso 6: generar ── */
  async function generar(boton){
    if (boton) boton.disabled = true;
    try {
      switch (W.tipo){
        case 'arken': {
          const r = W.resultado;
          if (!r || !r.validacion.ok){ UI.toast('El validador encontró errores: el archivo no se guarda.', 'bad'); return false; }
          const ok = await UI.guardarComo(r.nombre, new Blob([r.bytes], { type:MIME_XLSX }), [{ description:'Libro de Excel', accept:{ [MIME_XLSX]:['.xlsx'] } }]);
          if (!ok) return false;
          await Auditoria.registrar('exportar Excel para ARKEN', r.nombre + ' · ' + r.renglones.length + ' renglones · ' + r.existentes + ' existentes y ' + r.nuevos + ' nuevos');
          W.generado = { nombre:r.nombre };
          return true;
        }
        case 'intercambio': {
          const x = Informes.intercambio(opArken());
          if (contieneClave(x.texto)) throw new Error('El archivo contendría algo con forma de clave de API. Se detuvo la exportación.');
          UI.descargar(x.nombre, x.texto, 'application/json');
          await Auditoria.registrar('exportar intercambio', x.nombre);
          W.generado = { nombre:x.nombre };
          return true;
        }
        case 'analisis': {
          const r = W.resultado; if (!r) return false;
          const ok = await Documentos.guardarLibro(r.wb, r.nombre);
          if (!ok) return false;
          W.generado = { nombre:r.nombre };
          return true;
        }
        case 'pdf': case 'imprimir': {
          const cfg = W.resultado; if (!cfg) return false;
          await Documentos.emitir(cfg, W.tipo === 'pdf' ? 'pdf' : 'imprimir');
          W.generado = { nombre:cfg.nombre + '.pdf' };
          return true;
        }
        case 'paquete': {
          const nombre = await Respaldos.exportarPaquete(W.cortes.length ? W.cortes : ['-']);
          W.generado = { nombre };
          return true;
        }
        case 'respaldo': {
          await Respaldos.descargar();
          W.generado = { nombre:'ARKEN_PRECIOS_respaldo_' + hoyISO() };
          return true;
        }
      }
      return false;
    } catch(e){
      RegistroTecnico.anotar('Exportar · generar', e);
      UI.aviso('No fue posible generar el archivo', '<p>' + esc(e.message || e) + '</p>');
      return false;
    } finally { if (boton && document.body.contains(boton)) boton.disabled = false; }
  }
  function paso6(z){
    const g = W.generado || {};
    z.innerHTML = '<div class="alert ok"><div class="ic">✓</div><div class="bd"><b>' + (W.tipo === 'imprimir' ? 'Documento enviado a la impresora.' : 'Archivo generado.') + '</b> ' + esc(g.nombre || '') + '</div></div>' +
      (W.tipo === 'arken' ? '<h4 style="margin:14px 0 4px">Ahora, en ARKEN CONTROL</h4>' + PASOS_ARKEN +
        '<p class="small muted" style="margin-top:8px">Al sobrescribir, ARKEN cambia solo el precio de los que ya existen: la descripción, la unidad y la categoría quedan iguales.</p>' : '') +
      (W.tipo === 'paquete' ? '<p class="small" style="margin-top:10px">En el otro equipo: Administración › Respaldos › Importar paquete de precios.</p>' : '');
  }

  /* ═══════════ Documento PDF de la base (§10.3) ═══════════ */
  async function documento(){
    const o = W.op;
    const corte = W.corteId ? Datos.corte(W.corteId) : null;
    const filtro = filtroAlcance(W.alcance);
    const cols = COLUMNAS_PDF.filter(col => col.fija || o.columnas.indexOf(col.k) >= 0);
    const P = Consolidacion.parametros(corte ? corte.parametros : Datos.config('consolidacion', {}));
    const porCiudad = W.ciudades.map(ci => {
      const r = Informes.filas({ ciudad:ci, corteId:W.corteId || null, filtro, precio:o.precio, incluirDemo:o.incluirDemo });
      return { ciudad:ci, filas:r.filas.filter(f => !o.soloConPrecio || f.precio.valor > 0) };
    });
    const usoFuentes = new Map();
    const fuentesDe = v => {
      const s = new Set();
      ((v && v.observacionesUsadas) || []).forEach(id => { const ob = Datos.obsTodas().get(id); if (ob) s.add(ob.fuenteId); });
      return Array.from(s);
    };
    porCiudad.forEach(pc => pc.filas.forEach(f => {
      ((f.v && f.v.observacionesUsadas) || []).forEach(id => {
        const ob = Datos.obsTodas().get(id); if (!ob) return;
        let u = usoFuentes.get(ob.fuenteId); if (!u){ u = { n:0, insumos:new Set(), ciudades:new Set(), ultima:'' }; usoFuentes.set(ob.fuenteId, u); }
        u.n++; u.insumos.add(f.ins.id); u.ciudades.add(pc.ciudad);
        const fe = Observaciones.fechaDe(ob); if (fe > u.ultima) u.ultima = fe;
      });
    }));
    const demo = porCiudad.some(pc => pc.filas.some(f => (f.v && f.v.dependeDemo) || (f.adoptado && f.adoptado.esDemo)));
    const alcance = nombreAlcance(W.alcance);
    const bloques = [];
    if (o.portada){
      const todas = porCiudad.reduce((a, pc) => a.concat(pc.filas), []);
      const cuenta = k => todas.filter(f => f.v && f.v.confianza === k).length;
      bloques.push({ t:'sec', txt:'Resumen' });
      bloques.push({ t:'kv', cols:2, pares:[['Alcance', alcance], ['Ciudades', W.ciudades.map(x => Datos.nombreCiudad(x)).join(', ')],
        ['Precios de', corte ? 'Corte «' + corte.nombre + '» del ' + fmtFecha(corte.fecha) + (corte.cerrado ? ' (cerrado)' : ' (abierto)') : 'La base vigente al ' + fmtFecha(hoyISO())],
        ['Precio mostrado', Informes.NOMBRE_PRECIO[o.precio]], ['Insumos × ciudad', String(todas.length)],
        ['Con precio de mercado', String(todas.filter(f => f.v && f.v.n > 0).length)], ['Solo referencia de ARKEN', String(todas.filter(f => f.v && f.v.soloReferencia).length)],
        ['Precio adoptado', String(todas.filter(f => f.precio.origen === 'adoptado').length)],
        ['Confianza alta · media · baja', cuenta('alta') + ' · ' + cuenta('media') + ' · ' + cuenta('baja')],
        ['Fuentes con precios usados', String(Array.from(usoFuentes.keys()).filter(id => id !== 'ref-arken').length)]] });
      if (demo) bloques.push({ t:'nota', txt:'ATENCIÓN: este documento incluye datos de demostración (sintéticos), marcados [DEMO]. No son precios de mercado.' });
      bloques.push({ t:'sec', txt:'Metodología' });
      bloques.push({ t:'texto', tam:8, txt:'Cada precio sale de observaciones con fuente, fecha, ciudad y texto literal. Las observaciones se llevan a la unidad del insumo con su factor de conversión y a precio con IVA incluido.' });
      bloques.push({ t:'texto', tam:8, txt:'Precio recomendado: mediana ponderada de las observaciones válidas de los últimos ' + P.ventanaDias + ' días; el peso combina la confiabilidad de la fuente, la frescura (vida media de ' +
        P.vidaMediaDias + ' días) y el tipo de precio. Antes se descartan los atípicos (más de ' + P.kMad + ' MAD de la mediana). Si en la ciudad hay menos de ' + P.minimoObservaciones +
        ' observaciones se completan con las de la subregión, la región o el país, ajustadas por el factor regional, y se dice en «Nivel».' });
      bloques.push({ t:'texto', tam:8, txt:'Confianza alta: n ≥ ' + P.alta.n + ', ' + P.alta.fuentes + ' fuentes o más, coeficiente de variación ≤ ' + P.alta.cv + ' y edad ≤ ' + P.alta.edad +
        ' días. Media: n ≥ ' + P.media.n + ', ' + P.media.fuentes + ' fuentes, CV ≤ ' + P.media.cv + ', edad ≤ ' + P.media.edad + ' días. «Referencia» es el precio de partida del catálogo de ARKEN, sin fecha de mercado. ' +
        'Un precio adoptado es una decisión de la empresa, con su justificación, y prevalece sobre el recomendado cuando se exporta «Adoptado».' });
      bloques.push({ t:'salto' });
    }
    if (o.graficas){
      const imgs = await graficas(o, porCiudad);
      if (imgs.length){
        bloques.push({ t:'sec', txt:'Gráficas del último año' });
        const ancho = (o.orientacion === 'l' ? 257 : 194);
        imgs.forEach(x => {
          const w = Math.min(ancho, x.im.w * 0.3), h = Math.min(o.orientacion === 'l' ? 120 : 150, x.im.h * 0.3 * w / (x.im.w * 0.3));
          bloques.push({ t:'texto', txt:x.titulo, negrita:true, tam:8.4 }, { t:'img', dataUrl:x.im.dataUrl, w, h, alt:x.titulo }, { t:'texto', txt:x.desc, gris:true, tam:7.4 });
        });
        bloques.push({ t:'salto' });
      } else bloques.push({ t:'nota', txt:'Gráficas: no hay precios de mercado en el último año para el alcance y las ciudades elegidas.' });
    }
    porCiudad.forEach((pc, k) => {
      if (k > 0) bloques.push({ t:'salto' });
      const nombre = Datos.nombreCiudad(pc.ciudad);
      bloques.push({ t:'sec', txt:'Base de precios · ' + nombre });
      bloques.push({ t:'kv', cols:4, pares:[['Insumos', pc.filas.length], ['Con mercado', pc.filas.filter(f => f.v && f.v.n > 0).length],
        ['Solo referencia', pc.filas.filter(f => f.v && f.v.soloReferencia).length], ['Sin precio', pc.filas.filter(f => !(f.precio.valor > 0)).length]] });
      const body = [];
      let g0 = null, c0 = null;
      pc.filas.slice().sort((a,b) => (a.ins.grupo < b.ins.grupo ? -1 : (a.ins.grupo > b.ins.grupo ? 1 : (a.ins.categoria < b.ins.categoria ? -1 : (a.ins.categoria > b.ins.categoria ? 1 : (a.ins.codigo < b.ins.codigo ? -1 : 1))))))
        .forEach(f => {
          if (f.ins.grupo !== g0){ g0 = f.ins.grupo; c0 = null; const g = Datos.grupo(g0); body.push({ _clase:'cap', celdas:[{ content:(g ? g.codigo + ' · ' + g.nombre : g0).toUpperCase(), colSpan:cols.length }] }); }
          if (f.ins.categoria !== c0){ c0 = f.ins.categoria; body.push({ _clase:'sub', celdas:[{ content:c0, colSpan:cols.length }] }); }
          const v = f.v || {};
          const der = x => ({ content:x, styles:{ halign:'right' } });
          const tarifa = f.ins.baseIva === 'precio' ? f.ins.tarifaIva : 0;
          body.push(cols.map(col => {
            switch (col.k){
              case 'codigo': return f.ins.codigo;
              case 'descripcion': return f.ins.descripcion + ((v.dependeDemo || (f.adoptado && f.adoptado.esDemo)) ? ' [DEMO]' : '');
              case 'unidad': return f.ins.unidad;
              case 'precio': return der(f.precio.valor > 0 ? money3(f.precio.valor) : '—');
              case 'sinIva': return der(f.precio.valor > 0 ? money3(Impuestos.sinIva(f.precio.valor, tarifa)) : '—');
              case 'minimo': return der(v.minimo > 0 ? money3(v.minimo) : '—');
              case 'mediana': return der(v.mediana > 0 ? money3(v.mediana) : '—');
              case 'maximo': return der(v.maximo > 0 ? money3(v.maximo) : '—');
              case 'n': return der(String(v.n || 0));
              case 'confianza': return f.precio.origen === 'adoptado' ? 'Adoptado' : (UI.NOMBRE_CONF[v.confianza] || 'Sin dato');
              case 'fecha': return v.fecha && !v.sinActualizar ? fmtFecha(v.fecha) : 'Sin actualizar';
              case 'fuentes': return fuentesDe(v).filter(id => id !== 'ref-arken').slice(0, 3).map(id => Datos.nombreFuente(id)).join(', ') || (v.soloReferencia ? 'Referencia ARKEN' : '—');
              case 'categoriaArken': return f.ins.categoriaArken || '';
            }
            return '';
          }));
        });
      const anchos = {};
      cols.forEach((col, i) => { if (col.w) anchos[i] = { cellWidth:col.w }; });
      bloques.push({ t:'tabla', tam:cols.length > 10 ? 6.2 : 6.8, head:[cols.map(col => col.n)], body, anchos });
    });
    if (o.anexoFuentes){
      bloques.push({ t:'salto' }, { t:'sec', txt:'Anexo de fuentes' });
      const filasF = Array.from(usoFuentes.entries()).map(([id, u]) => ({ f:Datos.fuente(id) || { id, nombre:id }, u })).sort((a,b) => b.u.n - a.u.n);
      if (filasF.length) bloques.push({ t:'tabla', tam:7, head:[['Fuente','Tipo','Confiabilidad','Observaciones usadas','Insumos','Ciudades','Última observación','Dirección']],
        body:filasF.map(x => [x.f.nombre + (x.f.esDemo ? ' [DEMO]' : ''), x.f.tipo || '', x.f.confiabilidad !== undefined ? String(x.f.confiabilidad) : '', { content:String(x.u.n), styles:{ halign:'right' } },
          { content:String(x.u.insumos.size), styles:{ halign:'right' } }, Array.from(x.u.ciudades).map(c => Datos.nombreCiudad(c)).join(', '), x.u.ultima ? fmtFecha(x.u.ultima) : '', urlSegura(x.f.urlBase) || '']) });
      else bloques.push({ t:'texto', txt:'Ningún precio del documento sale todavía de observaciones de mercado.', gris:true });
      bloques.push({ t:'nota', txt:'Cada observación conserva su enlace, su texto literal y su fecha: en ARKEN PRECIOS, clic en el precio › Observaciones.' });
    }
    const nombreCiudades = W.ciudades.length === 1 ? Datos.nombreCiudad(W.ciudades[0]) : W.ciudades.length + '-ciudades';
    return {
      titulo:'Base de precios · ' + alcance, documento:'Base de precios', orientacion:o.orientacion,
      contexto:W.ciudades.map(x => Datos.nombreCiudad(x)).join(', ') + ' · ' + (corte ? corte.nombre : 'precios vigentes'),
      subtitulo:(corte ? 'Corte «' + corte.nombre + '» del ' + fmtFecha(corte.fecha) : 'Precios vigentes al ' + fmtFechaLarga(hoyISO())) + ' · precios por unidad, con IVA incluido.' + (demo ? ' Incluye datos de demostración.' : ''),
      nombre:nombreArchivoSeguro('ARKEN_PRECIOS_' + alcance + '_' + nombreCiudades + '_' + (corte ? corte.nombre : 'vigentes-' + hoyISO())) + (demo ? '_DEMO' : ''),
      bloques
    };
  }

  /** Las tres gráficas del tablero para el alcance del documento, como imágenes. */
  async function graficas(o, porCiudad){
    const ref = Datos.ciudadReferencia();
    const hoy = hoyISO();
    const a = W.alcance;
    const filtros = { desde:sumaDias(hoy, -365), hasta:hoy, ciudades:W.ciudades.slice(), categoriaArken:'', grupos:[], categorias:a.tipo === 'categorias' ? a.categorias.slice() : [],
      insumos:a.tipo === 'insumos' ? a.insumoIds.slice(0, 6) : [], fuentes:[], tipo:'', est:'med', incluirDemo:!!o.incluirDemo, referencia:ref ? ref.codigoDivipola : '', umbralAlza:0.05 };
    let r;
    try { r = await Tablero.consultar(filtros); } catch(e){ RegistroTecnico.anotar('Exportar · gráficas', e); return []; }
    const out = [];
    const aImagen = async (svgTxt, titulo, desc) => {
      const d = document.createElement('div'); d.innerHTML = svgTxt;
      const s = d.querySelector('svg'); if (!s) return;
      const im = await Documentos.svgAImagen(s, 2.2);
      if (im) out.push({ titulo, im, desc });
    };
    if (r.evol && r.evol.series.length){
      const varios = new Set(r.evol.series.map(s => s.insumoId)).size > 1;
      const series = r.evol.series.map((s, k) => ({ nombre:(varios ? Piezas.nombreInsumo(s.insumoId).slice(0, 38) + ' · ' : '') + Datos.nombreCiudad(s.ciudad), color:Graficas.color(k),
        puntos:s.puntos.map(p => ({ mes:p.mes, n:p.n, mediana:p.mediana, minimo:p.minimo, maximo:p.maximo })), obs:[] }));
      const titulo = varios ? 'Evolución de ' + new Set(r.evol.series.map(s => s.insumoId)).size + ' insumos' : 'Evolución: ' + Piezas.nombreInsumo(r.evol.series[0].insumoId);
      const desc = series.map(s => { const p0 = s.puntos[0], p1 = s.puntos[s.puntos.length - 1]; return p0 && p1 ? s.nombre + ': ' + money3(p0.mediana) + ' en ' + fmtMes(p0.mes) + ' y ' + money3(p1.mediana) + ' en ' + fmtMes(p1.mes) + '.' : ''; }).filter(Boolean).join(' ');
      await aImagen(Graficas.evolucion({ meses:r.meses, series, titulo, desc, formato:null, base100:false }), titulo + (r.evol.elegidoAuto ? ' (el insumo más observado)' : ''), desc);
    }
    const items = (r.comparacion || []).slice(0, 16).map(x => ({ nombre:Datos.nombreCiudad(x.ciudad), valor:x.diferencia, dato:x.ciudad, nota:x.insumos + ' insumos comparables' }));
    if (items.length){
      const desc = 'Diferencia de precio frente a ' + (ref ? ref.nombre : 'la ciudad de referencia') + ' (media geométrica de los cocientes por insumo, último mes con dato).';
      await aImagen(Graficas.divergentes(items, { titulo:'Comparación entre ciudades', desc, clase:'barra-ciudad', ml:150 }), 'Comparación entre ciudades', desc);
    }
    const ext = (r.alzas || []).slice(0, 10).concat((r.bajas || []).slice(0, 10).reverse()).map(x => ({ nombre:Piezas.nombreInsumo(x.insumoId), valor:x.variacion, dato:x.insumoId, nota:fmtMes(x.desde) + ' → ' + fmtMes(x.hasta) }));
    if (ext.length){
      const desc = 'Variación de la mediana mensual entre el primer y el último mes con dato del último año.';
      await aImagen(Graficas.divergentes(ext, { titulo:'Mayores alzas y bajas', desc, clase:'barra-ciudad', ml:220 }), 'Mayores alzas y bajas', desc);
    }
    return out;
  }

  return { pintar, documento, nuevo, estado:() => W };
})();

          l.slice((pag - 1) * porPag, pag * porPag).map(i => {
            const e = Datos.equivalencia(i.id), g = Datos.grupo(i.grupo);

        : '<div class="card-body">' + UI.vacio('◌', 'Ningún insumo con estos filtros', 'Cambie la búsqueda o los filtros.') + '</div>');

  /** Código siguiente dentro del grupo: G05-0012. */
  function siguienteCodigo(grupo){
    let max = 0;
    Datos.insumos().forEach(i => { if (i.grupo === grupo){ const n = parseInt(String(i.codigo).split('-')[1], 10); if (n > max) max = n; } });
    return grupo + '-' + String(max + 1).padStart(4, '0');
  }
  function palabras(descripcion, sinonimos){
    const s = new Set();
    [descripcion].concat(sinonimos || []).forEach(t => Emparejamiento.tokens(t).forEach(x => s.add(x)));
    return Array.from(s).slice(0, 24);
  }
  function listaSinonimos(txt){ return String(txt || '').split(/[\n;]+/).map(x => x.trim()).filter(Boolean).slice(0, 30); }

  /** Crear o editar un insumo. Sin permiso de administrador, la propuesta va a la bandeja. */
  async function editar(ins, prefill){
    const admin = Permisos.esAdmin();
    const base = ins || Object.assign({ grupo:'G01', categoriaArken:'Materiales', unidad:'UN', tarifaIva:19, regimenIva:'gravado', baseIva:'precio', investigable:true }, prefill || {});
    const g0 = Datos.grupo(base.grupo) || Datos.taxonomia()[0];
    const campos = [
      { k:'descripcion', lab:'Descripción', req:true, val:base.descripcion, col:2, ayuda:'Como se compra: material, medida, referencia. Ej.: «Tubo PVC presión RDE 21 de 1/2" x 6 m».' },
      { k:'especificacion', lab:'Especificación', val:base.especificacion, col:2 },
      { k:'unidad', lab:'Unidad canónica', tipo:'select', req:true, val:base.unidad, opts:UNIDADES.map(u => ({ v:u, n:u + ' · ' + (NOMBRE_UNIDAD[u] || '') })) },
      { k:'categoriaArken', lab:'Categoría ARKEN', tipo:'select', req:true, val:base.categoriaArken, opts:CATEGORIAS_ARKEN },
      { k:'grupo', lab:'Grupo', tipo:'select', req:true, val:g0 ? g0.codigo : '', opts:Piezas.opcionesGrupo() },
      { k:'categoria', lab:'Categoría', tipo:'select', req:true, val:base.categoria, opts:(g0 ? g0.categorias : []) },
      { k:'tarifaIva', lab:'Tarifa de IVA (%)', tipo:'number', min:0, max:100, val:base.tarifaIva },
      { k:'regimenIva', lab:'Régimen de IVA', tipo:'select', val:base.regimenIva, opts:REGIMENES },
      { k:'baseIva', lab:'Base del IVA', tipo:'select', val:base.baseIva || 'precio', opts:BASES },
      { k:'norma', lab:'Norma técnica', val:base.norma, ayuda:'Solo una norma que haya verificado. Si duda, déjela en blanco.' },
      { k:'sinonimos', lab:'Sinónimos (uno por línea)', tipo:'textarea', filas:3, val:(base.sinonimos || []).join('\n'), col:2, ayuda:'Ayudan a reconocer el insumo en cotizaciones y listas.' },
      { k:'investigable', lab:'Se investiga en el mercado (desmarque los valores pactados o porcentuales)', tipo:'check', val:base.investigable !== false, col:2 },
      { k:'ivaPorVerificar', lab:'La tarifa de IVA está por verificar con el contador', tipo:'check', val:!!base.ivaPorVerificar, col:2 }
    ];
    const d = await UI.pedir({ titulo:ins ? 'Editar ' + ins.codigo : (admin ? 'Nuevo insumo' : 'Proponer un insumo nuevo'), eyebrow:'Catálogo', ancho:'wide', cols:2, campos,
      intro:admin ? '' : '<div class="alert info"><div class="ic">i</div><div class="bd">La propuesta va a la bandeja de nuevos; el administrador la aprueba o la rechaza.</div></div>',
      textoAceptar:ins ? 'Guardar' : (admin ? 'Crear insumo' : 'Enviar a la bandeja'),
      alAbrir: m => {
        const sg = $('#f_grupo', m.el), sc = $('#f_categoria', m.el), sa = $('#f_categoriaArken', m.el);
        sg.onchange = () => { const g = Datos.grupo(sg.value); sc.innerHTML = UI.selectOpts(g ? g.categorias : []); if (g && g.categoriaArken && !ins) sa.value = g.categoriaArken; };
      },
      validar: x => {
        const desc = String(x.descripcion || '').trim();
        if (desc.length < 4) return 'La descripción es muy corta.';
        const repetido = Datos.insumos().find(i => normaliza(i.descripcion) === normaliza(desc) && (!ins || i.id !== ins.id));
        if (repetido) return 'Ya existe un insumo con esa descripción (' + repetido.codigo + ').';
        if (!(Number(x.tarifaIva) >= 0 && Number(x.tarifaIva) <= 100)) return 'La tarifa de IVA debe estar entre 0 y 100.';
        return '';
      } });
    if (!d) return;
    const sinonimos = listaSinonimos(d.sinonimos);
    const datos = { descripcion:d.descripcion.trim(), especificacion:String(d.especificacion || '').trim(), unidad:d.unidad, categoriaArken:d.categoriaArken, grupo:d.grupo,
      categoria:d.categoria, tarifaIva:Number(d.tarifaIva) || 0, regimenIva:d.regimenIva, baseIva:d.baseIva, norma:String(d.norma || '').trim(), sinonimos,
      investigable:!!d.investigable, ivaPorVerificar:!!d.ivaPorVerificar };
    if (!admin && !ins){
      await Datos.guardar('propuestas', { id:uid('pr'), tipo:'insumo', estado:'pendiente', datos:Object.assign({ origen:'usuario' }, datos), motivo:'',
        propuestoPor:Sesion.usuario.usuario, creado:ahoraISO() });
      await Auditoria.registrar('proponer insumo', datos.descripcion);
      UI.toast('Propuesta enviada a la bandeja de nuevos', 'ok');

    const ahora = ahoraISO();
    if (ins){
      const cambioUnidad = ins.unidad !== datos.unidad && Datos.obs(ins.id).some(o => o.tipoPrecio !== 'referencia');
      if (cambioUnidad){
        const ok = await UI.confirmar({ titulo:'¿Cambiar la unidad canónica?', textoAceptar:'Cambiar la unidad', claseAceptar:'danger',
          mensaje:'Este insumo ya tiene precios observados en ' + ins.unidad + '. Las observaciones guardadas no se convierten solas: quedarán con el factor con que se registraron. Cambie la unidad solo si estaba mal.' });
        if (!ok) return;
      }
      const nuevo = Object.assign({}, ins, datos, { palabrasClave:palabras(datos.descripcion, sinonimos), actualizado:ahora });
      await Datos.guardar('insumos', nuevo);
      await Auditoria.registrar('editar insumo', ins.codigo + ' · ' + datos.descripcion);
      UI.toast('Insumo guardado', 'ok');
    } else {
      const codigo = siguienteCodigo(datos.grupo);
      await Datos.guardar('insumos', Object.assign({ id:codigo, codigo, subcategoria:'', presentaciones:[], contenido:null, etiquetas:[], activo:true, origen:'usuario',
        codigoSemillaArken:'', codigoArken:'', creado:ahora, actualizado:ahora, notaIva:'' }, datos, { palabrasClave:palabras(datos.descripcion, sinonimos) }));
      await Auditoria.registrar('crear insumo', codigo + ' · ' + datos.descripcion);
      UI.toast('Insumo ' + codigo + ' creado. En ARKEN irá como nuevo hasta que le asigne una equivalencia.', 'ok');
    }
    App.render();
  }
  async function activar(ins){
    if (!ins || !Permisos.esAdmin()) return;
    const desactivar = ins.activo !== false;
    if (desactivar){
      const ok = await UI.confirmar({ titulo:'¿Desactivar ' + ins.codigo + '?', textoAceptar:'Desactivar',
        mensaje:'Deja de aparecer en la base, en las actualizaciones y en las exportaciones. Su historia de precios se conserva y puede volver a activarlo cuando quiera.' });
      if (!ok) return;
    }
    await Datos.guardar('insumos', Object.assign({}, ins, { activo:!desactivar, actualizado:ahoraISO() }));
    await Auditoria.registrar(desactivar ? 'desactivar insumo' : 'activar insumo', ins.codigo + ' · ' + ins.descripcion);
    App.render();
  }

  /* ── Excel del catálogo ── */
  function excel(){
    if (!Documentos.hayXLSX()){ Documentos.avisoLibreria('SheetJS'); return; }
    const enc = ['Código','Descripción','Especificación','Unidad','Grupo','Categoría','Categoría ARKEN','Tarifa IVA (%)','Régimen IVA','Base IVA','IVA por verificar',

        i.ivaPorVerificar ? 'Sí' : 'No', i.investigable === false ? 'No' : 'Sí', i.activo === false ? 'No' : 'Sí', (i.sinonimos || []).join('; '), i.norma || '',

    const info = Documentos.filasInformativas('Catálogo de insumos · ' + filas.length + ' insumos');
    Documentos.guardarLibro(Documentos.libro([{ nombre:'Catálogo', filas:info.concat([enc]).concat(filas), filaEncabezado:info.length,
      anchos:[11,50,26,7,30,26,14,8,10,9,8,8,7,40,20,50,8,7,12] },
      { nombre:'Taxonomía', filaEncabezado:0, anchos:[8,40,14,80], filas:[['Grupo','Nombre','Categoría ARKEN','Categorías']].concat(Datos.taxonomia().map(g => [g.codigo, g.nombre, g.categoriaArken, (g.categorias || []).join('; ')])) }]),
      'ARKEN_PRECIOS_catalogo_' + hoyISO() + '.xlsx');

  /* ── Taxonomía ── */
  function taxonomia(c){
    const admin = Permisos.esAdmin();
    const n = {};
    Datos.insumos().forEach(i => { n[i.grupo] = (n[i.grupo] || 0) + 1; n[i.grupo + '|' + i.categoria] = (n[i.grupo + '|' + i.categoria] || 0) + 1; });
    c.innerHTML = '<div class="card"><div class="card-head"><h3>Grupos y categorías</h3>' + (admin ? '<button class="btn sm" id="c9Grp" type="button">+ Nuevo grupo</button>' : '') + '</div>' +
      '<div class="tw"><table class="t" id="tTax"><thead><tr><th>Grupo</th><th>Nombre</th><th>Categoría ARKEN por defecto</th><th>Categorías</th><th class="n">Insumos</th><th data-no-orden></th></tr></thead><tbody>' +
      Datos.taxonomia().map(g => '<tr><td><span class="cod">' + esc(g.codigo) + '</span></td><td>' + esc(g.nombre) + '</td><td>' + UI.tagCategoria(g.categoriaArken) + '</td>' +
        '<td class="small">' + (g.categorias || []).map(x => esc(x) + ' <span class="muted">(' + (n[g.codigo + '|' + x] || 0) + ')</span>').join(' · ') + '</td><td class="n">' + (n[g.codigo] || 0) + '</td>' +
        '<td>' + (admin ? '<button class="btn xs" type="button" data-g="' + esc(g.codigo) + '">Editar</button>' : '') + '</td></tr>').join('') +
      '</tbody></table></div></div>';
    if ($('#c9Grp', c)) $('#c9Grp', c).onclick = () => editarGrupo(null);
    $$('[data-g]', c).forEach(b => b.onclick = () => editarGrupo(Datos.grupo(b.dataset.g)));
    UI.conectarOrden('#tTax');
  }
  async function editarGrupo(g){
    if (!Permisos.esAdmin()) return;
    const n = {};
    if (g) Datos.insumos().forEach(i => { if (i.grupo === g.codigo) n[i.categoria] = (n[i.categoria] || 0) + 1; });
    const fila = (nombre, i) => '<tr><td><input type="text" data-cat-orig="' + esc(nombre) + '" value="' + esc(nombre) + '" aria-label="Categoría"></td><td class="n">' + (n[nombre] || 0) + '</td>' +
      '<td><label class="checkline small"><input type="checkbox" data-quitar' + ((n[nombre] || 0) > 0 ? ' disabled title="Tiene insumos: muévalos antes de quitarla"' : '') + '> Quitar</label></td></tr>';
    const codigoNuevo = (() => { let max = 0; Datos.taxonomia().forEach(x => { const k = parseInt(String(x.codigo).replace(/\D/g, ''), 10); if (k > max) max = k; }); return 'G' + String(max + 1).padStart(2, '0'); })();
    UI.modal({ titulo:g ? 'Grupo ' + g.codigo : 'Nuevo grupo ' + codigoNuevo, eyebrow:'Taxonomía', ancho:'wide',
      cuerpo:UI.formHTML([{ k:'nombre', lab:'Nombre del grupo', req:true, val:g ? g.nombre : '' },
          { k:'categoriaArken', lab:'Categoría ARKEN por defecto', tipo:'select', val:g ? g.categoriaArken : 'Materiales', opts:CATEGORIAS_ARKEN }], 2) +
        '<h4 style="margin:14px 0 6px">Categorías</h4><p class="small muted" style="margin:0 0 6px">Cambiar el nombre de una categoría lo cambia en todos sus insumos. Solo se pueden quitar las vacías.</p>' +
        '<div class="tw"><table class="t renglones"><thead><tr><th>Nombre</th><th class="n">Insumos</th><th></th></tr></thead><tbody id="tgCats">' +
        (g ? (g.categorias || []).map(fila).join('') : '') + '</tbody></table></div><button class="btn sm" id="tgMas" type="button" style="margin-top:6px">+ Categoría</button>',
      alAbrir: m => { $('#tgMas', m.el).onclick = () => $('#tgCats', m.el).insertAdjacentHTML('beforeend', '<tr><td><input type="text" data-cat-orig="" value="" placeholder="Nueva categoría" aria-label="Categoría"></td><td class="n">0</td><td></td></tr>'); },
      botones:[{ texto:'Cancelar' }, { texto:'Guardar', clase:'primary', accion: async m => {
        const nombre = $('#f_nombre', m.el).value.trim(), catA = $('#f_categoriaArken', m.el).value;
        if (!nombre){ UI.toast('Falta el nombre del grupo', 'bad'); return; }
        const filas = $$('#tgCats tr', m.el).map(tr => ({ orig:$('input[type=text]', tr).dataset.catOrig, nuevo:$('input[type=text]', tr).value.trim(), quitar:!!($('[data-quitar]', tr) || {}).checked }));
        const quedan = filas.filter(x => !x.quitar && x.nuevo);
        if (!quedan.length){ UI.toast('El grupo necesita al menos una categoría', 'bad'); return; }
        const vistos = new Set();
        for (const x of quedan){ const k = normaliza(x.nuevo); if (vistos.has(k)){ UI.toast('Categoría repetida: ' + x.nuevo, 'bad'); return; } vistos.add(k); }
        if (filas.some(x => x.quitar && (n[x.orig] || 0) > 0)){ UI.toast('Solo se pueden quitar categorías sin insumos', 'bad'); return; }
        const renombres = filas.filter(x => x.orig && !x.quitar && x.nuevo && x.nuevo !== x.orig);
        const codigo = g ? g.codigo : codigoNuevo;
        await Datos.guardar('taxonomia', Object.assign({}, g || {}, { codigo, nombre, categoriaArken:catA, categorias:quedan.map(x => x.nuevo) }));
        if (renombres.length){
          const mapa = new Map(renombres.map(x => [x.orig, x.nuevo]));
          const cambiados = Datos.insumos().filter(i => i.grupo === codigo && mapa.has(i.categoria)).map(i => Object.assign({}, i, { categoria:mapa.get(i.categoria), actualizado:ahoraISO() }));
          await Datos.guardarVarios('insumos', cambiados);
        }
        await Auditoria.registrar(g ? 'editar grupo' : 'crear grupo', codigo + ' · ' + nombre + (renombres.length ? ' · ' + renombres.length + ' categoría(s) renombrada(s)' : ''));
        m.cerrar(); UI.toast('Grupo guardado', 'ok'); App.render();
      } }] });
  }

  /* ── Bandeja de insumos nuevos ── */
  function bandeja(c){
    const admin = Permisos.esAdmin();
    const l = Datos.lista('propuestas').filter(p => p.tipo === 'insumo').sort((a,b) => (a.estado === 'pendiente') === (b.estado === 'pendiente') ? (a.creado < b.creado ? 1 : -1) : (a.estado === 'pendiente' ? -1 : 1));
    c.innerHTML = '<div class="card">' + (l.length ? '<div class="tw"><table class="t" id="tBand"><thead><tr><th>Propuesto</th><th>Descripción</th><th>Unidad</th><th>Categoría ARKEN</th><th>Origen</th><th>Estado</th><th data-no-orden></th></tr></thead><tbody>' +
      l.map(p => { const d = p.datos || {};
        return '<tr><td class="nowrap small">' + esc(fmtSello(p.creado)) + '<br><span class="muted">' + esc(p.propuestoPor || '') + '</span></td><td>' + esc(d.descripcion || '') +
          (d.codigoArken ? '<div class="small muted">En ARKEN: ' + esc(d.codigoArken) + (d.precioArken ? ' · ' + money3(d.precioArken) : '') + '</div>' : '') + '</td><td>' + esc(d.unidad || '') + '</td>' +
          '<td>' + (d.categoriaArken ? UI.tagCategoria(d.categoriaArken) : '') + '</td><td class="small">' + esc(d.origen || '') + '</td>' +
          '<td>' + (p.estado === 'pendiente' ? '<span class="tag warn">pendiente</span>' : (p.estado === 'aprobada' ? '<span class="tag ok">aprobada</span>' : '<span class="tag bad">rechazada</span>')) +
            (p.motivo ? '<div class="small muted">' + esc(p.motivo) + '</div>' : '') + '</td>' +
          '<td class="nowrap">' + (admin && p.estado === 'pendiente' ? '<button class="btn xs primary" type="button" data-ap="' + esc(p.id) + '">Crear insumo</button> <button class="btn xs" type="button" data-asig="' + esc(p.id) + '">Es uno existente</button> <button class="btn xs ghost" type="button" data-re="' + esc(p.id) + '">Rechazar</button>' : '') + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '<div class="card-body">' + UI.vacio('◇', 'La bandeja está vacía', 'Aquí llegan los insumos que proponen los analistas y los de la lista maestra de ARKEN que no tienen equivalencia en el catálogo.') + '</div>') + '</div>';
    $$('[data-ap]', c).forEach(b => b.onclick = () => aprobar(Datos.uno('propuestas', b.dataset.ap)));
    $$('[data-asig]', c).forEach(b => b.onclick = () => asignarExistente(Datos.uno('propuestas', b.dataset.asig)));
    $$('[data-re]', c).forEach(b => b.onclick = async () => {
      const p = Datos.uno('propuestas', b.dataset.re); if (!p) return;
      const d = await UI.pedir({ titulo:'Rechazar la propuesta', cols:1, campos:[{ k:'motivo', lab:'Motivo', req:true, tipo:'textarea', filas:2 }], textoAceptar:'Rechazar' });
      if (!d) return;
      await Datos.guardar('propuestas', Object.assign({}, p, { estado:'rechazada', motivo:d.motivo, resuelto:ahoraISO(), resueltoPor:Sesion.usuario.usuario }));
      await Auditoria.registrar('rechazar insumo propuesto', (p.datos || {}).descripcion || '');
      App.render();
    });
    UI.conectarOrden('#tBand');
  }
  /** Aprobar: se abre el formulario prellenado; al crear, la propuesta queda aprobada y, si vino de ARKEN, con su equivalencia. */
  async function aprobar(p){
    if (!p || !Permisos.esAdmin()) return;
    const d = p.datos || {};
    const antes = new Set(Datos.insumos().map(i => i.id));
    await editar(null, { descripcion:d.descripcion, especificacion:d.especificacion, unidad:UNIDADES.indexOf(Unidades.normalizar(d.unidad)) >= 0 ? Unidades.normalizar(d.unidad) : (d.unidad || 'UN'),
      categoriaArken:CATEGORIAS_ARKEN.indexOf(d.categoriaArken) >= 0 ? d.categoriaArken : 'Materiales', grupo:d.grupo, categoria:d.categoria, sinonimos:d.sinonimos,
      tarifaIva:d.tarifaIva !== undefined ? d.tarifaIva : 19, regimenIva:d.regimenIva, baseIva:d.baseIva, investigable:d.investigable !== false });
    const creado = Datos.insumos().find(i => !antes.has(i.id));
    if (!creado) return;
    await Datos.guardar('propuestas', Object.assign({}, p, { estado:'aprobada', insumoId:creado.id, resuelto:ahoraISO(), resueltoPor:Sesion.usuario.usuario }));
    if (d.origen === 'lista maestra' && d.descripcionArken){
      const f = Unidades.factorACanonica(creado, d.unidad || creado.unidad, null).factor;
      await Datos.guardar('equivalenciasArken', { id:'eq-' + creado.id, insumoId:creado.id, descripcionArken:d.descripcionArken, unidadArken:d.unidad || creado.unidad,
        categoriaArken:CATEGORIAS_ARKEN.indexOf(d.categoriaArken) >= 0 ? d.categoriaArken : creado.categoriaArken, factor:f > 0 ? f : 1, codigoArken:d.codigoArken || '',
        origen:'lista maestra', estado:f > 0 ? 'exacta' : 'propuesta', actualizado:ahoraISO(), confirmadoPor:f > 0 ? Sesion.usuario.usuario : '' });
    }
    App.render();
  }
  async function asignarExistente(p){
    if (!p || !Permisos.esAdmin()) return;
    const d = p.datos || {};
    let elegido = null;
    const m = UI.modal({ titulo:'¿A qué insumo corresponde?', eyebrow:'Bandeja de nuevos', ancho:'wide',
      cuerpo:'<p class="small">Propuesta: <b>' + esc(d.descripcion || '') + '</b> (' + esc(d.unidad || '') + ')</p><div class="field"><label for="baIns">Insumo del catálogo</label><input id="baIns" type="text" placeholder="Buscar…"></div>' +
        '<div id="baSug" class="small" style="margin-top:8px"></div>',
      alAbrir: mm => {
        UI.sugerirInsumo($('#baIns', mm.el), ins => { elegido = ins; }, {});
        const r = Emparejamiento.emparejar(d.descripcion || '', Datos.insumosActivos(), { unidad:d.unidad, limite:5 });
        $('#baSug', mm.el).innerHTML = r.candidatos.length ? 'Parecidos: ' + r.candidatos.map(x => '<button class="btn xs" type="button" data-sug="' + esc(x.insumo.id) + '">' + esc(x.insumo.descripcion) + ' · ' + Math.round(x.puntaje * 100) + ' %</button>').join(' ') : '';
        $$('[data-sug]', mm.el).forEach(b => b.onclick = () => { elegido = Datos.insumo(b.dataset.sug); $('#baIns', mm.el).value = elegido.descripcion; });
      },
      botones:[{ texto:'Cancelar' }, { texto:'Asignar', clase:'primary', accion: async mm => {
        if (!elegido){ UI.toast('Elija un insumo', 'bad'); return; }
        mm.cerrar();
        await Datos.guardar('propuestas', Object.assign({}, p, { estado:'aprobada', insumoId:elegido.id, motivo:'Corresponde a ' + elegido.codigo, resuelto:ahoraISO(), resueltoPor:Sesion.usuario.usuario }));
        if (d.origen === 'lista maestra' && d.descripcionArken){
          await EquivalenciasUI.editar(elegido, Datos.equivalencia(elegido.id), { descripcionArken:d.descripcionArken, unidadArken:d.unidad, categoriaArken:d.categoriaArken, codigoArken:d.codigoArken });
        }
        App.render();
      } }] });
    return m;
  }

  return { lista, editar, activar, excel, taxonomia, bandeja, siguienteCodigo };
})();

/* ══════════════════════════════════════════════════════════════════════════
   EQUIVALENCIAS CON ARKEN (§9)
   Para que ARKEN reconozca un insumo como «Ya existe», el Excel debe traer
   la descripción, la unidad y la categoría exactas que tiene allá. El
   factor dice cuántas unidades del catálogo caben en una unidad de ARKEN.
   ══════════════════════════════════════════════════════════════════════════ */
const EquivalenciasUI = (function(){
  function lista(c){
    const F = Sesion.filtros.eq = Sesion.filtros.eq || { estado:'', q:'', catA:'', pagina:1 };
    const puede = Permisos.puede('equivalencias');
    c.innerHTML = '<div class="nota-tab">ARKEN reconoce un insumo como <span class="clave">Ya existe</span> cuando la descripción es la misma (sin importar mayúsculas ni tildes). ' +
        'Al sobrescribir, ARKEN cambia el precio y también la unidad y la categoría: por eso el Excel lleva las de allá, exactas.</div>' +
      '<div class="card"><div class="toolbar">' +
        '<div class="field grow"><label for="eqQ">Buscar</label><input id="eqQ" type="search" value="' + esc(F.q) + '" placeholder="Insumo o descripción en ARKEN…"></div>' +
        '<div class="field"><label for="eqEst">Estado</label><select id="eqEst">' + UI.selectOpts([{ v:'exacta', n:'Confirmadas' }, { v:'propuesta', n:'Por confirmar' }, { v:'sin', n:'Sin equivalencia (van como nuevos)' }], F.estado, 'Todas') + '</select></div>' +
        '<div class="field"><label for="eqCat">Categoría ARKEN</label><select id="eqCat">' + UI.selectOpts(CATEGORIAS_ARKEN, F.catA, 'Todas') + '</select></div>' +
      '</div><div id="eqRes"></div></div>';
    const pintar = () => {
      const q = normaliza(F.q).split(/\s+/).filter(Boolean);
      const filas = [];
      Datos.insumosActivos().forEach(i => {
        const e = Datos.equivalencia(i.id);
        const est = e ? e.estado : 'sin';
        if (F.estado && est !== F.estado) return;
        if (F.catA && (e ? e.categoriaArken : i.categoriaArken) !== F.catA) return;
        if (q.length){ const t = normaliza(i.codigo + ' ' + i.descripcion + ' ' + (e ? e.descripcionArken : '')); if (!q.every(p => t.indexOf(p) >= 0)) return; }
        filas.push({ i, e });
      });
      const porPag = 100, pag = Math.min(F.pagina, Math.max(1, Math.ceil(filas.length / porPag)));
      $('#eqRes', c).innerHTML = filas.length ? '<div class="tw"><table class="t" id="tEq"><thead><tr><th>Insumo</th><th>Unidad</th><th>En ARKEN</th><th>Unidad ARKEN</th><th>Categoría ARKEN</th><th class="n">Factor</th><th>Origen</th><th>Estado</th><th data-no-orden></th></tr></thead><tbody>' +
        filas.slice((pag - 1) * porPag, pag * porPag).map(({ i, e }) => '<tr><td><span class="cod">' + esc(i.codigo) + '</span> ' + esc(i.descripcion) + '</td><td>' + esc(i.unidad) + '</td>' +
          (e ? '<td>' + esc(e.descripcionArken) + (e.codigoArken ? ' <span class="cod">' + esc(e.codigoArken) + '</span>' : '') + '</td><td>' + esc(e.unidadArken) + '</td><td>' + UI.tagCategoria(e.categoriaArken) + '</td><td class="n">' + esc(cant(e.factor)) + '</td><td class="small">' + esc(e.origen || '') + '</td>' +
               '<td>' + (e.estado === 'exacta' ? '<span class="tag ok">Confirmada</span>' : '<span class="tag warn">Por confirmar</span>') + '</td>'
             : '<td class="muted small" colspan="5">Va como insumo nuevo, con su propia descripción, unidad y categoría ARKEN (' + esc(i.categoriaArken) + ').</td><td><span class="tag info">Nuevo</span></td>') +
          '<td class="nowrap">' + (puede ? '<button class="btn xs" type="button" data-ed="' + esc(i.id) + '">' + (e ? 'Editar' : 'Asignar') + '</button>' +
            (e && e.estado === 'propuesta' ? ' <button class="btn xs primary" type="button" data-conf="' + esc(e.id) + '">Confirmar</button>' : '') +
            (e ? ' <button class="btn xs ghost" type="button" data-quitar="' + esc(e.id) + '">Quitar</button>' : '') : '') + '</td></tr>').join('') +
        '</tbody></table></div>' + UI.paginador(filas.length, pag, porPag, p => { F.pagina = p; pintar(); })
        : '<div class="card-body">' + UI.vacio('◌', 'Nada con estos filtros', '') + '</div>';
      $$('[data-ed]', c).forEach(b => b.onclick = async () => { const ins = Datos.insumo(b.dataset.ed); await editar(ins, Datos.equivalencia(ins.id)); pintar(); });
      $$('[data-conf]', c).forEach(b => b.onclick = async () => { await confirmar(Datos.uno('equivalenciasArken', b.dataset.conf)); App.render(); });
      $$('[data-quitar]', c).forEach(b => b.onclick = async () => { await quitar(Datos.uno('equivalenciasArken', b.dataset.quitar)); App.render(); });
      UI.conectarOrden('#tEq');
    };
    $('#eqEst', c).onchange = e => { F.estado = e.target.value; F.pagina = 1; pintar(); };
    $('#eqCat', c).onchange = e => { F.catA = e.target.value; F.pagina = 1; pintar(); };
    let t = null; $('#eqQ', c).oninput = e => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value; F.pagina = 1; pintar(); }, 250); };
    pintar();
  }

  /** Otra equivalencia confirmada con la misma descripción en ARKEN (ARKEN las uniría). */
  function choque(insumoId, descripcionArken){
    const k = normaliza(descripcionArken);
    return Datos.equivalencias().find(x => x.insumoId !== insumoId && x.estado === 'exacta' && normaliza(x.descripcionArken) === k) || null;
  }
  function sugerencias(ins){
    const l = Equivalencias.listaArken().filas;
    const pseudo = l.map((f, k) => ({ id:'l' + k, descripcion:f.nombre, unidad:Unidades.normalizar(f.unidad) || f.unidad, sinonimos:[], fila:f }));
    return Emparejamiento.emparejar(ins.descripcion + ' ' + (ins.especificacion || ''), pseudo, { unidad:ins.unidad, limite:6 }).candidatos.map(c => ({ fila:c.insumo.fila, puntaje:c.puntaje }));
  }

  /** Editar o asignar la equivalencia de un insumo. `prefill` viene de la lista maestra. */
  function editar(ins, e, prefill){
    return new Promise(res => {
      if (!ins){ res(null); return; }
      if (!Permisos.exigir('equivalencias', 'editar equivalencias con ARKEN')){ res(null); return; }
      const v = Object.assign({ descripcionArken:ins.descripcion, unidadArken:ins.unidad, categoriaArken:ins.categoriaArken, factor:1, codigoArken:'' }, e || {}, prefill || {});
      const sug = sugerencias(ins);
      let listo = false;
      UI.modal({ titulo:'Equivalencia con ARKEN', eyebrow:ins.codigo + ' · ' + ins.descripcion, ancho:'wide',
        cuerpo:'<p class="small muted" style="margin-top:0">Escriba la descripción tal como está en ARKEN (en la lista maestra del proyecto). La unidad del catálogo es <b>' + esc(ins.unidad) + '</b>.</p>' +
          UI.formHTML([{ k:'descripcionArken', lab:'Descripción en ARKEN', req:true, val:v.descripcionArken, col:2 },
            { k:'unidadArken', lab:'Unidad en ARKEN', req:true, val:v.unidadArken },
            { k:'categoriaArken', lab:'Categoría en ARKEN', tipo:'select', req:true, val:v.categoriaArken, opts:CATEGORIAS_ARKEN },
            { k:'factor', lab:'Factor: ' + ins.unidad + ' por cada unidad de ARKEN', tipo:'number', min:0, step:'any', req:true, val:v.factor,
              ayuda:'1 si la unidad es la misma. Ej.: catálogo en KG y ARKEN en bulto de 50 kg → 50.' },
            { k:'codigoArken', lab:'Código en ARKEN (opcional)', val:v.codigoArken }], 2) +
          '<p class="small" id="eqFactorTxt" style="margin:6px 0 0"></p>' +
          (sug.length ? '<h4 style="margin:14px 0 6px">Parecidos en ' + esc(Equivalencias.listaArken().origen.split(' (')[0].toLowerCase()) + '</h4><div class="stack" style="gap:4px">' +
            sug.map((s, k) => '<button class="btn sm ghost" type="button" data-s="' + k + '" style="justify-content:flex-start;text-align:left">' + esc(s.fila.nombre) + ' <span class="muted">· ' + esc(s.fila.unidad || '') + ' · ' +
              esc(s.fila.categoria || '') + ' · ' + Math.round(s.puntaje * 100) + ' %</span></button>').join('') + '</div>' : ''),
        alAbrir: m => {
          const calcular = () => {
            const u = $('#f_unidadArken', m.el).value;
            const r = Unidades.factorACanonica(ins, u, null);
            $('#eqFactorTxt', m.el).innerHTML = r.factor > 0 ? 'Conversión sugerida: <b>' + esc(cant(r.factor)) + '</b> ' + esc(ins.unidad) + ' por ' + esc(u) + (r.metodo ? ' (' + esc(r.metodo) + ')' : '') +
              ' <button class="btn xs" type="button" id="eqUsar">Usar</button>' : '<span class="muted">' + esc(r.advertencia || 'Sin conversión automática: indique el factor.') + '</span>';
            const b = $('#eqUsar', m.el); if (b) b.onclick = () => { $('#f_factor', m.el).value = r.factor; };
          };
          $('#f_unidadArken', m.el).oninput = calcular;
          calcular();
          $$('[data-s]', m.el).forEach(b => b.onclick = () => {
            const s = sug[+b.dataset.s].fila;
            $('#f_descripcionArken', m.el).value = s.nombre; $('#f_unidadArken', m.el).value = s.unidad || '';
            if (CATEGORIAS_ARKEN.indexOf(s.categoria) >= 0) $('#f_categoriaArken', m.el).value = s.categoria;
            const r = Unidades.factorACanonica(ins, s.unidad, null); if (r.factor > 0) $('#f_factor', m.el).value = r.factor;
            calcular();
          });
        },
        alCerrar(){ if (!listo) res(null); },
        botones:[{ texto:'Cancelar' }, { texto:'Guardar y confirmar', clase:'primary', accion: async m => {
          const d = UI.leerForm(m.el);
          const desc = String(d.descripcionArken || '').trim(), uni = String(d.unidadArken || '').trim();
          if (!desc || !uni){ UI.toast('Faltan la descripción o la unidad de ARKEN', 'bad'); return; }
          if (!(Number(d.factor) > 0)){ UI.toast('El factor debe ser mayor que cero', 'bad'); return; }
          const otro = choque(ins.id, desc);
          if (otro){ UI.toast('Esa descripción ya la tiene ' + Piezas.nombreInsumo(otro.insumoId) + ': ARKEN uniría los dos.', 'bad'); return; }
          const reg = Object.assign({}, e || { id:Datos.uno('equivalenciasArken', 'eq-' + ins.id) ? uid('eq') : 'eq-' + ins.id, insumoId:ins.id, origen:'manual' },
            { descripcionArken:desc, unidadArken:uni, categoriaArken:d.categoriaArken, factor:Number(d.factor), codigoArken:String(d.codigoArken || '').trim(),
              estado:'exacta', actualizado:ahoraISO(), confirmadoPor:Sesion.usuario.usuario });
          await Datos.guardar('equivalenciasArken', reg);
          await Auditoria.registrar('equivalencia ARKEN', ins.codigo + ' → «' + desc + '» (' + uni + ', ' + d.categoriaArken + ', factor ' + d.factor + ')');
          listo = true; m.cerrar(); UI.toast('Equivalencia guardada', 'ok'); res(reg);
        } }] });
    });
  }
  async function confirmar(e){
    if (!e || !Permisos.exigir('equivalencias', 'confirmar equivalencias')) return null;
    const ins = Datos.insumo(e.insumoId); if (!ins) return null;
    const otro = choque(ins.id, e.descripcionArken);
    if (otro){ UI.aviso('No se puede confirmar', '<p>La descripción «' + esc(e.descripcionArken) + '» ya está confirmada para ' + esc(Piezas.nombreInsumo(otro.insumoId)) + '. ARKEN uniría los dos insumos.</p>'); return null; }
    const conv = Unidades.factorACanonica(ins, e.unidadArken, null);
    if (Unidades.normalizar(e.unidadArken) !== ins.unidad && Number(e.factor) === 1 && !(conv.factor === 1)){
      UI.toast('La unidad de ARKEN (' + e.unidadArken + ') no es la del catálogo (' + ins.unidad + '): revise el factor antes de confirmar.', 'bad');
      return editar(ins, e);
    }
    const reg = Object.assign({}, e, { estado:'exacta', actualizado:ahoraISO(), confirmadoPor:Sesion.usuario.usuario });
    await Datos.guardar('equivalenciasArken', reg);
    await Auditoria.registrar('confirmar equivalencia ARKEN', ins.codigo + ' → «' + e.descripcionArken + '»');
    UI.toast('Equivalencia confirmada', 'ok');
    return reg;
  }
  async function quitar(e){
    if (!e || !Permisos.exigir('equivalencias', 'quitar equivalencias')) return;
    const ok = await UI.confirmar({ titulo:'¿Quitar la equivalencia?', textoAceptar:'Quitar', claseAceptar:'danger',
      mensaje:'«' + Piezas.nombreInsumo(e.insumoId) + '» irá a ARKEN como insumo nuevo, con su propia descripción. Si ya existe allá con otro nombre, ARKEN lo duplicaría.' });
    if (!ok) return;
    await Datos.borrar('equivalenciasArken', e.id);
    await Auditoria.registrar('quitar equivalencia ARKEN', Piezas.nombreInsumo(e.insumoId) + ' · «' + e.descripcionArken + '»');
  }
  return { lista, editar, confirmar, quitar, sugerencias };
})();

/* ══════════════════════════════════════════════════════════════════════════
   LISTA MAESTRA DE ARKEN (§9.1)
   El Excel que exporta ARKEN (Módulo 04 › Exportar / importar… › Excel —
   Lista maestra) se empareja con el catálogo: exactas, propuestas para
   revisar y las que no tienen equivalencia van a la bandeja de nuevos.
   ══════════════════════════════════════════════════════════════════════════ */
const ListaMaestraUI = (function(){
  function ultima(){ return Datos.lista('listasArken').sort((a,b) => String(a.importada) < String(b.importada) ? 1 : -1)[0] || null; }
  function pintar(c){
    const l = ultima();
    const puede = Permisos.puede('equivalencias');
    let h = '<div class="card"><div class="card-head"><h3>Lista maestra del proyecto en ARKEN</h3>' +
      (puede ? '<button class="btn primary sm" id="lmImp" type="button">Importar lista maestra (Excel)</button>' : '') + '</div><div class="card-body">' +
      '<p class="small" style="margin-top:0">En ARKEN CONTROL, abra el proyecto y vaya a <b>Módulo 04 › «Exportar / importar…» › «Excel — Lista maestra»</b>. Importe aquí ese archivo: ' +
      'cada insumo de ARKEN se empareja con el catálogo y así el Excel de precios usa los nombres exactos del proyecto.</p>';
    if (!l) h += UI.vacio('◇', 'No se ha importado ninguna lista', 'Mientras tanto, el validador compara contra el catálogo semilla de ARKEN (los 336 insumos con que arranca todo proyecto).');
    else {
      const r = l.resumen || {};
      const clases = ContratoArken.abc(l.filas || []);
      const porClase = { A:{ n:0, v:0 }, B:{ n:0, v:0 }, C:{ n:0, v:0 } };
      clases.forEach(f => { porClase[f.clase].n++; porClase[f.clase].v += Number(f.valor) || 0; });
      const total = clases.reduce((a, f) => a + (Number(f.valor) || 0), 0);
      const eqPorDesc = new Map(Datos.equivalencias().filter(e => e.estado === 'exacta').map(e => [normaliza(e.descripcionArken), e]));
      h += '<div class="kv c2"><div class="k">Archivo</div><div class="v">' + esc(l.nombre || '') + '</div><div class="k">Importada</div><div class="v">' + esc(fmtSello(l.importada)) + ' · ' + esc(l.usuario || '') + '</div>' +
          '<div class="k">Insumos en la lista</div><div class="v">' + (l.filas || []).length + '</div><div class="k">Resultado</div><div class="v">' + (r.exactas || 0) + ' confirmadas · ' + (r.propuestas || 0) + ' por confirmar · ' +
          (r.nuevos || 0) + ' a la bandeja · ' + (r.omitidas || 0) + ' sin acción</div></div>' +
        '<h4 style="margin:16px 0 6px">Análisis ABC por valor presupuestado</h4>' +
        (total > 0 ? '<div class="grid g3">' + ['A','B','C'].map(k => '<div class="stat' + (k === 'A' ? ' accent' : '') + '"><div class="lab">Clase ' + k + '</div><div class="val">' + porClase[k].n + ' insumos</div><div class="foot">' +
            pct(porClase[k].v / total) + ' del valor · ' + money(porClase[k].v) + '</div></div>').join('') + '</div>' +
          '<p class="small muted">Los de clase A concentran el 80 % del valor del presupuesto: son los primeros que conviene cotizar y actualizar.</p>' +
          '<div class="tw" style="max-height:50vh;overflow:auto"><table class="t" id="tAbc"><thead><tr><th>Clase</th><th>Código ARKEN</th><th>Descripción</th><th>Unidad</th><th class="n">Precio en ARKEN</th><th class="n">Valor presupuestado</th><th class="n">Participación</th><th>En el catálogo</th></tr></thead><tbody>' +
          clases.filter(f => f.clase !== 'C').slice(0, 200).map(f => { const e = eqPorDesc.get(normaliza(f.descripcion));
            return '<tr><td><span class="tag ' + (f.clase === 'A' ? 'brass' : 'info') + '">' + f.clase + '</span></td><td><span class="cod">' + esc(f.codigo) + '</span></td><td>' + esc(f.descripcion) + '</td><td>' + esc(f.unidad) + '</td>' +
              '<td class="n">' + money(f.precio) + '</td><td class="n">' + money(f.valor) + '</td><td class="n">' + pct(f.participacion) + '</td><td>' +
              (e ? '<button class="btn xs ghost" type="button" data-fi="' + esc(e.insumoId) + '">' + esc(Piezas.nombreInsumo(e.insumoId)).slice(0, 60) + '</button>' : '<span class="tag warn">sin equivalencia</span>') + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<p class="small muted">La lista no trae cantidades presupuestadas (el proyecto aún no tiene presupuesto): no hay análisis ABC.</p>');
    }
    h += '</div></div>';
    c.innerHTML = h;
    if ($('#lmImp', c)) $('#lmImp', c).onclick = importar;
    $$('[data-fi]', c).forEach(b => b.onclick = () => Ficha.abrir(b.dataset.fi, null, 'resumen'));
    UI.conectarOrden('#tAbc');
  }

  function importar(){
    if (!Permisos.exigir('equivalencias', 'importar la lista maestra')) return;
    if (!Documentos.hayXLSX()){ Documentos.avisoLibreria('SheetJS'); return; }
    UI.pedirArchivo('.xlsx,.xls,.csv', async f => {
      let filas;
      try {
        const wb = XLSX.read(new Uint8Array(f.datos), { type:'array' });
        filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
      } catch(e){ UI.aviso('No fue posible leer el archivo', '<p>' + esc(e.message || e) + '</p>'); return; }
      const lm = ContratoArken.leerListaMaestra(filas);
      if (!lm.ok || !lm.filas.length){ UI.aviso('No es una lista maestra de ARKEN', '<p>' + esc(lm.error || 'El archivo no tiene filas.') + '</p><p class="small muted">Expórtela desde ARKEN: Módulo 04 › «Exportar / importar…» › «Excel — Lista maestra».</p>'); return; }
      const pr = UI.progreso('Emparejando con el catálogo', lm.filas.length + ' insumos de ARKEN');
      const res = [];
      try {
        const insumos = Datos.insumosActivos(), eqs = Datos.equivalencias();
        for (let i = 0; i < lm.filas.length; i += 25){
          ContratoArken.emparejarLista(lm.filas.slice(i, i + 25), insumos, eqs).forEach(x => res.push(x));
          pr.fijar(Math.min(1, (i + 25) / lm.filas.length));
          await pausa(0);
        }
      } finally { pr.cerrar(); }
      revisar(f.nombre, lm.filas, res);
    }, 'binario');
  }

  function revisar(nombre, filasLista, res){
    const filas = res.map((r, k) => {
      const ins = r.insumoId ? Datos.insumo(r.insumoId) : null;
      const conv = ins ? Unidades.factorACanonica(ins, r.fila.unidad, null) : { factor:null };
      return { k, f:r.fila, insumoId:r.insumoId, estado:r.estado, puntaje:r.puntaje, alternativas:r.alternativas || [], factor:conv.factor > 0 ? conv.factor : 1, factorSeguro:conv.factor > 0,
        accion:r.estado === 'exacta' ? 'confirmar' : (r.estado === 'propuesta' ? 'proponer' : 'nuevo') };
    });
    const cuenta = () => {
      const n = { confirmar:0, proponer:0, nuevo:0, omitir:0 };
      filas.forEach(x => { n[x.accion]++; });
      return n;
    };
    const ACC = [{ v:'confirmar', n:'Confirmar' }, { v:'proponer', n:'Dejar por confirmar' }, { v:'nuevo', n:'Proponer insumo nuevo' }, { v:'omitir', n:'No hacer nada' }];
    const fila = x => {
      const ins = x.insumoId ? Datos.insumo(x.insumoId) : null;
      return '<tr data-k="' + x.k + '"><td><span class="cod">' + esc(x.f.codigo) + '</span></td><td>' + esc(x.f.descripcion) + '<div class="small muted">' + esc(x.f.unidad) + ' · ' + esc(x.f.categoria) + ' · ' + money(x.f.precio) + '</div></td>' +
        '<td>' + (ins ? '<span class="cod">' + esc(ins.codigo) + '</span> ' + esc(ins.descripcion) + ' <span class="muted small">(' + esc(ins.unidad) + ')</span>' : '<span class="muted">—</span>') +
          ' <button class="btn xs ghost" type="button" data-cambiar="' + x.k + '">' + (ins ? 'Cambiar' : 'Buscar') + '</button>' +
          (x.estado !== 'exacta' && x.puntaje ? '<div class="small muted">Parecido ' + Math.round(x.puntaje * 100) + ' %</div>' : '') + '</td>' +
        '<td><input type="number" min="0" step="any" value="' + esc(x.factor) + '" data-factor="' + x.k + '" style="width:80px"' + (ins ? '' : ' disabled') + '>' + (ins && !x.factorSeguro && Unidades.normalizar(x.f.unidad) !== ins.unidad ? ' <span class="tag warn" title="Unidades distintas sin conversión automática">revise</span>' : '') + '</td>' +
        '<td><select data-acc="' + x.k + '">' + UI.selectOpts(ACC.filter(a => ins || a.v === 'nuevo' || a.v === 'omitir'), x.accion) + '</select></td></tr>';
    };
    const m = UI.modal({ titulo:'Revisar la lista maestra', eyebrow:nombre, ancho:'xwide', fijo:true,
      cuerpo:'<p class="small" style="margin-top:0">Exactas: misma descripción. Parecidas: revise antes de confirmar. Las que no tienen equivalencia pueden ir a la bandeja de nuevos. Nada se guarda hasta pulsar «Guardar».</p>' +
        '<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px"><span class="small" id="lmCuenta"></span><span style="flex:1"></span>' +
          '<button class="btn xs" type="button" id="lmTodasConf">Confirmar todas las parecidas</button></div>' +
        '<div class="tw" style="max-height:58vh;overflow:auto"><table class="t renglones"><thead><tr><th>Código ARKEN</th><th>En ARKEN</th><th>Insumo del catálogo</th><th>Factor</th><th>Acción</th></tr></thead><tbody id="lmFilas">' +
        filas.map(fila).join('') + '</tbody></table></div>',
      alAbrir: mm => {
        const pintarCuenta = () => { const n = cuenta(); $('#lmCuenta', mm.el).textContent = n.confirmar + ' a confirmar · ' + n.proponer + ' por confirmar · ' + n.nuevo + ' a la bandeja · ' + n.omitir + ' sin acción'; };
        const conectar = raiz => {
          $$('[data-acc]', raiz).forEach(s => s.onchange = () => { filas[+s.dataset.acc].accion = s.value; pintarCuenta(); });
          $$('[data-factor]', raiz).forEach(i => i.onchange = () => { filas[+i.dataset.factor].factor = Number(i.value) || 1; });
          $$('[data-cambiar]', raiz).forEach(b => b.onclick = () => cambiar(+b.dataset.cambiar));
        };
        const cambiar = k => {
          const x = filas[k];
          let elegido = null;
          UI.modal({ titulo:'Insumo del catálogo para', eyebrow:x.f.descripcion, ancho:'wide',
            cuerpo:'<div class="field"><label for="lmBus">Buscar</label><input id="lmBus" type="text" placeholder="Código o descripción…"></div><div class="small" id="lmAlt" style="margin-top:8px"></div>',
            alAbrir: m2 => {
              UI.sugerirInsumo($('#lmBus', m2.el), ins => { elegido = ins; });
              $('#lmAlt', m2.el).innerHTML = x.alternativas.length ? 'Parecidos: ' + x.alternativas.map(a => '<button class="btn xs" type="button" data-alt="' + esc(a.insumoId) + '">' + esc(Piezas.nombreInsumo(a.insumoId)) + ' · ' + Math.round(a.puntaje * 100) + ' %</button>').join(' ') : '';
              $$('[data-alt]', m2.el).forEach(b => b.onclick = () => { elegido = Datos.insumo(b.dataset.alt); $('#lmBus', m2.el).value = elegido.descripcion; });
            },
            botones:[{ texto:'Sin insumo', accion: m2 => { x.insumoId = null; x.accion = 'nuevo'; m2.cerrar(); repintar(k); } },
                     { texto:'Usar este', clase:'primary', accion: m2 => {
                       if (!elegido){ UI.toast('Elija un insumo', 'bad'); return; }
                       const conv = Unidades.factorACanonica(elegido, x.f.unidad, null);
                       x.insumoId = elegido.id; x.factor = conv.factor > 0 ? conv.factor : 1; x.factorSeguro = conv.factor > 0; x.accion = 'confirmar'; x.estado = 'manual';
                       m2.cerrar(); repintar(k);
                     } }] });
        };
        const repintar = k => { const tr = $('#lmFilas tr[data-k="' + k + '"]', mm.el); tr.outerHTML = fila(filas[k]); conectar($('#lmFilas tr[data-k="' + k + '"]', mm.el)); pintarCuenta(); };
        conectar(mm.el); pintarCuenta();
        $('#lmTodasConf', mm.el).onclick = () => { filas.forEach(x => { if (x.accion === 'proponer') x.accion = 'confirmar'; }); $('#lmFilas', mm.el).innerHTML = filas.map(fila).join(''); conectar(mm.el); pintarCuenta(); };
      },
      botones:[{ texto:'Cancelar' }, { texto:'Guardar', clase:'primary', accion: async mm => {
        const r = await guardar(nombre, filasLista, filas);
        if (r){ mm.cerrar(); Sesion.tabs['09'] = 'lista'; App.render(); }
      } }] });
    return m;
  }

  async function guardar(nombre, filasLista, filas){
    const ahora = ahoraISO(), usuario = Sesion.usuario.usuario;
    const porInsumo = new Map(), avisos = [];
    // Una equivalencia por insumo y una descripción de ARKEN por insumo: lo repetido se deja por confirmar.
    filas.forEach(x => {
      if (!x.insumoId || (x.accion !== 'confirmar' && x.accion !== 'proponer')) return;
      if (porInsumo.has(x.insumoId)){ avisos.push('«' + x.f.descripcion + '» y «' + porInsumo.get(x.insumoId).f.descripcion + '» apuntan al mismo insumo: se guardó solo la primera.'); x.accion = 'omitir'; return; }
      porInsumo.set(x.insumoId, x);
    });
    const eqs = [], propuestas = [];
    porInsumo.forEach((x, insumoId) => {
      const previa = Datos.equivalencia(insumoId);
      const otro = x.accion === 'confirmar' ? EquivalenciasUI_choque(insumoId, x.f.descripcion) : null;
      const estado = x.accion === 'confirmar' && !otro ? 'exacta' : 'propuesta';
      if (otro) avisos.push('«' + x.f.descripcion + '» ya está confirmada para otro insumo: quedó por confirmar.');
      eqs.push({ id:previa ? previa.id : 'eq-' + insumoId, insumoId, descripcionArken:x.f.descripcion, unidadArken:x.f.unidad || (Datos.insumo(insumoId) || {}).unidad || 'UN',
        categoriaArken:CATEGORIAS_ARKEN.indexOf(x.f.categoria) >= 0 ? x.f.categoria : (Datos.insumo(insumoId) || {}).categoriaArken, factor:Number(x.factor) > 0 ? Number(x.factor) : 1,
        codigoArken:x.f.codigo || '', origen:'lista maestra', estado, actualizado:ahora, confirmadoPor:estado === 'exacta' ? usuario : '' });
    });
    const pendientes = new Set(Datos.lista('propuestas').filter(p => p.tipo === 'insumo' && p.estado === 'pendiente').map(p => normaliza((p.datos || {}).descripcion || '')));
    filas.filter(x => x.accion === 'nuevo').forEach(x => {
      if (pendientes.has(normaliza(x.f.descripcion))) return;
      propuestas.push({ id:uid('pr'), tipo:'insumo', estado:'pendiente', motivo:'', propuestoPor:usuario, creado:ahora,
        datos:{ origen:'lista maestra', descripcion:x.f.descripcion, descripcionArken:x.f.descripcion, unidad:x.f.unidad, categoriaArken:x.f.categoria, codigoArken:x.f.codigo, precioArken:x.f.precio } });
    });
    const resumen = { exactas:eqs.filter(e => e.estado === 'exacta').length, propuestas:eqs.filter(e => e.estado === 'propuesta').length, nuevos:propuestas.length,
                      omitidas:filas.filter(x => x.accion === 'omitir').length };
    await Datos.guardar('listasArken', { id:uid('lista'), nombre, importada:ahora, usuario, filas:filasLista, resumen });
    await Datos.guardarVarios('equivalenciasArken', eqs);
    await Datos.guardarVarios('propuestas', propuestas);
    await Auditoria.registrar('importar lista maestra ARKEN', nombre + ' · ' + filasLista.length + ' filas · ' + resumen.exactas + ' confirmadas, ' + resumen.propuestas + ' por confirmar, ' + resumen.nuevos + ' a la bandeja');
    if (avisos.length) UI.aviso('Lista maestra guardada con observaciones', '<ul class="small">' + avisos.slice(0, 30).map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>');
    else UI.toast('Lista maestra guardada', 'ok');
    return resumen;
  }
  function EquivalenciasUI_choque(insumoId, desc){
    const k = normaliza(desc);
    return Datos.equivalencias().find(x => x.insumoId !== insumoId && x.estado === 'exacta' && normaliza(x.descripcionArken) === k) || null;
  }
  return { pintar, importar, ultima };
})();

const ConfigUI = (function(){
  const soloAdmin = () => Permisos.esAdmin();
  const avisoAdmin = '<div class="alert info" style="margin-bottom:var(--gap)"><div class="ic">i</div><div class="bd">Solo el administrador cambia esta configuración. Usted puede consultarla.</div></div>';

  /* ── Empresa ── */
  function empresa(c){
    const e = Datos.config('empresa', {}) || {};
    const admin = soloAdmin();
    c.innerHTML = (admin ? '' : avisoAdmin) + '<div class="card"><div class="card-body">' +
      UI.formHTML([{ k:'razonSocial', lab:'Razón social', val:e.razonSocial, col:2, dis:!admin },
        { k:'nit', lab:'NIT', val:e.nit, dis:!admin }, { k:'dv', lab:'Dígito de verificación', val:e.dv, dis:!admin },

    const tipoValor = p ? typeof p.valor : 'number';

      campos:[p ? { k:'clave', lab:'Parámetro', val:p.clave, dis:true } : { k:'clave', lab:'Parámetro', tipo:'select', req:true, opts:claves.map(k => ({ v:k, n:NOMBRE_PARAM[k] || k })) },
        tipoValor === 'boolean' ? { k:'valor', lab:'Valor', tipo:'select', val:p && p.valor ? 'si' : 'no', opts:[{ v:'si', n:'Sí' }, { v:'no', n:'No' }] }
          : (tipoValor === 'string' ? { k:'valor', lab:'Valor', req:true, val:p ? p.valor : '' } : { k:'valor', lab:'Valor', tipo:'number', req:true, step:'any', val:p ? p.valor : '' }),
        { k:'vigenteDesde', lab:'Vigente desde', tipo:'date', val:p ? p.vigenteDesde : '' }, { k:'vigenteHasta', lab:'Vigente hasta', tipo:'date', val:p ? p.vigenteHasta : '' },
        { k:'norma', lab:'Norma', val:p ? p.norma : '', col:2, ayuda:'Decreto, ley o artículo. Solo la que haya verificado.' }, { k:'nota', lab:'Nota', val:p ? p.nota : '', col:2 }],
      validar: x => {

        if (tipoValor === 'number' && !(Number(x.valor) >= 0)) return 'El valor debe ser un número mayor o igual a cero.';
        const clave = p ? p.clave : x.clave;
        const choca = Datos.parametros().find(q => q.clave === clave && (!p || q.id !== p.id) && (q.vigenteDesde || '') === (x.vigenteDesde || ''));

/* ══════════════════════════════════════════════════════════════════════════

const Admin = (function(){

        '<div class="btn-row"><button class="btn sm" id="adMiClave" type="button">Cambiar mi contraseña</button><button class="btn sm primary" id="adNuevo" type="button">+ Nuevo usuario</button></div></div>' +

      l.map(u => '<tr><td><b>' + esc(u.usuario) + '</b></td><td>' + esc(u.nombre || '') + '</td><td>' + esc(Permisos.rolNombre(u.rol)) + '</td>' +

        '<td class="small">' + (u.ultimoIngreso ? esc(fmtSello(u.ultimoIngreso)) : '—') + '</td>' +
        '<td class="nowrap"><button class="btn xs" type="button" data-ed="' + esc(u.id) + '">Editar</button> <button class="btn xs ghost" type="button" data-clave="' + esc(u.id) + '">Nueva contraseña</button></td></tr>').join('') +
      '</tbody></table></div>';
    $('#adMiClave', z).onclick = () => Auth.cambiarPropia();
    $('#adNuevo', z).onclick = async () => { await editarUsuario(null); repintar(); };

    $$('[data-clave]', z).forEach(b => b.onclick = async () => { await nuevaClave(Datos.uno('usuarios', b.dataset.clave)); repintar(); });
  }
  function adminsActivos(excepto){ return Datos.usuarios().filter(u => u.rol === 'administrador' && u.activo !== false && u.id !== excepto).length; }
  async function editarUsuario(u){
    const campos = [
      { k:'usuario', lab:'Usuario', req:true, val:u ? u.usuario : '', dis:!!u, ayuda:u ? '' : 'Sin espacios. Con él se ingresa.' },
      { k:'nombre', lab:'Nombre', req:true, val:u ? u.nombre : '' },
      { k:'rol', lab:'Rol', tipo:'select', req:true, val:u ? u.rol : 'analista', opts:Object.keys(ROLES).map(k => ({ v:k, n:ROLES[k] })) },
      { k:'activo', lab:'Activo', tipo:'check', val:u ? u.activo !== false : true }
    ].concat(u ? [] : [{ k:'clave', lab:'Contraseña inicial (mínimo 5 caracteres)', tipo:'password', req:true, ayuda:'El usuario la cambiará en su primer ingreso.' }]);
    const d = await UI.pedir({ titulo:u ? 'Editar ' + u.usuario : 'Nuevo usuario', eyebrow:'Usuarios', cols:2, campos,

          if (Datos.usuarios().some(y => normaliza(y.usuario) === nombre)) return 'Ya existe ese usuario.';
          if (String(x.clave || '').length < 5) return 'La contraseña debe tener al menos 5 caracteres.';

        if (u && u.rol === 'administrador' && (x.rol !== 'administrador' || !x.activo) && !adminsActivos(u.id)) return 'Debe quedar al menos un administrador activo.';
        if (u && Sesion.usuario && u.id === Sesion.usuario.id && !x.activo) return 'No puede desactivar su propio usuario.';
        return '';
