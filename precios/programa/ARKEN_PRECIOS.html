    const d = c.despues;
    const sigue = s => /^\s*\)?\s*[:\-]?\s*\$?\s*\d/.test(s);   // la frase rotula el precio que viene después
    const no = RE_IVA_NO.exec(d), si = RE_IVA_SI.exec(d);
    if (no && !sigue(d.slice(no[0].length))) c.iva = false;
    else if (si && !sigue(d.slice(si[0].length))) c.iva = true;
    else if (/(antes de iva|sin iva|\+\s*iva|mas iva|excluido iva|precio neto)\s*[:\-]?\s*\$?\s*$/.test(c.antes)) c.iva = false;
    else if (/(con iva|iva incluido|incluye iva|precio con iva)\s*[:\-]?\s*\$?\s*$/.test(c.antes)) c.iva = true;
    else c.iva = null;
    return c;
  }

  const RE_UNIDAD_PRECIO = /^[ \t]*(?:\/|x|por|el|la|cada|c\/)?[ \t]*(m2|m²|mt2|mts2|metro cuadrado|m3|m³|mt3|metro cubico|kg|kilos?|kilogramo|ml\b|m\.l\.|mts?\b|metro lineal|metros?|m\b|und\b|unidad|u\b|c\/u|cu\b|galon|gal\b|gl\b|litros?|lts?\b|l\b|bultos?|cajas?|rollos?|horas?|hr\b|jornal(?:es)?|dias?\b|mes\b|mensual|viajes?|toneladas?|ton\b|libras?|lb\b|juegos?|par\b|global|kwh)/;
  const RE_CU = /\bc\/u\b|\bcada uno\b|\bpor unidad\b/;

  function unidadDe(txt){
    const u = normaliza(txt).replace(/\s+/g,' ');
    return Unidades.normalizar(u);
  }

  const RE_PRES = /(bulto|saco|caja|rollo|paquete|cunete|caneca|tubo|varilla|lamina|galon|bolsa|tarro|garrafa|balde|pliego|plancha|tira|cunete)?[ \t]*(?:de|x|por|con)?[ \t]*\(?[ \t]*(\d+(?:[.,]\d+)?)[ \t]*(kg|kilos?|kilogramos?|m2|m²|mt2|mts2|m3|m³|metros?|mts?|m|ml|lts?|litros?|l|gal(?:ones)?|und|unidades|uds|piezas)(?![a-z0-9])/g;
  const PALABRA_PAQUETE = /\b(bulto|saco|caja|rollo|paquete|cunete|caneca|tubo|varilla|lamina|bolsa|tarro|garrafa|balde|pliego|plancha|tira)\b/;
  const CODIGO_PAQUETE = { bulto:'BTO', saco:'BTO', caja:'CAJA', rollo:'ROLLO' };

  function presentacion(p, excluir){
    RE_PRES.lastIndex = 0;
    let m;
    while ((m = RE_PRES.exec(p))){
      const ini = m.index, fin = m.index + m[0].length;
      if (excluir.some(c => ini < c.fin && fin > c.ini)) continue;
      if (/\/\s*$/.test(p.slice(Math.max(0, ini - 2), ini + (m[0].match(/^\s*/)[0].length)))) continue;
      const cantidad = numero(m[2]);
      if (!isFinite(cantidad) || cantidad <= 0) continue;
      const unidad = unidadDe(m[3]);
      if (!unidad) continue;
      const nombre = m[1] || (PALABRA_PAQUETE.exec(p)||[])[1] || '';
      return { cantidad, unidad, nombre };
    }
    if (/\bcunete\b/.test(p)) return { cantidad:5, unidad:'GL', nombre:'cuñete' };
    if (/\bcuarto de galon\b|\b1\/4 de galon\b/.test(p)) return { cantidad:0.946, unidad:'L', nombre:'cuarto de galón' };
    return null;
  }

  /** Punto de entrada. Devuelve el precio vigente y lo que lo acompaña. */
  function leer(texto){
    const original = String(texto === null || texto === undefined ? '' : texto);
    const t = original.replace(/[\u00A0\u2007\u202F]/g, ' ').replace(/\s+/g, ' ')
      .replace(/\$\s*(\d{1,3}(?: \d{3})+)(?!\d)/g, (m0, g) => '$' + ' '.repeat(m0.length - 1 - g.length) + g.replace(/ (?=\d{3})/g, '.'));
    const p = plano(t);
    const r = { ok:false, valor:null, moneda:'COP', incluyeIva:null, promocion:false, precioAnterior:null,
                desde:false, rango:null, esRango:false, unidad:null, presentacion:null, porPaquete:false,
                alternativas:[], disponibilidad:null, advertencias:[], textoPrecio:'' };
    if (/\bagotad|sin existencias|no disponible|sin stock|fuera de stock/.test(p)) r.disponibilidad = 'agotado';
    else if (/\bdisponible|en stock|entrega inmediata/.test(p)) r.disponibilidad = 'disponible';

    let cs = candidatos(t, p).map(clasificar);
    if (cs.some(c => c.marcado)) cs = cs.filter(c => c.marcado);
    cs = cs.filter(c => !c.ahorro);
    const impuestos = cs.filter(c => c.impuesto);
    cs = cs.filter(c => !c.impuesto);
    if (!cs.length){
      r.advertencias.push(r.disponibilidad === 'agotado' ? 'Producto agotado: no hay precio.' : 'No se encontró un precio en el texto.');
      return r;
    }

    let elegido = null;
    // Rango: «$30.000 - $35.000», «entre … y …», «desde … hasta …»
    for (let i = 0; i < cs.length - 1 && !elegido; i++){
      const a = cs[i], b = cs[i+1];
      const entre = p.slice(a.fin, b.ini);
      if (/^\s*(-|–|—|a|al|y|hasta|o)\s*\$?\s*$/.test(entre) || b.hasta){
        const pre = a.antes;
        const caida = /\bde\s*\$?\s*$/.test(pre) && /^\s*a\s*\$?\s*$/.test(entre) && a.valor > b.valor;
        if (caida){ elegido = b; r.promocion = true; r.precioAnterior = a.valor; break; }
        if (a.valor < b.valor){
          r.rango = { min:a.valor, max:b.valor }; r.esRango = true;
          elegido = { valor:redondear3((a.valor + b.valor)/2), texto:t.slice(a.ini, b.fin), ini:a.ini, fin:b.fin,
                      despues:b.despues, antes:a.antes, iva: a.iva !== null ? a.iva : b.iva, moneda:a.moneda };
          r.advertencias.push('Rango de precios: se toma el punto medio y se conserva el rango.');
        }
      }
    }
    if (!elegido){
      const anteriores = cs.filter(c => c.anterior && !c.vigente);
      const vigentes = cs.filter(c => !(c.anterior && !c.vigente));
      const totales = vigentes.filter(c => c.total);
      if (anteriores.length && vigentes.length){
        elegido = vigentes.find(c => c.vigente) || vigentes[0];
        r.promocion = true;
        r.precioAnterior = Math.max.apply(null, anteriores.map(c => c.valor));
      } else if (vigentes.some(c => c.vigente) && vigentes.length > 1){
        elegido = vigentes.find(c => c.vigente);
        r.promocion = true;
        const otros = vigentes.filter(c => c !== elegido && c.valor > elegido.valor);
        if (otros.length) r.precioAnterior = Math.max.apply(null, otros.map(c => c.valor));
      } else if (totales.length){
        elegido = totales[totales.length - 1];
        if (impuestos.length) elegido.iva = true;
      } else {
        const conIva = vigentes.filter(c => c.iva === true), sinIva = vigentes.filter(c => c.iva === false);
        elegido = (conIva.length && sinIva.length) ? conIva[0] : vigentes[0];
        if (vigentes.some(c => c.vigente)) r.promocion = true;
      }
      cs.filter(c => c !== elegido && !r.rango && c.valor !== r.precioAnterior)
        .forEach(c => r.alternativas.push({ valor:c.valor, incluyeIva:c.iva, texto:c.texto }));
    }
    if (/(^|\s)-\s?\d{1,2}\s?%|\d{1,2}\s?%\s*(dto|descuento|off|de descuento)|\boferta\b|\bpromo/.test(p)) r.promocion = true;
    r.desde = !r.rango && !!(elegido.desde || (/\bdesde\b/.test(p) && !/\bhasta\b/.test(p) && cs.length === 1));
    r.valor = elegido.valor;
    r.moneda = elegido.moneda || 'COP';
    r.textoPrecio = elegido.texto;

    // IVA: primero lo que acompaña al precio; si no dice nada, lo que dice el texto
    if (elegido.iva === true || elegido.iva === false) r.incluyeIva = elegido.iva;
    else if (/iva incluido|incluye iva|con iva|iva inc\b|precios? (con|incluye) iva|i\.v\.a\. incluido|impuestos incluidos/.test(p)) r.incluyeIva = true;
    else if (/\+\s*iva|mas iva|antes de iva|sin iva|no incluye iva|iva no incluido|excluye iva|antes de impuestos|precios? netos?/.test(p)) r.incluyeIva = false;

    // Unidad: la que va pegada al precio; si no, la del texto
    const um = RE_UNIDAD_PRECIO.exec(plano(elegido.despues || ''));
    if (um) r.unidad = unidadDe(um[1]);
    if (!r.unidad && RE_CU.test(p)) r.unidad = 'UN';
    r.presentacion = presentacion(p, [elegido]);
    if (r.presentacion && r.unidad && Unidades.dimension(r.unidad) && Unidades.dimension(r.unidad) === Unidades.dimension(r.presentacion.unidad)){
      // «$ 50.000 /m2» junto a «caja x 1,44 m2»: el precio ya es por unidad
      r.porPaquete = false;
    } else if (r.presentacion){
      r.porPaquete = true;
      if (!r.unidad){
        const pq = (r.presentacion.nombre && CODIGO_PAQUETE[r.presentacion.nombre]) || null;
        r.unidad = pq || 'UN';
      }
    }
    if (!r.unidad){
      const palabras = [
        [/\bgalon(es)?\b/, 'GL'], [/\bhoras?\b|\bhr\b/, 'HR'], [/\bjornal(es)?\b/, 'JOR'], [/\bviajes?\b/, 'VJE'],
        [/\bm2\b|m²|metro cuadrado/, 'M2'], [/\bm3\b|m³|metro cubico/, 'M3'], [/\bkilos?\b|\bkg\b/, 'KG'],
        [/\bmetros? lineal(es)?\b|\bml\b/, 'ML'], [/\btoneladas?\b/, 'TON'], [/\blibras?\b/, 'LB'],
        [/\blitros?\b/, 'L'], [/\bbultos?\b/, 'BTO'], [/\brollos?\b/, 'ROLLO'], [/\bcajas?\b/, 'CAJA'],
        [/\bdias?\b/, 'DIA'], [/\bmensual\b|\bpor mes\b|\bal mes\b/, 'MES'], [/\bglobal\b/, 'GLB'],
        [/\bjuegos?\b|\bkit\b/, 'JGO'], [/\bpar\b/, 'PAR'], [/\bkwh\b/, 'KWH'], [/\bunidad(es)?\b|\bund\b/, 'UN']
      ];
      const hallada = palabras.find(x => x[0].test(p));
      if (hallada) r.unidad = hallada[1];
    }
    if (r.moneda !== 'COP') r.advertencias.push('El precio está en una moneda distinta del peso colombiano.');
    if (r.desde) r.advertencias.push('Precio «desde»: es un mínimo y queda fuera del recomendado.');
    if (r.promocion) r.advertencias.push('Precio de promoción: queda fuera del recomendado por defecto.');
    if (!(r.valor > 0)){ r.advertencias.push('El precio es cero o negativo.'); return r; }
    r.ok = true;
    return r;
  }

  return { leer, numero };
})();

/* ══════════════════════════════════════════════════════════════════════════
   UNIDADES Y PRESENTACIONES (§8.2 y Anexo B)
   «M», «mt» o «metro» se leen como ML, para no partir un insumo en dos
   unidades. La libra comercial en Colombia es de 500 g. Una presentación
   distinta (bulto de 42,5 kg frente a uno de 50 kg) se normaliza por cantidad.
   ══════════════════════════════════════════════════════════════════════════ */
const Unidades = (function(){
  const ALIAS = {
    'un':'UN','und':'UN','unid':'UN','unidad':'UN','unidades':'UN','u':'UN','c/u':'UN','cu':'UN','pza':'UN','pieza':'UN',
    'piezas':'UN','ud':'UN','uds':'UN','unds':'UN',
    'ml':'ML','m':'ML','mt':'ML','mts':'ML','metro':'ML','metros':'ML','metro lineal':'ML','metros lineales':'ML','m.l.':'ML','ml.':'ML','mtl':'ML',
    'm2':'M2','m²':'M2','mt2':'M2','mts2':'M2','metro cuadrado':'M2','metros cuadrados':'M2','m 2':'M2',
    'm3':'M3','m³':'M3','mt3':'M3','mts3':'M3','metro cubico':'M3','metros cubicos':'M3','m 3':'M3',
    'kg':'KG','kgs':'KG','kilo':'KG','kilos':'KG','kilogramo':'KG','kilogramos':'KG','kg.':'KG',
    'ton':'TON','t':'TON','tonelada':'TON','toneladas':'TON','tn':'TON','tonel':'TON',
    'lb':'LB','lbs':'LB','libra':'LB','libras':'LB',
    'gl':'GL','gal':'GL','galon':'GL','galones':'GL','gln':'GL',
    'l':'L','lt':'L','lts':'L','litro':'L','litros':'L',
    'bto':'BTO','bulto':'BTO','bultos':'BTO','saco':'BTO','sacos':'BTO','sc':'BTO','sc50':'BTO',
    'jgo':'JGO','juego':'JGO','juegos':'JGO','kit':'JGO',
    'par':'PAR','pares':'PAR',
    'rollo':'ROLLO','rollos':'ROLLO','rll':'ROLLO',
    'caja':'CAJA','cajas':'CAJA','cja':'CAJA',
    'hr':'HR','h':'HR','hora':'HR','horas':'HR','hra':'HR','hrs':'HR',
    'hc':'HC','hora cuadrilla':'HC','hh':'HC','hora hombre':'HC','hora-hombre':'HC',
    'dia':'DIA','dias':'DIA','d':'DIA','diario':'DIA',
    'jor':'JOR','jornal':'JOR','jornales':'JOR',
    'mes':'MES','meses':'MES','mensual':'MES',
    'vje':'VJE','viaje':'VJE','viajes':'VJE',
    'glb':'GLB','global':'GLB','gb':'GLB',
    'kwh':'KWH','kw-h':'KWH','kw h':'KWH',
    '%mo':'%MO','% mo':'%MO','%':'%MO'
  };
  /** Dimensiones físicas: cuántas unidades base hay en cada unidad. */
  const DIM = {
    masa:     { KG:1, TON:1000, LB:0.5 },
    volumen:  { L:1, GL:3.785, M3:1000 },
    longitud: { ML:1 },
    area:     { M2:1 },
    energia:  { KWH:1 }
  };
  const DIM_DE = {};
  Object.keys(DIM).forEach(d => Object.keys(DIM[d]).forEach(u => { DIM_DE[u] = d; }));

  function normalizar(txt){
    if (txt === null || txt === undefined) return null;
    const s = String(txt).trim();
    if (!s) return null;
    if (UNIDADES.indexOf(s.toUpperCase()) >= 0) return s.toUpperCase();
    const k = normaliza(s).replace(/\s+/g,' ').replace(/\.$/,'');
    return ALIAS[k] || ALIAS[k.replace(/\.$/,'')] || null;
  }
  function dimension(u){ return DIM_DE[u] || null; }
  /** Cuántas unidades `hacia` caben en una unidad `desde`, si son de la misma dimensión. */
  function factorFisico(desde, hacia){
    const d = DIM_DE[desde];
    if (!d || d !== DIM_DE[hacia]) return null;
    return DIM[d][desde] / DIM[d][hacia];
  }

  /** Masa nominal por metro de las barras corrugadas (NSR-10, Anexo B). */
  const BARRAS = [
    { n:2, pulg:'1/4"', kgm:0.250 }, { n:3, pulg:'3/8"', kgm:0.560 }, { n:4, pulg:'1/2"', kgm:0.994 },
    { n:5, pulg:'5/8"', kgm:1.552 }, { n:6, pulg:'3/4"', kgm:2.235 }, { n:7, pulg:'7/8"', kgm:3.042 },
    { n:8, pulg:'1"',   kgm:3.973 }, { n:9, pulg:'1 1/8"', kgm:5.060 }, { n:10, pulg:'1 1/4"', kgm:6.404 },
    { n:11, pulg:'1 3/8"', kgm:7.907 }
  ];
  function masaBarra(numero, longitud){
    const b = BARRAS.find(x => x.n === Number(numero));
    return b ? redondearDec(b.kgm * (Number(longitud) || 6), 3) : null;
  }

  /** Contenido de una unidad canónica del insumo, en una unidad física. Un
      insumo cuya unidad es BTO, CAJA o ROLLO lo declara en su ficha
      (`contenido`); uno en KG, M2 o ML se contiene a sí mismo. */
  function contenidoCanonico(insumo){
    const u = insumo && insumo.unidad;
    if (DIM_DE[u]) return { cantidad:1, unidad:u };
    if (insumo && insumo.contenido && insumo.contenido.cantidad > 0) return insumo.contenido;
    return null;
  }

  /** Factor de conversión: cuántas unidades canónicas del insumo hay en una
      unidad publicada (con su presentación, si la tiene). Precio por unidad
      canónica = precio publicado ÷ factor. Si no hay forma segura de
      convertir, lo dice y no adivina. */
  function factorACanonica(insumo, unidadPublicada, presentacion, params){
    const canon = insumo.unidad;
    const up = normalizar(unidadPublicada) || unidadPublicada || canon;
    const pres = presentacion && presentacion.cantidad > 0 ? presentacion : null;
    const cc = contenidoCanonico(insumo);
    // 1 · Misma unidad y sin presentación: una a una
    if (!pres && up === canon) return { factor:1, metodo:'misma unidad' };
    // 2 · Presentación con contenido físico (bulto de 42,5 kg, caja de 1,44 m²)
    if (pres){
      const upres = normalizar(pres.unidad) || pres.unidad;
      if (upres === canon && !DIM_DE[canon]) return { factor:pres.cantidad, metodo:'presentación en la unidad del insumo' };
      if (cc){
        const f = factorFisico(upres, cc.unidad);
        if (f !== null) return { factor:redondearDec(pres.cantidad * f / cc.cantidad, 6),
          metodo: cant(pres.cantidad) + ' ' + upres + ' por unidad publicada ÷ ' + cant(cc.cantidad) + ' ' + cc.unidad + ' por ' + canon };
      }
      if (upres === canon) return { factor:pres.cantidad, metodo:'presentación en la unidad del insumo' };
    }
    // 3 · Unidades físicas convertibles (kg ↔ ton ↔ libra, galón ↔ litro)
    if (cc){
      const f = factorFisico(up, cc.unidad);
      if (f !== null) return { factor:redondearDec(f / cc.cantidad, 6),
        metodo:'1 ' + up + ' = ' + cant(f) + ' ' + cc.unidad + (cc.cantidad !== 1 ? ' ÷ ' + cant(cc.cantidad) + ' ' + cc.unidad + ' por ' + canon : '') };
    }
    // 4 · Presentación declarada en la ficha del insumo (rollo de 100 m, varilla de 6 m)
    const fichas = (insumo.presentaciones||[]).filter(x => normalizar(x.unidadPublicada || x.nombre) === up || normalizar(x.unidadPublicada) === up);
    if (fichas.length === 1 && cc){
      const x = fichas[0];
      const f = factorFisico(normalizar(x.unidadBase) || x.unidadBase, cc.unidad);
      if (f !== null) return { factor:redondearDec(x.cantidad * f / cc.cantidad, 6), metodo:'presentación de la ficha: ' + x.nombre, advertencia:'Presentación tomada de la ficha del insumo.' };
    }
    // 5 · Tiempo de mano de obra: hora, jornal, día y mes con los parámetros laborales
    const P = params || {};
    const horasJornal = Number(P.horasJornal) || 7, divisor = Number(P.divisorMensual) || 210;
    const HORAS = { HC:1, JOR:horasJornal, DIA:divisor/30, MES:divisor };
    if (HORAS[up] && HORAS[canon]) return { factor:redondearDec(HORAS[up] / HORAS[canon], 6),
      metodo:'1 ' + up + ' = ' + cant(HORAS[up]) + ' h; 1 ' + canon + ' = ' + cant(HORAS[canon]) + ' h' };
    return { factor:null, metodo:'', advertencia:'No hay una conversión segura de ' + up + ' a ' + canon + '. Indique la presentación.' };
  }

  return { normalizar, dimension, factorFisico, factorACanonica, contenidoCanonico, masaBarra, BARRAS, ALIAS };
})();

/* ══════════════════════════════════════════════════════════════════════════
   IVA Y AIU (§8.3)
   ARKEN recibe siempre el precio con IVA incluido; el detalle lleva la tarifa
   y el precio sin IVA. En subcontratos a todo costo con AIU, el IVA del 19 %
   va sobre la utilidad (art. 3 del Decreto 1372 de 1992, compilado en el
   art. 1.3.1.7.9 del DUR 1625 de 2016). Las tarifas las verifica el contador.
   ══════════════════════════════════════════════════════════════════════════ */
const Impuestos = (function(){
  function tasa(t){ const x = Number(t); return isFinite(x) && x > 0 ? x : 0; }
  function sinIva(precioConIva, tarifa){ return redondear3(Number(precioConIva||0) / (1 + tasa(tarifa)/100)); }
  function conIva(precioSinIva, tarifa){ return redondear3(Number(precioSinIva||0) * (1 + tasa(tarifa)/100)); }
  /** Los dos precios a partir de lo publicado y de si incluía IVA. */
  function ambos(precio, incluyeIva, tarifa){
    const p = Number(precio||0);
    return incluyeIva === false
      ? { sinIva:redondear3(p), conIva:conIva(p, tarifa) }
      : { conIva:redondear3(p), sinIva:sinIva(p, tarifa) };
  }
  /** Costo total para la constructora de un valor con AIU. */
  function aiu(o){
    const cd = Number(o.costoDirecto||0);
    const a = cd * (Number(o.a)||0) / 100, i = cd * (Number(o.i)||0) / 100, u = cd * (Number(o.u)||0) / 100;
    const iva = u * tasa(o.tarifaIva === undefined ? 19 : o.tarifaIva) / 100;
    return { costoDirecto:redondear3(cd), administracion:redondear3(a), imprevistos:redondear3(i), utilidad:redondear3(u),
             ivaUtilidad:redondear3(iva), total:redondear3(cd + a + i + u + iva),
             factor: cd > 0 ? redondearDec((cd + a + i + u + iva) / cd, 6) : 0 };
  }
  return { sinIva, conIva, ambos, aiu };
})();

/* ══════════════════════════════════════════════════════════════════════════
   ESTADÍSTICA
   Nada sofisticado y todo verificable: percentiles con interpolación lineal,
   mediana ponderada y la regla MAD para atípicos.
   ══════════════════════════════════════════════════════════════════════════ */
const Estadistica = (function(){
  function ordenados(xs){ return xs.filter(x => isFinite(x)).slice().sort((a,b) => a - b); }
  function percentil(xs, p, yaOrdenado){
    const s = yaOrdenado ? xs : ordenados(xs);
    if (!s.length) return null;
    if (s.length === 1) return s[0];
    const h = (s.length - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
    return s[lo] + (s[hi] - s[lo]) * (h - lo);
  }
  function mediana(xs){ return percentil(xs, 0.5); }
  function promedio(xs){ const s = xs.filter(x => isFinite(x)); return s.length ? s.reduce((a,b) => a + b, 0) / s.length : null; }
  function desviacion(xs){
    const s = xs.filter(x => isFinite(x));
    if (s.length < 2) return 0;
    const m = promedio(s);
    return Math.sqrt(s.reduce((a,x) => a + (x - m) * (x - m), 0) / (s.length - 1));
  }
  function coefVariacion(xs){ const m = promedio(xs); return m ? desviacion(xs) / m : 0; }
  function mad(xs){
    const m = mediana(xs);
    if (m === null) return null;
    return mediana(xs.map(x => Math.abs(x - m)));
  }
  /** Atípicos por la regla MAD: |x − mediana| > k × 1,4826 × MAD. Si la MAD es
      cero (más de la mitad de los datos son iguales) se usa la desviación
      absoluta media escalada, para no dejar pasar un precio absurdo. */
  function atipicos(xs, k){
    const kk = k || 3.5;
    if (xs.length < 3) return xs.map(() => false);
    const m = mediana(xs);
    let escala = 1.4826 * mad(xs);
    if (!(escala > 0)){
      const meanAD = promedio(xs.map(x => Math.abs(x - m)));
      escala = 1.2533 * meanAD;
    }
    if (!(escala > 0)) return xs.map(() => false);
    return xs.map(x => Math.abs(x - m) > kk * escala);
  }
  /** Mediana ponderada: el valor donde el peso acumulado alcanza la mitad. */
  function medianaPonderada(valores, pesos){
    const pares = valores.map((v, i) => [v, Math.max(0, Number(pesos[i]) || 0)]).filter(p => isFinite(p[0]));
    if (!pares.length) return null;
    const total = pares.reduce((a,p) => a + p[1], 0);
    if (!(total > 0)) return mediana(pares.map(p => p[0]));
    pares.sort((a,b) => a[0] - b[0]);
    let acum = 0;
    for (let i = 0; i < pares.length; i++){
      acum += pares[i][1];
      if (Math.abs(acum - total/2) < 1e-12 * total && i + 1 < pares.length) return (pares[i][0] + pares[i+1][0]) / 2;
      if (acum > total/2) return pares[i][0];
    }
    return pares[pares.length - 1][0];
  }
  function mediaGeometrica(xs){
    const s = xs.filter(x => x > 0);
    return s.length ? Math.exp(s.reduce((a,x) => a + Math.log(x), 0) / s.length) : null;
  }
  return { ordenados, percentil, mediana, promedio, desviacion, coefVariacion, mad, atipicos, medianaPonderada, mediaGeometrica };
})();


/* ══════════════════════════════════════════════════════════════════════════
   OBSERVACIONES: NORMALIZACIÓN, VALIDACIÓN Y REGISTRO POR CAMBIOS (§6, §8.4)
   El dato original (precio publicado, unidad, presentación, texto literal)
   se guarda intacto; al lado van el factor de conversión y los dos precios
   por unidad canónica. Así cualquiera puede rehacer la cuenta.
   ══════════════════════════════════════════════════════════════════════════ */
const Observaciones = (function(){
  /** Estados posibles de una observación. El precio nunca cambia; el estado
      sí, y cada cambio queda con motivo, usuario y fecha. */
  const ESTADOS = ['válida','atípica','descartada','pendiente de revisión'];
  const TIPOS_PRECIO = ['lista','promoción','cotización','oficial','contrato','referencia'];

  /** Lleva un precio publicado a la unidad canónica del insumo, con y sin IVA. */
  function normalizar(datos, insumo, params){
    const adv = [];
    const conv = Unidades.factorACanonica(insumo, datos.unidadPublicada || insumo.unidad, datos.presentacion, params);
    if (!(conv.factor > 0)) return { ok:false, advertencias:[conv.advertencia || 'No hay conversión segura a la unidad del insumo.'] };
    if (conv.advertencia) adv.push(conv.advertencia);
    const precioCanonico = Number(datos.precioPublicado) / conv.factor;
    const tarifa = datos.tarifaIva !== undefined && datos.tarifaIva !== null && datos.tarifaIva !== '' ? Number(datos.tarifaIva) : Number(insumo.tarifaIva || 0);
    let precios;
    if (datos.aiu && (datos.aiu.a || datos.aiu.i || datos.aiu.u)){
      // Subcontrato con AIU: el precio publicado es el costo directo
      const r = Impuestos.aiu({ costoDirecto:precioCanonico, a:datos.aiu.a, i:datos.aiu.i, u:datos.aiu.u, tarifaIva:tarifa });
      precios = { conIva:r.total, sinIva:redondear3(r.total - r.ivaUtilidad) };
      adv.push('Precio con AIU: el IVA va sobre la utilidad.');
    } else if (insumo.baseIva === 'utilidad' || insumo.baseIva === 'aiu'){
      // A todo costo sin A, I y U: el IVA solo grava una parte del valor y no se
      // puede separar sin ellos. Se toma el valor como costo total y se avisa,
      // en vez de quitarle un 19 % que no corresponde.
      precios = { conIva:redondear3(precioCanonico), sinIva:redondear3(precioCanonico) };
      adv.push('Valor a todo costo sin AIU: el IVA (sobre la ' + (insumo.baseIva === 'aiu' ? 'administración, imprevistos y utilidad' : 'utilidad') +
               ') no se pudo separar. Registre A, I y U para desagregarlo.');
    } else {
      precios = Impuestos.ambos(precioCanonico, datos.incluyeIva, tarifa);
    }
    if (datos.incluyeIva === null || datos.incluyeIva === undefined) adv.push('El texto no dice si incluye IVA: se tomó como IVA incluido.');
    return { ok:true, factorConversion:conv.factor, metodoConversion:conv.metodo, tarifaIva:tarifa,
             precioSinIva:redondear3(precios.sinIva), precioConIva:redondear3(precios.conIva), advertencias:adv };
  }

  /** Fecha en que el precio estuvo vigente: la de captura (para una lista
      histórica es la fecha de la lista). */
  function fechaDe(o){ return String(o.fechaCaptura || o.fechaPublicada || '').slice(0,10); }

  /** Validación de §8.4 contra la historia del insumo. Devuelve el estado
      sugerido y su motivo; no borra ni cambia nada. */
  function validar(obs, historia, params){
    const P = params || {};
    if (!(obs.precioConIva > 0)) return { estado:'descartada', motivo:'Precio cero o negativo.' };
    const validas = (historia||[]).filter(h => h.id !== obs.id && h.estado === 'válida' && h.precioConIva > 0 && h.tipoPrecio !== 'referencia');
    const k = Number(P.kMad) || 3.5;
    if (validas.length >= 5){
      const xs = validas.map(h => h.precioConIva);
      const m = Estadistica.mediana(xs);
      let s = 1.4826 * Estadistica.mad(xs);
      if (!(s > 0)) s = 1.2533 * Estadistica.promedio(xs.map(x => Math.abs(x - m)));
      if (s > 0 && Math.abs(obs.precioConIva - m) > k * s)
        return { estado:'atípica', motivo:'Fuera del rango plausible de su historia (mediana ' + money(m) + ' ± ' + k + '·MAD).' };
    }
    const mismas = validas.filter(h => h.ciudad === obs.ciudad).sort((a,b) => fechaDe(a) < fechaDe(b) ? -1 : 1);
    const ultima = mismas.filter(h => fechaDe(h) <= fechaDe(obs)).pop();
    const umbral = Number(P.umbralSalto) || 0.35;
    if (ultima){
      const salto = obs.precioConIva / ultima.precioConIva - 1;
      if (Math.abs(salto) > umbral)
        return { estado:'atípica', motivo:'Salto de ' + pctVar(salto) + ' frente a la última observación válida (' + fmtFecha(fechaDe(ultima)) + ').' };
    }
    return { estado:'válida', motivo:'' };
  }

  /** Registro por cambios: si la captura repite el último precio del mismo
      insumo, fuente, ciudad y presentación, se actualiza la vista en vez de
      crear otra fila. La misma URL el mismo día es un duplicado. */
  function comparar(nueva, existentes){
    const mismas = (existentes||[]).filter(e => e.insumoId === nueva.insumoId && e.fuenteId === nueva.fuenteId &&
      (e.ciudad||'') === (nueva.ciudad||'') && claveP(e.presentacion) === claveP(nueva.presentacion) && !e.corrigeA);
    if (!mismas.length) return { accion:'nueva' };
    if (nueva.url){
      const dup = mismas.find(e => e.url === nueva.url && fechaDe(e) === fechaDe(nueva));
      if (dup) return { accion:'duplicado', existente:dup };
    }
    const ultima = mismas.slice().sort((a,b) => fechaDe(a) < fechaDe(b) ? -1 : (fechaDe(a) > fechaDe(b) ? 1 : 0)).pop();
    if (ultima && fechaDe(ultima) <= fechaDe(nueva) && igualDinero(ultima.precioPublicado, nueva.precioPublicado) &&
        ultima.incluyeIva === nueva.incluyeIva && (ultima.unidadPublicada||'') === (nueva.unidadPublicada||''))
      return { accion:'fundir', existente:ultima };
    return { accion:'nueva' };
  }
  function claveP(p){ return p && p.cantidad ? (p.cantidad + ' ' + (p.unidad||p.unidadBase||'')) : ''; }

  return { ESTADOS, TIPOS_PRECIO, normalizar, validar, comparar, fechaDe };
})();

/* ══════════════════════════════════════════════════════════════════════════
   CONSOLIDACIÓN Y CONFIANZA (§8.5)
   Precio recomendado = mediana ponderada de las observaciones válidas de la
   ventana, con peso = confiabilidad × frescura × tipo de precio. Si la ciudad
   tiene menos de 3, se amplía a la subregión, la región y el país, con el
   factor regional y bajando la confianza en cada paso.
   ══════════════════════════════════════════════════════════════════════════ */
const Consolidacion = (function(){
  const PARAMETROS = {
    ventanaDias:45, vidaMediaDias:30, minimoObservaciones:3, kMad:3.5, umbralSalto:0.35,
    pesos:{ cotizacion:1, oficial:0.8, tienda:0.6, ia:0.4, referencia:0.1 },
    incluirPromociones:false, incluirDesde:false, diasDesactualizado:30,
    alta:{ n:5, fuentes:3, cv:0.15, edad:30 }, media:{ n:3, fuentes:2, cv:0.30, edad:45 }
  };
  const NIVELES = ['ciudad','subregión','región','país'];
  const NOMBRE_CLASE = { cotizacion:'Cotización o contrato', oficial:'Lista oficial', tienda:'Tienda o lista comercial',
                         ia:'Búsqueda con IA', referencia:'Referencia (semilla)' };

  function parametros(p){
    const out = JSON.parse(JSON.stringify(PARAMETROS));
    Object.keys(p||{}).forEach(k => {
      if (p[k] && typeof p[k] === 'object' && !Array.isArray(p[k]) && out[k] && typeof out[k] === 'object') Object.assign(out[k], p[k]);
      else if (p[k] !== undefined) out[k] = p[k];
    });
    return out;
  }

  /** Clase de precio para el peso: cotización > lista oficial > tienda > IA > referencia. */
  function clase(o){
    if (o.tipoPrecio === 'referencia') return 'referencia';
    if (o.metodo === 'ia') return 'ia';
    if (o.tipoPrecio === 'cotización' || o.tipoPrecio === 'contrato') return 'cotizacion';
    if (o.tipoPrecio === 'oficial') return 'oficial';
    return 'tienda';
  }

  /** Observaciones que pueden entrar al recomendado. */
  function utilizable(o, fecha, P){
    if (o.estado !== 'válida' || !(o.precioConIva > 0)) return false;
    if (o.tipoPrecio === 'promoción' && !P.incluirPromociones) return false;
    if (o.esDesde && !P.incluirDesde) return false;
    const f = Observaciones.fechaDe(o);
    return f <= fecha;
  }

  /** Relación de la ciudad con el país para un grupo: mediana de los
      cocientes «mediana en la ciudad ÷ mediana nacional» de sus insumos. */
  function factoresRegionales(observaciones, insumosPorId, fecha, diasHistoria){
    const desde = sumaDias(fecha, -(diasHistoria || 180));
    const porInsumo = new Map();
    observaciones.forEach(o => {
      if (o.estado !== 'válida' || !(o.precioConIva > 0) || o.tipoPrecio === 'referencia' || !o.ciudad) return;
      const f = Observaciones.fechaDe(o);
      if (f < desde || f > fecha) return;
      let m = porInsumo.get(o.insumoId);
      if (!m){ m = new Map(); porInsumo.set(o.insumoId, m); }
      let a = m.get(o.ciudad); if (!a){ a = []; m.set(o.ciudad, a); }
      a.push(o.precioConIva);
    });
    const relativos = {};   // clave grupo|ciudad → cocientes
    porInsumo.forEach((m, insumoId) => {
      const ins = insumosPorId[insumoId]; if (!ins || m.size < 2) return;
      const todas = []; m.forEach(a => a.forEach(x => todas.push(x)));
      const nac = Estadistica.mediana(todas);
      if (!(nac > 0)) return;
      m.forEach((a, ciudad) => {
        const k = (ins.grupo || ins.categoriaArken) + '|' + ciudad;
        (relativos[k] = relativos[k] || []).push(Estadistica.mediana(a) / nac);
      });
    });
    const factores = {};
    Object.keys(relativos).forEach(k => { if (relativos[k].length >= 3) factores[k] = redondearDec(Estadistica.mediana(relativos[k]), 4); });
    return factores;
  }
  function factorDe(factores, insumo, ciudad){
    if (!ciudad || !factores) return 1;
    return factores[(insumo.grupo || insumo.categoriaArken) + '|' + ciudad] || 1;
  }

  /** Ciudades que forman cada nivel geográfico alrededor de la ciudad. */
  function ambitos(ciudad, ciudadesPorCodigo){
    const c = ciudadesPorCodigo[ciudad] || { codigoDivipola:ciudad };
    const todas = Object.keys(ciudadesPorCodigo).map(k => ciudadesPorCodigo[k]);
    return [
      { nivel:'ciudad', nombre:c.nombre || ciudad, pasos:0, incluye: x => x.ciudad === ciudad },
      { nivel:'subregión', nombre:c.region || '—', pasos:1, incluye: x => !!c.region && !!x.ciudad && ((ciudadesPorCodigo[x.ciudad]||{}).region === c.region) },
      { nivel:'región', nombre:c.regionAmplia || '—', pasos:2, incluye: x => !!c.regionAmplia && !!x.ciudad && ((ciudadesPorCodigo[x.ciudad]||{}).regionAmplia === c.regionAmplia) },
      { nivel:'país', nombre:'Colombia', pasos:3, incluye: () => true, ciudades: todas.length }
    ];
  }

  function bajar(conf, pasos){
    let i = CONFIANZAS.indexOf(conf);
    if (i < 0) return conf;
    i = Math.min(CONFIANZAS.length - 1, i + pasos);
    return CONFIANZAS[i];
  }
  /** Reglas de confianza, a la vista en Ayuda. */
  function confianza(n, nFuentes, cv, edadMediana, P){
    const A = P.alta, M = P.media;
    if (n >= A.n && nFuentes >= A.fuentes && cv <= A.cv && edadMediana <= A.edad) return 'alta';
    if (n >= M.n && nFuentes >= M.fuentes && cv <= M.cv && edadMediana <= M.edad) return 'media';
    return 'baja';
  }

  /** Elige el nivel geográfico: el primero con al menos el mínimo de
      observaciones; si ninguno llega, el más cercano con más observaciones. */
  function elegirNivel(mercado, ambs, P){
    const conteos = ambs.map(a => mercado.filter(a.incluye));
    let i = conteos.findIndex(l => l.length >= P.minimoObservaciones);
    if (i < 0){
      let mejor = 0;
      conteos.forEach((l, k) => { if (l.length > conteos[mejor].length) mejor = k; });
      i = mejor;
    }
    return { ambito:ambs[i], obs:conteos[i] };
  }

  /** Estadísticos y recomendado sobre observaciones ya ajustadas. */
  function resumir(items, fecha, P){
    const precios = items.map(x => x.precio);
    const marcas = Estadistica.atipicos(precios, P.kMad);
    const usados = items.filter((x, i) => !marcas[i]);
    const atipicas = items.filter((x, i) => marcas[i]);
    const xs = usados.map(x => x.precio);
    const pesos = usados.map(x => {
      const conf = x.o.confianza > 0 ? x.o.confianza : 0.5;
      const edad = Math.max(0, diasEntre(Observaciones.fechaDe(x.o), fecha));
      return conf * Math.pow(0.5, edad / P.vidaMediaDias) * (P.pesos[clase(x.o)] || 0.5);
    });
    const s = Estadistica.ordenados(xs);
    const fuentes = new Set(usados.map(x => x.o.fuenteId || x.o.proveedor || ''));
    const edades = usados.map(x => diasEntre(Observaciones.fechaDe(x.o), fecha));
    return {
      n: usados.length, nFuentes: fuentes.size,
      minimo: s.length ? redondear3(s[0]) : null, p25: s.length ? redondear3(Estadistica.percentil(s, 0.25, true)) : null,
      mediana: s.length ? redondear3(Estadistica.percentil(s, 0.5, true)) : null, promedio: s.length ? redondear3(Estadistica.promedio(s)) : null,
      p75: s.length ? redondear3(Estadistica.percentil(s, 0.75, true)) : null, maximo: s.length ? redondear3(s[s.length-1]) : null,
      coefVariacion: s.length > 1 ? redondearDec(Estadistica.coefVariacion(s), 4) : 0,
      recomendado: s.length ? redondear3(Estadistica.medianaPonderada(xs, pesos)) : null,
      edadMediana: edades.length ? Estadistica.mediana(edades) : null,
      usados, atipicas
    };
  }

  /** Consolida un insumo en una ciudad a una fecha. `obsInsumo` son todas
      las observaciones del insumo (de todas las ciudades). */
  function consolidar(insumo, ciudad, fecha, obsInsumo, contexto){
    const P = parametros(contexto && contexto.parametros);
    const ciudades = (contexto && contexto.ciudades) || {};
    const factores = (contexto && contexto.factores) || {};
    const desde = sumaDias(fecha, -P.ventanaDias);
    const base = { id: insumo.id + '|' + ciudad, insumoId: insumo.id, ciudad, fecha, tarifaIva: Number(insumo.tarifaIva||0),
                   metodo:'', nivel:null, ambito:'', factorRegional:1, observacionesUsadas:[], observacionesAtipicas:[],
                   dependeDemo:false, soloReferencia:false, ultimaObservacion:null };
    const todas = (obsInsumo||[]).filter(o => utilizable(o, fecha, P));
    const mercado = todas.filter(o => clase(o) !== 'referencia' && Observaciones.fechaDe(o) >= desde);
    const ultima = todas.filter(o => clase(o) !== 'referencia').sort((a,b) => Observaciones.fechaDe(a) < Observaciones.fechaDe(b) ? 1 : -1)[0];
    if (ultima) base.ultimaObservacion = { fecha:Observaciones.fechaDe(ultima), precio:ultima.precioConIva, fuenteId:ultima.fuenteId, ciudad:ultima.ciudad, id:ultima.id };
    if (!mercado.length) return sinMercado(base, todas, fecha, P);
    const eleccion = elegirNivel(mercado, ambitos(ciudad, ciudades), P);
    const fDest = factorDe(factores, insumo, ciudad);
    const items = eleccion.obs.map(o => {
      const fOrig = o.ciudad ? factorDe(factores, insumo, o.ciudad) : 1;
      const ajuste = (o.ciudad === ciudad) ? 1 : fDest / fOrig;
      return { o, precio: o.precioConIva * ajuste, ajuste };
    });
    const r = resumir(items, fecha, P);
    if (!r.n) return sinMercado(base, todas, fecha, P);
    let conf = confianza(r.n, r.nFuentes, r.coefVariacion, r.edadMediana, P);
    conf = bajar(conf, eleccion.ambito.pasos);
    return Object.assign(base, {
      n:r.n, nFuentes:r.nFuentes, minimo:r.minimo, p25:r.p25, mediana:r.mediana, promedio:r.promedio, p75:r.p75, maximo:r.maximo,
      coefVariacion:r.coefVariacion, recomendado:r.recomendado,
      recomendadoSinIva: Impuestos.sinIva(r.recomendado, insumo.tarifaIva),
      confianza:conf, edadMediana:r.edadMediana, nivel:eleccion.ambito.nivel, ambito:eleccion.ambito.nombre,
      factorRegional: eleccion.ambito.nivel === 'ciudad' ? 1 : redondearDec(fDest, 4),
      metodo:'Mediana ponderada · ventana ' + P.ventanaDias + ' d · ' + eleccion.ambito.nivel +
             (eleccion.ambito.nivel !== 'ciudad' ? ' (' + eleccion.ambito.nombre + ', ajustado por factor regional)' : ''),
      observacionesUsadas: r.usados.map(x => x.o.id), observacionesAtipicas: r.atipicas.map(x => x.o.id),
      dependeDemo: r.usados.some(x => x.o.esDemo)
    });
  }

  /** Sin observaciones de mercado: se usa la referencia (rotulada) o queda «sin dato». */
  function sinMercado(base, todas, fecha, P){
    const refs = todas.filter(o => clase(o) === 'referencia').sort((a,b) => Observaciones.fechaDe(a) < Observaciones.fechaDe(b) ? 1 : -1);
    if (refs.length){
      const r = refs[0];
      return Object.assign(base, { n:0, nFuentes:0, minimo:null, p25:null, mediana:null, promedio:null, p75:null, maximo:null, coefVariacion:0,
        recomendado:redondear3(r.precioConIva), recomendadoSinIva:Impuestos.sinIva(r.precioConIva, base.tarifaIva), confianza:'referencia',
        soloReferencia:true, nivel:'referencia', ambito:'Referencia', metodo:'Solo referencia: no hay observaciones de mercado en la ventana',
        observacionesUsadas:[r.id], dependeDemo:!!r.esDemo, edadMediana:diasEntre(Observaciones.fechaDe(r), fecha) });
    }
    return Object.assign(base, { n:0, nFuentes:0, minimo:null, p25:null, mediana:null, promedio:null, p75:null, maximo:null,
      coefVariacion:0, recomendado:null, recomendadoSinIva:null, confianza:'sin dato', edadMediana:null,
      metodo:'Sin observaciones válidas en la ventana de ' + P.ventanaDias + ' días' });
  }

  /** Variación entre dos precios como fracción; null si falta alguno. */
  function variacion(actual, anterior){
    if (!(actual > 0) || !(anterior > 0)) return null;
    return actual / anterior - 1;
  }

  /** Consolida todos los insumos pedidos para las ciudades pedidas. */
  function consolidarLote(insumos, ciudadesLista, fecha, obsPorInsumo, contexto, alAvanzar){
    const out = [];
    const total = insumos.length * ciudadesLista.length;
    let hechos = 0;
    insumos.forEach(ins => {
      const obs = obsPorInsumo[ins.id] || [];
      ciudadesLista.forEach(c => {
        const r = consolidar(ins, c, fecha, obs, contexto);
        const previo = consolidar(ins, c, sumaDias(fecha, -30), obs, contexto);
        r.variacion30 = variacion(r.recomendado, previo.recomendado);
        out.push(r);
        hechos++;
        if (alAvanzar && hechos % 200 === 0) alAvanzar(hechos, total);
      });
    });
    return out;
  }

  return { PARAMETROS, NIVELES, NOMBRE_CLASE, parametros, clase, consolidar, consolidarLote, factoresRegionales, confianza, bajar, variacion };
})();

/* ══════════════════════════════════════════════════════════════════════════
   CORTES
   Un corte es una foto de los consolidados con sus parámetros. Cerrado, es
   inmutable: toda exportación dice de qué corte salen sus precios.
   ══════════════════════════════════════════════════════════════════════════ */
const Cortes = (function(){
  function nombrePorDefecto(fecha, ciudadNombre){ return 'Corte ' + String(fecha).slice(0,7) + ' · ' + (ciudadNombre || 'varias ciudades'); }
  function crear(datos){
    return {
      id: datos.id || uid('corte'), nombre: datos.nombre, fecha: datos.fecha, ciudades: datos.ciudades.slice(),
      parametros: JSON.parse(JSON.stringify(datos.parametros || {})),
      precios: datos.precios.map(p => Object.assign({}, p, { observacionesUsadas:(p.observacionesUsadas||[]).slice(0,60) })),
      cerrado: !!datos.cerrado, creadoPor: datos.creadoPor || '', creado: datos.creado || ahoraISO(), cerradoEn: datos.cerrado ? ahoraISO() : null,
      incluyeDemo: datos.precios.some(p => p.dependeDemo)
    };
  }
  /** Diferencias de precio entre dos cortes, por insumo y ciudad. */
  function comparar(a, b){
    const mb = new Map((b.precios||[]).map(p => [p.insumoId + '|' + p.ciudad, p]));
    return (a.precios||[]).map(p => {
      const q = mb.get(p.insumoId + '|' + p.ciudad);
      const dif = (q && p.recomendado > 0 && q.recomendado > 0) ? p.recomendado - q.recomendado : null;
      return { insumoId:p.insumoId, ciudad:p.ciudad, actual:p.recomendado, anterior:q ? q.recomendado : null,
               diferencia: dif === null ? null : redondear3(dif), variacion: q ? Consolidacion.variacion(p.recomendado, q.recomendado) : null };
    });
  }
  return { nombrePorDefecto, crear, comparar };
})();

/* ══════════════════════════════════════════════════════════════════════════
   EMPAREJAMIENTO (§7.2 y §9.1)
   Puntaje por palabras, especificaciones (diámetro, número de barra, RDE,
   calibre, psi, MPa, formato) y unidad. Lo seguro se vincula; lo dudoso va a
   revisión; un conflicto de especificación (1/2" frente a 3/4") hunde el
   puntaje, porque es otro producto.
   ══════════════════════════════════════════════════════════════════════════ */
const Emparejamiento = (function(){
  const VACIAS = new Set(['de','del','la','el','los','las','y','o','en','con','para','por','a','x','tipo','un','una','sin','al','e','u','incl','incluye','m','mm','cm']);
  const SINONIMOS = {
    tuberia:'tubo', tubos:'tubo', tubo:'tubo', caneria:'tubo', manguera:'manguera',
    varilla:'barra', varillas:'barra', barra:'barra', barras:'barra', hierro:'acero',
    corrugada:'corrugado', corrugado:'corrugado', galvanizada:'galvanizado', galvanizado:'galvanizado',
    bloque:'bloque', ladrillo:'ladrillo', adobe:'ladrillo',
    cemento:'cemento', concreto:'concreto', hormigon:'concreto',
    pegante:'adhesivo', pega:'adhesivo', adhesivo:'adhesivo', boquilla:'boquilla', fragua:'boquilla',
    vinilo:'vinilo', pintura:'pintura', esmalte:'esmalte',
    alambre:'alambre', cable:'cable', conductor:'cable',
    llave:'grifo', grifo:'grifo', griferia:'grifo', registro:'valvula', valvula:'valvula',
    sanitario:'sanitario', inodoro:'sanitario', taza:'sanitario',
    teja:'teja', lamina:'lamina', placa:'placa', panel:'panel',
    retroexcavadora:'retroexcavadora', retro:'retroexcavadora', volqueta:'volqueta', mezcladora:'mezcladora', trompo:'mezcladora',
    triturado:'triturado', gravilla:'triturado', grava:'triturado', balasto:'triturado',
    puntilla:'clavo', puntillas:'clavo', clavo:'clavo', clavos:'clavo',
    tornillo:'tornillo', chazo:'chazo', taco:'chazo', ancla:'anclaje', anclaje:'anclaje',
    ayudante:'ayudante', obrero:'ayudante', peon:'ayudante', oficial:'oficial', maestro:'maestro',
    impermeabilizante:'impermeabilizante', manto:'manto', geotextil:'geotextil'
  };

  /** Plural ingenuo, igual a los dos lados de la comparación: «tubos» → «tubo». */
  function singular(w){
    return (w.length > 4 && /s$/.test(w) && !/(ss|is|us)$/.test(w)) ? w.slice(0, -1) : w;
  }
  function tokens(texto){
    const t = normaliza(texto).replace(/[^a-z0-9ñ/".]+/g,' ').split(/\s+/).filter(Boolean);
    const out = [];
    t.forEach(w => {
      if (VACIAS.has(w) || /^\d/.test(w) || w.length < 2) return;
      const s = singular(w.replace(/\.$/,''));
      out.push(SINONIMOS[s] || SINONIMOS[w] || s);
    });
    return out;
  }

  function fraccion(txt){
    const m = /^(\d+)\s+(\d+)\/(\d+)$/.exec(txt);
    if (m) return Number(m[1]) + Number(m[2]) / Number(m[3]);
    const f = /^(\d+)\/(\d+)$/.exec(txt);
    if (f) return Number(f[1]) / Number(f[2]);
    const n = Number(String(txt).replace(',','.'));
    return isFinite(n) ? n : null;
  }
  /** Especificaciones legibles en un título o una descripción. */
  function especificaciones(texto){
    const t = normaliza(texto).replace(/”|''|pulgadas?|pulg\.?/g, '"');
    const e = {};
    let m;
    const rePul = /(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)\s*"/g;
    while ((m = rePul.exec(t))){ const v = fraccion(m[1].trim()); if (v !== null) (e.pulgadas = e.pulgadas || []).push(redondearDec(v, 4)); }
    if ((m = /(?:\bno\.?|n[°º]|#)\s*(\d{1,2})\b/.exec(t))) e.numero = Number(m[1]);
    if ((m = /\brde\s*(\d+(?:[.,]\d+)?)/.exec(t))) e.rde = Number(m[1].replace(',','.'));
    if ((m = /(\d{1,2})\s*awg\b/.exec(t)) || (m = /\bcal(?:ibre)?\.?\s*(\d{1,2})\b/.exec(t))) e.calibre = Number(m[1]);
    if ((m = /(\d[\d.,]*)\s*psi\b/.exec(t))) e.psi = Number(m[1].replace(/[.,]/g,''));
    if ((m = /(\d+(?:[.,]\d+)?)\s*mpa\b/.exec(t))) e.mpa = Number(m[1].replace(',','.'));
    if ((m = /(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)(?:\s*[x×]\s*(\d+(?:[.,]\d+)?))?\s*(cm|mm|m)?\b/.exec(t))){
      const f = { mm:0.1, cm:1, m:100 }[m[4] || 'cm'];
      e.formato = [m[1], m[2], m[3]].filter(Boolean).map(x => redondearDec(Number(x.replace(',','.')) * f, 2)).sort((a,b) => a - b).join('x');
    }
    if ((m = /(\d+(?:[.,]\d+)?)\s*(kg|kilos?)\b/.exec(t))) e.kg = Number(m[1].replace(',','.'));
    if ((m = /(\d+(?:[.,]\d+)?)\s*(kva|kw|kwp|btu|hp|w)\b/.exec(t))) e.potencia = Number(m[1].replace(',','.')) + m[2];
    if ((m = /(\d+(?:[.,]\d+)?)\s*(mm)\b/.exec(t)) && !e.formato) e.mm = Number(m[1].replace(',','.'));
    if ((m = /(\d+(?:[.,]\d+)?)\s*(m3|m³)\b/.exec(t))) e.m3 = Number(m[1].replace(',','.'));
    return e;
  }
  function igualesEsp(a, b){
    if (Array.isArray(a) && Array.isArray(b)) return a.some(x => b.some(y => Math.abs(x - y) < 1e-6));
    return String(a) === String(b);
  }

  /** Puntaje de 0 a 1 entre un texto encontrado y un insumo del catálogo. */
  function similitud(texto, insumo, unidad){
    const ref = [insumo.descripcion].concat(insumo.sinonimos || []);
    const ta = tokens(texto);
    let mejorDice = 0;
    ref.forEach(r => {
      const tb = tokens(r);
      if (!ta.length || !tb.length) return;
      const sa = new Set(ta), sb = new Set(tb);
      let comun = 0; sa.forEach(x => { if (sb.has(x)) comun++; });
      const d = 2 * comun / (sa.size + sb.size);
      if (d > mejorDice) mejorDice = d;
    });
    if (normaliza(texto) === normaliza(insumo.descripcion)) return { puntaje:1, dice:1, acuerdos:[], conflictos:[] };
    const ea = especificaciones(texto), eb = especificaciones(insumo.descripcion + ' ' + (insumo.especificacion||''));
    const acuerdos = [], conflictos = [];
    Object.keys(ea).forEach(k => {
      if (eb[k] === undefined) return;
      (igualesEsp(ea[k], eb[k]) ? acuerdos : conflictos).push(k);
    });
    let p = mejorDice * 0.8 + Math.min(0.2, acuerdos.length * 0.1) - conflictos.length * 0.35;
    if (unidad && Unidades.normalizar(unidad) === insumo.unidad) p += 0.05;
    return { puntaje: Math.max(0, Math.min(1, redondearDec(p, 4))), dice:redondearDec(mejorDice, 4), acuerdos, conflictos };
  }

  /** Mejores candidatos del catálogo para un texto. */
  function emparejar(texto, catalogo, opciones){
    const o = opciones || {};
    const lista = (catalogo||[]).map(ins => Object.assign({ insumo:ins }, similitud(texto, ins, o.unidad)))
      .filter(x => x.puntaje > 0.15).sort((a,b) => b.puntaje - a.puntaje).slice(0, o.limite || 5);
    const mejor = lista[0];
    const estado = !mejor ? 'ninguno' : (mejor.puntaje >= (o.seguro || 0.85) ? 'seguro' : (mejor.puntaje >= (o.dudoso || 0.5) ? 'dudoso' : 'ninguno'));
    return { estado, candidatos:lista };
  }
  return { tokens, especificaciones, similitud, emparejar };
})();

/* ══════════════════════════════════════════════════════════════════════════
   MANO DE OBRA (§14)
   Costo empresa = salario + auxilio + prestaciones + seguridad social +
   parafiscales + dotación + EPP + FIC. Cada parámetro tiene vigencia y
   norma. Costo por hora = mensual ÷ divisor; jornal = hora × horas por jornal;
   día calendario = mensual ÷ 30.
   ══════════════════════════════════════════════════════════════════════════ */
const Laboral = (function(){
  const ARL = { I:0.522, II:1.044, III:2.436, IV:4.35, V:6.96 };

  /** Valor de un parámetro vigente en una fecha (el más reciente que aplique). */
  function vigente(parametros, clave, fecha){
    const f = String(fecha || hoyISO()).slice(0,10);
    const cands = (parametros||[]).filter(p => p.clave === clave && (!p.vigenteDesde || p.vigenteDesde <= f) && (!p.vigenteHasta || p.vigenteHasta >= f))
      .sort((a,b) => String(a.vigenteDesde||'') < String(b.vigenteDesde||'') ? 1 : -1);
    return cands.length ? cands[0] : null;
  }
  function valor(parametros, clave, fecha, porDefecto){
    const p = vigente(parametros, clave, fecha);
    return p ? p.valor : porDefecto;
  }
  /** Todos los parámetros laborales vigentes en una fecha, con su norma. */
  function enFecha(parametros, fecha){
    const claves = Array.from(new Set((parametros||[]).filter(p => p.ambito === 'laboral').map(p => p.clave)));
    const out = { _normas:{} };
    claves.forEach(k => { const p = vigente(parametros, k, fecha); if (p){ out[k] = p.valor; out._normas[k] = p.norma || ''; } });
    return out;
  }

  function linea(concepto, base, tasa, valorL, norma, nota){
    return { concepto, base: base === null ? null : redondear3(base), tasa, valor: redondear3(valorL), norma: norma || '', nota: nota || '' };
  }

  /** Costo mensual para la empresa de un trabajador y su desglose. */
  function costoEmpresa(entrada, P){
    const smmlv = Number(P.smmlv), salario = Number(entrada.salario) || 0;
    const N = P._normas || {};
    const conAuxilio = salario <= 2 * smmlv && entrada.auxilio !== false;
    const auxilio = conAuxilio ? Number(P.auxilioTransporte) : 0;
    const basePrest = salario + auxilio;
    const exonerado = entrada.exonerado !== undefined ? !!entrada.exonerado : (P.exoneracion114 !== false);
    const aplicaExo = exonerado && salario < 10 * smmlv;
    const tasaArl = ARL[entrada.claseRiesgo || 'V'];
    const L = [];
    L.push(linea('Salario', null, null, salario, '', entrada.nota || ''));
    L.push(linea('Auxilio de transporte', null, null, auxilio, N.auxilioTransporte, conAuxilio ? 'Devenga hasta 2 SMMLV' : 'No aplica: devenga más de 2 SMMLV'));
    L.push(linea('Cesantías', basePrest, P.cesantias, basePrest * P.cesantias / 100, N.cesantias));
    L.push(linea('Intereses sobre cesantías', basePrest, P.interesesCesantias, basePrest * P.interesesCesantias / 100, N.interesesCesantias));
    L.push(linea('Prima de servicios', basePrest, P.prima, basePrest * P.prima / 100, N.prima));
    L.push(linea('Vacaciones', salario, P.vacaciones, salario * P.vacaciones / 100, N.vacaciones, 'Sin auxilio de transporte'));
    L.push(linea('Pensión', salario, P.pension, salario * P.pension / 100, N.pension));
    L.push(linea('Salud', salario, aplicaExo ? 0 : P.salud, aplicaExo ? 0 : salario * P.salud / 100, N.salud, aplicaExo ? 'Exonerado (art. 114-1 ET)' : ''));
    L.push(linea('ARL clase ' + (entrada.claseRiesgo || 'V'), salario, tasaArl, salario * tasaArl / 100, 'Decreto 1772 de 1994'));
    L.push(linea('Caja de compensación', salario, P.caja, salario * P.caja / 100, N.caja));
    L.push(linea('ICBF', salario, aplicaExo ? 0 : P.icbf, aplicaExo ? 0 : salario * P.icbf / 100, N.icbf, aplicaExo ? 'Exonerado (art. 114-1 ET)' : ''));
    L.push(linea('SENA', salario, aplicaExo ? 0 : P.sena, aplicaExo ? 0 : salario * P.sena / 100, N.sena, aplicaExo ? 'Exonerado (art. 114-1 ET)' : ''));
    const dot = (salario <= Number(P.topeDotacionSMMLV || 2) * smmlv) ? Number(entrada.dotacionPorEntrega || 0) * Number(P.dotacionEntregas || 3) / 12 : 0;
    L.push(linea('Dotación', null, null, dot, N.dotacionEntregas, dot ? (P.dotacionEntregas || 3) + ' entregas al año ÷ 12' : 'No aplica o sin valor registrado'));
    L.push(linea('Elementos de protección personal', null, null, Number(entrada.eppMensual || 0), '', 'Por trabajador y mes'));
    const fic = entrada.fic === false ? 0 : smmlv / Number(P.ficTrabajadores || 40);
    L.push(linea('FIC', null, null, fic, N.ficTrabajadores, '1 SMMLV por cada ' + (P.ficTrabajadores || 40) + ' trabajadores, por fracción'));
    const total = L.reduce((a, l) => a + l.valor, 0);
    const divisor = Number(entrada.divisor || P.divisorMensual || 210), horas = Number(entrada.horasJornal || P.horasJornal || 7);
    const hora = total / divisor;
    return { lineas:L, totalMensual:redondear3(total), costoHora:redondear3(hora), jornal:redondear3(hora * horas), dia:redondear3(total / 30),
             factorPrestacional: salario > 0 ? redondearDec(total / salario, 4) : null, divisor, horasJornal:horas };
  }

  /** Valor de la hora con cada recargo, a partir del salario y la fecha. */
  function recargos(salario, P){
    const hora = Number(salario) / Number(P.divisorMensual || 210);
    return [
      { concepto:'Hora ordinaria diurna', factor:1, valor:redondear3(hora) },
      { concepto:'Recargo nocturno (' + (P.inicioNocturno || '19:00') + ' a 06:00)', factor:1 + P.recargoNocturno/100, valor:redondear3(hora * (1 + P.recargoNocturno/100)) },
      { concepto:'Hora extra diurna', factor:1 + P.extraDiurna/100, valor:redondear3(hora * (1 + P.extraDiurna/100)) },
      { concepto:'Hora extra nocturna', factor:1 + P.extraNocturna/100, valor:redondear3(hora * (1 + P.extraNocturna/100)) },
      { concepto:'Hora dominical o festiva', factor:1 + P.recargoDominical/100, valor:redondear3(hora * (1 + P.recargoDominical/100)) }
    ];
  }

  /** Cuadrilla armada con oficios: suma de costos por hora (HC). */
  function cuadrilla(composicion){
    const partes = (composicion||[]).map(c => ({ oficio:c.oficio, cantidad:Number(c.cantidad)||0, costoHora:Number(c.costoHora)||0,
                                                  subtotal:redondear3((Number(c.cantidad)||0) * (Number(c.costoHora)||0)) }));
    const hora = partes.reduce((a,p) => a + p.subtotal, 0);
    return { partes, costoHora:redondear3(hora), completa: partes.every(p => p.costoHora > 0) };
  }
  /** Lleva un costo por hora a las unidades de ARKEN (HC, JOR, DIA, MES). */
  function enUnidad(costoHora, unidad, P){
    const h = { HC:1, JOR:Number(P.horasJornal || 7), DIA:Number(P.divisorMensual || 210) / 30, MES:Number(P.divisorMensual || 210) }[unidad];
    return h ? redondear3(costoHora * h) : null;
  }
  return { ARL, vigente, valor, enFecha, costoEmpresa, recargos, cuadrilla, enUnidad };
})();

/* ══════════════════════════════════════════════════════════════════════════
   CONTRATO CON ARKEN CONTROL (§10.1 y §9.1)
   El validador lee el archivo ya escrito con la misma lógica de
   `elegirArchivoInsumos` de ARKEN. Si algo falla, no se guarda.
   ══════════════════════════════════════════════════════════════════════════ */
const ContratoArken = (function(){

  /** Réplica exacta de lo que hace ARKEN con las filas de la primera hoja. */
  function leerComoArken(filas, nombresLista){
    const inicio = filas.findIndex(r => r && String(r[0]||'').toLowerCase().indexOf('categor') >= 0);
    const crudas = (inicio >= 0 ? filas.slice(inicio + 1) : filas).filter(r => r && r[2]);
    const lista = new Map((nombresLista||[]).map(n => [normaliza(n.nombre !== undefined ? n.nombre : n), n]));
    const armadas = crudas.map(r => {
      const cat = CATEGORIAS_ARKEN.indexOf(String(r[0]||'').trim()) >= 0 ? String(r[0]).trim() : 'Materiales';
      const nombre = String(r[2]||'').trim();
      return { categoria:cat, unidad:String(r[1]||'UN').trim() || 'UN', nombre, precio:Number(r[3])||0,
               existente: lista.get(normaliza(nombre)) || null, cruda:r };
    }).filter(f => f.nombre);
    return { inicio, filas:armadas };
  }

  /** Validación obligatoria: cuenta lo que ARKEN leerá y bloquea si algo falla. */
  function validar(filasHoja, esperado, listaArken){
    const errores = [], avisos = [];
    const leido = leerComoArken(filasHoja, listaArken);
    if (leido.inicio < 0) errores.push('No hay fila de encabezado con «Categoría» en la columna A: ARKEN tomaría todas las filas como insumos.');
    else {
      const enc = filasHoja[leido.inicio].slice(0, 4).map(x => String(x||''));
      if (enc.join('|') !== ENCABEZADO_ARKEN.join('|')) errores.push('El encabezado no es el del contrato: ' + enc.join(' · '));
      filasHoja.slice(0, leido.inicio).forEach((r, i) => {
        if (r && r.length && normaliza(r[0]).indexOf('categor') >= 0) errores.push('La fila informativa ' + (i+1) + ' tiene «categor» en la columna A.');
      });
    }
    const vistos = new Map();
    let categoriasInvalidas = 0, preciosInvalidos = 0, duplicadas = 0, coinciden = 0, cambiarian = 0;
    leido.filas.forEach((f, i) => {
      const r = f.cruda, fila = leido.inicio + 2 + i;
      if (CATEGORIAS_ARKEN.indexOf(r[0]) < 0){ categoriasInvalidas++; errores.push('Fila ' + fila + ': categoría «' + r[0] + '» no es una de las siete (ARKEN la volvería «Materiales»).'); }
      if (typeof r[3] !== 'number' || !isFinite(r[3]) || !(r[3] > 0)){ preciosInvalidos++; errores.push('Fila ' + fila + ': el precio no es un número mayor que cero.'); }
      else if (Math.abs(r[3] - redondear3(r[3])) > 1e-9){ errores.push('Fila ' + fila + ': el precio tiene más de 3 decimales.'); }
      if (!String(r[1]||'').trim()) errores.push('Fila ' + fila + ': sin unidad (ARKEN pondría «UN»).');
      if (String(r[2]) !== String(r[2]).trim()) errores.push('Fila ' + fila + ': la descripción tiene espacios a los lados.');
      const k = normaliza(f.nombre);
      if (vistos.has(k)){ duplicadas++; errores.push('Fila ' + fila + ': descripción repetida («' + f.nombre + '», igual a la fila ' + vistos.get(k) + ').'); }
      else vistos.set(k, fila);
      if (f.existente){
        coinciden++;
        const ex = f.existente;
        if (ex.unidad !== undefined && ex.unidad !== f.unidad){ cambiarian++; errores.push('Fila ' + fila + ': al sobrescribir, ARKEN cambiaría la unidad de «' + ex.unidad + '» a «' + f.unidad + '».'); }
        if (ex.categoria !== undefined && ex.categoria !== f.categoria){ cambiarian++; errores.push('Fila ' + fila + ': al sobrescribir, ARKEN cambiaría la categoría de «' + ex.categoria + '» a «' + f.categoria + '».'); }
      }
    });
    if (esperado){
      if (esperado.length !== leido.filas.length) errores.push('ARKEN leerá ' + leido.filas.length + ' filas y se escribieron ' + esperado.length + '.');
      esperado.forEach((e, i) => {
        const f = leido.filas[i];
        if (!f) return;
        if (f.nombre !== e.descripcion || f.unidad !== e.unidad || f.categoria !== e.categoria || !(Math.abs(f.precio - e.precio) < 1e-6))
          errores.push('La fila ' + (leido.inicio + 2 + i) + ' no se leyó igual a como se escribió («' + e.descripcion + '»).');
      });
    }
    if (!leido.filas.length) errores.push('El archivo no tiene filas de insumos.');
    if (!listaArken) avisos.push('No se ha importado la lista maestra de ARKEN: no se puede contar cuántos insumos coinciden.');
    return { ok:!errores.length, errores:errores.slice(0, 200), totalErrores:errores.length, avisos,
             leidas:leido.filas.length, coinciden: listaArken ? coinciden : null, nuevas: listaArken ? leido.filas.length - coinciden : null,
             categoriasInvalidas, preciosInvalidos, duplicadas, cambiarian };
  }

  function redondeo(v, modo){
    if (modo === 'peso') return redondear(v);
    if (modo === 'centena') return Math.round(v / 100) * 100;
    return redondear3(v);
  }

  /** Lo que no va en la hoja «Insumos», agrupado por motivo. */
  function notasExcluidos(excluidos){
    if (!excluidos.length) return [];
    const grupos = new Map();
    excluidos.forEach(x => { const m = String(x.motivo || 'Sin motivo'); if (!grupos.has(m)) grupos.set(m, []); grupos.get(m).push(String(x.descripcion || '')); });
    const out = [['Insumos que no van en la hoja «Insumos» y por qué (' + excluidos.length + '):']];
    grupos.forEach((descs, motivo) => {
      out.push(['']); out.push([motivo + ' (' + descs.length + '):']);
      descs.forEach(t => out.push(['   ' + t]));
    });
    return out;
  }
  /** Arma las tres hojas del libro a partir de los renglones ya decididos. */
  function armarLibro(d){
    const info = [
      ['ARKEN PRECIOS · Precios para importar en ARKEN CONTROL'],
      ['Ciudad: ' + d.ciudadNombre],
      ['Corte: ' + d.corteNombre + (d.corteFecha ? ' (' + fmtFecha(d.corteFecha) + ')' : '')],
      ['Precio exportado: ' + d.precioExportado + ' · con IVA incluido' + (d.redondeoNombre ? ' · redondeo ' + d.redondeoNombre : '')],
      ['Generado: ' + fmtSello(Date.now()) + ' · Usuario: ' + (d.usuario || '')]
    ];
    if (d.incluyeDemo) info.push(['ATENCIÓN: incluye datos de demostración (sintéticos). No son precios de mercado.']);
    if (d.puestoEnObra) info.push(['Precio puesto en obra: incluye flete según la tabla de fletes.']);
    info.forEach(r => { if (normaliza(r[0]).indexOf('categor') >= 0) r[0] = r[0].replace(/categor[ií]as?/gi, 'grupos'); });
    const renglones = d.renglones.map(r => Object.assign({}, r, { precio: redondeo(r.precioArken, d.redondeo) }))
      .map(r => (r.precio > 0 ? r : Object.assign(r, { precio:redondear3(r.precioArken), notaRedondeo:true })));
    const hoja1 = info.concat([ENCABEZADO_ARKEN.slice()]).concat(renglones.map(r => [r.categoria, r.unidad, r.descripcion, r.precio]));
    const hoja2 = [['Código interno','Código ARKEN de referencia','Descripción para ARKEN','Unidad ARKEN','Categoría ARKEN','Ciudad','Corte',
      'Precio con IVA (unidad ARKEN)','Precio sin IVA (unidad ARKEN)','Tarifa de IVA (%)','Factor (unidades canónicas por unidad ARKEN)','Unidad canónica',
      'n','Mínimo','Mediana','Máximo','Confianza','Nivel geográfico','Fuentes','Enlaces','Datos de demostración']]
      .concat(renglones.map(r => [r.codigoInterno, r.codigoArken || '', r.descripcion, r.unidad, r.categoria, d.ciudadNombre, d.corteNombre,
        r.precio, redondear3(r.precio / (1 + (Number(r.tarifaIva)||0)/100)), Number(r.tarifaIva)||0, r.factor, r.unidadCanonica,
        r.n || 0, r.minimo === null || r.minimo === undefined ? '' : redondear3(r.minimo * r.factor),
        r.mediana === null || r.mediana === undefined ? '' : redondear3(r.mediana * r.factor),
        r.maximo === null || r.maximo === undefined ? '' : redondear3(r.maximo * r.factor),
        r.confianza, r.nivel || '', (r.fuentes||[]).join(' | '), (r.enlaces||[]).join(' | '), r.dependeDemo ? 'Sí' : 'No']));
    const notas = [['Notas del archivo']].concat([
      ['Este archivo se importa en ARKEN CONTROL por Módulo 04 › Exportar / importar… › Importar desde Excel.'],
      ['Pasos en ARKEN: Seleccionar archivo… › revisar › Sobrescribir todos los que coinciden › Importar › Sí, importar con estos precios.'],
      ['Solo cuenta la primera hoja («Insumos»). Esta hoja y la de detalle las ignora ARKEN.'],
      ['Los precios llevan IVA incluido. Las tarifas son parametrizables y las verifica el contador de la empresa.'],
      ['']
    ]).concat(notasExcluidos(d.excluidos || []))
      .concat(renglones.filter(r => r.notaRedondeo).map(r => ['Sin redondear (quedaría en cero): ' + r.descripcion]));
    return {
      nombreArchivo: nombreArchivoSeguro('ARKEN_PRECIOS_' + d.ciudadNombre + '_' + d.corteNombre.replace(/^Corte\s*/i,'Corte-')) +
                     (d.incluyeDemo ? '_DEMO' : '') + (d.puestoEnObra ? '_puesto-en-obra' : '') + '.xlsx',
      hojas:[ { nombre:'Insumos', filas:hoja1, anchos:[16,8,64,30] },
              { nombre:'Detalle', filas:hoja2, anchos:[12,12,56,8,14,16,26,16,16,10,14,10,6,14,14,14,11,12,40,50,10] },
              { nombre:'Notas', filas:notas, anchos:[120] } ],
      esperado: renglones.map(r => ({ categoria:r.categoria, unidad:r.unidad, descripcion:r.descripcion, precio:r.precio }))
    };
  }

  /** Lista maestra exportada por ARKEN: el encabezado se busca por nombre. */
  function leerListaMaestra(filas){
    const idx = filas.findIndex(r => Array.isArray(r) && r.some(c => normaliza(c) === 'codigo') && r.some(c => normaliza(c) === 'descripcion'));
    if (idx < 0) return { ok:false, error:'No se encontró la fila de encabezado con «Código» y «Descripción».', filas:[] };
    const enc = filas[idx].map(c => normaliza(c));
    const col = nombre => enc.findIndex(c => c === nombre);
    const C = { codigo:col('codigo'), descripcion:col('descripcion'), unidad:col('unidad'), categoria:col('categoria'),
                precio:col('precio unitario'), cantidad:col('cantidad presupuestada'), valor:col('valor presupuestado'), proveedor:col('proveedor sugerido') };
    const num = v => typeof v === 'number' ? v : leerNumero(String(v||'').replace(/\$/g,''));
    const out = filas.slice(idx + 1).filter(r => Array.isArray(r) && r[C.descripcion] !== undefined && String(r[C.descripcion]).trim())
      .map(r => ({ codigo:String(r[C.codigo]||'').trim(), descripcion:String(r[C.descripcion]).trim(), unidad:String(r[C.unidad]||'').trim(),
                   categoria:String(r[C.categoria]||'').trim(), precio:num(r[C.precio]), cantidad: C.cantidad >= 0 ? num(r[C.cantidad]) : 0,
                   valor: C.valor >= 0 ? num(r[C.valor]) : 0, proveedor: C.proveedor >= 0 ? String(r[C.proveedor]||'').trim() : '' }));
    return { ok:true, filaEncabezado:idx, filas:out };
  }

  /** Empareja la lista de ARKEN con el catálogo: exacto por descripción
      normalizada; parecidos se proponen; el resto queda sin equivalencia. */
  function emparejarLista(lista, insumos, equivalencias){
    const porDesc = new Map();
    (insumos||[]).forEach(i => porDesc.set(normaliza(i.descripcion), i));
    (equivalencias||[]).forEach(e => { const i = (insumos||[]).find(x => x.id === e.insumoId); if (i) porDesc.set(normaliza(e.descripcionArken), i); });
    return lista.map(f => {
      const exacto = porDesc.get(normaliza(f.descripcion));
      if (exacto) return { fila:f, insumoId:exacto.id, estado:'exacta', puntaje:1, alternativas:[] };
      const r = Emparejamiento.emparejar(f.descripcion, insumos, { unidad:f.unidad, limite:3 });
      const mejor = r.candidatos[0];
      if (mejor && mejor.puntaje >= 0.6) return { fila:f, insumoId:mejor.insumo.id, estado:'propuesta', puntaje:mejor.puntaje,
        alternativas:r.candidatos.map(c => ({ insumoId:c.insumo.id, puntaje:c.puntaje })) };
      return { fila:f, insumoId:null, estado:'sin equivalencia', puntaje: mejor ? mejor.puntaje : 0,
               alternativas:r.candidatos.map(c => ({ insumoId:c.insumo.id, puntaje:c.puntaje })) };
    });
  }

  /** Análisis ABC por valor presupuestado (§8.6). */
  function abc(lista){
    const total = lista.reduce((a, f) => a + (Number(f.valor) || 0), 0);
    let acum = 0;
    return lista.slice().sort((a,b) => (Number(b.valor)||0) - (Number(a.valor)||0)).map(f => {
      const antes = acum;
      acum += Number(f.valor) || 0;
      const clase = !(total > 0) || !(f.valor > 0) ? 'C' : (antes / total < 0.8 ? 'A' : (antes / total < 0.95 ? 'B' : 'C'));
      return Object.assign({}, f, { clase, participacion: total > 0 ? (Number(f.valor)||0) / total : 0, acumulado: total > 0 ? acum / total : 0 });
    });
  }
  return { leerComoArken, validar, armarLibro, leerListaMaestra, emparejarLista, abc, redondeo };
})();

/* ══════════════════════════════════════════════════════════════════════════
   AGREGADOS DEL TABLERO (§13)
   Precalculados por insumo, ciudad y mes. Con 50.000 observaciones la
   consulta recorre unos miles de celdas, no las 50.000 filas.
   ══════════════════════════════════════════════════════════════════════════ */
const Agregados = (function(){
  /** Observación compacta: lo justo para el tablero. */
  function compactar(o){
    return { i:o.insumoId, c:o.ciudad || '', f:Observaciones.fechaDe(o), p:o.precioConIva, s:o.fuenteId || '', d:o.esDemo ? 1 : 0,
             t:Consolidacion.clase(o), id:o.id };
  }
  function construir(compactas){
    const celdas = new Map();       // i|c|mes → { i, c, m, v:[] }
    compactas.forEach(o => {
      if (!(o.p > 0) || o.t === 'referencia') return;
      const m = o.f.slice(0,7), k = o.i + '|' + o.c + '|' + m;
      let x = celdas.get(k);
      if (!x){ x = { i:o.i, c:o.c, m, v:[] }; celdas.set(k, x); }
      x.v.push(o.p);
    });
    const porInsumo = new Map();
    celdas.forEach(x => {
      x.v.sort((a,b) => a - b);
      x.n = x.v.length; x.min = x.v[0]; x.max = x.v[x.n-1];
      x.med = Estadistica.percentil(x.v, 0.5, true);
      x.prom = x.v.reduce((a,b) => a + b, 0) / x.n;
      let l = porInsumo.get(x.i); if (!l){ l = []; porInsumo.set(x.i, l); } l.push(x);
    });
    return { celdas, porInsumo, total:compactas.length };
  }
  /** Serie mensual de un insumo en una o varias ciudades. */
  function serie(ag, insumoId, ciudades, desdeMes, hastaMes){
    const set = ciudades && ciudades.length ? new Set(ciudades) : null;
    const porCiudad = {};
    (ag.porInsumo.get(insumoId) || []).forEach(x => {
      if (set && !set.has(x.c)) return;
      if (desdeMes && x.m < desdeMes) return;
      if (hastaMes && x.m > hastaMes) return;
      (porCiudad[x.c] = porCiudad[x.c] || []).push({ mes:x.m, n:x.n, minimo:x.min, maximo:x.max, mediana:x.med, promedio:x.prom });
    });
    Object.keys(porCiudad).forEach(c => porCiudad[c].sort((a,b) => a.mes < b.mes ? -1 : 1));
    return porCiudad;
  }
  /** Índice de la canasta por mes (Jevons: media geométrica de relativos
      frente al mes base, sobre los insumos con dato en ambos meses). */
  function indice(ag, insumoIds, ciudades, meses, estadistico){
    const est = estadistico || 'med';
    const set = new Set(ciudades || []);
    const val = new Map();      // insumo → mes → valor (mediana de las ciudades)
    insumoIds.forEach(id => {
      const porMes = {};
      (ag.porInsumo.get(id) || []).forEach(x => { if (!set.size || set.has(x.c)) (porMes[x.m] = porMes[x.m] || []).push(x[est]); });
      const m = new Map();
      Object.keys(porMes).forEach(mes => m.set(mes, Estadistica.mediana(porMes[mes])));
      val.set(id, m);
    });
    const base = meses[0];
    return meses.map(mes => {
      const rel = [];
      val.forEach(m => { const a = m.get(base), b = m.get(mes); if (a > 0 && b > 0) rel.push(b / a); });
      return { mes, indice: rel.length ? redondearDec(100 * Estadistica.mediaGeometrica(rel), 2) : null, insumos: rel.length };
    });
  }
  /** Comparación entre ciudades: mediana de los relativos frente a la
      ciudad de referencia, sobre los insumos que ambas tienen en el periodo. */
  function compararCiudades(ag, insumoIds, ciudades, referencia, desdeMes, hastaMes){
    const valorEn = (id, c) => {
      const xs = (ag.porInsumo.get(id) || []).filter(x => x.c === c && (!desdeMes || x.m >= desdeMes) && (!hastaMes || x.m <= hastaMes));
      if (!xs.length) return null;
      xs.sort((a,b) => a.m < b.m ? 1 : -1);
      return xs[0].med;              // el mes más reciente del periodo
    };
    return ciudades.filter(c => c !== referencia).map(c => {
      const rel = [];
      insumoIds.forEach(id => { const a = valorEn(id, referencia), b = valorEn(id, c); if (a > 0 && b > 0) rel.push(b / a); });
      const r = rel.length ? Estadistica.mediaGeometrica(rel) : null;
      return { ciudad:c, relativo: r, diferencia: r === null ? null : r - 1, insumos: rel.length };
    });
  }
  /** Mayores alzas y bajas del periodo (mediana del último mes frente al primero). */
  function extremos(ag, insumoIds, ciudades, desdeMes, hastaMes, cuantos){
    const set = new Set(ciudades || []);
    const out = [];
    insumoIds.forEach(id => {
      const xs = (ag.porInsumo.get(id) || []).filter(x => (!set.size || set.has(x.c)) && (!desdeMes || x.m >= desdeMes) && (!hastaMes || x.m <= hastaMes));
      if (xs.length < 2) return;
      const porMes = {};
      xs.forEach(x => (porMes[x.m] = porMes[x.m] || []).push(x.med));
      const meses = Object.keys(porMes).sort();
      if (meses.length < 2) return;
      const a = Estadistica.mediana(porMes[meses[0]]), b = Estadistica.mediana(porMes[meses[meses.length-1]]);
      if (a > 0 && b > 0) out.push({ insumoId:id, variacion:b / a - 1, desde:meses[0], hasta:meses[meses.length-1] });
    });
    out.sort((x,y) => y.variacion - x.variacion);
    const n = cuantos || 10;
    return { alzas: out.filter(x => x.variacion > 0).slice(0, n), bajas: out.filter(x => x.variacion < 0).slice(-n).reverse() };
  }
  return { compactar, construir, serie, indice, compararCiudades, extremos };
})();

/* ══════════════════════════════════════════════════════════════════════════
   CRIPTOGRAFÍA: SHA-256, PBKDF2 Y JSON CANÓNICO
   PBKDF2-HMAC-SHA256 se calcula con WebCrypto; esta versión en JavaScript
   puro es el respaldo para navegadores sin `crypto.subtle` y la referencia
   de las pruebas.
   ══════════════════════════════════════════════════════════════════════════ */
const Cripto = (function(){
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H0 = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64);

  /** Procesa un bloque de 64 bytes (16 palabras) sobre el estado H. */
  function bloque(H, palabras){
    for (let t = 0; t < 16; t++) W[t] = palabras[t];
    for (let t = 16; t < 64; t++){
      const a = W[t-15], b = W[t-2];
      const s0 = ((a>>>7)|(a<<25)) ^ ((a>>>18)|(a<<14)) ^ (a>>>3);
      const s1 = ((b>>>17)|(b<<15)) ^ ((b>>>19)|(b<<13)) ^ (b>>>10);
      W[t] = (W[t-16] + s0 + W[t-7] + s1) >>> 0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let t = 0; t < 64; t++){
      const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[t] + W[t]) >>> 0;
      const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  function utf8(txt){
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(String(txt));
    const s = unescape(encodeURIComponent(String(txt))); const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  /** SHA-256 de bytes, continuando desde un estado (para HMAC precalculado). */
  function sha256Desde(estado, bytes, yaProcesados){
    const H = estado.slice();
    const l = bytes.length, total = l + (yaProcesados || 0);
    const n = (((l + 8) >> 6) + 1) * 64;
    const buf = new Uint8Array(n); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(n - 4, (total * 8) >>> 0, false);
    dv.setUint32(n - 8, Math.floor(total * 8 / 4294967296), false);
    const p = new Uint32Array(16);
    for (let i = 0; i < n; i += 64){ for (let t = 0; t < 16; t++) p[t] = dv.getUint32(i + t*4, false); bloque(H, p); }
    return H;
  }
  function aBytes(H){ const out = new Uint8Array(32); const dv = new DataView(out.buffer); H.forEach((x, i) => dv.setUint32(i*4, x, false)); return out; }
  function hex(bytes){ return Array.from(bytes, b => b.toString(16).padStart(2,'0')).join(''); }
  function deHex(h){ const s = String(h||''); const out = new Uint8Array(s.length / 2); for (let i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i*2, 2), 16); return out; }
  function sha256Bytes(bytes){ return aBytes(sha256Desde(H0, bytes, 0)); }
  function sha256Hex(texto){ return hex(sha256Bytes(utf8(texto))); }

  /** Estado de SHA-256 tras procesar un bloque de 64 bytes (relleno de HMAC). */
  function estadoTras(bloque64){
    const H = H0.slice(); const dv = new DataView(bloque64.buffer, bloque64.byteOffset, 64); const p = new Uint32Array(16);
    for (let t = 0; t < 16; t++) p[t] = dv.getUint32(t*4, false);
    bloque(H, p); return H;
  }
  function prepararHmac(claveBytes){
    let k = claveBytes.length > 64 ? sha256Bytes(claveBytes) : claveBytes;
    const ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (let i = 0; i < 64; i++){ const x = i < k.length ? k[i] : 0; ipad[i] = x ^ 0x36; opad[i] = x ^ 0x5c; }
    return { interno:estadoTras(ipad), externo:estadoTras(opad) };
  }
  function hmac(prep, mensaje){
    const interno = aBytes(sha256Desde(prep.interno, mensaje, 64));
    return aBytes(sha256Desde(prep.externo, interno, 64));
  }
  /** PBKDF2-HMAC-SHA256 en JavaScript puro (32 bytes de salida). */
  function pbkdf2(contrasena, salBytes, iteraciones){
    const prep = prepararHmac(utf8(contrasena));
    const s = new Uint8Array(salBytes.length + 4); s.set(salBytes); s[salBytes.length + 3] = 1;
    let u = hmac(prep, s);
    const t = u.slice();
    for (let i = 1; i < iteraciones; i++){
      u = hmac(prep, u);
      for (let j = 0; j < 32; j++) t[j] ^= u[j];
    }
    return hex(t);
  }
  /** JSON con las llaves en orden: el mismo contenido da el mismo hash. */
  function jsonCanonico(v){
    if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
    if (Array.isArray(v)) return '[' + v.map(jsonCanonico).join(',') + ']';
    return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + jsonCanonico(v[k])).join(',') + '}';
  }
  return { sha256Hex, sha256Bytes, pbkdf2, hex, deHex, utf8, jsonCanonico };
})();

/* ══════════════════════════════════════════════════════════════════════════
   PAQUETES, RESPALDOS E INTERCAMBIO (§10.5 y §10.1)
   Todo archivo que sale lleva su formato, su versión y un hash del
   contenido; ninguno lleva claves de API.
   ══════════════════════════════════════════════════════════════════════════ */
const Formatos = (function(){
