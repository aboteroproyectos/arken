    } catch(e){
      pr.cerrar(); RegistroTecnico.anotar('Crear corte', e);
      UI.aviso('No fue posible crear el corte', '<p>' + esc(e.message || e) + '</p>');
    }
  }
  async function cerrar(id){
    const k = Datos.corte(id); if (!k) return;
    const ok = await UI.confirmar({ titulo:'Cerrar el corte', mensaje:'«' + k.nombre + '» quedará inmutable: sus precios no cambian nunca más y no se puede eliminar. ¿Cerrarlo?', textoAceptar:'Cerrar corte' });
    if (!ok) return;
    await CortesSrv.cerrar(id); UI.toast('Corte cerrado', 'ok'); App.render();
  }
  async function eliminar(id){
    const k = Datos.corte(id); if (!k) return;
    const ok = await UI.confirmarEliminar({ nombre:k.nombre, detalle:'Se elimina el corte y su copia de precios. Las observaciones y la base no cambian.' });
    if (!ok) return;
    await intentar('eliminar el corte', async () => { await CortesSrv.eliminar(id); UI.toast('Corte eliminado', 'ok'); App.render(); });
  }
  return { pintar, crear, cerrar, eliminar };
})();


/* ══════════════════════════════════════════════════════════════════════════
   FICHA DEL INSUMO
   Resumen, observaciones (enlace, texto literal, fecha y evidencia),
   historia por ciudad, presentaciones y conversiones, equivalencia con
   ARKEN y precio adoptado. Desde aquí se actualiza el insumo solo.
   ══════════════════════════════════════════════════════════════════════════ */
const Ficha = (function(){
  const PESTANAS = [{ k:'resumen', n:'Resumen' }, { k:'obs', n:'Observaciones' }, { k:'historia', n:'Historia' },
                    { k:'presentaciones', n:'Presentaciones' }, { k:'equivalencia', n:'Equivalencia ARKEN' }, { k:'adoptado', n:'Precio adoptado' }];

  async function abrir(insumoId, ciudad, pestana, obsResaltada){
    const ins = Datos.insumo(insumoId);
    if (!ins){ UI.toast('El insumo ya no existe en el catálogo', 'bad'); return; }
    const estado = { tab:pestana || 'obs', ciudad:ciudad || Piezas.ciudadActual(), todas:false, resaltada:obsResaltada || null, completas:null };
    if (obsResaltada){
      const o = Datos.obsTodas().get(obsResaltada);
      if (o && o.ciudad) estado.ciudad = o.ciudad;
    }
    const g = Datos.grupo(ins.grupo);
    const m = UI.modal({ titulo:ins.descripcion, eyebrow:ins.codigo + ' · ' + ins.unidad + ' · ' + (g ? g.nombre : ins.grupo) + ' › ' + ins.categoria, ancho:'xwide',
      cuerpo:'<div id="fiCab"></div><div id="fiTabs"></div><div id="fiCuerpo" style="margin-top:12px"></div>',
      botones:[{ texto:'Cerrar' }] });
    m.el.dataset.ficha = ins.id;
    const recargar = async () => { estado.completas = await Datos.observacionesCompletas(ins.id); };
    await recargar();
    const pintar = async () => {
      if (!document.body.contains(m.el)) return;
      const v = Precios.vigente(ins, estado.ciudad), ad = Datos.adoptado(ins.id, estado.ciudad);
      $('#fiCab', m.el).innerHTML = '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between">' +
        '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">' +
          '<div class="field" style="min-width:200px"><label for="fiCiudad">Ciudad</label><select id="fiCiudad">' + UI.selectOpts(Piezas.opcionesCiudad(true), estado.ciudad) + '</select></div>' +
          '<div><div class="eyebrow">Precio vigente con IVA</div><div style="font-family:var(--font-num);font-size:19px;font-weight:600">' +
            (ad ? money3(ad.precio) : (v.recomendado > 0 ? money3(v.recomendado) : '—')) + ' <span class="small muted">por ' + esc(ins.unidad) + '</span></div>' +
            '<div class="small">' + Piezas.rotulosPrecio(v, ad) + ' · n = ' + (v.n || 0) + (v.fecha && !v.sinActualizar ? ' · calculado el ' + esc(fmtFecha(v.fecha)) : ' · sin actualizar') + '</div></div></div>' +
        '<div class="btn-row">' +
          (Permisos.puede('registrarPrecios') ? '<button class="btn sm" id="fiReg" type="button">Registrar un precio</button>' : '') +
          (Permisos.puede('actualizar') ? '<button class="btn sm brass" id="fiAct" type="button">Actualizar este insumo ahora</button>' : '') +
        '</div></div>';
      $('#fiTabs', m.el).innerHTML = UI.tabs(PESTANAS, estado.tab, k => { estado.tab = k; pintar(); }, true);
      $('#fiCiudad', m.el).onchange = e => { estado.ciudad = e.target.value; pintar(); };
      if ($('#fiReg', m.el)) $('#fiReg', m.el).onclick = () => PreciosManuales.formulario({ insumoId:ins.id, ciudad:estado.ciudad }, async () => { await recargar(); pintar(); });
      if ($('#fiAct', m.el)) $('#fiAct', m.el).onclick = () => actualizarAhora(ins, estado, pintar);
      const cuerpo = $('#fiCuerpo', m.el);
      try {
        if (estado.tab === 'resumen') resumen(cuerpo, ins, v, ad, estado);
        else if (estado.tab === 'obs') observaciones(cuerpo, ins, v, estado, async () => { await recargar(); pintar(); });
        else if (estado.tab === 'historia') await historia(cuerpo, ins, estado);
        else if (estado.tab === 'presentaciones') presentaciones(cuerpo, ins, estado, pintar);
        else if (estado.tab === 'equivalencia') equivalencia(cuerpo, ins, pintar);
        else adoptado(cuerpo, ins, v, estado, pintar);
      } catch(e){ RegistroTecnico.anotar('Ficha ' + estado.tab, e); cuerpo.innerHTML = '<div class="alert bad"><div class="ic">!</div><div class="bd">' + esc(e.message || e) + '</div></div>'; }
    };
    await pintar();
    return m;
  }

  async function actualizarAhora(ins, estado, pintar){
    const ciudades = Array.from(new Set([estado.ciudad].concat(Informes.ciudadesPorDefecto())));
    const antes = Datos.consolidado(ins.id, estado.ciudad);
    const pr = UI.progreso('Actualizando ' + ins.descripcion, 'Recalculando con las observaciones registradas…');
    try {
      const ej = await Motor.ejecutar({ tipo:'insumo', descripcion:'Insumo ' + ins.codigo + ' · ' + ins.descripcion, insumoIds:[ins.id], ciudades });
      pr.cerrar();
      const despues = Datos.consolidado(ins.id, estado.ciudad);
      UI.toast(despues && despues.recomendado > 0 ? 'Actualizado: ' + money3(despues.recomendado) + (antes && antes.recomendado > 0 && !igualDinero(antes.recomendado, despues.recomendado) ? ' (antes ' + money3(antes.recomendado) + ')' : ' (sin cambio)') :
        'Actualizado: sigue sin observaciones de mercado (' + ej.estado + ')', 'ok');
      await pintar();
      App.pintarCinta();
    } catch(e){ pr.cerrar(); RegistroTecnico.anotar('Actualizar insumo', e); UI.aviso('No fue posible actualizar el insumo', '<p>' + esc(e.message || e) + '</p>'); }
  }

  /* ── Resumen ── */
  function resumen(c, ins, v, ad, estado){
    const e = Datos.equivalencia(ins.id);
    const P = Consolidacion.parametros(Datos.config('consolidacion', {}));
    c.innerHTML = '<div class="grid g2">' +
      '<div class="card"><div class="card-head"><h3>Cálculo en ' + esc(Datos.nombreCiudad(estado.ciudad)) + '</h3></div><div class="card-body"><div class="kv">' +
        kv('Recomendado con IVA', v.recomendado > 0 ? money3(v.recomendado) : 'Sin dato') + kv('Sin IVA', v.recomendadoSinIva > 0 ? money3(v.recomendadoSinIva) : '—') +
        kv('Observaciones usadas', String(v.n || 0) + (v.nFuentes ? ' de ' + v.nFuentes + ' fuente(s)' : '')) +
        kv('Mínimo · mediana · máximo', v.minimo > 0 ? money3(v.minimo) + ' · ' + money3(v.mediana) + ' · ' + money3(v.maximo) : '—') +
        kv('Coeficiente de variación', v.coefVariacion ? pct(v.coefVariacion * 100) : '—') + kv('Confianza', UI.tagConfianza(v.soloReferencia ? 'referencia' : v.confianza), true) +
        kv('Nivel geográfico', esc(v.nivel || '—') + (v.ambito && v.nivel !== 'ciudad' ? ' (' + esc(v.ambito) + ')' : '') + (v.factorRegional && v.factorRegional !== 1 ? ' · factor regional ' + cant(v.factorRegional) : ''), true) +
        kv('Método', esc(v.metodo || '—'), true) + kv('Variación a 30 días', UI.variacionHTML(v.variacion30), true) +
        kv('Precio adoptado', ad ? money3(ad.precio) + ' · ' + esc(ad.justificacion || '') : 'No hay', true) +
        (v.dependeDemo ? kv('Atención', UI.tagDemo() + ' depende de datos de demostración', true) : '') +
      '</div></div></div>' +
      '<div class="card"><div class="card-head"><h3>Ficha del insumo</h3></div><div class="card-body"><div class="kv">' +
        kv('Código', ins.codigo) + kv('Unidad canónica', ins.unidad + ' · ' + (NOMBRE_UNIDAD[ins.unidad] || '')) + kv('Especificación', ins.especificacion || '—') +
        kv('Norma', ins.norma || '—') + kv('Sinónimos', (ins.sinonimos || []).join(', ') || '—') + kv('Categoría ARKEN', UI.tagCategoria(ins.categoriaArken), true) +
        kv('En ARKEN', e && e.estado === 'exacta' ? '«' + esc(e.descripcionArken) + '» · ' + esc(e.unidadArken) + ' · ' + esc(e.categoriaArken) : (e ? 'Equivalencia ' + esc(e.estado) : 'No: entraría como insumo nuevo'), true) +
        kv('IVA', esc(ins.regimenIva + ' · ' + ins.tarifaIva + ' %' + (ins.baseIva && ins.baseIva !== 'precio' ? ' sobre la ' + (ins.baseIva === 'aiu' ? 'AIU' : 'utilidad') : '')) +
          (ins.ivaPorVerificar ? ' <span class="tag warn">por verificar</span>' : '') + (ins.notaIva ? '<div class="small muted">' + esc(ins.notaIva) + '</div>' : ''), true) +
        kv('Investigable', ins.investigable === false ? 'No (valor pactado o porcentual)' : 'Sí') + kv('Etiquetas', (ins.etiquetas || []).join(', ') || '—') +
      '</div></div></div></div>' +
      '<p class="small muted" style="margin-top:10px">Ventana de ' + P.ventanaDias + ' días; con menos de ' + P.minimoObservaciones + ' observaciones en la ciudad se amplía a la subregión, la región y el país con el factor regional, y la confianza baja un nivel por paso.</p>';
  }
  function kv(k, v, html){ return '<div class="k">' + esc(k) + '</div><div class="v">' + (html ? v : esc(v)) + '</div>'; }

  /* ── Observaciones ── */
  function observaciones(c, ins, v, estado, recargar){
    const usadas = new Set(v.observacionesUsadas || []);
    const lista = (estado.completas || []).filter(o => estado.todas || o.ciudad === estado.ciudad || (!o.ciudad && o.tipoPrecio === 'referencia'))
      .sort((a,b) => (Observaciones.fechaDe(a) < Observaciones.fechaDe(b) ? 1 : (Observaciones.fechaDe(a) > Observaciones.fechaDe(b) ? -1 : 0)));
    const puedeValidar = Permisos.puede('validar');
    c.innerHTML = '<div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">' +
      '<label class="checkline"><input type="checkbox" id="fiTodas"' + (estado.todas ? ' checked' : '') + '> Ver las de todas las ciudades</label>' +
      '<span class="small muted">' + lista.length + ' observación(es). <span class="tag usada">usada</span> = entra al precio vigente.</span></div>' +
      (lista.length ? '<div class="tw"><table class="t" id="tFiObs"><thead><tr><th>Fecha</th><th>Fuente</th><th>Ciudad</th><th class="n">Precio publicado</th>' +
        '<th class="n">Por ' + esc(ins.unidad) + ' con IVA</th><th>Estado</th><th>Tipo</th><th>Texto literal</th><th>Enlace</th>' + (puedeValidar ? '<th data-no-orden></th>' : '') + '</tr></thead><tbody>' +
        lista.map(o => '<tr' + (o.id === estado.resaltada ? ' class="resaltada"' : '') + ' data-obs="' + esc(o.id) + '">' +
          '<td class="nowrap">' + esc(fmtFecha(Observaciones.fechaDe(o))) + (o.vecesVista > 1 ? '<div class="small muted">vista ' + o.vecesVista + ' veces</div>' : '') + '</td>' +
          '<td>' + esc(Datos.nombreFuente(o.fuenteId)) + (o.proveedor && o.proveedor !== Datos.nombreFuente(o.fuenteId) ? '<div class="small muted">' + esc(o.proveedor) + '</div>' : '') +
            (o.esDemo ? ' ' + UI.tagDemo() : '') + '</td>' +
          '<td>' + esc(o.ciudad ? Datos.nombreCiudad(o.ciudad) : 'Nacional') + '</td>' +
          '<td class="n">' + money3(o.precioPublicado) + '<div class="small muted">' + esc((o.unidadPublicada || '') + (o.presentacion && o.presentacion.cantidad ? ' · ' + cant(o.presentacion.cantidad) + ' ' + (o.presentacion.unidad || '') : '')) +
            (o.incluyeIva === false ? ' · + IVA' : (o.incluyeIva === true ? ' · IVA incl.' : ' · IVA no dicho')) + '</div></td>' +
          '<td class="n">' + money3(o.precioConIva) + (o.factorConversion && o.factorConversion !== 1 ? '<div class="small muted">÷ ' + cant(o.factorConversion) + '</div>' : '') + '</td>' +
          '<td>' + UI.tagEstado(o.estado) + (usadas.has(o.id) ? ' <span class="tag usada">usada</span>' : '') + (o.motivoEstado ? '<div class="small muted">' + esc(o.motivoEstado) + '</div>' : '') + '</td>' +
          '<td>' + esc(o.tipoPrecio) + (o.esDesde ? '<div class="small muted">«desde»</div>' : '') + '</td>' +
          '<td class="lit">' + (o.textoLiteral ? '«' + esc(o.textoLiteral) + '»' : '<span class="muted">—</span>') +
            (o.evidencia ? '<div class="small muted">Evidencia: ' + esc(String(o.evidencia).slice(0, 160)) + '</div>' : '') +
            (o.cotizacionId ? '<div><button class="btn xs" data-cot="' + esc(o.cotizacionId) + '" type="button">Ver la cotización</button></div>' : '') + '</td>' +
          '<td>' + Piezas.enlace(o.url, 'Abrir') + '</td>' +
          (puedeValidar ? '<td class="act">' + (o.tipoPrecio !== 'referencia' ? '<div class="btn-row"><button class="btn xs" data-estado="' + esc(o.id) + '" type="button">Estado</button>' +
            (o.estado !== 'descartada' ? '<button class="btn xs" data-corregir="' + esc(o.id) + '" type="button">Corregir</button>' : '') + '</div>' : '') + '</td>' : '') + '</tr>').join('') +
        '</tbody></table></div>' : UI.vacio('◇', 'Sin observaciones en esta ciudad', 'Registre un precio o marque «Ver las de todas las ciudades».'));
    $('#fiTodas', c).onchange = e => { estado.todas = e.target.checked; observaciones(c, ins, v, estado, recargar); };
    $$('[data-estado]', c).forEach(b => b.onclick = () => cambiarEstado(b.dataset.estado, recargar));
    $$('[data-corregir]', c).forEach(b => b.onclick = () => corregir(b.dataset.corregir, ins, recargar));
    $$('[data-cot]', c).forEach(b => b.onclick = () => CotizacionesUI.ver(b.dataset.cot));
    const r = $('tr.resaltada', c); if (r) setTimeout(() => r.scrollIntoView({ block:'center' }), 60);
  }
  async function cambiarEstado(id, recargar){
    const o = await Datos.observacion(id); if (!o) return;
    const d = await UI.pedir({ titulo:'Cambiar el estado de la observación', eyebrow:fmtFecha(o.fechaCaptura) + ' · ' + money3(o.precioPublicado), cols:1,
      intro:'<p class="small muted">El precio no cambia: solo su estado. El cambio queda con su motivo, su usuario y su fecha.</p>',
      campos:[{ k:'estado', lab:'Estado', tipo:'select', val:o.estado, opts:Observaciones.ESTADOS },
              { k:'motivo', lab:'Motivo', tipo:'textarea', req:true, filas:2 }] });
    if (!d) return;
    await intentar('cambiar el estado', async () => { await Registro.cambiarEstado(id, d.estado, d.motivo); UI.toast('Estado cambiado. Actualice el insumo para que el cambio entre a la base.', 'ok'); await recargar(); });
  }
  async function corregir(id, ins, recargar){
    const o = await Datos.observacion(id); if (!o) return;
    const d = await UI.pedir({ titulo:'Corregir la observación', eyebrow:'Se crea un registro nuevo; el original queda descartado con el motivo', ancho:'wide', cols:2,
      campos:[{ k:'precioPublicado', lab:'Precio publicado', tipo:'money', val:o.precioPublicado, req:true },
              { k:'unidadPublicada', lab:'Unidad publicada', tipo:'select', val:o.unidadPublicada, opts:UNIDADES },
              { k:'incluyeIva', lab:'IVA', tipo:'select', val:o.incluyeIva === false ? 'no' : (o.incluyeIva === true ? 'si' : ''), opts:[{ v:'si', n:'Incluido' }, { v:'no', n:'No incluido (+ IVA)' }, { v:'', n:'No lo dice' }] },
              { k:'fechaCaptura', lab:'Fecha del precio', tipo:'date', val:o.fechaCaptura, req:true },
              { k:'ciudad', lab:'Ciudad', tipo:'select', val:o.ciudad || '', opts:[{ v:'', n:'Nacional' }].concat(Piezas.opcionesCiudad(true)) },
              { k:'tipoPrecio', lab:'Tipo de precio', tipo:'select', val:o.tipoPrecio, opts:Observaciones.TIPOS_PRECIO.filter(t => t !== 'referencia') },
              { k:'motivo', lab:'Motivo de la corrección', tipo:'textarea', req:true, col:2, filas:2 }] });
    if (!d) return;
    await intentar('corregir la observación', async () => {
      await Registro.corregir(id, { precioPublicado:d.precioPublicado, unidadPublicada:d.unidadPublicada, incluyeIva:d.incluyeIva === 'si' ? true : (d.incluyeIva === 'no' ? false : null),
        fechaCaptura:d.fechaCaptura, ciudad:d.ciudad || null, tipoPrecio:d.tipoPrecio }, d.motivo);
      UI.toast('Corrección registrada. El original quedó descartado y a la vista.', 'ok');
      await recargar();
    });
  }

  /* ── Historia ── */
  async function historia(c, ins, estado){
    const obs = Datos.obs(ins.id).filter(o => o.ciudad && o.estado === 'válida' && o.tipoPrecio !== 'referencia' && o.precioConIva > 0);
    const conteo = {};
    obs.forEach(o => { conteo[o.ciudad] = (conteo[o.ciudad] || 0) + 1; });
    const ciudades = Object.keys(conteo).sort((a,b) => (a === estado.ciudad ? -1 : (b === estado.ciudad ? 1 : conteo[b] - conteo[a]))).slice(0, 5);
    const hasta = mesDe(hoyISO()), meses = [];
    for (let k = 23; k >= 0; k--) meses.push(sumaMeses(hasta, -k));
    const series = ciudades.map((cod, k) => {
      const porMes = {};
      obs.filter(o => o.ciudad === cod).forEach(o => { const m = mesDe(o.fechaCaptura); (porMes[m] = porMes[m] || []).push(o.precioConIva); });
      return { nombre:Datos.nombreCiudad(cod), color:Graficas.color(k),
        puntos:meses.filter(m => porMes[m]).map(m => { const s = Estadistica.ordenados(porMes[m]); return { mes:m, n:s.length, minimo:s[0], maximo:s[s.length - 1], mediana:Estadistica.percentil(s, 0.5, true) }; }),
        obs:cod === estado.ciudad ? obs.filter(o => o.ciudad === cod && mesDe(o.fechaCaptura) >= meses[0]).map(o => ({ id:o.id, i:ins.id, f:o.fechaCaptura, p:o.precioConIva, d:o.esDemo, fuente:Datos.nombreFuente(o.fuenteId) })) : [] };
    }).filter(s => s.puntos.length);
    const hist = (await BD.porPrefijo('consolidados', 'insumoCiudadFecha', [ins.id, estado.ciudad])).sort((a,b) => a.fecha < b.fecha ? 1 : -1);
    const enCortes = Datos.cortes().map(k => ({ k, p:(k.precios || []).find(p => p.insumoId === ins.id && p.ciudad === estado.ciudad) })).filter(x => x.p);
    c.innerHTML = '<div class="card"><div class="card-head"><h3>Mediana mensual por ciudad (24 meses)</h3></div><div class="card-body"><div class="graf" id="fiGraf">' +
      (series.length ? Graficas.evolucion({ meses, series, titulo:'Historia de ' + ins.descripcion, desc:'Mediana mensual de las observaciones válidas, con la banda entre mínimo y máximo, por ciudad.' }) +
        '<div class="legend" style="flex-direction:row;flex-wrap:wrap;max-height:none;margin-top:8px">' + series.map(s => '<div class="li"><span class="sw" style="background:' + s.color + '"></span><span class="nm">' + esc(s.nombre) + '</span></div>').join('') + '</div>'
        : '<div class="graf-vacia">Sin observaciones de mercado todavía.</div>') + '</div></div></div>' +
      '<div class="grid g2" style="margin-top:var(--gap)">' +
        '<div class="card"><div class="card-head"><h3>Cálculos guardados en ' + esc(Datos.nombreCiudad(estado.ciudad)) + '</h3></div>' +
          (hist.length ? '<div class="tw"><table class="t"><thead><tr><th>Fecha</th><th class="n">Recomendado</th><th class="n">n</th><th>Confianza</th><th>Nivel</th></tr></thead><tbody>' +
            hist.slice(0, 60).map(h => '<tr><td>' + esc(fmtFecha(h.fecha)) + '</td><td class="n">' + (h.recomendado > 0 ? money3(h.recomendado) : '—') + '</td><td class="n">' + (h.n || 0) +
              '</td><td>' + UI.tagConfianza(h.soloReferencia ? 'referencia' : h.confianza) + '</td><td>' + esc(h.nivel || '—') + '</td></tr>').join('') + '</tbody></table></div>'
            : '<div class="card-body">' + UI.vacio('◌', 'Nunca se ha actualizado aquí', 'Use «Actualizar este insumo ahora».') + '</div>') + '</div>' +
        '<div class="card"><div class="card-head"><h3>En los cortes</h3></div>' +
          (enCortes.length ? '<div class="tw"><table class="t"><thead><tr><th>Corte</th><th>Fecha</th><th class="n">Precio</th><th>Estado</th></tr></thead><tbody>' +
            enCortes.map(x => '<tr><td>' + esc(x.k.nombre) + '</td><td>' + esc(fmtFecha(x.k.fecha)) + '</td><td class="n">' + money3(x.p.adoptado ? x.p.adoptado.precio : x.p.recomendado) +
              '</td><td>' + (x.k.cerrado ? '<span class="tag ok">cerrado</span>' : '<span class="tag warn">abierto</span>') + '</td></tr>').join('') + '</tbody></table></div>'
            : '<div class="card-body">' + UI.vacio('◌', 'No está en ningún corte de esta ciudad', '') + '</div>') + '</div></div>';
    $$('#fiGraf circle.obs', c).forEach(el => el.onclick = () => { estado.tab = 'obs'; estado.resaltada = el.dataset.obs; const t = $('[data-ficha="' + ins.id + '"] .tabs .tab[data-k="obs"]'); if (t) t.click(); });
  }

  /* ── Presentaciones y conversiones ── */
  function presentaciones(c, ins, estado, pintar){
    const cc = Unidades.contenidoCanonico(ins);
    const params = Registro.parametrosLaborales();
    c.innerHTML = '<div class="grid g2"><div class="card"><div class="card-head"><h3>Presentaciones</h3>' +
      (Permisos.esAdmin() ? '<button class="btn xs" id="fiPresNueva" type="button">Agregar</button>' : '') + '</div><div class="card-body">' +
      '<div class="kv">' + kv('Unidad canónica', ins.unidad + ' · ' + (NOMBRE_UNIDAD[ins.unidad] || '')) + kv('Contenido', cc ? cant(cc.cantidad) + ' ' + cc.unidad + ' por ' + ins.unidad : 'No declarado') + '</div>' +
      ((ins.presentaciones || []).length ? '<table class="t" style="margin-top:10px"><thead><tr><th>Nombre</th><th>Se publica en</th><th class="n">Contiene</th>' + (Permisos.esAdmin() ? '<th></th>' : '') + '</tr></thead><tbody>' +
        ins.presentaciones.map((p, i) => '<tr><td>' + esc(p.nombre) + '</td><td>' + esc(p.unidadPublicada || '—') + '</td><td class="n">' + cant(p.cantidad) + ' ' + esc(p.unidadBase) + '</td>' +
          (Permisos.esAdmin() ? '<td class="act"><button class="btn xs danger" data-quitar-pres="' + i + '" type="button">Quitar</button></td>' : '') + '</tr>').join('') + '</tbody></table>'
        : '<p class="small muted" style="margin-top:10px">Sin presentaciones declaradas.</p>') +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h3>Convertir un precio publicado</h3></div><div class="card-body">' +
        UI.formHTML([{ k:'cvPrecio', lab:'Precio publicado', ph:'Ej.: $ 32.900 + IVA' }, { k:'cvUnidad', lab:'Unidad publicada', tipo:'select', val:ins.unidad, opts:UNIDADES },
          { k:'cvCant', lab:'Presentación: cantidad', tipo:'cantidad', val:'' }, { k:'cvUP', lab:'Presentación: unidad', tipo:'select', val:'', opts:[{ v:'', n:'—' }].concat(UNIDADES) }], 2) +
        '<div id="fiConv" class="small" style="margin-top:10px"></div></div></div></div>';
    const calcular = () => {
      const lect = LectorPrecios.leer($('#f_cvPrecio', c).value);
      const out = $('#fiConv', c);
      if (!lect.ok){ out.innerHTML = '<span class="muted">' + esc(lect.advertencias.join(' ') || 'Escriba un precio.') + '</span>'; return; }
      const cantidad = Number($('#f_cvCant', c).value), up = $('#f_cvUP', c).value;
      const pres = cantidad > 0 && up ? { cantidad, unidad:up } : (lect.presentacion || null);
      const n = Observaciones.normalizar({ precioPublicado:lect.valor, unidadPublicada:$('#f_cvUnidad', c).value || lect.unidad || ins.unidad, presentacion:pres, incluyeIva:lect.incluyeIva }, ins, params);
      out.innerHTML = n.ok ? '<b>' + money3(n.precioConIva) + '</b> por ' + esc(ins.unidad) + ' con IVA · ' + money3(n.precioSinIva) + ' sin IVA<br><span class="muted">Factor ' + cant(n.factorConversion) + ' (' + esc(n.metodoConversion) + ')' +
        (n.advertencias.length ? ' · ' + esc(n.advertencias.join(' ')) : '') + '</span>' : '<span class="bad-txt">' + esc(n.advertencias.join(' ')) + '</span>';
    };
    ['#f_cvPrecio', '#f_cvUnidad', '#f_cvCant', '#f_cvUP'].forEach(s => { $(s, c).oninput = calcular; $(s, c).onchange = calcular; });
    if ($('#fiPresNueva', c)) $('#fiPresNueva', c).onclick = async () => {
      const d = await UI.pedir({ titulo:'Agregar presentación', cols:2, campos:[{ k:'nombre', lab:'Nombre (ej.: Varilla de 6 m)', req:true, col:2 },
        { k:'unidadPublicada', lab:'Se publica en', tipo:'select', opts:UNIDADES, val:'UN' }, { k:'cantidad', lab:'Cantidad que contiene', tipo:'cantidad', req:true },
        { k:'unidadBase', lab:'Unidad de esa cantidad', tipo:'select', opts:UNIDADES, val:ins.unidad }] });
      if (!d || !(d.cantidad > 0)) return;
      const nuevo = Object.assign({}, ins, { presentaciones:(ins.presentaciones || []).concat([{ nombre:d.nombre, cantidad:d.cantidad, unidadBase:d.unidadBase, unidadPublicada:d.unidadPublicada }]), actualizado:ahoraISO() });
      await Datos.guardar('insumos', nuevo); await Auditoria.registrar('editar insumo', ins.codigo + ': presentación ' + d.nombre);
      Object.assign(ins, nuevo); pintar();
    };
    $$('[data-quitar-pres]', c).forEach(b => b.onclick = async () => {
      const lista = (ins.presentaciones || []).slice(); const p = lista.splice(Number(b.dataset.quitarPres), 1)[0];
      const nuevo = Object.assign({}, ins, { presentaciones:lista, actualizado:ahoraISO() });
      await Datos.guardar('insumos', nuevo); await Auditoria.registrar('editar insumo', ins.codigo + ': quitó la presentación ' + (p ? p.nombre : ''));
      Object.assign(ins, nuevo); pintar();
    });
  }

  /* ── Equivalencia con ARKEN ── */
  function equivalencia(c, ins, pintar){
    const e = Datos.equivalencia(ins.id);
    const pa = Equivalencias.paraArken(ins);
    c.innerHTML = '<div class="card"><div class="card-body"><div class="kv">' +
      kv('Estado', e ? e.estado : 'sin equivalencia: entra como insumo nuevo') +
      kv('Descripción en ARKEN', e ? e.descripcionArken : '—') + kv('Unidad en ARKEN', e ? e.unidadArken : '—') + kv('Categoría en ARKEN', e ? e.categoriaArken : '—') +
      kv('Factor', e ? cant(e.factor) + ' ' + ins.unidad + ' por cada ' + (e.unidadArken || '') : '—') + kv('Código ARKEN de referencia', e && e.codigoArken ? e.codigoArken : '—') +
      kv('Origen', e ? e.origen : '—') +
      kv('En el Excel para ARKEN irá como', pa.ok ? '«' + pa.descripcion + '» · ' + pa.unidad + ' · ' + pa.categoria + (pa.existe ? ' (ya existe en ARKEN)' : ' (nuevo)') : 'No va: ' + pa.motivo) +
      '</div>' + (Permisos.puede('equivalencias') ? '<div class="btn-row" style="margin-top:12px"><button class="btn sm" id="fiEqEditar" type="button">' + (e ? 'Editar' : 'Crear') + ' equivalencia</button>' +
        (e && e.estado === 'propuesta' ? '<button class="btn sm primary" id="fiEqConf" type="button">Confirmar como exacta</button>' : '') + '</div>' : '') + '</div></div>';
    if ($('#fiEqEditar', c)) $('#fiEqEditar', c).onclick = async () => { await EquivalenciasUI.editar(ins, e); pintar(); };
    if ($('#fiEqConf', c)) $('#fiEqConf', c).onclick = async () => { await EquivalenciasUI.confirmar(e); pintar(); };
  }

  /* ── Precio adoptado ── */
  function adoptado(c, ins, v, estado, pintar){
    const todos = Datos.lista('preciosAdoptados').filter(a => a.insumoId === ins.id).sort((a,b) => a.creado < b.creado ? 1 : -1);
    const vig = Datos.adoptado(ins.id, estado.ciudad);
    c.innerHTML = '<div class="nota-tab">El precio adoptado es la decisión del analista para una ciudad, con su justificación y su vigencia. <b>Nunca borra el recomendado</b>: los dos quedan a la vista.</div>' +
      '<div class="card"><div class="card-head"><h3>Vigente en ' + esc(Datos.nombreCiudad(estado.ciudad)) + '</h3>' +
        (Permisos.puede('adoptar') ? '<div class="btn-row"><button class="btn sm primary" id="fiAdNuevo" type="button">Adoptar un precio</button>' +
          (vig ? '<button class="btn sm danger" id="fiAdRetirar" type="button">Retirar</button>' : '') + '</div>' : '') + '</div>' +
        '<div class="card-body">' + (vig ? '<div class="kv">' + kv('Precio adoptado', money3(vig.precio) + ' por ' + ins.unidad) + kv('Recomendado', v.recomendado > 0 ? money3(v.recomendado) : '—') +
          kv('Justificación', vig.justificacion) + kv('Vigencia', fmtFecha(vig.vigenteDesde) + (vig.vigenteHasta ? ' a ' + fmtFecha(vig.vigenteHasta) : ' en adelante')) + kv('Usuario', vig.usuario) + '</div>'
          : '<p class="small muted">No hay precio adoptado en esta ciudad.</p>') + '</div></div>' +
      (todos.length ? '<div class="card" style="margin-top:var(--gap)"><div class="card-head"><h3>Historial</h3></div><div class="tw"><table class="t"><thead><tr><th>Ciudad</th><th class="n">Precio</th><th>Vigencia</th><th>Justificación</th><th>Usuario</th><th>Estado</th></tr></thead><tbody>' +
        todos.map(a => '<tr><td>' + esc(Datos.nombreCiudad(a.ciudad)) + '</td><td class="n">' + money3(a.precio) + '</td><td>' + esc(fmtFecha(a.vigenteDesde) + (a.vigenteHasta ? ' a ' + fmtFecha(a.vigenteHasta) : '')) +
          '</td><td class="small">' + esc(a.justificacion) + '</td><td>' + esc(a.usuario) + '</td><td>' + (a.retirado ? '<span class="tag sin">retirado</span>' + (a.motivoRetiro ? '<div class="small muted">' + esc(a.motivoRetiro) + '</div>' : '') : '<span class="tag adop">vigente</span>') + '</td></tr>').join('') +
        '</tbody></table></div></div>' : '');
    if ($('#fiAdNuevo', c)) $('#fiAdNuevo', c).onclick = async () => {
      const d = await UI.pedir({ titulo:'Adoptar un precio', eyebrow:ins.descripcion + ' · ' + Datos.nombreCiudad(estado.ciudad), cols:2,
        campos:[{ k:'precio', lab:'Precio con IVA por ' + ins.unidad, tipo:'money', req:true, val:v.recomendado > 0 ? v.recomendado : '' },
                { k:'vigenteDesde', lab:'Vigente desde', tipo:'date', val:hoyISO(), req:true }, { k:'vigenteHasta', lab:'Vigente hasta (opcional)', tipo:'date' },
                { k:'justificacion', lab:'Justificación', tipo:'textarea', req:true, col:2, filas:3, ph:'Por qué este precio y no el recomendado: negociación, contrato marco, cotización vigente…' }],
        validar:d2 => !(d2.precio > 0) ? 'El precio debe ser mayor que cero' : (d2.vigenteHasta && d2.vigenteHasta < d2.vigenteDesde ? 'La vigencia termina antes de empezar' : '') });
      if (!d) return;
      const reg = { id:uid('adop'), insumoId:ins.id, ciudad:estado.ciudad, precio:redondear3(d.precio), justificacion:d.justificacion.trim(), vigenteDesde:d.vigenteDesde,
                    vigenteHasta:d.vigenteHasta || '', usuario:Sesion.usuario.usuario, creado:ahoraISO(), recomendadoAlAdoptar:v.recomendado || null, retirado:false };
      await Datos.guardar('preciosAdoptados', reg);
      await Auditoria.registrar('adoptar precio', ins.codigo + ' · ' + Datos.nombreCiudad(estado.ciudad) + ' · ' + money3(reg.precio) + ' · ' + reg.justificacion);
      UI.toast('Precio adoptado', 'ok'); pintar();
    };
    if ($('#fiAdRetirar', c)) $('#fiAdRetirar', c).onclick = async () => {
      const d = await UI.pedir({ titulo:'Retirar el precio adoptado', cols:1, campos:[{ k:'motivo', lab:'Motivo', tipo:'textarea', req:true, filas:2 }] });
      if (!d) return;
      await Datos.guardar('preciosAdoptados', Object.assign({}, vig, { retirado:true, motivoRetiro:d.motivo, retiradoPor:Sesion.usuario.usuario, retiradoEn:ahoraISO() }));
      await Auditoria.registrar('retirar precio adoptado', ins.codigo + ' · ' + Datos.nombreCiudad(estado.ciudad) + ': ' + d.motivo);
      UI.toast('Precio adoptado retirado', 'ok'); pintar();
    };
  }

  return { abrir };
})();


/* ══════════════════════════════════════════════════════════════════════════
   MÓDULO 02 — ACTUALIZAR PRECIOS
   Alcance → vista previa → ejecución → resultado. En la Fase 1 no se
   consulta internet: se recalcula la consolidación con las observaciones
   registradas. Solo cambia el alcance pedido; nada se borra.
   ══════════════════════════════════════════════════════════════════════════ */
Vistas.m02 = function(st){
  const tab = Sesion.tabs['02'] || 'actualizar';
  st.innerHTML = App.cabecera('02', 'Actualizar precios', 'Elija qué actualizar, revise lo que va a cambiar y ejecútelo. Actualizar una categoría no toca las demás.') +
    UI.tabs([{ k:'actualizar', n:'Actualizar' }, { k:'historial', n:'Historial de ejecuciones' }, { k:'programacion', n:'Programación' }], tab, k => { Sesion.tabs['02'] = k; App.render(); }) +
    '<div id="c02"></div>';
  const c = $('#c02');
  if (tab === 'historial') ActualizarUI.historial(c);
  else if (tab === 'programacion') c.innerHTML = '<div class="card"><div class="card-body">' + UI.vacio('⏱', 'Actualizaciones programadas: Fase 3',
    'Las actualizaciones semanales o mensuales corren en la app de escritorio o en el servidor de recolección, que llegan en la Fase 3 con el motor y los conectores certificados.') + '</div></div>';
  else ActualizarUI.pintar(c);
};

const ActualizarUI = (function(){
  let E = null;          // estado del asistente: { paso, alcance, resultado, registro[] }
  const NOMBRE_ALCANCE = { todo:'Toda la base', categorias:'Por categorías', desactualizados:'Solo desactualizados', pendientes:'Con precios nuevos sin actualizar',
                           insumos:'Insumos seleccionados', fuentes:'Por fuentes' };

  function nuevo(){
    const P = Consolidacion.parametros(Datos.config('consolidacion', {}));
    return { paso:1, alcance:{ tipo:'todo', categorias:[], dias:P.diasDesactualizado, insumoIds:[], fuentes:[], ciudades:Informes.ciudadesPorDefecto() }, resultado:null, registro:[], tramos:[] };
  }
  function pintar(c){
    if (!E) E = nuevo();
    const op = Sesion.opciones; Sesion.opciones = null;
    if (op && op.alcance && !Motor.enCurso()){
      E = nuevo();
      Object.assign(E.alcance, { tipo:op.alcance, insumoIds:op.insumoIds || [], ciudades:op.ciudades && op.ciudades.length ? op.ciudades : E.alcance.ciudades });
      E.paso = 2;
    }
    if (!Permisos.puede('actualizar')){
      c.innerHTML = '<div class="card"><div class="card-body">' + UI.vacio('🔒', 'Su rol no actualiza precios', 'Pídale a un analista de costos o al administrador que actualice.') + '</div></div>';
      return;
    }
    const pasos = ['Alcance', 'Vista previa', 'Ejecución', 'Resultado'];
    c.innerHTML = '<div class="pasos">' + pasos.map((p, i) => '<button class="paso-w' + (E.paso === i + 1 ? ' activo' : (E.paso > i + 1 ? ' hecho' : '')) + '" type="button" disabled><b>' + (i + 1) + '</b>' + p + '</button>').join('') + '</div>' +
      '<div class="nota-tab">En la <b>Fase 1</b> la actualización no sale a internet: recalcula los precios con las observaciones registradas (cotizaciones, precios a mano y listas). ' +
      'La búsqueda con el Investigador IA llega en la <span class="clave">Fase 2</span> y los conectores certificados en la <span class="clave">Fase 3</span>.</div>' +
      '<div id="a2Paso"></div>';
    const z = $('#a2Paso');
    if (E.paso === 1) paso1(z); else if (E.paso === 2) paso2(z); else if (E.paso === 3) paso3(z); else paso4(z);
  }

  /** Insumos del alcance elegido. */
  function insumosDelAlcance(a){
    const activos = Datos.insumosActivos();
    const P = Consolidacion.parametros(Datos.config('consolidacion', {}));
    switch (a.tipo){
      case 'categorias': { const s = new Set(a.categorias); return activos.filter(i => s.has(i.grupo + '|' + i.categoria)).map(i => i.id); }
      case 'desactualizados': {
        const hoy = hoyISO(), dias = Number(a.dias) || P.diasDesactualizado;
        return activos.filter(i => a.ciudades.some(c => { const k = Datos.consolidado(i.id, c); return !k || diasEntre(k.fecha, hoy) > dias; })).map(i => i.id);
      }
      case 'pendientes': { const s = new Set(); a.ciudades.forEach(c => Precios.pendientes(c).forEach(id => s.add(id))); return activos.filter(i => s.has(i.id)).map(i => i.id); }
      case 'insumos': { const s = new Set(a.insumoIds); return activos.filter(i => s.has(i.id)).map(i => i.id); }
      case 'fuentes': {
        const fs = new Set(a.fuentes), s = new Set();
        Datos.obsTodas().forEach(o => { if (fs.has(o.fuenteId)) s.add(o.insumoId); });
        return activos.filter(i => s.has(i.id)).map(i => i.id);
      }
      default: return activos.map(i => i.id);
    }
  }
  function conteoArbol(){
    const ult = new Map();
    Datos.consolidados().forEach(k => { const x = ult.get(k.insumoId); if (!x || k.fecha > x) ult.set(k.insumoId, k.fecha); });
    const porCat = {}, porGrupo = {};
    Datos.insumosActivos().forEach(i => {
      const k = i.grupo + '|' + i.categoria, f = ult.get(i.id) || '';
      const a = porCat[k] = porCat[k] || { n:0, fecha:'' }; a.n++; if (f > a.fecha) a.fecha = f;
      const b = porGrupo[i.grupo] = porGrupo[i.grupo] || { n:0, fecha:'' }; b.n++; if (f > b.fecha) b.fecha = f;
    });
    return (g, cat) => (cat === undefined ? porGrupo[g] : porCat[g + '|' + cat]) || { n:0, fecha:'' };
  }

  function paso1(z){
    const a = E.alcance;
    const opciones = Object.keys(NOMBRE_ALCANCE).map(k => '<label class="checkline"><input type="radio" name="a2Tipo" value="' + k + '"' + (a.tipo === k ? ' checked' : '') + '> ' + esc(NOMBRE_ALCANCE[k]) + '</label>').join('');
    z.innerHTML = '<div class="grid g2">' +
      '<div class="card"><div class="card-head"><h3>¿Qué actualizar?</h3></div><div class="card-body"><div class="stack" style="gap:6px">' + opciones + '</div>' +
        '<div id="a2Det" style="margin-top:12px"></div></div></div>' +
      '<div class="card"><div class="card-head"><h3>¿En qué ciudades?</h3></div><div class="card-body">' +
        '<div class="field"><label>Ciudades</label>' + UI.multi('a2Ciudades', Piezas.opcionesCiudad(), a.ciudades, 'Elija al menos una') + '</div>' +
        '<p class="small muted" style="margin-top:8px">Por defecto: la ciudad de referencia y las que tienen precios de mercado registrados.</p></div></div></div>' +
      '<div class="btn-row" style="justify-content:flex-end;margin-top:var(--gap)"><button class="btn primary" id="a2Sig" type="button">Ver la vista previa</button></div>';
    const detalle = () => {
      const d = $('#a2Det', z);
      if (a.tipo === 'categorias') d.innerHTML = '<p class="small muted">Cada rama muestra cuántos insumos tiene y la fecha de su última actualización.</p>' +
        UI.arbol('a2Arbol', { grupos:new Set(), categorias:new Set(a.categorias) }, conteoArbol());
      else if (a.tipo === 'desactualizados') d.innerHTML = UI.formHTML([{ k:'a2Dias', lab:'Sin actualizar en más de (días)', tipo:'number', val:a.dias, min:1 }], 1);
      else if (a.tipo === 'insumos') d.innerHTML = '<div class="field"><label for="a2Ins">Agregar insumo</label><input id="a2Ins" type="text" placeholder="Buscar insumo…"></div><div class="chips" id="a2Chips" style="margin-top:8px"></div>';
      else if (a.tipo === 'fuentes') d.innerHTML = '<div class="field"><label>Fuentes</label>' + UI.multi('a2Fuentes', Datos.fuentes().filter(f => f.id !== 'ref-arken').map(f => ({ v:f.id, n:f.nombre })), a.fuentes, 'Elija fuentes') + '</div>' +
        '<p class="small muted" style="margin-top:6px">Se actualizan los insumos que tienen observaciones de esas fuentes.</p>';
      else if (a.tipo === 'pendientes') d.innerHTML = '<p class="small muted">Los insumos que recibieron precios nuevos (cotizaciones, precios a mano o listas) después de su última actualización.</p>';
      else d.innerHTML = '<p class="small muted">Todos los insumos activos del catálogo (' + Datos.insumosActivos().length + ').</p>';
      if (a.tipo === 'insumos'){
        const chips = () => { $('#a2Chips', z).innerHTML = a.insumoIds.map(id => '<span class="chip">' + esc(Piezas.nombreInsumo(id)) + '<button type="button" data-q="' + esc(id) + '" aria-label="Quitar">✕</button></span>').join('');
          $$('[data-q]', z).forEach(b => b.onclick = () => { a.insumoIds = a.insumoIds.filter(x => x !== b.dataset.q); chips(); }); };
        UI.sugerirInsumo($('#a2Ins', z), ins => { if (a.insumoIds.indexOf(ins.id) < 0) a.insumoIds.push(ins.id); $('#a2Ins', z).value = ''; chips(); }, { limpiar:false });
        chips();
      }
    };
    $$('input[name=a2Tipo]', z).forEach(r => r.onchange = () => { leer(); a.tipo = r.value; detalle(); });
    detalle();
    function leer(){
      if ($('#a2Arbol', z)) a.categorias = UI.leerArbol('a2Arbol');
      if ($('#f_a2Dias', z)) a.dias = Number($('#f_a2Dias', z).value) || a.dias;
      if ($('#a2Fuentes', z)) a.fuentes = UI.valorMulti('a2Fuentes');
      a.ciudades = UI.valorMulti('a2Ciudades');
    }
    $('#a2Sig', z).onclick = () => {
      leer();
      if (!a.ciudades.length){ UI.toast('Elija al menos una ciudad', 'bad'); return; }
      if (a.tipo === 'categorias' && !a.categorias.length){ UI.toast('Marque al menos una categoría', 'bad'); return; }
      if (a.tipo === 'insumos' && !a.insumoIds.length){ UI.toast('Agregue al menos un insumo', 'bad'); return; }
      if (a.tipo === 'fuentes' && !a.fuentes.length){ UI.toast('Elija al menos una fuente', 'bad'); return; }
      E.paso = 2; pintar($('#c02'));
    };
  }

  function descripcionAlcance(a, n){
    let d = NOMBRE_ALCANCE[a.tipo];
    if (a.tipo === 'categorias') d += ': ' + a.categorias.map(k => k.split('|')[1]).slice(0, 4).join(', ') + (a.categorias.length > 4 ? ' y ' + (a.categorias.length - 4) + ' más' : '');
    if (a.tipo === 'desactualizados') d += ' (más de ' + a.dias + ' días)';
    if (a.tipo === 'fuentes') d += ': ' + a.fuentes.map(f => Datos.nombreFuente(f)).join(', ');
    return d + ' · ' + n + ' insumo(s) · ' + a.ciudades.map(c => Datos.nombreCiudad(c)).join(', ');
  }

  function paso2(z){
    const a = E.alcance;
    const ids = insumosDelAlcance(a);
    const setIds = new Set(ids);
    let obsMercado = 0; const fuentes = new Set(), conMercado = new Set();
    Datos.obsTodas().forEach(o => { if (setIds.has(o.insumoId) && o.tipoPrecio !== 'referencia'){ obsMercado++; fuentes.add(o.fuenteId); conMercado.add(o.insumoId); } });
    const pares = ids.length * a.ciudades.length;
    const segundos = Math.max(1, Math.round(pares * 0.0006 + 0.5));
    const caidas = Datos.fuentes().filter(f => fuentes.has(f.id) && (f.salud === 'caída' || f.salud === 'degradada'));
    const sinMercado = ids.length - conMercado.size;
    z.innerHTML = '<div class="grid g4">' +
      stat('Insumos', ids.length) + stat('Ciudades', a.ciudades.length) + stat('Cálculos (insumo × ciudad)', pares) + stat('Observaciones de mercado', obsMercado) + '</div>' +
      '<div class="grid g4" style="margin-top:var(--gap)">' + stat('Fuentes con datos', fuentes.size) + stat('Solicitudes a internet', '0', 'Fase 1: sin conexión') +
        stat('Tiempo estimado', segundos < 60 ? segundos + ' s' : Math.round(segundos / 60) + ' min') + stat('Costo de IA', '$ 0', 'El Investigador IA llega en la Fase 2') + '</div>' +
      '<div class="card" style="margin-top:var(--gap)"><div class="card-head"><h3>Qué va a cambiar</h3></div><div class="card-body"><ul class="small" style="padding-left:18px;line-height:1.7;color:var(--steel)">' +
        '<li>Se recalcula el precio recomendado de <b>' + ids.length + '</b> insumo(s) en <b>' + a.ciudades.length + '</b> ciudad(es) con las observaciones válidas registradas.</li>' +
        '<li>Cada cálculo queda guardado con la fecha de hoy. Los cálculos anteriores y todas las observaciones se conservan: <b>nada se borra</b>.</li>' +
        '<li>Los insumos fuera del alcance <b>conservan sus precios y sus fechas</b>.</li>' +
        (sinMercado ? '<li>' + sinMercado + ' insumo(s) no tienen observaciones de mercado: quedarán con la referencia de ARKEN (rotulada) o sin dato.</li>' : '') +
        (caidas.length ? '<li class="warn-txt">Fuentes con problemas: ' + caidas.map(f => esc(f.nombre)).join(', ') + '.</li>' : '') +
        (Datos.lista('fuentes').some(f => f.esDemo) ? '<li class="warn-txt">Hay datos de demostración cargados: entran al cálculo rotulados DEMO.</li>' : '') +
      '</ul><p class="small muted">' + esc(descripcionAlcance(a, ids.length)) + '</p></div></div>' +
      '<div class="btn-row" style="justify-content:space-between;margin-top:var(--gap)"><button class="btn" id="a2Atras" type="button">Cambiar el alcance</button>' +
        '<button class="btn brass" id="a2Ejecutar" type="button"' + (ids.length ? '' : ' disabled') + '>Actualizar ' + ids.length + ' insumo(s)</button></div>';
    $('#a2Atras', z).onclick = () => { E.paso = 1; pintar($('#c02')); };
    $('#a2Ejecutar', z).onclick = () => ejecutar(ids);
  }
  function stat(lab, val, foot){ return '<div class="stat"><div class="lab">' + esc(lab) + '</div><div class="val">' + esc(String(val)) + '</div>' + (foot ? '<div class="foot">' + esc(foot) + '</div>' : '') + '</div>'; }

  async function ejecutar(ids){
    if (Motor.enCurso()){ UI.toast('Ya hay una actualización en curso', 'bad'); return; }
    const a = E.alcance;
    E.paso = 3; E.registro = []; E.tramos = []; E.avance = 0; E.resultado = null;
    pintar($('#c02'));
    const ganchos = {
      registro: t => { E.registro.push(t); const r = $('#a2Log'); if (r){ r.textContent = E.registro.join('\n'); r.scrollTop = r.scrollHeight; } },
      tramo: (k, total, t, estado, extra) => { E.tramos[k] = { nombre:t.grupo + ' · ' + t.categoria, n:t.insumos.length, estado, extra }; pintarTramos(); },
      avance: f => { E.avance = f; const b = $('#a2Bar'); if (b) b.style.width = Math.round(f * 100) + '%'; const t = $('#a2Pct'); if (t) t.textContent = Math.round(f * 100) + ' %'; }
    };
    try {
      E.resultado = await Motor.ejecutar({ tipo:a.tipo, descripcion:descripcionAlcance(a, ids.length), insumoIds:ids, ciudades:a.ciudades }, ganchos);
    } catch(e){
      RegistroTecnico.anotar('Actualizar precios', e);
      E.resultado = { estado:'con errores', errores:[{ fuente:'motor', mensaje:String(e.message || e) }], cambios:[], pares:0, cambiosDePrecio:0, sinDato:0, atipicas:0, categorias:[] };
    }
    E.paso = 4;
    if (Sesion.moduloActivo === '02' && $('#c02')) pintar($('#c02'));
    else UI.toast('La actualización terminó: ' + E.resultado.cambiosDePrecio + ' precio(s) cambiaron. Vea el resultado en el módulo 02.', 'ok');
  }
  function pintarTramos(){
    const l = $('#a2Tramos'); if (!l) return;
    l.innerHTML = E.tramos.filter(Boolean).slice(-80).map(t => '<div class="prog-fila"><span class="nm" title="' + esc(t.nombre) + '">' + esc(t.nombre) + '</span>' +
      '<div class="barra-doc"><i style="width:' + (t.estado === 'en curso' ? 50 : 100) + '%;' + (t.estado === 'error' ? 'background:var(--bad)' : '') + '"></i></div>' +
      '<span class="vl">' + (t.estado === 'terminado' ? (t.extra ? t.extra.cambios + ' cambio(s)' : 'listo') : esc(t.estado)) + '</span></div>').join('');
  }
  function paso3(z){
    z.innerHTML = '<div class="card"><div class="card-head"><h3>Actualizando</h3><span class="mono" id="a2Pct">' + Math.round((E.avance || 0) * 100) + ' %</span></div><div class="card-body">' +
      '<div class="barra-doc" style="height:10px"><i id="a2Bar" style="width:' + Math.round((E.avance || 0) * 100) + '%"></i></div>' +
      '<div class="btn-row" style="margin:12px 0"><button class="btn sm" id="a2Pausa" type="button">Pausar</button><button class="btn sm" id="a2Sigue" type="button">Reanudar</button>' +
        '<button class="btn sm danger" id="a2Cancela" type="button">Cancelar</button></div>' +
      '<div class="grid g2"><div><div class="eyebrow" style="margin-bottom:6px">Por categoría</div><div class="prog-lista" id="a2Tramos"></div></div>' +
      '<div><div class="eyebrow" style="margin-bottom:6px">Registro en vivo</div><div class="registro" id="a2Log">' + esc(E.registro.join('\n')) + '</div></div></div>' +
      '<p class="small muted" style="margin-top:10px">Puede moverse a otro módulo: la actualización sigue y avisa al terminar. Si cancela, lo ya calculado queda guardado y el resto conserva sus precios.</p></div></div>';
    pintarTramos();
    $('#a2Pausa', z).onclick = () => { Motor.pausar(); UI.toast('En pausa', ''); };
    $('#a2Sigue', z).onclick = () => { Motor.reanudar(); UI.toast('Continúa', ''); };
    $('#a2Cancela', z).onclick = async () => { if (await UI.confirmar({ titulo:'Cancelar la actualización', mensaje:'Lo ya calculado queda guardado; lo que falta conserva sus precios. ¿Cancelar?', textoAceptar:'Cancelar la actualización', claseAceptar:'danger', textoCancelar:'Seguir' })) Motor.cancelar(); };
  }
  function paso4(z){
    const r = E.resultado || {};
    const cambios = (r.cambios || []).slice().sort((x, y) => Math.abs(variacion(y)) - Math.abs(variacion(x)));
    z.innerHTML = '<div class="grid g4">' + stat('Estado', r.estado || '—') + stat('Cálculos', r.pares || 0) + stat('Precios que cambiaron', r.cambiosDePrecio || 0) + stat('Sin dato', r.sinDato || 0) + '</div>' +
      '<div class="grid g4" style="margin-top:var(--gap)">' + stat('Observaciones nuevas', r.observacionesNuevas || 0, 'Fase 1: solo lo registrado') + stat('Atípicas detectadas', r.atipicas || 0) +
        stat('Categorías', (r.categorias || []).length) + stat('Errores', (r.errores || []).length) + '</div>' +
      ((r.errores || []).length ? '<div class="alert bad" style="margin-top:var(--gap)"><div class="ic">!</div><div class="bd"><b>Errores</b>' + r.errores.map(e => esc((e.categoria ? e.categoria + ': ' : '') + e.mensaje)).join('<br>') + '</div></div>' : '') +
      '<div class="card" style="margin-top:var(--gap)"><div class="card-head"><h3>Precios que cambiaron (antes y después)</h3><span class="muted small">' + cambios.length + (cambios.length >= 3000 ? '+' : '') + '</span></div>' +
        (cambios.length ? '<div class="tw scroll" style="max-height:460px;overflow:auto"><table class="t" id="tA2Cambios"><thead><tr><th>Insumo</th><th>Ciudad</th><th class="n">Antes</th><th class="n">Después</th><th class="n">Variación</th><th>Confianza</th><th class="n">n</th></tr></thead><tbody>' +
          cambios.slice(0, 1000).map(x => '<tr><td><button class="btn xs ghost" data-f="' + esc(x.insumoId) + '" data-c="' + esc(x.ciudad) + '" type="button">' + esc(Piezas.nombreInsumo(x.insumoId)) + '</button></td><td>' + esc(Datos.nombreCiudad(x.ciudad)) + '</td>' +
            '<td class="n">' + (x.antes > 0 ? money3(x.antes) : '—') + '</td><td class="n">' + (x.despues > 0 ? money3(x.despues) : '—') + '</td><td class="n">' + UI.variacionHTML(variacion(x)) + '</td>' +
            '<td>' + UI.tagConfianza(x.confianza) + '</td><td class="n">' + (x.n || 0) + '</td></tr>').join('') + '</tbody></table></div>'
          : '<div class="card-body">' + UI.vacio('◌', 'Ningún precio cambió', 'Los insumos del alcance siguen con el mismo precio.') + '</div>') + '</div>' +
      '<div class="btn-row" style="justify-content:space-between;margin-top:var(--gap)"><button class="btn" id="a2Nueva" type="button">Nueva actualización</button>' +
        '<div class="btn-row"><button class="btn" id="a2Revisar" type="button">Revisar cambios en la base</button>' + (Permisos.puede('cortes') ? '<button class="btn primary" id="a2Corte" type="button">Crear corte</button>' : '') + '</div></div>';
    $$('[data-f]', z).forEach(b => b.onclick = () => Ficha.abrir(b.dataset.f, b.dataset.c, 'resumen'));
    $('#a2Nueva', z).onclick = () => { E = nuevo(); pintar($('#c02')); };
    $('#a2Revisar', z).onclick = () => { Sesion.filtros.base = Object.assign({}, Sesion.filtros.base || {}, { fuente:'', mostrar:'mercado', pagina:1 }); Sesion.tabs['01'] = 'precios'; App.ir('01'); };
    if ($('#a2Corte', z)) $('#a2Corte', z).onclick = () => CortesUI.crear();
    UI.conectarOrden('#tA2Cambios');
  }
  function variacion(x){ return x.antes > 0 && x.despues > 0 ? x.despues / x.antes - 1 : 0; }

  function historial(c){
    const lista = Datos.lista('ejecuciones').sort((a,b) => a.inicio < b.inicio ? 1 : -1);
    c.innerHTML = lista.length ? '<div class="card"><div class="tw"><table class="t" id="tEjec"><thead><tr><th>Inicio</th><th>Alcance</th><th>Usuario</th><th class="n">Cálculos</th><th class="n">Cambios</th><th class="n">Sin dato</th><th>Estado</th><th data-no-orden></th></tr></thead><tbody>' +
      lista.map(e => '<tr><td class="nowrap">' + esc(fmtSello(e.inicio)) + '</td><td class="small">' + esc(e.alcance ? e.alcance.descripcion : '') + '</td><td>' + esc(e.usuario || '') + '</td>' +
        '<td class="n">' + (e.pares || 0) + '</td><td class="n">' + (e.cambiosDePrecio || 0) + '</td><td class="n">' + (e.sinDato || 0) + '</td>' +
        '<td>' + (e.estado === 'terminada' ? '<span class="tag ok">terminada</span>' : '<span class="tag warn">' + esc(e.estado) + '</span>') + '</td>' +
        '<td class="act"><button class="btn xs" data-ej="' + esc(e.id) + '" type="button">Ver</button></td></tr>').join('') + '</tbody></table></div></div>'
      : '<div class="card"><div class="card-body">' + UI.vacio('◌', 'Sin ejecuciones todavía', 'Cada actualización queda registrada aquí con su alcance, sus cambios y sus errores.') + '</div></div>';
    $$('[data-ej]', c).forEach(b => b.onclick = () => { const e = Datos.uno('ejecuciones', b.dataset.ej); if (!e) return; E = nuevo(); E.paso = 4; E.resultado = e; Sesion.tabs['02'] = 'actualizar'; App.render(); });
    UI.conectarOrden('#tEjec');
  }
  return { pintar, historial, insumosDelAlcance };
})();


/* ══════════════════════════════════════════════════════════════════════════
   MÓDULO 03 — FUENTES
   Cada fuente con su tipo, alcance, método, confiabilidad, salud y revisión
   legal. Las automáticas quedan «suspendidas» hasta certificarse (Fase 3);
   en la Fase 1 los precios entran a mano, por cotización o por lista.
   ══════════════════════════════════════════════════════════════════════════ */
Vistas.m03 = function(st){
  const tab = Sesion.tabs['03'] || 'lista';
  const nProp = Datos.lista('propuestas').filter(p => p.tipo === 'fuente' && p.estado === 'pendiente').length;
  st.innerHTML = App.cabecera('03', 'Fuentes', 'De dónde sale cada precio, qué tan confiable es y si se puede leer de forma automática.',
      (Permisos.puede('fuentesManuales') ? '<button class="btn" id="f3Nueva" type="button">Nueva fuente</button>' : '') +
      (Sesion.usuario ? '<button class="btn" id="f3Proponer" type="button">Proponer una fuente</button>' : '')) +
    UI.tabs([{ k:'lista', n:'Fuentes' }, { k:'propuestas', n:'Fuentes propuestas' + (nProp ? ' (' + nProp + ')' : '') }], tab, k => { Sesion.tabs['03'] = k; App.render(); }) +
    '<div id="c03"></div>';
  if ($('#f3Nueva')) $('#f3Nueva').onclick = () => FuentesUI.editar(null);
  if ($('#f3Proponer')) $('#f3Proponer').onclick = () => FuentesUI.proponer();

};

const FuentesUI = (function(){
  const TIPOS = ['manual','cotización','tienda en línea','distribuidor','fabricante','entidad pública','datos abiertos','índice oficial','gremio','referencia','búsqueda IA','cálculo'];
  const METODOS = ['manual','html','api-json','pdf','excel','socrata','ia','cálculo'];
  const SALUD = { activa:'ok', suspendida:'warn', degradada:'warn', 'caída':'bad', inactiva:'' };
  const RESULTADOS = ['por certificar','aprobada','aprobada con restricciones','rechazada','no aplica'];

  function usos(){
    return Datos.memorizar('usoFuentes', ['obs'], () => {
      const m = new Map();
      Datos.obsTodas().forEach(o => {
        let u = m.get(o.fuenteId); if (!u){ u = { n:0, insumos:new Set(), ultima:'' }; m.set(o.fuenteId, u); }
        u.n++; u.insumos.add(o.insumoId); const f = Observaciones.fechaDe(o); if (f > u.ultima) u.ultima = f;
      });
      return m;
    });
  }
  function puedeEditar(f){ return Permisos.esAdmin() || (Permisos.puede('fuentesManuales') && (!f || f.metodo === 'manual')); }

  function lista(c){
    const F = Sesion.filtros.fuentes = Sesion.filtros.fuentes || { q:'', tipo:'', salud:'' };
    const u = usos();
    const todas = Datos.fuentes().filter(f => (!F.tipo || f.tipo === F.tipo) && (!F.salud || f.salud === F.salud) &&
      (!F.q || normaliza(f.nombre + ' ' + (f.notas || '') + ' ' + (f.urlBase || '')).indexOf(normaliza(F.q)) >= 0));
    c.innerHTML = '<div class="nota-tab">En la <b>Fase 1</b> ninguna fuente se lee de forma automática: las de internet quedan <b>suspendidas</b> hasta que su conector se certifique ' +
      '(revisión de robots.txt y términos, <span class="clave">Fase 3</span>). Los precios entran por cotizaciones, a mano o por listas, y cada uno queda con su fuente.</div>' +
      '<div class="card"><div class="toolbar"><input id="f3Q" type="search" placeholder="Buscar fuente…" value="' + esc(F.q) + '" style="max-width:260px">' +
        '<select id="f3Tipo">' + UI.selectOpts(TIPOS, F.tipo, 'Todos los tipos') + '</select>' +
        '<select id="f3Salud">' + UI.selectOpts(Object.keys(SALUD), F.salud, 'Toda salud') + '</select>' +
        '<span class="muted small" style="margin-left:auto">' + todas.length + ' fuente(s)</span></div>' +
      '<div class="tw"><table class="t" id="tFuentes"><thead><tr><th>Fuente</th><th>Tipo</th><th>Alcance</th><th>Método</th><th class="n">Confiabilidad</th><th>Salud</th>' +
        '<th>Revisión legal</th><th class="n">Observaciones</th><th class="n">Insumos</th><th>Última</th><th data-no-orden></th></tr></thead><tbody>' +
      todas.map(f => {
        const x = u.get(f.id) || { n:0, insumos:new Set(), ultima:'' };
        return '<tr><td><b>' + esc(f.nombre) + '</b>' + (f.esDemo ? ' ' + UI.tagDemo() : '') + (f.urlBase ? '<div class="small">' + Piezas.enlace(f.urlBase, f.urlBase.replace(/^https?:\/\//, '')) + '</div>' : '') + '</td>' +
          '<td>' + esc(f.tipo || '') + '</td><td>' + esc(f.alcance || '') + (f.ciudades && f.ciudades.length ? '<div class="small muted">' + esc(f.ciudades.map(Datos.nombreCiudad).slice(0, 3).join(', ')) + (f.ciudades.length > 3 ? '…' : '') + '</div>' : '') + '</td>' +
          '<td>' + esc(f.metodo || '') + '</td><td class="n" data-v="' + (f.confiabilidad || 0) + '">' + esc(cant(f.confiabilidad || 0)) + '</td>' +
          '<td><span class="tag ' + (SALUD[f.salud] || '') + '">' + esc(f.salud || '—') + '</span></td>' +
          '<td class="small">' + esc((f.revisionLegal || {}).resultado || '—') + '</td><td class="n">' + x.n + '</td><td class="n">' + x.insumos.size + '</td>' +
          '<td class="nowrap" data-v="' + esc(x.ultima) + '">' + (x.ultima ? esc(fmtFecha(x.ultima)) : '—') + '</td>' +
          '<td class="act"><button class="btn xs" data-ver="' + esc(f.id) + '" type="button">Ficha</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
    const re = () => { Sesion.filtros.fuentes = { q:$('#f3Q').value, tipo:$('#f3Tipo').value, salud:$('#f3Salud').value }; lista(c); };
    let t = null;
    $('#f3Q').oninput = () => { clearTimeout(t); t = setTimeout(() => { re(); const q = $('#f3Q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); };
    $('#f3Tipo').onchange = re; $('#f3Salud').onchange = re;
    $$('[data-ver]', c).forEach(b => b.onclick = () => ficha(b.dataset.ver));
    UI.conectarOrden('#tFuentes');
  }

  function ficha(id){
    const f = Datos.fuente(id); if (!f) return;
    const x = usos().get(f.id) || { n:0, insumos:new Set(), ultima:'' };
    const rl = f.revisionLegal || {};
    const automatica = ['html','api-json','pdf','excel','socrata'].indexOf(f.metodo) >= 0;
    const m = UI.modal({ titulo:f.nombre, eyebrow:'Ficha de la fuente', ancho:'wide',
      cuerpo:'<div class="kv">' +
        kv('Tipo', f.tipo) + kv('Método', f.metodo) + kv('Alcance', f.alcance + (f.ciudades && f.ciudades.length ? ' · ' + f.ciudades.map(Datos.nombreCiudad).join(', ') : '')) +
        kv('Dirección', f.urlBase ? Piezas.enlace(f.urlBase) : '—', true) + kv('Confiabilidad', cant(f.confiabilidad || 0) + ' (de 0 a 1: pesa en la mediana ponderada)') +
        kv('Salud', '<span class="tag ' + (SALUD[f.salud] || '') + '">' + esc(f.salud || '—') + '</span>', true) + kv('Límite de lectura', f.limitePorMinuto ? f.limitePorMinuto + ' solicitudes por minuto' : '—') +
        kv('Uso', x.n + ' observación(es) de ' + x.insumos.size + ' insumo(s)' + (x.ultima ? ' · la última del ' + fmtFecha(x.ultima) : '')) +
        kv('Notas', f.notas || '—') + '</div>' +
        '<div class="p-sec" style="margin-top:14px">Revisión legal</div><div class="kv">' +
        kv('Resultado', rl.resultado || 'por certificar') + kv('robots.txt', rl.robotsTxt || '—') + kv('Términos y condiciones', rl.terminos || '—') +
        kv('Fecha de la revisión', rl.fecha ? fmtFecha(rl.fecha) : '—') + kv('Responsable', rl.responsable || '—') + '</div>' +
        (automatica ? '<div class="alert info" style="margin-top:12px"><div class="ic">i</div><div class="bd">La lectura automática de esta fuente llega con los conectores certificados (Fase 3). ' +
          'Mientras tanto, sus precios se registran a mano con el enlace y el texto literal de la página.</div></div>' : ''),
      botones:[{ texto:'Cerrar' },
        { texto:'Probar ahora', deshabilitado:true, id:'f3Probar' },
        { texto:'Ver sus observaciones', accion: mm => { mm.cerrar(); verObservaciones(f); } }]
        .concat(puedeEditar(f) ? [{ texto:'Editar', clase:'primary', accion: mm => { mm.cerrar(); editar(f); } }] : [])
    });
    const p = $('#f3Probar', m.el); if (p) p.title = automatica ? 'Probar la lectura llega con los conectores (Fase 3).' : 'Esta fuente no se lee de forma automática.';
  }
  function kv(k, v, html){ return '<div class="k">' + esc(k) + '</div><div class="v">' + (html ? v : esc(v === undefined || v === null || v === '' ? '—' : v)) + '</div>'; }

  /** Observaciones de una fuente (las 300 más recientes) con acceso a la ficha del insumo. */
  async function verObservaciones(f){
    const obs = [];
    Datos.obsTodas().forEach(o => { if (o.fuenteId === f.id) obs.push(o); });
    obs.sort((a,b) => Observaciones.fechaDe(a) < Observaciones.fechaDe(b) ? 1 : -1);
    UI.modal({ titulo:'Observaciones de ' + f.nombre, eyebrow:obs.length + ' en total', ancho:'xwide',
      cuerpo:obs.length ? '<div class="tw" style="max-height:60vh;overflow:auto"><table class="t" id="tF3Obs"><thead><tr><th>Fecha</th><th>Insumo</th><th>Ciudad</th><th class="n">Precio con IVA</th><th>Estado</th><th>Enlace</th></tr></thead><tbody>' +

/** Lectura de textos de precio y presentación, común a los formularios. */
const Captura = (function(){
  /** «$ 32.900», «32900,5», «32.900,50» → número; NaN si no es un precio. */
  function precio(txt){
    if (typeof txt === 'number') return txt;
    const s = String(txt === undefined || txt === null ? '' : txt).replace(/[^\d.,]/g, '');
    if (!s) return NaN;
    const n = LectorPrecios.numero(s);
    return isFinite(n) ? n : NaN;
  }
  /** «bulto 50 kg», «caja x 1,44 m2», «galón» → presentación; null si no se entiende. */
  function presentacion(txt){
    const t = String(txt || '').trim();
    if (!t) return null;
    const m = /^(.*?)\s*(?:x|de|por)?\s*(\d+(?:[.,]\d+)?)\s*([a-zA-Z²³%.]+\d?)\s*$/.exec(t);
    if (m){
      const cantidad = LectorPrecios.numero(m[2]);
      const unidad = Unidades.normalizar(m[3]);
      if (cantidad > 0 && unidad) return { cantidad, unidad, nombre:normaliza(m[1]).replace(/\b(x|de|por)$/,'').trim() };
    }
    const u = Unidades.normalizar(t);
    if (u === 'GL') return { cantidad:1, unidad:'GL', nombre:'galón' };
    if (/cu[nñ]ete/i.test(t)) return { cantidad:5, unidad:'GL', nombre:'cuñete' };
    return null;
  }
  function textoPresentacion(p){ return p ? ((p.nombre ? p.nombre + ' ' : '') + cant(p.cantidad) + ' ' + p.unidad) : ''; }
  /** Vista previa del precio por unidad del insumo, sin guardar nada. */
  function vistaPrevia(d){
    if (!d.insumoId) return { ok:false, motivo:'Elija el insumo.' };
    if (!(d.precioPublicado > 0)) return { ok:false, motivo:'Escriba un precio mayor que cero.' };
    const p = Registro.preparar(d);
    if (!p.ok) return { ok:false, motivo:p.motivo };
    return { ok:true, obs:p.obs };
  }
  function vistaPreviaHTML(d){
    const r = vistaPrevia(d);
    if (!r.ok) return '<span class="muted">' + esc(r.motivo) + '</span>';
    const o = r.obs, ins = Datos.insumo(o.insumoId);
    return '<b>' + money3(o.precioConIva) + '</b> por ' + esc(ins.unidad) + ' con IVA · ' + money3(o.precioSinIva) + ' sin IVA (tarifa ' + o.tarifaIva + ' %)' +
      (o.factorConversion !== 1 ? ' · factor ' + esc(cant(o.factorConversion)) + ' (' + esc(o.metodoConversion) + ')' : '') +
      (o.advertencias && o.advertencias.length ? '<div class="small" style="color:var(--warn)">' + o.advertencias.map(esc).join(' ') + '</div>' : '');
  }
  function numero(clase){
    const pre = { cotizacion:'COT', lista:'LIS', solicitud:'SOL' }[clase] || 'DOC';
    const anio = hoyISO().slice(0, 4);
    const almacen = clase === 'solicitud' ? 'solicitudes' : 'cotizaciones';
    const usados = Datos.lista(almacen).map(x => String(x.numero || '')).filter(n => n.indexOf(pre + '-' + anio + '-') === 0).map(n => Number(n.split('-')[2]) || 0);
    return pre + '-' + anio + '-' + String((usados.length ? Math.max.apply(null, usados) : 0) + 1).padStart(4, '0');
  }
  /** Fuentes a las que un usuario puede atribuir un precio. */
  function fuentesElegibles(){
    return Datos.fuentes().filter(f => !f.esDemo && f.id !== 'ref-arken' && f.metodo !== 'ia' && f.id !== 'costo-empresa');
  }
  return { precio, presentacion, textoPresentacion, vistaPrevia, vistaPreviaHTML, numero, fuentesElegibles };
})();

      d.url = urlSegura(d.url) || '';
      d.evidencia = 'Registrado a mano por ' + (Sesion.usuario.nombre || Sesion.usuario.usuario);
      const actualizar = $('#pmAct', el).checked;
      let r;
      try { r = await Registro.registrar([d], { origen:'precio a mano' }); }
      catch(e){ RegistroTecnico.anotar('Registrar precio', e); UI.toast('No fue posible guardar: ' + (e.message || e), 'bad'); return; }

      mm.cerrar();
      if (r.fundidas.length) UI.toast('El mismo precio ya estaba registrado: se anotó que se volvió a ver', 'ok');

        if (Motor.enCurso()) UI.toast('Hay una actualización en curso: este precio entra a la base cuando actualice el insumo', '');

      if (alGuardar) alGuardar(r); else App.render();
    }
    return m;

  /** Guarda una cotización o una lista y crea una observación por renglón. */

  /* ── Importar Excel, CSV o PDF con revisión humana ── */
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  async function filasPDF(bytes){
    if (typeof pdfjsLib === 'undefined') throw new Error('No está disponible la librería de PDF (pdf.js). Conéctese a internet una vez y vuelva a intentarlo.');
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const doc = await pdfjsLib.getDocument({ data:new Uint8Array(bytes), isEvalSupported:false }).promise;
    const out = [];
    for (let p = 1; p <= doc.numPages; p++){
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({ x:it.transform[4], y:it.transform[5], w:it.width || 0, s:it.str }));
      const lineas = [];
      items.forEach(it => { const l = lineas.find(L => Math.abs(L.y - it.y) < 2.5); if (l) l.items.push(it); else lineas.push({ y:it.y, items:[it] }); });
      lineas.sort((a,b) => b.y - a.y).forEach(L => {
        L.items.sort((a,b) => a.x - b.x);
        const celdas = []; let actual = null, fin = -Infinity;
        L.items.forEach(it => {
          if (actual && it.x - fin < 12) actual.s += (it.x - fin > 1.5 ? ' ' : '') + it.s;
          else { actual = { s:it.s }; celdas.push(actual); }
          fin = it.x + it.w;
        });
        out.push(celdas.map(c => c.s.replace(/\s+/g, ' ').trim()));
      });
    }
    return out;
  }
  function texto(bytes){
    const u = new Uint8Array(bytes);
    let t = new TextDecoder('utf-8').decode(u);
    if (t.indexOf('�') >= 0){ try { t = new TextDecoder('windows-1252').decode(u); } catch(e){} }
    return t.replace(/^﻿/, '');
  }
  async function leerArchivo(f){
    const ext = (String(f.nombre).toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
    if (ext === 'pdf') return { tipo:'pdf', hojas:[{ nombre:'PDF', filas:await filasPDF(f.datos) }] };
    if (!Documentos.hayXLSX()) throw new Error('No está disponible la librería de Excel (SheetJS). Conéctese a internet una vez y vuelva a intentarlo.');
    const wb = (ext === 'csv' || ext === 'txt') ? XLSX.read(texto(f.datos), { type:'string', raw:true }) : XLSX.read(new Uint8Array(f.datos), { type:'array' });
    return { tipo:ext === 'txt' ? 'csv' : (ext || 'excel'), hojas:wb.SheetNames.map(n => ({ nombre:n, filas:XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:'' }) })) };
  }
  /** Encabezado y columnas: por nombre si hay encabezado; si no, por contenido. */
  function detectarColumnas(filas){
    const prueba = (re, c) => re.test(normaliza(c));
    const R = { desc:/descrip|producto|articulo|item|detalle|material|nombre|concepto/, precio:/precio|valor|vr\b|vlr|unitario|tarifa|costo/, unidad:/^(unidad|und|un|um|u\.m|medida)$|unidad/, codigo:/^(codigo|cod|ref|referencia|sku|item)$/ };
    for (let i = 0; i < Math.min(40, filas.length); i++){
      const f = filas[i] || [];
      const d = f.findIndex(c => prueba(R.desc, c)), p = f.findIndex(c => prueba(R.precio, c) && !/total|cantidad/.test(normaliza(c)));
      if (d >= 0 && p >= 0) return { encabezado:i, desc:d, precio:p, unidad:f.findIndex((c, k) => k !== d && k !== p && prueba(R.unidad, c)), codigo:f.findIndex((c, k) => k !== d && prueba(R.codigo, c)) };
    }
    const ancho = Math.max.apply(null, filas.slice(0, 200).map(f => (f || []).length).concat([0]));
    if (ancho <= 1) return { encabezado:-1, desc:0, precio:-1, unidad:-1, codigo:-1, lineaCompleta:true };
    let mejorP = -1, puntajeP = 0, mejorD = -1, largoD = 0;
    for (let c = 0; c < ancho; c++){
      let num = 0, txt = 0, largo = 0;
      filas.slice(0, 300).forEach(f => {
        const v = (f || [])[c];
        if (v === '' || v === undefined || v === null) return;
        if (typeof v === 'number' || Captura.precio(v) > 0 && /^[\s$\d.,]+$/.test(String(v))) num++;
        else { txt++; largo += String(v).length; }
      });
      if (num > puntajeP || (num === puntajeP && num > 0)){ puntajeP = num; mejorP = c; }
      const prom = txt ? largo / txt : 0;
      if (prom > largoD){ largoD = prom; mejorD = c; }
    }
    return { encabezado:-1, desc:mejorD, precio:mejorP, unidad:-1, codigo:-1 };
  }
  function candidatos(filas, col){
    const out = [];
    const desde = col.encabezado + 1;
    for (let i = desde; i < filas.length; i++){
      const f = filas[i] || [];
      let texto = '', precio = NaN, unidad = '', codigo = '', incluyeIva = null, presentacion = null;
      if (col.lineaCompleta || col.precio < 0){
        texto = f.filter(x => x !== '' && x !== null && x !== undefined).join(' ').trim();
        if (!texto) continue;
        const r = LectorPrecios.leer(texto);
        if (!r.ok) continue;
        precio = r.valor; incluyeIva = r.incluyeIva; presentacion = r.presentacion; unidad = r.unidad || '';
        if (r.textoPrecio) texto = texto.replace(r.textoPrecio, '').replace(/\s{2,}/g, ' ').trim() || texto;
      } else {
        texto = String(f[col.desc] === undefined ? '' : f[col.desc]).trim();
        const v = f[col.precio];
        precio = typeof v === 'number' ? v : Captura.precio(v);
        if (!texto || !(precio > 0)) continue;
        if (typeof v !== 'number'){ const r = LectorPrecios.leer(String(v)); if (r.incluyeIva !== null) incluyeIva = r.incluyeIva; }
        if (col.unidad >= 0) unidad = Unidades.normalizar(f[col.unidad]) || String(f[col.unidad] || '').trim();
        if (col.codigo >= 0) codigo = String(f[col.codigo] || '').trim();
        const r2 = LectorPrecios.leer(texto + ' $1');
        if (r2.presentacion) presentacion = r2.presentacion;
      }
      out.push({ fila:i + 1, texto:texto.slice(0, 300), precio:redondear3(precio), unidad, codigo, incluyeIva, presentacion, incluir:false, insumoId:null, puntaje:0, alternativas:[] });
    }
    return out;
  }
  async function emparejar(cands, alAvanzar){
    const activos = Datos.insumosActivos();
    const porCodigo = new Map();
    activos.forEach(i => { porCodigo.set(normaliza(i.codigo), i); if (i.codigoArken) porCodigo.set(normaliza(i.codigoArken), i); });
    for (let k = 0; k < cands.length; k++){
      const c = cands[k];
      const porCod = c.codigo ? porCodigo.get(normaliza(c.codigo)) : null;
      if (porCod){ c.insumoId = porCod.id; c.puntaje = 1; c.alternativas = [{ insumoId:porCod.id, puntaje:1 }]; c.porCodigo = true; }
      else {
        const r = Emparejamiento.emparejar(c.texto, activos, { unidad:c.unidad, limite:4 });
        c.alternativas = r.candidatos.map(x => ({ insumoId:x.insumo.id, puntaje:x.puntaje }));
        if (r.candidatos[0] && r.candidatos[0].puntaje >= 0.5){ c.insumoId = r.candidatos[0].insumo.id; c.puntaje = r.candidatos[0].puntaje; }
      }
      c.incluir = !!c.insumoId && c.puntaje >= 0.6;
      if (!c.unidad && c.insumoId) c.unidad = Datos.insumo(c.insumoId).unidad;
      if (k % 25 === 0){ alAvanzar((k + 1) / cands.length); await pausa(0); }
    }
    return cands;
  }

  function importar(clase){
    if (!Permisos.exigir('registrarPrecios', 'importar precios')) return;
    UI.pedirArchivo('.xlsx,.xls,.csv,.txt,.pdf', async f => {
      const pr = UI.progreso('Leyendo el archivo', f.nombre);
      try {
        const arch = await leerArchivo(f);
        const hojas = arch.hojas.filter(h => h.filas.length);
        if (!hojas.length) throw new Error('El archivo no tiene filas.');
        const hoja = hojas.slice().sort((a,b) => b.filas.length - a.filas.length)[0];
        const archivo = { nombre:f.nombre, peso:f.peso, tipo:arch.tipo, hash:Cripto.hex(Cripto.sha256Bytes(new Uint8Array(f.datos))) };
        pr.cerrar();
        revisar({ hojas, hoja, archivo, clase });

    }, 'binario');
  }

    function prev(tr, c){

        unidadPublicada:c.unidad, presentacion:c.presentacion, incluyeIva:c.incluyeIva !== null ? c.incluyeIva : (cab.iva === 'incluido' ? true : (cab.iva === 'no incluido' ? false : null)) }) : '';
    }
    function resumen(){
      const n = cands.filter(c => c.incluir).length, dudosos = cands.filter(c => c.incluir && c.puntaje < 0.85 && !c.porCodigo).length;
      $('#riResumen', el).innerHTML = cands.length + ' renglón(es) leídos · <b>' + n + '</b> marcados para guardar' + (dudosos ? ' · <span style="color:var(--warn)">' + dudosos + ' con similitud menor de 85 %: revíselos</span>' : '');
    }
    $('#riTodos', el).onchange = e => { cands.forEach(c => { c.incluir = e.target.checked && !!c.insumoId; }); pintarFilas(); };
    pintarCols();

    async function confirmar(mm){
      const cab = UI.leerForm(mm.el);
      const marcados = cands.filter(c => c.incluir);
      if (!marcados.length){ UI.toast('Marque al menos un renglón', 'bad'); return; }
      if (es){
        if (!cab.fecha){ UI.toast('Escriba la fecha de la lista: es la fecha de sus precios', 'bad'); return; }
        if (!cab.fuenteId && !String(cab.proveedor).trim()){ UI.toast('Elija la fuente o escriba el nombre del proveedor', 'bad'); return; }
      } else if (!String(cab.proveedor).trim()){ UI.toast('Escriba el proveedor', 'bad'); return; }
      if (!cab.fecha || cab.fecha > hoyISO()){ UI.toast('Revise la fecha', 'bad'); return; }
      for (const c of marcados){
        if (!c.insumoId || !(c.precio > 0)){ UI.toast('La fila ' + c.fila + ' no tiene insumo o precio', 'bad'); return; }
        const v = Captura.vistaPrevia({ insumoId:c.insumoId, ciudad:cab.ciudad || null, fechaCaptura:cab.fecha, precioPublicado:c.precio, unidadPublicada:c.unidad, presentacion:c.presentacion });
        if (!v.ok){ UI.toast('Fila ' + c.fila + ': ' + v.motivo, 'bad'); return; }
      }
      const repetido = Datos.lista('cotizaciones').find(x => x.archivo && x.archivo.hash === E.archivo.hash);
      if (repetido && !(await UI.confirmar({ titulo:'Archivo ya importado', mensaje:'Este mismo archivo ya se importó como ' + repetido.numero + ' el ' + fmtSello(repetido.creado) + '. ¿Importarlo otra vez?', textoAceptar:'Importar de todos modos' }))) return;
      mm.cerrar();
      const pr = UI.progreso('Registrando', marcados.length + ' precio(s)');
      try {
        const cab2 = Object.assign({}, cab, { proveedor:String(cab.proveedor || '').trim() || (Datos.fuente(cab.fuenteId) || {}).nombre, nit:String(cab.nit || '').trim(), ciudad:cab.ciudad || null });
        const { cot, res } = await guardar(cab2, marcados.map(c => ({ insumoId:c.insumoId, texto:c.texto, unidad:c.unidad, presentacion:c.presentacion, precio:redondear3(c.precio),
          incluyeIva:c.incluyeIva, fila:c.fila, cantidad:'' })), { clase:E.clase, origen:E.archivo.tipo, archivo:E.archivo });
        pr.cerrar();
        balance(cot, res);
      } catch(e){ pr.cerrar(); RegistroTecnico.anotar('Guardar importación', e); UI.aviso('No fue posible guardar', '<p>' + esc(e.message || e) + '</p>'); }
    }
  }
  function buscarInsumo(c, listo){
    const m = UI.modal({ titulo:'Elegir el insumo', eyebrow:'«' + String(c.texto).slice(0, 80) + '»',
      cuerpo:'<div class="field"><label for="biQ">Insumo del catálogo</label><input id="biQ" type="text" placeholder="Buscar por código, nombre o sinónimo…"></div>',
      botones:[{ texto:'Cancelar' }] });

      if (!c.alternativas.some(a => a.insumoId === ins.id)) c.alternativas.unshift({ insumoId:ins.id, puntaje:c.puntaje }); m.cerrar(); listo(); });
  }
  return { lista, ver, nueva, importar, guardar, leerArchivo, detectarColumnas, candidatos };
})();

  function leerProveedores(txt){

  async function editar(s){
