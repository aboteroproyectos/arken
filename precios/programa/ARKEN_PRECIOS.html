      '\n' + (s.notas || '') + (s.fechaLimite ? '\nFavor responder antes del ' + fmtFecha(s.fechaLimite) + '.' : '');
  }
  function enlaceCorreo(s, p){ return 'mailto:' + encodeURIComponent(p.correo) + '?subject=' + encodeURIComponent('Solicitud de cotización ' + s.numero) + '&body=' + encodeURIComponent(resumenTexto(s)); }
  function enlaceWhatsApp(s, p){
    let n = String(p.telefono || '').replace(/\D/g, '');
    if (n.length === 10 && n[0] === '3') n = '57' + n;
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(resumenTexto(s));
  }
  function documento(s){
    return { titulo:'Solicitud de cotización ' + s.numero, documento:'Solicitud de cotización', contexto:Datos.nombreCiudad(s.ciudad) + (s.lugar ? ' · ' + s.lugar : ''), orientacion:'p',
      nombre:nombreArchivoSeguro('Solicitud_de_cotizacion_' + s.numero),
      bloques:[
        { t:'kv', cols:2, pares:[['Número', s.numero], ['Fecha', fmtFecha(s.fecha)], ['Ciudad de entrega', Datos.nombreCiudad(s.ciudad)], ['Responder antes del', s.fechaLimite ? fmtFecha(s.fechaLimite) : '—'],
          ['Lugar de entrega', s.lugar || '—'], ['Forma de pago', s.formaPago || '—']] },
        { t:'texto', txt:s.notas || 'Indique el precio unitario, si incluye IVA, la unidad y la presentación, el valor del flete y la vigencia de la oferta.' },
        { t:'tabla', head:[['Código','Descripción','Especificación','Unidad','Cantidad','Precio unitario','Observaciones']],
          body:(s.renglones || []).map(r => { const i = Datos.insumo(r.insumoId) || {}; return [i.codigo || '', i.descripcion || '', i.especificacion || '', i.unidad || '', { content:r.cantidad ? cant(r.cantidad) : '', styles:{ halign:'right' } }, '', r.nota || '']; }),
          anchos:{ 0:{ cellWidth:16 }, 3:{ cellWidth:12 }, 4:{ cellWidth:16 }, 5:{ cellWidth:24 }, 6:{ cellWidth:30 } } },
        { t:'nota', txt:'Puede responder sobre este documento o en el Excel adjunto, sin cambiar la columna «Código». Gracias.' }
      ] };
  }
  function excelProveedor(s){
    if (!Documentos.hayXLSX()){ Documentos.avisoLibreria('SheetJS'); return; }
    const info = [['Solicitud de cotización ' + s.numero], [(Datos.config('empresa', {}) || {}).razonSocial || ''], ['Entrega en: ' + Datos.nombreCiudad(s.ciudad) + (s.lugar ? ' · ' + s.lugar : '')],
                  ['Responder antes del: ' + (s.fechaLimite ? fmtFecha(s.fechaLimite) : '—')], []];
    const enc = ['Código','Descripción','Unidad','Cantidad','Precio unitario','¿Incluye IVA? (Sí/No)','Presentación','Observaciones'];
    const filas = info.concat([enc]).concat((s.renglones || []).map(r => { const i = Datos.insumo(r.insumoId) || {}; return [i.codigo || '', i.descripcion || '', i.unidad || '', Number(r.cantidad) || '', '', '', '', r.nota || '']; }));
    Documentos.guardarLibro(Documentos.libro([{ nombre:'Cotización', filas, filaEncabezado:info.length, anchos:[11,56,8,10,16,16,18,30], formatos:{ 4:'#,##0.000' } },
      { nombre:'Instrucciones', filas:[['Escriba el precio unitario de cada insumo en la columna «Precio unitario».'], ['Diga si el precio incluye IVA (Sí o No) y la presentación (por ejemplo, bulto 50 kg).'],
        ['No cambie la columna «Código»: con ella se registra su respuesta.'], [s.notas || '']], anchos:[110] }]),
      nombreArchivoSeguro('Solicitud_de_cotizacion_' + s.numero) + '.xlsx');
  }
  /** Respuesta en el Excel de la solicitud: se empareja por código y se abre la cotización para revisar. */
  function importarRespuesta(s){
    UI.pedirArchivo('.xlsx,.xls,.csv', async f => {
      try {
        const arch = await CotizacionesUI.leerArchivo(f);
        const filas = arch.hojas[0].filas;
        const ie = filas.findIndex(r => (r || []).some(c => normaliza(c) === 'codigo') && (r || []).some(c => normaliza(c).indexOf('precio') >= 0));
        if (ie < 0) throw new Error('No se encontró la fila con «Código» y «Precio unitario».');
        const enc = filas[ie].map(c => normaliza(c));
        const C = { cod:enc.indexOf('codigo'), precio:enc.findIndex(c => c.indexOf('precio') >= 0), iva:enc.findIndex(c => c.indexOf('iva') >= 0), pres:enc.findIndex(c => c.indexOf('presentacion') >= 0),
                    cant:enc.findIndex(c => c.indexOf('cantidad') >= 0), obs:enc.findIndex(c => c.indexOf('observacion') >= 0), unidad:enc.indexOf('unidad') };
        const porCodigo = new Map(Datos.insumos().map(i => [normaliza(i.codigo), i]));
        const renglones = [];
        filas.slice(ie + 1).forEach(r => {
          const ins = porCodigo.get(normaliza((r || [])[C.cod])); if (!ins) return;
          const pr = typeof r[C.precio] === 'number' ? r[C.precio] : Captura.precio(r[C.precio]);
          if (!(pr > 0)) return;
          const iva = C.iva >= 0 ? normaliza(r[C.iva]) : '';
          renglones.push({ insumoId:ins.id, texto:ins.descripcion + (C.obs >= 0 && r[C.obs] ? ' · ' + r[C.obs] : ''), unidad:Unidades.normalizar(r[C.unidad]) || ins.unidad,
                           presentacionTxt:C.pres >= 0 ? String(r[C.pres] || '') : '', cantidad:C.cant >= 0 ? r[C.cant] : '', precio:moneyPlano(pr), incluyeIva:/^s/.test(iva) ? true : (/^n/.test(iva) ? false : null) });
        });
        if (!renglones.length) throw new Error('El archivo no trae precios en la columna «Precio unitario».');
        const ivas = Array.from(new Set(renglones.map(r => r.incluyeIva)));
        CotizacionesUI.nueva({ solicitudId:s.id, ciudad:s.ciudad, renglones, iva:ivas.length === 1 ? (ivas[0] === true ? 'incluido' : (ivas[0] === false ? 'no incluido' : '')) : 'incluido',
                               notas:'Respuesta importada del archivo «' + f.nombre + '».' });
        if (ivas.length > 1) UI.toast('El proveedor marcó el IVA distinto en algunos renglones: se respeta lo que dice cada renglón', '');
      } catch(e){ UI.aviso('No fue posible leer la respuesta', '<p>' + esc(e.message || e) + '</p>'); }
    }, 'binario');
  }
  return { lista, editar, abrir, documento, excelProveedor, importarRespuesta };
})();


/* ══════════════════════════════════════════════════════════════════════════
   MÓDULO 05 — MANO DE OBRA (§14)
   Dos precios lado a lado: el de mercado (lo que se paga por el oficio, con
   sus observaciones) y el costo empresa (salario + auxilio + prestaciones +
   seguridad social + parafiscales + dotación + EPP + FIC) con su desglose y
   la norma de cada línea. El salario de un oficio no se inventa: se registra.
   ══════════════════════════════════════════════════════════════════════════ */
Vistas.m05 = function(st){
  const tab = Sesion.tabs['05'] || 'oficios';
  st.innerHTML = App.cabecera('05', 'Mano de obra', 'El precio de mercado de cada oficio y su costo para la empresa, lado a lado, por hora, jornal, día y mes, con el desglose y la norma de cada concepto.') +
    UI.tabs([{ k:'oficios', n:'Oficios por ciudad' }, { k:'calculadora', n:'Calculadora de costo empresa' }, { k:'cuadrillas', n:'Cuadrillas' }, { k:'parametros', n:'Parámetros laborales' }],
      tab, k => { Sesion.tabs['05'] = k; App.render(); }) + '<div id="c05"></div>';
  const c = $('#c05');
  if (tab === 'calculadora') ManoObra.calculadora(c);
  else if (tab === 'cuadrillas') ManoObra.cuadrillas(c);
  else if (tab === 'parametros') ManoObra.parametrosVista(c);
  else ManoObra.oficios(c);
};

const ManoObra = (function(){
  const UNIDADES_MO = ['HC','JOR','DIA','MES'];
  const GRUPOS_PERSONAS = ['G31','G32','G33'];
  const NOMBRE_U = { HC:'hora', JOR:'jornal', DIA:'día', MES:'mes' };

  function oficios(){ return Datos.insumosActivos().filter(i => GRUPOS_PERSONAS.indexOf(i.grupo) >= 0 && UNIDADES_MO.indexOf(i.unidad) >= 0); }
  function parametros(fecha){ return Laboral.enFecha(Datos.parametros(), fecha || hoyISO()); }
  function empresa(){ return Object.assign({ claseRiesgo:'V', dotacionPorEntrega:0, eppMensual:0, fic:true }, Datos.config('laboral', {}) || {}); }
  /** Salario registrado más reciente, primero el de la ciudad y si no el nacional. */
  function salario(insumoId, ciudad, fecha){
    const f = fecha || hoyISO();
    return Datos.lista('salarios').filter(s => s.insumoId === insumoId && (s.ciudad === ciudad || !s.ciudad) && String(s.fecha) <= f)
      .sort((a,b) => ((a.ciudad === ciudad) - (b.ciudad === ciudad)) || (a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : (a.creado < b.creado ? -1 : 1)))).pop() || null;
  }
  /** Salario del cálculo: el registrado; el personal no calificado parte del SMMLV (piso legal) y se rotula. */
  function salarioBase(ins, ciudad, P, fecha){
    const s = salario(ins.id, ciudad, fecha);
    if (s) return { valor:Number(s.salarioMensual), origen:'registrado', registro:s };
    if (ins.grupo === 'G33' && Number(P.smmlv) > 0) return { valor:Number(P.smmlv), origen:'smmlv' };
    return null;
  }
  function costo(ins, ciudad, fecha){
    const P = parametros(fecha);
    const base = salarioBase(ins, ciudad, P, fecha);
    if (!base) return { sinSalario:true, P };
    const e = empresa(), reg = base.registro || {};
    const r = Laboral.costoEmpresa({ salario:base.valor, claseRiesgo:reg.claseRiesgo || e.claseRiesgo,
      dotacionPorEntrega:reg.dotacionPorEntrega !== undefined && reg.dotacionPorEntrega !== '' ? Number(reg.dotacionPorEntrega) : Number(e.dotacionPorEntrega) || 0,
      eppMensual:reg.eppMensual !== undefined && reg.eppMensual !== '' ? Number(reg.eppMensual) : Number(e.eppMensual) || 0, fic:e.fic !== false }, P);
    return Object.assign(r, { base, P, enUnidad:Laboral.enUnidad(r.costoHora, ins.unidad, P) });
  }
  /** Horas que hay en una unidad de mano de obra con los parámetros vigentes. */
  function horasDe(unidad, P){ return Laboral.enUnidad(1, unidad, P); }

  /* ── Oficios por ciudad ── */
  function vistaOficios(c){
    const ciudad = Piezas.ciudadActual();
    const P = parametros();
    const lista = oficios();
    const e = empresa();
    const sinDot = !(Number(e.dotacionPorEntrega) > 0) || !(Number(e.eppMensual) > 0);
    c.innerHTML = '<div class="toolbar" style="margin-bottom:var(--gap)"><div class="field" style="min-width:220px"><label for="m5Ciudad">Ciudad</label><select id="m5Ciudad">' + UI.selectOpts(Piezas.opcionesCiudad(), ciudad) + '</select></div>' +
        '<span class="small muted" style="margin-left:auto">SMMLV ' + money(P.smmlv) + ' · auxilio ' + money(P.auxilioTransporte) + ' · divisor ' + P.divisorMensual + ' h · ' + P.horasJornal + ' h por jornal</span></div>' +
      (sinDot ? '<div class="alert warn"><div class="ic">!</div><div class="bd">La dotación y los elementos de protección personal no tienen valor registrado: el costo empresa los toma en cero. Regístrelos en «Parámetros laborales».</div></div>' : '') +
      '<div class="nota-tab"><b>Mercado</b>: el precio de la base (observaciones de lo que se paga). <b>Costo empresa</b>: lo que le cuesta a la empresa un trabajador con el salario registrado. ' +
        'El salario de un oficio no se inventa: mientras no lo registre, aparece «sin salario». El personal no calificado parte del SMMLV, rotulado «piso legal».</div>' +
      '<div class="card"><div class="tw"><table class="t" id="tOficios"><thead><tr><th>Oficio</th><th>Unidad</th><th class="n">Mercado</th><th class="n">Salario mensual</th>' +
        '<th class="n">Costo empresa por hora</th><th class="n">Costo empresa en su unidad</th><th class="n">Diferencia</th><th data-no-orden></th></tr></thead><tbody>' +
      lista.map(ins => {
        const v = Precios.vigente(ins, ciudad), ad = Datos.adoptado(ins.id, ciudad);
        const k = costo(ins, ciudad);
        const merc = ad ? ad.precio : v.recomendado;
        const dif = !k.sinSalario && merc > 0 && k.enUnidad > 0 ? k.enUnidad / merc - 1 : null;
        return '<tr><td><span class="cod">' + esc(ins.codigo) + '</span> ' + esc(ins.descripcion) + '</td><td>' + esc(ins.unidad) + '</td>' +
          '<td class="n">' + Piezas.precioHTML(merc, Piezas.rotulosPrecio(v, ad), 'data-fi="' + esc(ins.id) + '"') + '</td>' +
          '<td class="n">' + (k.sinSalario ? '<span class="muted small">sin salario</span>' : money(k.base.valor) + '<div class="small muted">' + (k.base.origen === 'smmlv' ? 'piso legal (SMMLV)' : 'registrado ' + esc(fmtFecha(k.base.registro.fecha))) + '</div>') + '</td>' +
          '<td class="n">' + (k.sinSalario ? '—' : money3(k.costoHora)) + '</td><td class="n">' + (k.sinSalario ? '—' : '<b>' + money3(k.enUnidad) + '</b> <span class="muted small">/' + esc(ins.unidad) + '</span>') + '</td>' +
          '<td class="n">' + UI.variacionHTML(dif) + '</td>' +
          '<td class="act"><div class="btn-row">' + (Permisos.puede('registrarPrecios') ? '<button class="btn xs" data-sal="' + esc(ins.id) + '" type="button">Salario</button>' : '') +
            (!k.sinSalario ? '<button class="btn xs" data-des="' + esc(ins.id) + '" type="button">Desglose</button>' : '') +
            (!k.sinSalario && Permisos.puede('adoptar') ? '<button class="btn xs" data-adop="' + esc(ins.id) + '" type="button">Adoptar</button>' : '') + '</div></td></tr>';
      }).join('') + '</tbody></table></div></div>';
    $('#m5Ciudad', c).onchange = e => { Sesion.ciudad = e.target.value; vistaOficios(c); };
    $$('[data-fi]', c).forEach(b => b.onclick = () => Ficha.abrir(b.dataset.fi, ciudad, 'resumen'));
    $$('[data-sal]', c).forEach(b => b.onclick = () => registrarSalario(Datos.insumo(b.dataset.sal), ciudad, () => vistaOficios(c)));
    $$('[data-des]', c).forEach(b => b.onclick = () => desglose(Datos.insumo(b.dataset.des), ciudad));
    $$('[data-adop]', c).forEach(b => b.onclick = () => adoptar(Datos.insumo(b.dataset.adop), ciudad, () => vistaOficios(c)));
    UI.conectarOrden('#tOficios');
  }

  async function registrarSalario(ins, ciudad, listo){
    if (!Permisos.exigir('registrarPrecios', 'registrar salarios')) return;
    const previo = salario(ins.id, ciudad);
    const e = empresa();
    const d = await UI.pedir({ titulo:'Salario de ' + ins.descripcion, eyebrow:Datos.nombreCiudad(ciudad), cols:2,
      intro:'<p class="small muted">El salario mensual que la empresa paga por este oficio, con su soporte. Con él se calcula el costo empresa; el precio de mercado no cambia.</p>',
      campos:[
        { k:'salarioMensual', lab:'Salario mensual', tipo:'money', req:true, val:previo ? previo.salarioMensual : '' },
        { k:'fecha', lab:'Vigente desde', tipo:'date', req:true, val:hoyISO() },
        { k:'ambito', lab:'Aplica en', tipo:'select', opts:[{ v:'ciudad', n:Datos.nombreCiudad(ciudad) }, { v:'nacional', n:'Todas las ciudades' }], val:'ciudad' },
        { k:'claseRiesgo', lab:'Clase de riesgo ARL', tipo:'select', opts:['I','II','III','IV','V'], val:previo && previo.claseRiesgo ? previo.claseRiesgo : e.claseRiesgo },
        { k:'dotacionPorEntrega', lab:'Dotación por entrega (vacío: el valor de la empresa)', tipo:'money', val:previo ? previo.dotacionPorEntrega : '' },
        { k:'eppMensual', lab:'EPP por mes (vacío: el valor de la empresa)', tipo:'money', val:previo ? previo.eppMensual : '' },
        { k:'soporte', lab:'Soporte (nómina, contrato, convocatoria…)', tipo:'textarea', req:true, col:2, filas:2 }
      ], validar:x => !(x.salarioMensual > 0) ? 'El salario debe ser mayor que cero' : (x.fecha > hoyISO() ? 'La fecha no puede ser futura' : '') });
    if (!d) return;
    const vacio = x => x === '' || x === 0 || x === null || x === undefined;
    const reg = { id:uid('sal'), insumoId:ins.id, ciudad:d.ambito === 'ciudad' ? ciudad : '', salarioMensual:redondear3(d.salarioMensual), fecha:d.fecha, claseRiesgo:d.claseRiesgo,
      dotacionPorEntrega:vacio(d.dotacionPorEntrega) ? '' : d.dotacionPorEntrega, eppMensual:vacio(d.eppMensual) ? '' : d.eppMensual, soporte:d.soporte, usuario:Sesion.usuario.usuario, creado:ahoraISO() };
    await Datos.guardar('salarios', reg);
    await Auditoria.registrar('registrar salario', ins.codigo + ' · ' + (reg.ciudad ? Datos.nombreCiudad(reg.ciudad) : 'todas las ciudades') + ' · ' + money(reg.salarioMensual));
    UI.toast('Salario registrado', 'ok');
    if (listo) listo();
  }

  function tablaDesglose(k){
    return '<div class="tw"><table class="t"><thead><tr><th>Concepto</th><th class="n">Base</th><th class="n">Tasa</th><th class="n">Valor mensual</th><th>Norma</th><th>Nota</th></tr></thead><tbody>' +
      k.lineas.map(l => '<tr><td>' + esc(l.concepto) + '</td><td class="n">' + (l.base !== null ? money(l.base) : '—') + '</td><td class="n">' + (l.tasa !== null && l.tasa !== undefined ? esc(cant(l.tasa)) + ' %' : '—') + '</td>' +
        '<td class="n">' + money3(l.valor) + '</td><td class="small">' + esc(l.norma || '') + '</td><td class="small muted">' + esc(l.nota || '') + '</td></tr>').join('') +
      '</tbody><tfoot><tr><td colspan="3"><b>Costo mensual para la empresa</b></td><td class="n"><b>' + money3(k.totalMensual) + '</b></td><td colspan="2" class="small">Factor prestacional ' + (k.factorPrestacional ? esc(cant(k.factorPrestacional)) : '—') + '</td></tr></tfoot></table></div>' +
      '<div class="grid g4" style="margin-top:var(--gap)">' +
        stat('Por hora', money3(k.costoHora), 'mensual ÷ ' + k.divisor + ' h') + stat('Por jornal', money3(k.jornal), 'hora × ' + cant(k.horasJornal) + ' h') +
        stat('Por día calendario', money3(k.dia), 'mensual ÷ 30') + stat('Por mes', money3(k.totalMensual), 'costo empresa') + '</div>';
  }
  function stat(lab, val, foot){ return '<div class="stat"><div class="lab">' + esc(lab) + '</div><div class="val">' + esc(val) + '</div>' + (foot ? '<div class="foot">' + esc(foot) + '</div>' : '') + '</div>'; }
  function desglose(ins, ciudad){
    const k = costo(ins, ciudad);
    if (k.sinSalario){ UI.toast('Registre primero el salario de este oficio', 'bad'); return; }
    const v = Precios.vigente(ins, ciudad);
    UI.modal({ titulo:'Costo empresa · ' + ins.descripcion, eyebrow:Datos.nombreCiudad(ciudad) + ' · parámetros vigentes al ' + fmtFecha(hoyISO()), ancho:'xwide',
      cuerpo:'<div class="grid g2" style="margin-bottom:var(--gap)">' +
        '<div class="stat"><div class="lab">Precio de mercado por ' + esc(ins.unidad) + '</div><div class="val">' + (v.recomendado > 0 ? money3(v.recomendado) : '—') + '</div><div class="foot">' + Piezas.rotulosPrecio(v) + ' · n = ' + (v.n || 0) + '</div></div>' +
        '<div class="stat accent"><div class="lab">Costo empresa por ' + esc(ins.unidad) + '</div><div class="val">' + money3(k.enUnidad) + '</div><div class="foot">salario ' + money(k.base.valor) + (k.base.origen === 'smmlv' ? ' (piso legal)' : '') + '</div></div></div>' +
        tablaDesglose(k) + '<p class="small muted" style="margin-top:10px">Costo por hora = costo mensual ÷ divisor (' + k.divisor + ' h desde el 15 de julio de 2026, Ley 2101 de 2021); jornal = hora × horas por jornal; día calendario = mensual ÷ 30.</p>',
      botones:[{ texto:'Cerrar' }, { texto:'Imprimir', accion: () => Documentos.emitir(documentoDesglose(ins, ciudad, k, v), 'imprimir') }, { texto:'PDF', clase:'primary', accion: () => Documentos.emitir(documentoDesglose(ins, ciudad, k, v), 'pdf') }] });
  }
  function documentoDesglose(ins, ciudad, k, v){
    return { titulo:'Costo empresa · ' + ins.descripcion, documento:'Costo empresa de mano de obra', contexto:Datos.nombreCiudad(ciudad), orientacion:'p',
      nombre:nombreArchivoSeguro('ARKEN_PRECIOS_costo_empresa_' + ins.codigo + '_' + Datos.nombreCiudad(ciudad)),
      bloques:[
        { t:'kv', cols:2, pares:[['Oficio', ins.codigo + ' · ' + ins.descripcion], ['Ciudad', Datos.nombreCiudad(ciudad)], ['Salario mensual', money(k.base.valor) + (k.base.origen === 'smmlv' ? ' (SMMLV)' : '')],
          ['Parámetros', 'vigentes al ' + fmtFecha(hoyISO())], ['Precio de mercado', v && v.recomendado > 0 ? money3(v.recomendado) + ' por ' + ins.unidad : 'sin dato'], ['Costo empresa', money3(k.enUnidad) + ' por ' + ins.unidad]] },
        { t:'tabla', head:[['Concepto','Base','Tasa (%)','Valor mensual','Norma']],
          body:k.lineas.map(l => [l.concepto, { content:l.base !== null ? money(l.base) : '—', styles:{ halign:'right' } }, { content:l.tasa !== null && l.tasa !== undefined ? cant(l.tasa) : '—', styles:{ halign:'right' } },
            { content:money3(l.valor), styles:{ halign:'right' } }, l.norma || '']),
          foot:[['Costo mensual para la empresa', '', '', { content:money3(k.totalMensual), styles:{ halign:'right' } }, '']] },
        { t:'kv', cols:2, pares:[['Por hora', money3(k.costoHora)], ['Por jornal', money3(k.jornal)], ['Por día calendario', money3(k.dia)], ['Factor prestacional', k.factorPrestacional ? cant(k.factorPrestacional) : '—']] },
        { t:'nota', txt:'Costo por hora = costo mensual ÷ ' + k.divisor + ' horas; jornal = hora × ' + cant(k.horasJornal) + ' horas; día calendario = mensual ÷ 30. Los porcentajes son parámetros con vigencia; verifíquelos con el contador de la empresa.' }
      ] };
  }
  async function adoptar(ins, ciudad, listo){
    if (!Permisos.exigir('adoptar', 'adoptar precios')) return;
    const k = costo(ins, ciudad);
    if (k.sinSalario) return;
    const v = Precios.vigente(ins, ciudad);

  /* ── Cuadrillas ── */

      const v = Precios.vigente(ins, ciudad), ad = Datos.adoptado(ins.id, ciudad), p = ad ? ad.precio : v.recomendado;
      const h = horasDe(ins.unidad, P);
      return p > 0 && h > 0 ? { valor:redondear3(p / h), origen:base === 'empresa' ? 'mercado (sin salario)' : 'mercado' } : { valor:0, origen:'sin dato' };
    };

          '<div class="tw"><table class="t"><thead><tr><th>Oficio</th><th class="n">Cantidad</th><th class="n">Valor hora</th><th>Origen</th><th class="n">Subtotal hora</th></tr></thead><tbody>' +
          r.partes.map((p, i) => '<tr><td>' + esc(p.oficio) + (partes[i].insumoId ? '' : ' <span class="tag warn">sin oficio en el catálogo</span>') + '</td><td class="n">' + esc(cant(p.cantidad)) + '</td><td class="n">' + (p.costoHora > 0 ? money3(p.costoHora) : '—') + '</td>' +
            '<td class="small">' + esc(partes[i].origen) + '</td><td class="n">' + (p.subtotal > 0 ? money3(p.subtotal) : '—') + '</td></tr>').join('') + '</tbody></table></div>' +
          '<div class="card-body"><div class="grid g4">' + UNIDADES_MO.map(u => stat('Por ' + NOMBRE_U[u] + ' (' + u + ')', r.completa ? money3(Laboral.enUnidad(r.costoHora, u, P)) : '—', u === 'HC' ? 'suma de los oficios' : cant(horasDe(u, P)) + ' h')).join('') + '</div>' +
          (!r.completa ? '<p class="small" style="color:var(--warn);margin-top:8px">Falta el valor de algún oficio: regístrelo para completar la cuadrilla.</p>' : '') + '</div></div>';
      }).join('') : '<div class="card"><div class="card-body">' + UI.vacio('◌', 'Sin cuadrillas', 'Las cuadrillas de la semilla se crean al instalar el programa.') + '</div></div>');
    $('#m5qCiu', c).onchange = e => { Sesion.ciudad = e.target.value; cuadrillas(c); };
    $('#m5qBase', c).onchange = e => { Sesion.filtros.cuadBase = e.target.value; cuadrillas(c); };
  }

  /* ── Parámetros laborales (lectura y valores de la empresa) ── */
  function parametrosVista(c){
    const P = parametros(), N = P._normas || {};
    const e = empresa();
    const claves = Object.keys(P).filter(k => k !== '_normas').sort();
    c.innerHTML = '<div class="grid g2"><div class="card"><div class="card-head"><h3>Vigentes hoy (' + esc(fmtFecha(hoyISO())) + ')</h3>' +
        (Permisos.esAdmin() ? '<button class="btn sm" id="m5pEditar" type="button">Editar por vigencia</button>' : '') + '</div>' +
      '<div class="tw"><table class="t"><thead><tr><th>Parámetro</th><th class="n">Valor</th><th>Norma</th></tr></thead><tbody>' +
        claves.map(k => '<tr><td class="mono small">' + esc(k) + '</td><td class="n">' + esc(typeof P[k] === 'boolean' ? (P[k] ? 'Sí' : 'No') : (typeof P[k] === 'number' && P[k] > 1000 ? money(P[k]) : String(P[k]))) + '</td><td class="small">' + esc(N[k] || '') + '</td></tr>').join('') +
      '</tbody></table></div></div>' +
      '<div class="card"><div class="card-head"><h3>Valores de la empresa</h3></div><div class="card-body">' +
        '<p class="small muted">Se usan cuando el salario de un oficio no trae los suyos.</p>' + UI.formHTML([
          { k:'claseRiesgo', lab:'Clase de riesgo ARL por defecto', tipo:'select', opts:Object.keys(Laboral.ARL), val:e.claseRiesgo, dis:!Permisos.esAdmin() },
          { k:'dotacionPorEntrega', lab:'Dotación por entrega', tipo:'money', val:e.dotacionPorEntrega, dis:!Permisos.esAdmin() },
          { k:'eppMensual', lab:'Elementos de protección por mes', tipo:'money', val:e.eppMensual, dis:!Permisos.esAdmin() },
          { k:'fic', lab:'Liquidar FIC (1 SMMLV por cada 40 trabajadores)', tipo:'check', val:e.fic !== false, dis:!Permisos.esAdmin() }
        ], 2) + (Permisos.esAdmin() ? '<div class="btn-row" style="margin-top:12px"><button class="btn primary" id="m5pGuardar" type="button">Guardar</button></div>' : '') +
        '<div class="alert info" style="margin-top:12px"><div class="ic">i</div><div class="bd">Los porcentajes y valores son parámetros con vigencia y norma. Verifíquelos con el contador de la empresa antes de usarlos en una propuesta.</div></div>' +
      '</div></div></div>';
    if ($('#m5pEditar', c)) $('#m5pEditar', c).onclick = () => { Sesion.tabs['10'] = 'laborales'; App.ir('10'); };
    if ($('#m5pGuardar', c)) $('#m5pGuardar', c).onclick = async () => {
      const d = UI.leerForm(c);
      await Datos.fijarConfig('laboral', { claseRiesgo:d.claseRiesgo, dotacionPorEntrega:Number(d.dotacionPorEntrega) || 0, eppMensual:Number(d.eppMensual) || 0, fic:!!d.fic });
      await Auditoria.registrar('valores laborales de la empresa', 'ARL ' + d.claseRiesgo + ' · dotación ' + money(d.dotacionPorEntrega || 0) + ' · EPP ' + money(d.eppMensual || 0));
      UI.toast('Guardado', 'ok');
    };
  }
  return { oficios:vistaOficios, calculadora, cuadrillas, parametrosVista, costo, salario, parametros, listaOficios:oficios };
})();


/* ══════════════════════════════════════════════════════════════════════════
   MÓDULO 06 — COMPARADOR
   Un mismo insumo entre ciudades, entre dos cortes y entre fuentes. Cada
   comparación sale en Excel y en PDF. (La versión completa, con índices y
   pesos, llega en la Fase 4.)
   ══════════════════════════════════════════════════════════════════════════ */
Vistas.m06 = function(st){
  const tab = Sesion.tabs['06'] || 'ciudades';
  st.innerHTML = App.cabecera('06', 'Comparador', 'Un insumo entre ciudades, entre dos cortes o entre fuentes, con su diferencia y su soporte.') +
    UI.tabs([{ k:'ciudades', n:'Entre ciudades' }, { k:'cortes', n:'Entre cortes' }, { k:'fuentes', n:'Entre fuentes' }], tab, k => { Sesion.tabs['06'] = k; App.render(); }) +
    '<div id="c06"></div>';
  const c = $('#c06');
  if (tab === 'cortes') Comparador.cortes(c);
  else if (tab === 'fuentes') Comparador.fuentes(c);
  else Comparador.ciudades(c);
};

const Comparador = (function(){
  /* ── Entre ciudades ── */
  function ciudades(c){
    const F = Sesion.filtros.cmpCiu = Sesion.filtros.cmpCiu || { ciudades:Informes.ciudadesPorDefecto().slice(0, 6), grupo:'', q:'', precio:'adoptado', soloConDato:true };
    if (F.ciudades.length < 2){
      const extra = Datos.ciudadesActivas().map(x => x.codigoDivipola).filter(x => F.ciudades.indexOf(x) < 0).slice(0, 2 - F.ciudades.length);
      F.ciudades = F.ciudades.concat(extra);
    }
    c.innerHTML = '<div class="card"><div class="toolbar">' +
        '<div class="field"><label>Ciudades (la primera es la base)</label>' + UI.multi('cpCiu', Piezas.opcionesCiudad(), F.ciudades, 'Elija ciudades') + '</div>' +
        '<div class="field"><label for="cpGrupo">Grupo</label><select id="cpGrupo">' + UI.selectOpts(Piezas.opcionesGrupo(), F.grupo, 'Todos') + '</select></div>' +
        '<div class="field"><label for="cpPrecio">Precio</label><select id="cpPrecio">' + UI.selectOpts(Object.keys(Informes.NOMBRE_PRECIO).map(k => ({ v:k, n:Informes.NOMBRE_PRECIO[k] })), F.precio) + '</select></div>' +
        '<div class="field"><label for="cpQ">Buscar</label><input id="cpQ" type="search" value="' + esc(F.q) + '" placeholder="Insumo…"></div>' +
        '<label class="checkline"><input type="checkbox" id="cpSolo"' + (F.soloConDato ? ' checked' : '') + '> Solo insumos con mercado en dos o más ciudades</label>' +
        '<div class="btn-row" style="margin-left:auto"><button class="btn sm" id="cpXls" type="button">Excel</button><button class="btn sm" id="cpPdf" type="button">PDF</button></div></div>' +
      '<div id="cpRes"></div></div>';
    let datos = null;
    const pintar = () => { datos = resultadoCiudades(F); $('#cpRes', c).innerHTML = datos.html; conectar(); };
    const conectar = () => {
      $$('[data-fi]', c).forEach(b => b.onclick = () => Ficha.abrir(b.dataset.fi, b.dataset.ci, 'obs'));
      UI.conectarOrden('#tCmpCiu');
    };
    let tm = null;
    $('#cpCiu', c).addEventListener('cambio', e => { clearTimeout(tm); tm = setTimeout(() => { F.ciudades = e.detail || UI.valorMulti('cpCiu'); pintar(); }, 450); });
    $('#cpGrupo', c).onchange = e => { F.grupo = e.target.value; pintar(); };
    $('#cpPrecio', c).onchange = e => { F.precio = e.target.value; pintar(); };
    $('#cpSolo', c).onchange = e => { F.soloConDato = e.target.checked; pintar(); };
    let tq = null; $('#cpQ', c).oninput = e => { clearTimeout(tq); tq = setTimeout(() => { F.q = e.target.value; pintar(); }, 300); };
    $('#cpXls', c).onclick = () => {
      if (!datos || !datos.filas.length){ UI.toast('No hay filas para exportar.', 'bad'); return; }
      excel('Comparación entre ciudades', datos.enc, datos.cuerpo, 'ciudades', F.ciudades.reduce((o, ci, i) => { const col = 3 + (i ? 2 * i - 1 : 0); o[col] = '#,##0.000'; if (i) o[col + 1] = '0.0%'; return o; }, {}));
    };
    $('#cpPdf', c).onclick = () => {
      if (!datos || !datos.filas.length){ UI.toast('No hay filas para el PDF.', 'bad'); return; }
      const ref = F.ciudades[0];
      Documentos.previsualizar({ titulo:'Comparación entre ciudades', documento:'Comparador', orientacion:'l', contexto:F.ciudades.map(Datos.nombreCiudad).join(' · '),
        nombre:nombreArchivoSeguro('ARKEN_PRECIOS_comparacion_ciudades_' + hoyISO()),
        bloques:[{ t:'kv', cols:3, pares:[['Ciudad base', Datos.nombreCiudad(ref)], ['Precio', Informes.NOMBRE_PRECIO[F.precio]], ['Insumos', String(datos.filas.length)]]
            .concat(datos.resumen.map(r => [Datos.nombreCiudad(r.ciudad) + ' frente a ' + Datos.nombreCiudad(ref), r.relativo ? pctVar(r.relativo - 1) + ' (' + r.n + ' insumos)' : '—'])) },
          { t:'tabla', tam:6.4, head:[datos.enc], body:datos.cuerpo.map(r => r.map((x, i) => i < 3 ? String(x) : { content:x === '' ? '—' : (datos.enc[i].indexOf('vs ') === 0 ? pctVar(x) : money3(x)), styles:{ halign:'right' } })) },
          { t:'nota', txt:'Las variaciones son frente a la primera ciudad. El resumen usa la media geométrica de las razones de precio de los insumos con dato en las dos ciudades.' }] });
    };
    pintar();
  }
  function resultadoCiudades(F){
    const ref = F.ciudades[0];
    const q = normaliza(F.q);
    const filas = [];
    Datos.insumosActivos().forEach(ins => {
      if (F.grupo && ins.grupo !== F.grupo) return;
      if (q && normaliza(ins.codigo + ' ' + ins.descripcion).indexOf(q) < 0) return;
      const precios = F.ciudades.map(ci => { const v = Precios.vigente(ins, ci), ad = Datos.adoptado(ins.id, ci); const e = Informes.elegirPrecio(v, ad, F.precio); return { valor:e.valor, origen:e.origen, v, ad }; });
      const conMercado = precios.filter(p => p.v && p.v.n > 0 && p.valor > 0).length;
      if (F.soloConDato && conMercado < 2) return;
      filas.push({ ins, precios });
    });
    const resumen = F.ciudades.slice(1).map((ci, k) => {
      const rel = filas.map(f => (f.precios[0].valor > 0 && f.precios[k + 1].valor > 0) ? f.precios[k + 1].valor / f.precios[0].valor : null).filter(x => x > 0);
      return { ciudad:ci, n:rel.length, relativo:rel.length ? Estadistica.mediaGeometrica(rel) : null };
    });
    const enc = ['Código','Descripción','Unidad'].concat(F.ciudades.reduce((a, ci, i) => a.concat([Datos.nombreCiudad(ci)]).concat(i ? ['vs ' + Datos.nombreCiudad(ref)] : []), []));
    const cuerpo = filas.map(f => [f.ins.codigo, f.ins.descripcion, f.ins.unidad].concat(f.precios.reduce((a, p, i) => a.concat([p.valor > 0 ? p.valor : ''])
      .concat(i ? [p.valor > 0 && f.precios[0].valor > 0 ? redondearDec(p.valor / f.precios[0].valor - 1, 4) : ''] : []), [])));
    if (F.ciudades.length < 2) return { filas:[], resumen:[], enc, cuerpo:[], html:'<div class="card-body">' + UI.vacio('◌', 'Elija dos ciudades o más', 'La primera ciudad elegida es la base de la comparación.') + '</div>' };
    const html = '<div class="card-body"><div class="grid g4">' + resumen.map(r => '<div class="stat"><div class="lab">' + esc(Datos.nombreCiudad(r.ciudad)) + ' frente a ' + esc(Datos.nombreCiudad(ref)) + '</div><div class="val">' +
          (r.relativo ? UI.variacionHTML(r.relativo - 1) : '—') + '</div><div class="foot">' + r.n + ' insumos comparables (media geométrica)</div></div>').join('') + '</div></div>' +
      (filas.length ? '<div class="tw" style="max-height:62vh;overflow:auto"><table class="t" id="tCmpCiu"><thead><tr><th>Insumo</th><th>Unidad</th>' +
          F.ciudades.map((ci, i) => '<th class="n">' + esc(Datos.nombreCiudad(ci)) + '</th>' + (i ? '<th class="n">vs ' + esc(Datos.nombreCiudad(ref)) + '</th>' : '')).join('') + '</tr></thead><tbody>' +
        filas.slice(0, 600).map(f => '<tr><td><span class="cod">' + esc(f.ins.codigo) + '</span> ' + esc(f.ins.descripcion) + '</td><td>' + esc(f.ins.unidad) + '</td>' +
          f.precios.map((p, i) => '<td class="n" data-v="' + (p.valor || 0) + '">' + Piezas.precioHTML(p.valor, Piezas.rotulosPrecio(p.v, p.ad), 'data-fi="' + esc(f.ins.id) + '" data-ci="' + esc(F.ciudades[i]) + '"') + '</td>' +
            (i ? '<td class="n">' + UI.variacionHTML(p.valor > 0 && f.precios[0].valor > 0 ? p.valor / f.precios[0].valor - 1 : null) + '</td>' : '')).join('') + '</tr>').join('') +
        '</tbody></table></div>' + (filas.length > 600 ? '<p class="small muted" style="padding:8px 12px">Se muestran 600 de ' + filas.length + '. El Excel trae todos.</p>' : '')
        : '<div class="card-body">' + UI.vacio('◌', 'Nada que comparar', 'Ningún insumo tiene precio de mercado en dos o más de las ciudades elegidas. Desmarque «Solo insumos con mercado…» para ver las referencias.') + '</div>');
    return { filas, resumen, enc, cuerpo, html };
  }

  /* ── Entre cortes ── */
  function cortes(c){
    const lista = Datos.cortes();
    const op = Sesion.opciones && Sesion.opciones.corteA ? Sesion.opciones : null; if (op) Sesion.opciones = null;
    const F = Sesion.filtros.cmpCor = Sesion.filtros.cmpCor || { a:'', b:'', ciudad:'', umbral:0 };
    if (op) F.a = op.corteA;
    if (!F.a && lista[0]) F.a = lista[0].id;
    if ((!F.b || F.b === F.a) && lista.length > 1) F.b = (lista.find(x => x.id !== F.a) || {}).id || '';
    if (lista.length < 2){
      c.innerHTML = '<div class="card"><div class="card-body">' + UI.vacio('◌', 'Hacen falta dos cortes', 'Cree cortes en Base de precios › Cortes para ver cómo cambiaron los precios entre uno y otro.') + '</div></div>';
      return;
    }
    const A = Datos.corte(F.a), B = Datos.corte(F.b);
    const ciudadesAB = Array.from(new Set((A.ciudades || []).filter(x => (B.ciudades || []).indexOf(x) >= 0)));
    if (!F.ciudad || ciudadesAB.indexOf(F.ciudad) < 0) F.ciudad = ciudadesAB[0] || '';
    const filas = Cortes.comparar(A, B).filter(x => x.ciudad === F.ciudad && x.variacion !== null && x.anterior > 0 && Math.abs(x.variacion) >= (Number(F.umbral) || 0) / 100)
      .sort((x, y) => Math.abs(y.variacion) - Math.abs(x.variacion));
    const suben = filas.filter(x => x.variacion > 0.0005).length, bajan = filas.filter(x => x.variacion < -0.0005).length;
    const rel = filas.map(x => x.actual / x.anterior).filter(x => x > 0);
    c.innerHTML = '<div class="card"><div class="toolbar">' +
        '<div class="field"><label for="cmA">Corte reciente</label><select id="cmA">' + UI.selectOpts(Piezas.opcionesCorte(), F.a) + '</select></div>' +
        '<div class="field"><label for="cmB">Frente al corte</label><select id="cmB">' + UI.selectOpts(Piezas.opcionesCorte(), F.b) + '</select></div>' +
        '<div class="field"><label for="cmCiu">Ciudad</label><select id="cmCiu">' + UI.selectOpts(ciudadesAB.map(x => ({ v:x, n:Datos.nombreCiudad(x) })), F.ciudad) + '</select></div>' +
        '<div class="field"><label for="cmUmb">Variación mínima (%)</label><input id="cmUmb" type="number" min="0" step="1" value="' + esc(F.umbral) + '" style="width:90px"></div>' +
        '<div class="btn-row" style="margin-left:auto"><button class="btn sm" id="cmXls" type="button">Excel</button><button class="btn sm" id="cmPdf" type="button">PDF</button></div></div>' +
      (A.id === B.id ? '<div class="card-body"><div class="alert warn"><div class="ic">!</div><div class="bd">Elija dos cortes distintos.</div></div></div>' :
      '<div class="card-body"><div class="grid g4">' +
        '<div class="stat"><div class="lab">Insumos comparados</div><div class="val">' + filas.length + '</div></div>' +
        '<div class="stat"><div class="lab">Suben</div><div class="val var-sube">' + suben + '</div></div>' +
        '<div class="stat"><div class="lab">Bajan</div><div class="val var-baja">' + bajan + '</div></div>' +
        '<div class="stat accent"><div class="lab">Variación típica</div><div class="val">' + (rel.length ? esc(pctVar(Estadistica.mediaGeometrica(rel) - 1)) : '—') + '</div><div class="foot">media geométrica</div></div></div></div>' +
      (filas.length ? '<div class="tw" style="max-height:60vh;overflow:auto"><table class="t" id="tCmpCor"><thead><tr><th>Insumo</th><th>Unidad</th><th class="n">' + esc(B.nombre) + '</th><th class="n">' + esc(A.nombre) + '</th><th class="n">Diferencia</th><th class="n">Variación</th></tr></thead><tbody>' +
        filas.slice(0, 800).map(x => { const ins = Datos.insumo(x.insumoId) || {};
          return '<tr><td><button class="btn xs ghost" type="button" data-fi="' + esc(x.insumoId) + '"><span class="cod">' + esc(ins.codigo || '') + '</span> ' + esc(ins.descripcion || x.insumoId) + '</button></td><td>' + esc(ins.unidad || '') + '</td>' +
            '<td class="n">' + money3(x.anterior) + '</td><td class="n">' + money3(x.actual) + '</td><td class="n">' + money3(x.diferencia) + '</td><td class="n">' + UI.variacionHTML(x.variacion) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '<div class="card-body">' + UI.vacio('◌', 'Sin diferencias', 'No hay insumos con precio en los dos cortes para esta ciudad, o ninguno supera la variación mínima.') + '</div>')) + '</div>';
    const re = () => { F.a = $('#cmA', c).value; F.b = $('#cmB', c).value; F.ciudad = $('#cmCiu', c).value; F.umbral = Number($('#cmUmb', c).value) || 0; cortes(c); };
    ['#cmA','#cmB','#cmCiu','#cmUmb'].forEach(s => $(s, c).onchange = re);
    $$('[data-fi]', c).forEach(b => b.onclick = () => Ficha.abrir(b.dataset.fi, F.ciudad, 'historia'));
    UI.conectarOrden('#tCmpCor');
    const enc = ['Código','Descripción','Unidad', B.nombre, A.nombre, 'Diferencia', 'Variación'];
    const cuerpo = filas.map(x => { const ins = Datos.insumo(x.insumoId) || {}; return [ins.codigo || '', ins.descripcion || '', ins.unidad || '', x.anterior, x.actual, x.diferencia, redondearDec(x.variacion, 4)]; });
    $('#cmXls', c).onclick = () => excel('Comparación entre cortes · ' + Datos.nombreCiudad(F.ciudad), enc, cuerpo, 'cortes', { 3:'#,##0.000', 4:'#,##0.000', 5:'#,##0.000', 6:'0.0%' });
    $('#cmPdf', c).onclick = () => Documentos.previsualizar({ titulo:'Comparación entre cortes', documento:'Comparador', orientacion:'p', contexto:Datos.nombreCiudad(F.ciudad),
      nombre:nombreArchivoSeguro('ARKEN_PRECIOS_comparacion_cortes_' + Datos.nombreCiudad(F.ciudad)),
      bloques:[{ t:'kv', cols:2, pares:[['Corte reciente', A.nombre + ' · ' + fmtFecha(A.fecha)], ['Frente a', B.nombre + ' · ' + fmtFecha(B.fecha)], ['Ciudad', Datos.nombreCiudad(F.ciudad)],
          ['Insumos', filas.length], ['Suben', suben], ['Bajan', bajan]] },
        { t:'tabla', tam:6.8, head:[enc.slice(0, 2).concat(enc.slice(3))], body:cuerpo.map(r => [r[0], r[1] + ' (' + r[2] + ')', { content:money3(r[3]), styles:{ halign:'right' } }, { content:money3(r[4]), styles:{ halign:'right' } },
          { content:money3(r[5]), styles:{ halign:'right' } }, { content:pctVar(r[6]), styles:{ halign:'right' } }]) }] });
  }

  /* ── Entre fuentes ── */
  function fuentes(c){
    const F = Sesion.filtros.cmpFue = Sesion.filtros.cmpFue || { insumoId:'', ciudad:Piezas.ciudadActual(), dias:180, todasCiudades:false };
    const ins = F.insumoId ? Datos.insumo(F.insumoId) : null;
    let filas = [], total = [];
    if (ins){
      const desde = sumaDias(hoyISO(), -(Number(F.dias) || 180));
      const por = new Map();
      Datos.obs(ins.id).forEach(o => {
        if (o.tipoPrecio === 'referencia' || o.estado !== 'válida' || !(o.precioConIva > 0)) return;
        if (!F.todasCiudades && o.ciudad !== F.ciudad) return;
        if (Observaciones.fechaDe(o) < desde) return;
        let x = por.get(o.fuenteId); if (!x){ x = { fuenteId:o.fuenteId, v:[], ultima:'', demo:false }; por.set(o.fuenteId, x); }
        x.v.push(o.precioConIva); total.push(o.precioConIva); if (Observaciones.fechaDe(o) > x.ultima) x.ultima = Observaciones.fechaDe(o); if (o.esDemo) x.demo = true;
      });
      const medTotal = total.length ? Estadistica.mediana(total) : null;
      filas = Array.from(por.values()).map(x => ({ fuenteId:x.fuenteId, n:x.v.length, mediana:Estadistica.mediana(x.v), minimo:Math.min.apply(null, x.v), maximo:Math.max.apply(null, x.v), ultima:x.ultima, demo:x.demo,
        relativa:medTotal ? Estadistica.mediana(x.v) / medTotal - 1 : null })).sort((a,b) => a.mediana - b.mediana);
    }
    c.innerHTML = '<div class="card"><div class="toolbar">' +
        '<div class="field" style="min-width:280px;flex:1"><label for="cfIns">Insumo</label><input id="cfIns" type="text" value="' + esc(ins ? ins.descripcion : '') + '" placeholder="Buscar insumo…"></div>' +
        '<div class="field"><label for="cfCiu">Ciudad</label><select id="cfCiu"' + (F.todasCiudades ? ' disabled' : '') + '>' + UI.selectOpts(Piezas.opcionesCiudad(), F.ciudad) + '</select></div>' +
        '<div class="field"><label for="cfDias">Últimos (días)</label><input id="cfDias" type="number" min="7" value="' + esc(F.dias) + '" style="width:90px"></div>' +
        '<label class="checkline"><input type="checkbox" id="cfTodas"' + (F.todasCiudades ? ' checked' : '') + '> Todas las ciudades</label>' +
        '<div class="btn-row" style="margin-left:auto"><button class="btn sm" id="cfXls" type="button"' + (filas.length ? '' : ' disabled') + '>Excel</button></div></div>' +
      (!ins ? '<div class="card-body">' + UI.vacio('◇', 'Elija un insumo', 'Verá la mediana, el mínimo y el máximo de cada fuente, y cuánto se aparta cada una de la mediana de todas.') + '</div>'
        : (filas.length ? '<div class="tw"><table class="t" id="tCmpFue"><thead><tr><th>Fuente</th><th class="n">n</th><th class="n">Mínimo</th><th class="n">Mediana</th><th class="n">Máximo</th><th class="n">Frente a la mediana de todas</th><th>Última</th></tr></thead><tbody>' +
            filas.map(x => '<tr><td>' + esc(Datos.nombreFuente(x.fuenteId)) + (x.demo ? ' ' + UI.tagDemo() : '') + '</td><td class="n">' + x.n + '</td><td class="n">' + money3(x.minimo) + '</td><td class="n"><b>' + money3(x.mediana) + '</b></td>' +
              '<td class="n">' + money3(x.maximo) + '</td><td class="n">' + UI.variacionHTML(x.relativa) + '</td><td class="nowrap">' + esc(fmtFecha(x.ultima)) + '</td></tr>').join('') +
            '</tbody><tfoot><tr><td><b>Todas</b></td><td class="n">' + total.length + '</td><td></td><td class="n"><b>' + money3(Estadistica.mediana(total)) + '</b></td><td colspan="3"></td></tr></tfoot></table></div>'
          : '<div class="card-body">' + UI.vacio('◌', 'Sin observaciones válidas', 'Este insumo no tiene precios de mercado válidos en ese periodo y esa ciudad.') + '</div>')) + '</div>';
    UI.sugerirInsumo($('#cfIns', c), x => { F.insumoId = x.id; fuentes(c); });
    $('#cfCiu', c).onchange = e => { F.ciudad = e.target.value; fuentes(c); };
    $('#cfDias', c).onchange = e => { F.dias = Number(e.target.value) || 180; fuentes(c); };
    $('#cfTodas', c).onchange = e => { F.todasCiudades = e.target.checked; fuentes(c); };
    UI.conectarOrden('#tCmpFue');
    $('#cfXls', c).onclick = () => excel('Comparación entre fuentes · ' + (ins ? ins.descripcion : ''), ['Fuente','n','Mínimo','Mediana','Máximo','Frente a la mediana de todas','Última'],
      filas.map(x => [Datos.nombreFuente(x.fuenteId), x.n, x.minimo, x.mediana, x.maximo, x.relativa === null ? '' : redondearDec(x.relativa, 4), fmtFecha(x.ultima)]), 'fuentes',
      { 2:'#,##0.000', 3:'#,##0.000', 4:'#,##0.000', 5:'0.0%' });
  }

  function excel(titulo, enc, cuerpo, sufijo, formatos){
    if (!Documentos.hayXLSX()){ Documentos.avisoLibreria('SheetJS'); return; }
    const info = Documentos.filasInformativas(titulo);
    Documentos.guardarLibro(Documentos.libro([{ nombre:'Comparación', filas:info.concat([enc]).concat(cuerpo), filaEncabezado:info.length, anchos:enc.map((x, i) => i === 1 ? 50 : 14), formatos:formatos || {} }]),
      nombreArchivoSeguro('ARKEN_PRECIOS_comparacion_' + sufijo + '_' + hoyISO()) + '.xlsx');
  }
  return { ciudades, cortes, fuentes };
})();

const ExportarUI = (function(){
  let W = null;
  const TIPOS = [
    { k:'arken', n:'Excel para ARKEN CONTROL', d:'Los precios de una ciudad, listos para Módulo 04 › Importar desde Excel. Pasa por el validador antes de guardarse.' },
    { k:'analisis', n:'Excel de análisis', d:'Precios por ciudad, observaciones, comparativo, fuentes, equivalencias, parámetros y método.' },
    { k:'pdf', n:'PDF de la base', d:'Carta, por categorías, con portada, metodología, gráficas y anexo de fuentes.' },
    { k:'imprimir', n:'Imprimir la base', d:'El mismo documento directo a la impresora, con «Página x de y».' },
    { k:'paquete', n:'Paquete de precios', d:'Catálogo, equivalencias y cortes cerrados para llevar a otro equipo con ARKEN PRECIOS.' },
    { k:'intercambio', n:'Archivo de intercambio', d:'JSON con hash con los mismos renglones del Excel para ARKEN, para integraciones.' },
    { k:'respaldo', n:'Respaldo completo', d:'Todos los datos de este equipo, para restaurar en otro o en este.', permiso:() => Permisos.esAdmin() || Permisos.puede('actualizar') }
  ];
  const PASOS = ['Qué', 'Alcance', 'Ciudad y corte', 'Opciones', 'Validación y vista previa', 'Generar'];
  const COLUMNAS_PDF = [
    { k:'codigo', n:'Código', w:17 }, { k:'descripcion', n:'Descripción', fija:true }, { k:'unidad', n:'Unidad', fija:true, w:11 },
    { k:'precio', n:'Precio con IVA', fija:true, w:22 }, { k:'sinIva', n:'Precio sin IVA', w:22 }, { k:'minimo', n:'Mínimo', w:20 },
    { k:'mediana', n:'Mediana', w:20 }, { k:'maximo', n:'Máximo', w:20 }, { k:'n', n:'n', w:7 }, { k:'confianza', n:'Confianza', w:16 },
    { k:'fecha', n:'Fecha', w:17 }, { k:'fuentes', n:'Fuentes', w:38 }, { k:'categoriaArken', n:'Categoría ARKEN', w:20 }
  ];
  const COLUMNAS_DEFECTO = ['codigo','descripcion','unidad','precio','minimo','maximo','n','confianza','fecha'];
  const MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

  function hayDemo(){ return Datos.lista('fuentes').some(f => f.esDemo); }
  function nuevo(tipo){
    const ref = Datos.ciudadReferencia(), activo = Datos.corteActivo();
    return { paso:1, tipo:tipo || 'arken', alcance:{ tipo:'todo', categorias:[], insumoIds:[] },
      ciudad:ref ? ref.codigoDivipola : '', ciudades:ref ? [ref.codigoDivipola] : [], corteId:activo ? activo.id : '',
      cortes:Datos.cortes().filter(c => c.cerrado).slice(0, 1).map(c => c.id),
      op:{ alcanceArken:'ambos', precio:'adoptado', redondeo:'ninguno', listarSinPrecio:true, incluirNoInvestigables:false, incluirReferencia:false,
           incluirDemo:false, incluirObservaciones:true, soloConPrecio:false, columnas:COLUMNAS_DEFECTO.slice(), orientacion:'l',
           portada:true, graficas:true, anexoFuentes:true },
      resultado:null, generado:null };
  }
  function aplica(paso, tipo){
    if (tipo === 'respaldo') return paso === 1 || paso >= 5;
    if (tipo === 'paquete') return paso === 1 || paso === 3 || paso >= 5;
    return true;
  }
  function tipoDe(k){ return TIPOS.find(t => t.k === k) || TIPOS[0]; }
  function multiCiudad(){ return W.tipo === 'analisis' || W.tipo === 'pdf' || W.tipo === 'imprimir'; }

  /* ── Alcance ── */
  function filtroAlcance(a){
    if (a.tipo === 'categorias') return Informes.filtroCategorias(a.categorias);
    if (a.tipo === 'insumos'){ const s = new Set(a.insumoIds); return ins => s.has(ins.id); }
    return null;
  }
  function insumosEnAlcance(a){
    const f = filtroAlcance(a);
    return Datos.insumosActivos().filter(i => !f || f(i)).length;
  }
  function nombreAlcance(a){
    if (a.tipo === 'insumos') return a.insumoIds.length + ' insumo(s) elegido(s)';
    if (a.tipo === 'categorias'){
      const porGrupo = {};
      a.categorias.forEach(k => { const g = k.split('|')[0]; porGrupo[g] = (porGrupo[g] || 0) + 1; });
      const grupos = Object.keys(porGrupo);
      if (grupos.length === 1){
        const g = Datos.grupo(grupos[0]);
        if (g && porGrupo[grupos[0]] === (g.categorias || []).length) return g.nombre;
        if (a.categorias.length === 1) return a.categorias[0].split('|')[1];
        return (g ? g.nombre : grupos[0]) + ' (' + a.categorias.length + ' categorías)';
      }
      return a.categorias.length + ' categorías de ' + grupos.length + ' grupos';
    }
    return 'Toda la base';
  }
  function corteNombre(){ const c = W.corteId ? Datos.corte(W.corteId) : null; return c ? c.nombre : 'Precios vigentes'; }
  function ciudadesTexto(){
    const l = multiCiudad() ? W.ciudades : [W.ciudad];
    return l.length > 3 ? l.length + ' ciudades' : l.map(c => Datos.nombreCiudad(c)).join(', ');
  }
  function resumenEleccion(){
    const t = tipoDe(W.tipo);
    if (W.tipo === 'respaldo') return t.n;
    if (W.tipo === 'paquete') return t.n + (W.paso > 3 ? ' · ' + (W.cortes.length ? W.cortes.length + ' corte(s)' : 'solo catálogo') : '');
    return t.n + (W.paso > 2 ? ' · ' + nombreAlcance(W.alcance) : '') + (W.paso > 3 ? ' · ' + ciudadesTexto() + ' · ' + corteNombre() : '');
  }

  /* ── Pintura general ── */
  let leerPaso = null;
  function pintar(c){
    if (!W) W = nuevo();
    const op = Sesion.opciones;
    if (op && op.exportar){
      Sesion.opciones = null;
      W = nuevo(op.exportar.tipo);
      if (op.exportar.ciudad){ W.ciudad = op.exportar.ciudad; W.ciudades = [op.exportar.ciudad]; }
      if (op.exportar.corteId !== undefined) W.corteId = op.exportar.corteId || '';
      if (op.exportar.categorias && op.exportar.categorias.length) W.alcance = { tipo:'categorias', categorias:op.exportar.categorias.slice(), insumoIds:[] };
      if (op.exportar.tipo) W.paso = 2;
    }
    if (!Permisos.puede('exportar')){
      c.innerHTML = '<div class="card"><div class="card-body">' + UI.vacio('🔒', 'Su rol no exporta', 'Pídale al administrador que le asigne un rol con permiso de exportar.') + '</div></div>';
      return;
    }
    c.innerHTML = '<div class="pasos">' + PASOS.map((p, i) => {
        const n = i + 1, ap = aplica(n, W.tipo);
        return '<button class="paso-w' + (W.paso === n ? ' activo' : (W.paso > n && ap ? ' hecho' : '')) + '" type="button"' +
          (ap && n < W.paso && W.paso < 6 ? ' data-ir="' + n + '"' : ' disabled') + (ap ? '' : ' style="opacity:.4" title="No aplica a ' + esc(tipoDe(W.tipo).n) + '"') +
          '><b>' + n + '</b>' + esc(p) + '</button>'; }).join('') + '</div>' +
      '<div class="card"><div class="card-body" id="e8Paso"></div>' +
      '<div class="card-body" style="border-top:1px solid var(--line)"><div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap">' +
        (W.paso === 6 ? '<button class="btn" id="e8Otra" type="button">Nueva exportación</button>' : '<button class="btn" id="e8Atras" type="button"' + (W.paso === 1 ? ' disabled' : '') + '>Atrás</button>') +
        '<span class="muted small" style="flex:1;text-align:center;min-width:160px">' + esc(resumenEleccion()) + '</span>' +
        (W.paso === 6 ? '<button class="btn primary" id="e8Repetir" type="button">Generar de nuevo</button>'
          : '<button class="btn primary" id="e8Sig" type="button">' + (W.paso === 5 ? textoGenerar() : 'Siguiente') + '</button>') +
      '</div></div></div>';
    $$('[data-ir]', c).forEach(b => b.onclick = () => { W.paso = Number(b.dataset.ir); pintar(c); });
    const z = $('#e8Paso', c);
    leerPaso = null;
    try {
      [null, paso1, paso2, paso3, paso4, paso5, paso6][W.paso](z, c);
    } catch(e){
      RegistroTecnico.anotar('Exportar · paso ' + W.paso, e);
      z.innerHTML = '<div class="alert bad"><div class="ic">!</div><div class="bd"><b>No fue posible preparar este paso.</b> ' + esc(e.message || e) + '</div></div>';
      W.resultado = null;
      if ($('#e8Sig', c)) $('#e8Sig', c).disabled = true;
    }
    if ($('#e8Atras', c)) $('#e8Atras', c).onclick = () => { let p = W.paso - 1; while (p > 1 && !aplica(p, W.tipo)) p--; W.paso = Math.max(1, p); pintar(c); };
    if ($('#e8Sig', c)) $('#e8Sig', c).onclick = async () => {
      if (leerPaso){ const err = leerPaso(); if (err){ UI.toast(err, 'bad'); return; } }
      if (W.paso === 5){ const ok = await generar($('#e8Sig', c)); if (!ok) return; }
      let p = W.paso + 1; while (p < 6 && !aplica(p, W.tipo)) p++;
      W.paso = Math.min(6, p); pintar(c);
    };
    if ($('#e8Otra', c)) $('#e8Otra', c).onclick = () => { W = nuevo(W.tipo); pintar(c); };
    if ($('#e8Repetir', c)) $('#e8Repetir', c).onclick = async () => { await generar($('#e8Repetir', c)); pintar(c); };
  }
  function textoGenerar(){
    return { arken:'Guardar el Excel', analisis:'Guardar el Excel', pdf:'Guardar el PDF', imprimir:'Imprimir', paquete:'Descargar el paquete',
             intercambio:'Descargar el archivo', respaldo:'Descargar el respaldo' }[W.tipo] || 'Generar';
  }

  /* ── Paso 1: qué ── */
  function paso1(z, c){
    const tipos = TIPOS.filter(t => !t.permiso || t.permiso());
    z.innerHTML = '<h3 style="margin:0 0 10px">¿Qué quiere generar?</h3><div class="opciones-tipo">' + tipos.map(t =>
      '<button class="opcion' + (t.k === W.tipo ? ' sel' : '') + '" type="button" data-t="' + t.k + '" aria-pressed="' + (t.k === W.tipo) + '"><b>' + esc(t.n) + '</b><span>' + esc(t.d) + '</span></button>').join('') + '</div>';
    $$('[data-t]', z).forEach(b => b.onclick = () => { const t = b.dataset.t; if (t !== W.tipo){ const v = W; W = nuevo(t); W.alcance = v.alcance; W.ciudad = v.ciudad; W.ciudades = v.ciudades; W.corteId = v.corteId; } pintar(c); });
    leerPaso = () => '';
  }

  /* ── Paso 2: alcance ── */
  function paso2(z){
    const a = W.alcance;
    const radio = (k, n, d) => '<label class="opcion' + (a.tipo === k ? ' sel' : '') + '" style="display:flex;gap:10px;align-items:flex-start"><input type="radio" name="e8Alc" value="' + k + '"' +
      (a.tipo === k ? ' checked' : '') + ' style="margin-top:3px"><span style="display:flex;flex-direction:column;gap:2px"><b>' + esc(n) + '</b><span>' + esc(d) + '</span></span></label>';
    z.innerHTML = '<h3 style="margin:0 0 10px">¿Qué insumos?</h3><div class="opciones-tipo">' +
      radio('todo', 'Toda la base', Datos.insumosActivos().length + ' insumos activos') +
      radio('categorias', 'Por categorías', 'Grupos completos o algunas de sus categorías') +
      radio('insumos', 'Insumos seleccionados', 'Busque y agregue los que necesite') + '</div>' +
      '<div id="e8Det" style="margin-top:var(--gap)"></div><p class="small muted" id="e8Cuenta" style="margin:10px 0 0"></p>';

    const cuenta = () => { $('#e8Cuenta', z).textContent = insumosEnAlcance(a) + ' insumo(s) en el alcance.'; };
    const pintarDet = () => {
      if (a.tipo === 'categorias'){
        const n = {};
        Datos.insumosActivos().forEach(i => { n[i.grupo] = (n[i.grupo] || 0) + 1; n[i.grupo + '|' + i.categoria] = (n[i.grupo + '|' + i.categoria] || 0) + 1; });
        det.innerHTML = '<p class="small muted" style="margin:0 0 6px">Marque un grupo para incluirlo completo, o abra el grupo y marque solo algunas categorías.</p>' +
          UI.arbol('e8Arbol', { grupos:new Set(), categorias:new Set(a.categorias) }, (g, cat) => ({ n:n[cat ? g + '|' + cat : g] || 0 }));
        setTimeout(() => { const r = $('#e8Arbol'); if (r) r.addEventListener('cambio', () => { a.categorias = UI.leerArbol('e8Arbol'); cuenta(); }); }, 0);
      } else if (a.tipo === 'insumos'){
        det.innerHTML = '<div class="field" style="max-width:560px"><label for="e8Ins">Agregar insumo</label><input id="e8Ins" type="text" placeholder="Código o descripción…"></div>' +
          '<div class="chips" id="e8Chips" style="margin-top:8px"></div>';
        const chips = () => {
          $('#e8Chips', z).innerHTML = a.insumoIds.map(id => '<span class="chip">' + esc(Piezas.nombreInsumo(id)) + '<button type="button" data-q="' + esc(id) + '" aria-label="Quitar">✕</button></span>').join('');
          $$('[data-q]', z).forEach(b => b.onclick = () => { a.insumoIds = a.insumoIds.filter(x => x !== b.dataset.q); chips(); cuenta(); });
        };
        UI.sugerirInsumo($('#e8Ins', z), ins => { if (a.insumoIds.indexOf(ins.id) < 0) a.insumoIds.push(ins.id); $('#e8Ins', z).value = ''; chips(); cuenta(); }, { limpiar:false });
        chips();
      } else det.innerHTML = '';
      cuenta();
    };
    $$('input[name=e8Alc]', z).forEach(r => r.onchange = () => {
      a.tipo = r.value;
      $$('.opcion', z).forEach(o => o.classList.toggle('sel', !!$('input:checked', o)));
      pintarDet();
    });
    pintarDet();
    leerPaso = () => {
      if (a.tipo === 'categorias'){ a.categorias = UI.leerArbol('e8Arbol'); if (!a.categorias.length) return 'Marque al menos una categoría.'; }
      if (a.tipo === 'insumos' && !a.insumoIds.length) return 'Agregue al menos un insumo.';
      return '';
    };
  }

  /* ── Paso 3: ciudad y corte ── */
  function paso3(z){
    if (W.tipo === 'paquete'){
      const cerrados = Datos.cortes().filter(x => x.cerrado);
      z.innerHTML = '<h3 style="margin:0 0 10px">¿Qué cortes lleva el paquete?</h3>' +
        (cerrados.length ? '<div class="field" style="max-width:420px"><label>Cortes cerrados</label>' + UI.multi('e8Cortes', cerrados.map(x => ({ v:x.id, n:x.nombre + ' · ' + fmtFecha(x.fecha) + (x.incluyeDemo ? ' · DEMO' : '') })), W.cortes, 'Ninguno: solo catálogo') + '</div>'
          : '<div class="alert info"><div class="ic">i</div><div class="bd">No hay cortes cerrados. El paquete llevará el catálogo, la taxonomía, las ciudades, las fuentes y las equivalencias con ARKEN. Para incluir precios, cierre un corte en Base de precios › Cortes.</div></div>') +
        '<p class="small muted" style="margin-top:10px">Los datos de demostración no viajan en el paquete: las fuentes DEMO se quedan en este equipo.</p>';
      leerPaso = () => { W.cortes = $('#e8Cortes', z) ? UI.valorMulti('e8Cortes') : []; return ''; };

    if (corte){
      if ((corte.ciudades || []).indexOf(W.ciudad) < 0) W.ciudad = (corte.ciudades || [])[0] || '';
      W.ciudades = W.ciudades.filter(x => (corte.ciudades || []).indexOf(x) >= 0);
      if (!W.ciudades.length && corte.ciudades && corte.ciudades.length) W.ciudades = [corte.ciudades[0]];
    }
    z.innerHTML = '<h3 style="margin:0 0 10px">¿De qué corte y para qué ciudad' + (multiCiudad() ? 'es' : '') + '?</h3><div class="grid g2">' +
      '<div class="field"><label for="e8Corte">Precios de</label><select id="e8Corte">' + UI.selectOpts(Piezas.opcionesCorte(false), W.corteId, 'La base vigente (precios de hoy)') + '</select>' +
        '<div class="small muted" style="margin-top:4px">' + (corte ? 'Corte ' + (corte.cerrado ? 'cerrado' : 'abierto') + ' del ' + esc(fmtFecha(corte.fecha)) + ' con ' + (corte.ciudades || []).length + ' ciudad(es).' +
          (corte.incluyeDemo ? ' <span class="tag demo">DEMO</span> Incluye datos de demostración.' : '') : 'Los precios guardados en la base al día de hoy.') + '</div></div>' +
      (multiCiudad() ? '<div class="field"><label>Ciudades</label>' + UI.multi('e8Ciudades', opcCiudad, W.ciudades, 'Elija al menos una') +
          '<div class="small muted" style="margin-top:4px">' + (W.tipo === 'analisis' ? 'La primera es la base del comparativo.' : 'Cada ciudad va en su propia sección.') + '</div></div>'
        : '<div class="field"><label for="e8Ciudad">Ciudad</label><select id="e8Ciudad">' + UI.selectOpts(opcCiudad, W.ciudad) + '</select>' +
          '<div class="small muted" style="margin-top:4px">Un archivo por ciudad: en ARKEN cada proyecto tiene sus precios.</div></div>') +
      '</div>';
    $('#e8Corte', z).onchange = e => { W.corteId = e.target.value; paso3(z); };
    leerPaso = () => {
      if (multiCiudad()){ W.ciudades = UI.valorMulti('e8Ciudades'); if (!W.ciudades.length) return 'Elija al menos una ciudad.'; W.ciudad = W.ciudades[0]; }
      else { W.ciudad = $('#e8Ciudad', z).value; if (!W.ciudad) return 'Elija la ciudad.'; W.ciudades = [W.ciudad]; }
      return '';
    };
  }

  /* ── Paso 4: opciones ── */
  function paso4(z){
    const o = W.op, demo = hayDemo() || (W.corteId && (Datos.corte(W.corteId) || {}).incluyeDemo);
    const chk = (k, txt, ayuda, dis) => '<label class="checkline"' + (dis ? ' style="opacity:.55"' : '') + '><input type="checkbox" data-o="' + k + '"' + (o[k] ? ' checked' : '') + (dis ? ' disabled' : '') + '> <span>' + txt +
      (ayuda ? '<br><span class="small muted">' + ayuda + '</span>' : '') + '</span></label>';

    const chkDemo = demo ? chk('incluirDemo', 'Incluir datos de demostración', 'Sintéticos, rotulados DEMO. Si no se incluyen, esos insumos vuelven a su precio de referencia.') : '';
    let h = '<h3 style="margin:0 0 10px">Opciones</h3>';
    if (W.tipo === 'arken' || W.tipo === 'intercambio'){
      h += '<div class="grid g2"><div class="stack" style="gap:10px">' +
        '<div class="field"><label>Insumos del archivo</label><div class="stack" style="gap:4px">' +
          [['ambos', 'Los que ya existen en ARKEN y los nuevos'], ['existentes', 'Solo los que ya existen en ARKEN'], ['nuevos', 'Solo los nuevos']].map(x =>
            '<label class="checkline"><input type="radio" name="e8AlcA" value="' + x[0] + '"' + (o.alcanceArken === x[0] ? ' checked' : '') + '> ' + esc(x[1]) + '</label>').join('') + '</div></div>' +
        selPrecio +
        (W.tipo === 'arken' ? '<div class="field"><label for="e8Red">Redondeo</label><select id="e8Red">' + UI.selectOpts([{ v:'ninguno', n:'Ninguno (tres decimales, como ARKEN)' }, { v:'peso', n:'Al peso' }, { v:'centena', n:'A la centena' }], o.redondeo) + '</select></div>' : '') +
        '</div><div class="stack" style="gap:8px">' +
        (W.tipo === 'arken' ? chk('listarSinPrecio', 'Listar en la hoja «Notas» los insumos que no van y por qué', 'Sin precio, solo referencia, no investigables o equivalencia por confirmar.') : '') +
        chk('incluirReferencia', 'Incluir los que solo tienen el precio de referencia de ARKEN', 'Precio de partida del catálogo, sin observaciones de mercado. Por defecto no se exportan.') +
        chk('incluirNoInvestigables', 'Incluir los no investigables', 'Valores pactados o porcentuales (administración, herramienta menor…). Por defecto no se exportan.') +
        (W.tipo === 'arken' ? chk('puestoEnObra', 'Precio puesto en obra (con flete)', 'Llega en la Fase 4 con la tabla de fletes.', true) : '') +
        chkDemo + '</div></div>';
    } else if (W.tipo === 'analisis'){
      h += '<div class="grid g2"><div class="stack" style="gap:10px">' + selPrecio + '</div><div class="stack" style="gap:8px">' +
        chk('incluirObservaciones', 'Incluir la hoja de observaciones', 'Cada precio registrado con su fuente, fecha, enlace y estado.') +
        chk('soloConPrecio', 'Solo insumos con precio', 'Deja fuera los que no tienen ni mercado ni referencia.') + chkDemo + '</div></div>';

      h += '<div class="grid g2"><div class="stack" style="gap:10px">' + selPrecio +
        '<div class="field"><label>Orientación</label><div class="row" style="gap:14px">' +
          [['l', 'Horizontal'], ['p', 'Vertical']].map(x => '<label class="checkline"><input type="radio" name="e8Ori" value="' + x[0] + '"' + (o.orientacion === x[0] ? ' checked' : '') + '> ' + x[1] + '</label>').join('') + '</div></div>' +
        '<div class="field"><label>Columnas de la tabla</label><div class="grid g2" style="gap:2px 12px">' + COLUMNAS_PDF.map(col =>
          '<label class="checkline"><input type="checkbox" data-col="' + col.k + '"' + (col.fija || o.columnas.indexOf(col.k) >= 0 ? ' checked' : '') + (col.fija ? ' disabled' : '') + '> ' + esc(col.n) + '</label>').join('') + '</div></div>' +
        '</div><div class="stack" style="gap:8px">' +
        chk('portada', 'Portada con resumen y metodología', 'Cobertura, confianza, fuentes y cómo se calcula el precio recomendado.') +
        chk('graficas', 'Gráficas del tablero', 'Evolución, comparación entre ciudades y mayores alzas y bajas del último año.') +
        chk('anexoFuentes', 'Anexo de fuentes', 'Las fuentes cuyos precios entraron en el cálculo, con su tipo y cuántas observaciones aportaron.') +
        chk('soloConPrecio', 'Solo insumos con precio', 'Deja fuera los que no tienen ni mercado ni referencia.') + chkDemo +
        '<p class="small muted" style="margin:6px 0 0">Tamaño carta, con encabezado y pie de ARKEN PRECIOS y «Página x de y».</p></div></div>';
    }

      if ($('[data-col]', z)) o.columnas = $$('[data-col]', z).filter(x => x.checked).map(x => x.dataset.col);
      return '';

  }

  /* ── Paso 5: validación y vista previa ── */
  function opArken(){
    const o = W.op;
    return { ciudad:W.ciudad, corteId:W.corteId || null, filtro:filtroAlcance(W.alcance), precio:o.precio, incluirDemo:o.incluirDemo,
      alcanceArken:o.alcanceArken, incluirNoInvestigables:o.incluirNoInvestigables, incluirReferencia:o.incluirReferencia,
      listarSinPrecio:W.tipo === 'arken' ? o.listarSinPrecio : true, redondeo:o.redondeo };
  }
  function resumenExcluidos(excluidos){
    if (!excluidos.length) return '';
    const g = new Map();
    excluidos.forEach(x => { const m = String(x.motivo).replace(/con el insumo .*$/, 'con otro insumo').replace(/\(«.*»\)/, ''); g.set(m, (g.get(m) || 0) + 1); });
    return '<details style="margin-top:10px"><summary class="small"><b>' + excluidos.length + '</b> insumo(s) del alcance no van en el archivo. Ver por qué.</summary>' +
      '<div class="tw" style="margin-top:6px"><table class="t"><thead><tr><th>Motivo</th><th class="n">Insumos</th></tr></thead><tbody>' +
      Array.from(g.entries()).sort((a,b) => b[1] - a[1]).map(([m, n]) => '<tr><td>' + esc(m) + '</td><td class="n">' + n + '</td></tr>').join('') + '</tbody></table></div></details>';
  }
  const PASOS_ARKEN = '<ol class="pasos-arken"><li>En ARKEN CONTROL abra el proyecto y vaya a <b>Módulo 04 › Exportar / importar… › Importar desde Excel</b>.</li>' +
    '<li>Pulse <b>«Seleccionar archivo…»</b> y elija este archivo.</li><li><b>Revise</b> la lista: los que ya existen salen como «Ya existe».</li>' +
    '<li>Pulse <b>«Sobrescribir todos los que coinciden»</b>.</li><li>Pulse <b>«Importar»</b>.</li><li>Confirme con <b>«Sí, importar con estos precios»</b>.</li></ol>';

  function paso5(z, c){
    W.resultado = null;
    const sig = $('#e8Sig', c);
    if (W.tipo === 'arken'){
      if (!Documentos.hayXLSX()){ z.innerHTML = alertaLibreria('SheetJS'); sig.disabled = true; return; }
      const r = Informes.excelArken(opArken());
      W.resultado = r;
      const v = r.validacion;
      const est = (lab, val, malo, foot) => '<div class="stat' + (malo ? '' : '') + '"><div class="lab">' + esc(lab) + '</div><div class="val"' + (malo ? ' style="color:var(--bad)"' : '') + '>' + val + '</div>' + (foot ? '<div class="foot">' + esc(foot) + '</div>' : '') + '</div>';
      z.innerHTML = '<h3 style="margin:0 0 4px">Validación del archivo</h3><p class="small muted" style="margin:0 0 10px">El archivo se armó en memoria y se volvió a leer exactamente como lo leerá ARKEN. Se compara contra: ' + esc(r.listaOrigen) + '.</p>' +
        '<div class="validador">' +
          est('Renglones', String(v.leidas), !v.leidas, r.ciudadNombre) +
          est('«Ya existe» en ARKEN', v.coinciden === null ? '—' : String(v.coinciden), false, 'Se sobrescribe solo el precio') +
          est('Nuevos', v.nuevas === null ? '—' : String(v.nuevas), false, 'ARKEN los crea') +
          est('Categorías inválidas', String(v.categoriasInvalidas), v.categoriasInvalidas > 0) +
          est('Precios en cero o no numéricos', String(v.preciosInvalidos), v.preciosInvalidos > 0) +
          est('Descripciones repetidas', String(v.duplicadas), v.duplicadas > 0) +
          est('Cambiarían unidad o categoría', String(v.cambiarian), v.cambiarian > 0) +
        '</div>' +
        (v.ok ? '<div class="alert ok"><div class="ic">✓</div><div class="bd"><b>El archivo pasa la validación.</b> ' + v.leidas + ' renglón(es) · ' + esc(r.nombre) +

        (v.ok ? '<h4 style="margin:16px 0 4px">Cómo importarlo en ARKEN CONTROL</h4>' + PASOS_ARKEN : '');
      sig.disabled = !v.ok;
      if (!v.ok) sig.title = 'El validador encontró errores: el archivo no se guarda';
      return;
    }
    if (W.tipo === 'intercambio'){
      const r = Informes.renglonesArken(opArken());
      W.resultado = { renglones:r.renglones.length };
      z.innerHTML = '<h3 style="margin:0 0 10px">Vista previa</h3><div class="kv c2"><div class="k">Ciudad</div><div class="v">' + esc(r.ciudadNombre) + '</div><div class="k">Corte</div><div class="v">' + esc(corteNombre()) + '</div>' +
        '<div class="k">Renglones</div><div class="v">' + r.renglones.length + '</div><div class="k">Formato</div><div class="v">' + esc(Formatos.INTERCAMBIO) + ' (JSON con hash SHA-256)</div></div>' +
        resumenExcluidos(r.excluidos) +
        (r.renglones.length ? '' : '<div class="alert bad" style="margin-top:10px"><div class="ic">!</div><div class="bd">No hay renglones para exportar con estas opciones.</div></div>');
      sig.disabled = !r.renglones.length;
      return;
    }
    if (W.tipo === 'analisis'){
      if (!Documentos.hayXLSX()){ z.innerHTML = alertaLibreria('SheetJS'); sig.disabled = true; return; }
      const r = Informes.excelAnalisis({ ciudades:W.ciudades, corteId:W.corteId || null, filtro:filtroAlcance(W.alcance), precio:W.op.precio,
        incluirDemo:W.op.incluirDemo, incluirObservaciones:W.op.incluirObservaciones, soloConPrecio:W.op.soloConPrecio });
      W.resultado = r;
      const hojas = r.wb.SheetNames.map(n => { const ws = r.wb.Sheets[n]; const rg = XLSX.utils.decode_range(ws['!ref'] || 'A1'); return { n, filas:rg.e.r + 1 }; });
      z.innerHTML = '<h3 style="margin:0 0 10px">Vista previa</h3><div class="kv c2"><div class="k">Archivo</div><div class="v">' + esc(r.nombre) + '</div><div class="k">Filas de precios</div><div class="v">' + r.filas + '</div></div>' +
        '<div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Hoja</th><th class="n">Filas</th></tr></thead><tbody>' +
        hojas.map(h => '<tr><td>' + esc(h.n) + '</td><td class="n">' + h.filas + '</td></tr>').join('') + '</tbody></table></div>';
      sig.disabled = !r.filas;

    }
    if (W.tipo === 'pdf' || W.tipo === 'imprimir'){
      z.innerHTML = '<p class="muted">Preparando el documento…</p>';
      sig.disabled = true;
      documento().then(cfg => {

        z.innerHTML = '<h3 style="margin:0 0 4px">Vista previa</h3><p class="small muted" style="margin:0 0 10px">' + esc(cfg.nombre + '.pdf') + ' · ' + (cfg.orientacion === 'l' ? 'horizontal' : 'vertical') +
          ' · carta. La paginación final («Página x de y») la pone el PDF o la impresora.</p><div class="doc-view" style="max-height:60vh;overflow:auto">' + Documentos.bloquesAHTML(cfg) + '</div>';
        sig.disabled = false;
      }).catch(e => { RegistroTecnico.anotar('Exportar · documento', e); z.innerHTML = '<div class="alert bad"><div class="ic">!</div><div class="bd">No fue posible preparar el documento: ' + esc(e.message || e) + '</div></div>'; });
      return;

    if (W.tipo === 'paquete'){
      const cortes = W.cortes.map(id => Datos.corte(id)).filter(Boolean);

      z.innerHTML = '<h3 style="margin:0 0 10px">Contenido del paquete</h3><div class="kv c2">' +
