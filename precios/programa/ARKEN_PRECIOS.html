  function envolver(formato, contenido, extra){
    const limpio = limpiarClaves(contenido);
    return Object.assign({ formato, version:1, generado:ahoraISO() }, extra || {},
      { hash: Cripto.sha256Hex(Cripto.jsonCanonico(limpio)), contenido:limpio });
  }
  /** Verifica formato y hash antes de mostrar la revisión de una restauración. */
  function verificar(obj, formatoEsperado){
    if (!obj || typeof obj !== 'object') return { ok:false, motivo:'El archivo no es un JSON válido.' };
    if (obj.formato !== formatoEsperado) return { ok:false, motivo:'El archivo no es de tipo ' + formatoEsperado + ' (dice «' + String(obj.formato||'—') + '»).' };
    if (!obj.contenido) return { ok:false, motivo:'El archivo no trae contenido.' };
    const h = Cripto.sha256Hex(Cripto.jsonCanonico(obj.contenido));
    if (h !== obj.hash) return { ok:false, motivo:'El hash no coincide: el archivo fue modificado o está incompleto.' };
    return { ok:true };
  }
  return { PAQUETE, RESPALDO, INTERCAMBIO, envolver, verificar };
})();

/* ══════════════════════════════════════════════════════════════════════════
   DATOS DE DEMOSTRACIÓN
   Sintéticos, con semilla fija y rotulados: la fuente se llama «Datos de
   demostración (sintéticos)», cada observación lleva esDemo y un botón los
   borra todos. Parten del precio de referencia de ARKEN para que las
   magnitudes tengan sentido; nunca se presentan como precios de mercado.
   ══════════════════════════════════════════════════════════════════════════ */
const Demo = (function(){
  const FUENTES = [
    { id:'demo-a', nombre:'DEMO · Ferretería A (sintética)', tipo:'distribuidor', tipoPrecio:'lista', confiabilidad:0.6 },
    { id:'demo-b', nombre:'DEMO · Distribuidor B (sintético)', tipo:'distribuidor', tipoPrecio:'lista', confiabilidad:0.7 },
    { id:'demo-c', nombre:'DEMO · Cotización C (sintética)', tipo:'cotización', tipoPrecio:'cotización', confiabilidad:0.9 }
  ];
  /** Genera observaciones sintéticas. `base` = [{insumo, precio}] y
      `ciudades` = [{codigo, factor}]. Devuelve objetos listos para guardar. */
  function generar(base, ciudades, opciones){
    const o = Object.assign({ meses:12, hasta:hoyISO(), semilla:20261002, recientes:4 }, opciones || {});
    const r = azar(o.semilla);
    const out = [];
    const hastaUtc = utcDe(o.hasta);
    base.forEach((b, bi) => {
      const tendencia = (r() - 0.35) * 0.012;            // deriva mensual entre −0,4 % y +0,8 %
      ciudades.forEach((c, ci) => {
        if (ci > 0 && r() > (o.cobertura || 0.65)) return;
        for (let m = o.meses - 1; m >= 0; m--){
          const reciente = m === 0;
          const cuantas = reciente ? 2 + Math.floor(r() * (o.recientes + 1)) : 1;
          for (let k = 0; k < cuantas; k++){
            const dias = m * 30 + Math.floor(r() * (reciente ? 40 : 28));
            const fecha = new Date(hastaUtc - dias * MS_DIA).toISOString().slice(0,10);
            const ruido = 1 + (r() - 0.5) * 0.10;
            const precio = redondear3(b.precio * c.factor * Math.pow(1 + tendencia, o.meses - 1 - m) * ruido);
            const f = FUENTES[(bi + ci + k + m) % FUENTES.length];
            out.push({ insumoId:b.insumo.id, ciudad:c.codigo, fuenteId:f.id, fechaCaptura:fecha, precioPublicado:precio,
                       unidadPublicada:b.insumo.unidad, incluyeIva:true, tipoPrecio:f.tipoPrecio, metodo:'demo', confianza:f.confiabilidad,
                       textoLiteral:'Dato sintético de demostración', esDemo:true, estado:'válida' });
          }
        }
      });
    });
    return out;
  }
  return { FUENTES, generar };
})();

  /* ─────────────────────────  IVA POR INSUMO  ─────────────────────────
     Régimen sugerido para que el contador lo confirme (§8.3). «No sujeto» se
     agrega a gravado, exento y excluido porque la nómina y los tributos no
     son ventas: decirles «excluidos» sería impreciso. */
  const GRUPOS_SIN_VENTA = ['G31','G32','G33','G34','G35','G57'];
  function iva(grupo, b){
    const out = { tarifaIva:19, regimenIva:'gravado', baseIva:'precio', ivaPorVerificar:b.has('v'), notaIva:'' };
    if (b.has('x')){
      out.tarifaIva = 0;
      if (GRUPOS_SIN_VENTA.indexOf(grupo) >= 0){
        out.regimenIva = 'no sujeto';
        out.notaIva = grupo === 'G57' ? 'Tributo, tasa o cargo público: no causa IVA.'
          : 'La nómina no causa IVA. Si el trabajo lo factura una persona o empresa responsable de IVA, el servicio sí lo causa.';
      } else {
        out.regimenIva = 'excluido';
        out.notaIva = { G44:'Transporte de carga, excluido (art. 476 ET).', G49:'Servicio público domiciliario, excluido (art. 476 ET).',
                        G54:'Servicio de salud, excluido (art. 476 ET).' }[grupo] || 'Excluido (art. 476 ET).';
      }
    }
    if (b.has('u')){ out.baseIva = 'utilidad'; out.notaIva = 'Contrato a todo costo con AIU: el IVA del 19 % va sobre la utilidad (art. 3 del Decreto 1372 de 1992). Registre A, I y U en cada cotización.'; }
    if (b.has('a')){ out.baseIva = 'aiu'; out.notaIva = 'Vigilancia y aseo: el IVA va sobre el AIU (art. 462-1 ET). Registre el AIU en cada cotización.'; }

  /** «c=50KG» → contenido; «p=UN:5.964KG:Varilla de 6 m;…» → presentaciones de la ficha. */
  function extra(txt){

  }
  function banderas(txt){ return new Set(String(txt || '').split(/\s+/).filter(Boolean)); }

  /** Palabras clave para el emparejamiento: descripción y sinónimos en tokens. */
  function palabrasClave(descripcion, sinonimos){
    const vistas = new Set();
    [descripcion].concat(sinonimos).forEach(t => N.Emparejamiento.tokens(t).forEach(x => vistas.add(x)));
    return Array.from(vistas).slice(0, 24);
  }

  /** Códigos que ARKEN asigna al sembrar un proyecto: prefijo por categoría y consecutivo en el orden de INSUMOS_BASE. */
  function codigosArken(){
    const n = {}, out = {};
    ANEXO_A.forEach(r => {

      n[pre] = (n[pre] || 0) + 1;
      out[r[0]] = pre + '-' + String(n[pre]).padStart(4, '0');
    });
    return out;
  }

  function grupoDe(codigo){ return TAXONOMIA.find(t => t[0] === codigo) || null; }

  /** Catálogo inicial completo. Los códigos internos son consecutivos por grupo: primero los de ARKEN, luego los nuevos. */
  function catalogo(ahora){
    const f = ahora || N.ahoraISO();
    const porGrupo = {}, arken = codigosArken(), insumos = [];
    const siguiente = g => { porGrupo[g] = (porGrupo[g] || 0) + 1; return g + '-' + String(porGrupo[g]).padStart(4, '0'); };
    ANEXO_A.forEach(r => {
      const [cod, descripcion, unidad, tipo, , grupo, cat, flags, ex] = r;
      const g = grupoDe(grupo), b = banderas(flags), e = extra(ex), codigo = siguiente(grupo);
      insumos.push(Object.assign({
        id:codigo, codigo, grupo, categoria:g[3][cat], subcategoria:'', descripcion, especificacion:'', norma:'', unidad,
        presentaciones:e.presentaciones, contenido:e.contenido, sinonimos:[], palabrasClave:palabrasClave(descripcion, []),
        categoriaArken:CATEGORIA_DE_TIPO[tipo], investigable:!b.has('n'), etiquetas:b.has('c') ? ['campestre'] : [],
        activo:true, origen:'arken', codigoSemillaArken:cod, codigoArken:arken[cod], creado:f, actualizado:f
      }, iva(grupo, b)));
    });
    NUEVOS.forEach(r => {
      const [grupo, cat, descripcion, unidad, especificacion, sin, norma, flags, ex] = r;
      const g = grupoDe(grupo), b = banderas(flags), e = extra(ex), codigo = siguiente(grupo), sinonimos = lista(sin);
      insumos.push(Object.assign({
        id:codigo, codigo, grupo, categoria:g[3][cat], subcategoria:'', descripcion, especificacion, norma, unidad,
        presentaciones:e.presentaciones, contenido:e.contenido, sinonimos, palabrasClave:palabrasClave(descripcion, sinonimos),
        categoriaArken:g[2], investigable:!b.has('n'), etiquetas:b.has('c') ? ['campestre'] : [],
        activo:true, origen:'semilla', codigoSemillaArken:'', codigoArken:'', creado:f, actualizado:f
      }, iva(grupo, b)));
    });
    return insumos;
  }

  /** Equivalencias exactas de la semilla: los 336 de ARKEN con su descripción, unidad y categoría de allá. */
  function equivalencias(insumos){
    return insumos.filter(i => i.origen === 'arken').map(i => ({
      id:'eq-' + i.id, insumoId:i.id, descripcionArken:i.descripcion, unidadArken:i.unidad, categoriaArken:i.categoriaArken,
      factor:1, codigoArken:i.codigoArken, origen:'semilla', estado:'exacta', actualizado:i.creado
    }));
  }

  /** Precios de partida de ARKEN como observaciones de referencia: alcance nacional, sin fecha de mercado. */
  function observacionesReferencia(insumos, ahora){
    const f = ahora || N.ahoraISO(), dia = f.slice(0, 10);
    const precio = {};
    ANEXO_A.forEach(r => { precio[r[0]] = Number(r[4]) || 0; });
    return insumos.filter(i => i.origen === 'arken' && precio[i.codigoSemillaArken] > 0).map(i => {
      const p = precio[i.codigoSemillaArken];
      return {
        id:'ref-' + i.codigoSemillaArken, insumoId:i.id, fuenteId:'ref-arken', vinculoId:null, ciudad:null, alcance:'nacional',
        fechaCaptura:dia, fechaPublicada:null, precioPublicado:p,
        textoLiteral:'Precio de partida del catálogo de ARKEN CONTROL: ' + N.money3(p) + ' por ' + i.unidad + ' (sin fecha de mercado).',
        unidadPublicada:i.unidad, presentacion:null, factorConversion:1, metodoConversion:'misma unidad', incluyeIva:true,
        tarifaIva:i.tarifaIva, precioSinIva:N.Impuestos.sinIva(p, i.baseIva === 'precio' ? i.tarifaIva : 0), precioConIva:N.redondear3(p),
        tipoPrecio:'referencia', condiciones:'', disponibilidad:'', proveedor:'ARKEN CONTROL', url:'', hashEvidencia:'', evidencia:'',
        metodo:'semilla', ejecucionId:null, confianza:0.2, estado:'válida', motivoEstado:'', historialEstado:[],
        vistaPorPrimeraVez:f, vistaPorUltimaVez:f, vecesVista:1, esDemo:false, esDesde:false, corrigeA:null, creado:f
      };
    });
  }

  function ciudades(){
    return CIUDADES.map(c => ({

    }));
  }

  function fuentes(ahora){

  }

  function parametros(ahora){
    const f = ahora || N.ahoraISO();
    return PARAMETROS.map((p, i) => ({

    }));
  }

  /** Cuadrillas con los id de sus oficios; las que no encuentran un oficio lo dicen. */
  function cuadrillas(insumos){
    const porDesc = new Map(insumos.map(i => [N.normaliza(i.descripcion), i]));
    return CUADRILLAS.map(([desc, comp]) => {
      const ins = porDesc.get(N.normaliza(desc));
      return { insumoId:ins ? ins.id : null, descripcion:desc,
               composicion:comp.map(([oficio, cantidad]) => { const o = porDesc.get(N.normaliza(oficio)); return { insumoId:o ? o.id : null, oficio, cantidad }; }) };
    });
  }

  /** Resumen para pruebas y para la pantalla de bienvenida. */
  function resumen(){
    const ins = catalogo('2026-10-02T00:00:00-05:00');
    return { total:ins.length, arken:ins.filter(i => i.origen === 'arken').length, nuevos:ins.filter(i => i.origen === 'semilla').length,
             campestres:ins.filter(i => i.etiquetas.indexOf('campestre') >= 0).length, noInvestigables:ins.filter(i => !i.investigable).length,
             grupos:TAXONOMIA.length, ciudades:CIUDADES.length, fuentes:FUENTES.length, parametros:PARAMETROS.length };
  }

  return { VERSION, TAXONOMIA, CIUDAD_REFERENCIA, DOMINIOS_ICOCED, CATEGORIA_DE_TIPO, catalogo, equivalencias,
           observacionesReferencia, ciudades, fuentes, parametros, cuadrillas, codigosArken, iva, resumen };
})();

  function puede(accion){

const RegistroTecnico = (function(){

  }
  function entradas(){ return lista.slice(); }
  return { anotar, entradas };
})();

});
window.addEventListener('unhandledrejection', ev => {

  const oyentes = {};

/* ══════════════════════════════════════════════════════════════════════════
   BASE DE DATOS LOCAL (IndexedDB, §6)

const BD = (function(){
  const NOMBRE = 'arken_precios', VERSION = 1;
  const ESQUEMA = {
    insumos:{ keyPath:'id', indices:{ grupo:'grupo', categoriaArken:'categoriaArken' } },
    taxonomia:{ keyPath:'codigo' },
    equivalenciasArken:{ keyPath:'id', indices:{ insumoId:'insumoId' } },
    ciudades:{ keyPath:'codigoDivipola' },
    fuentes:{ keyPath:'id' },
    vinculosProducto:{ keyPath:'id', indices:{ insumoId:'insumoId' } },

    consolidados:{ keyPath:'id', indices:{ insumoCiudadFecha:['insumoId','ciudad','fecha'] } },
    cortes:{ keyPath:'id' },
    preciosAdoptados:{ keyPath:'id', indices:{ insumoId:'insumoId' } },
    ejecuciones:{ keyPath:'id' },
    cotizaciones:{ keyPath:'id' },
    solicitudes:{ keyPath:'id' },
    fletes:{ keyPath:'id' },
    parametros:{ keyPath:'id' },
    salarios:{ keyPath:'id' },
    cuadrillas:{ keyPath:'id' },
    alertas:{ keyPath:'id' },
    vistasGuardadas:{ keyPath:'id' },
    propuestas:{ keyPath:'id' },
    listasArken:{ keyPath:'id' },
    usuarios:{ keyPath:'id' },
    auditoria:{ keyPath:'id' },
    configuracion:{ keyPath:'id' }
  };
  const ALMACENES = Object.keys(ESQUEMA);
  let db = null, backend = 'memoria';
  const memoria = {};
  ALMACENES.forEach(a => { memoria[a] = new Map(); });

  function abrir(){
    return new Promise(res => {
      if (!window.indexedDB){ res(backend = 'memoria'); return; }
      let req;
      try { req = indexedDB.open(NOMBRE, VERSION); } catch(e){ RegistroTecnico.anotar('Abrir IndexedDB', e); res(backend = 'memoria'); return; }

      req.onsuccess = () => {
        db = req.result;
        db.onversionchange = () => { db.close(); UI.toast('Se abrió una versión más nueva del programa en otra pestaña. Recargue esta.', 'bad'); };
        backend = 'indexeddb';
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
        res(backend);
      };
      req.onerror = () => { RegistroTecnico.anotar('Abrir IndexedDB', req.error); res(backend = 'memoria'); };
      req.onblocked = () => UI.toast('Cierre las otras pestañas de ARKEN PRECIOS para terminar de actualizar la base.', 'bad');
    });
  }
  /** Migraciones por versión: cada versión nueva agrega lo suyo sin tocar lo anterior. */
  function migrar(base, desde, tx){
    if (desde < 1){
      ALMACENES.forEach(nombre => {
        const def = ESQUEMA[nombre];
        if (base.objectStoreNames.contains(nombre)) return;
        const st = base.createObjectStore(nombre, { keyPath:def.keyPath });
        Object.keys(def.indices || {}).forEach(ix => st.createIndex(ix, def.indices[ix], { unique:false }));

  }

  function clave(almacen, obj){ return obj[ESQUEMA[almacen].keyPath]; }
  const copia = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));

  async function todos(almacen){
    if (backend === 'memoria') return Array.from(memoria[almacen].values()).map(copia);
    return promesa(db.transaction(almacen).objectStore(almacen).getAll());
  }
  async function obtener(almacen, id){
    if (backend === 'memoria') return copia(memoria[almacen].get(id));
    return promesa(db.transaction(almacen).objectStore(almacen).get(id));
  }
  async function porIndice(almacen, indice, valor){
    if (backend === 'memoria'){
      const k = ESQUEMA[almacen].indices[indice];
      return Array.from(memoria[almacen].values()).filter(o => o[k] === valor).map(copia);
    }
    return promesa(db.transaction(almacen).objectStore(almacen).index(indice).getAll(IDBKeyRange.only(valor)));
  }
  /** Registros cuyo índice compuesto empieza por `prefijo` (por ejemplo [insumo, ciudad]). */
  async function porPrefijo(almacen, indice, prefijo){
    const campos = ESQUEMA[almacen].indices[indice];
    if (backend === 'memoria') return Array.from(memoria[almacen].values()).filter(o => prefijo.every((v, i) => o[campos[i]] === v)).map(copia);
    return promesa(db.transaction(almacen).objectStore(almacen).index(indice).getAll(IDBKeyRange.bound(prefijo, prefijo.concat([[]]))));

    if (backend === 'memoria') return memoria[almacen].size;
    return promesa(db.transaction(almacen).objectStore(almacen).count());
  }
  /** Escribe y borra en varios almacenes dentro de una sola transacción:
      o queda todo o no queda nada. */
  async function escribir(cambios){
    const poner = cambios.poner || {}, borrar = cambios.borrar || {}, vaciar = cambios.vaciar || [];
    const nombres = Array.from(new Set(Object.keys(poner).concat(Object.keys(borrar)).concat(vaciar)));
    if (!nombres.length) return;

      vaciar.forEach(a => memoria[a].clear());
      Object.keys(borrar).forEach(a => borrar[a].forEach(id => memoria[a].delete(id)));

    vaciar.forEach(a => tx.objectStore(a).clear());
    Object.keys(borrar).forEach(a => { const st = tx.objectStore(a); borrar[a].forEach(id => st.delete(id)); });
    Object.keys(poner).forEach(a => { const st = tx.objectStore(a); poner[a].forEach(o => st.put(o)); });

  const ponerVarios = (almacen, lista) => escribir({ poner:{ [almacen]:lista } });
  const borrar = (almacen, id) => escribir({ borrar:{ [almacen]:[id] } });
  const borrarVarios = (almacen, ids) => escribir({ borrar:{ [almacen]:ids } });
  const vaciarAlmacen = almacen => escribir({ vaciar:[almacen] });

  return { abrir, todos, obtener, porIndice, porPrefijo, contar, escribir, poner, ponerVarios, borrar, borrarVarios, vaciar:vaciarAlmacen,
           ALMACENES, ESQUEMA, get backend(){ return backend; } };
})();

/* ══════════════════════════════════════════════════════════════════════════
   DATOS: CACHÉ EN MEMORIA DE LA BASE
   Una sola fuente de verdad: IndexedDB. Aquí se guarda una copia para leer
   rápido; todo cambio pasa por estas funciones, que escriben en la base,
   actualizan la copia y avisan con un evento.
   De las observaciones se guarda en memoria solo lo que usan los cálculos;
   el texto literal y la evidencia se leen de la base al abrir la ficha.
   ══════════════════════════════════════════════════════════════════════════ */
const Datos = (function(){
  const PEQUENOS = ['insumos','taxonomia','equivalenciasArken','ciudades','fuentes','vinculosProducto','cortes','preciosAdoptados',
                    'ejecuciones','cotizaciones','solicitudes','fletes','parametros','salarios','cuadrillas','alertas','vistasGuardadas',
                    'propuestas','listasArken','usuarios','configuracion'];
  const cache = {};
  const versiones = {};
  PEQUENOS.forEach(a => { cache[a] = new Map(); versiones[a] = 0; });
  const vigentes = new Map();         // insumo|ciudad → último consolidado guardado
  const obsPorId = new Map();          // id → observación ligera
  const obsPorInsumo = new Map();      // insumoId → [observaciones ligeras]
  let versionObs = 0, versionCons = 0;
  const memo = {};

  const CAMPOS_LIGEROS = ['id','insumoId','ciudad','fuenteId','fechaCaptura','fechaPublicada','precioPublicado','unidadPublicada','presentacion',
    'incluyeIva','precioConIva','precioSinIva','estado','tipoPrecio','metodo','esDesde','confianza','proveedor','esDemo','url','corrigeA',
    'cotizacionId','vecesVista','vistaPorUltimaVez','alcance'];
  function ligera(o){ const x = {}; CAMPOS_LIGEROS.forEach(k => { if (o[k] !== undefined) x[k] = o[k]; }); return x; }
  const claveAlm = (a, o) => o[BD.ESQUEMA[a].keyPath];

  /* ── Carga ── */
  async function cargar(){
    for (const a of PEQUENOS){
      const filas = await BD.todos(a);
      cache[a] = new Map(filas.map(o => [claveAlm(a, o), o]));
      versiones[a]++;
    }
    await cargarConsolidados();
    await cargarObservaciones();
  }
  async function cargarConsolidados(){
    vigentes.clear();
    (await BD.todos('consolidados')).forEach(c => {
      const k = c.insumoId + '|' + c.ciudad, x = vigentes.get(k);
      if (!x || String(c.fecha) > String(x.fecha) || (c.fecha === x.fecha && String(c.calculado || '') > String(x.calculado || ''))) vigentes.set(k, c);
    });
    versionCons++;
  }
  async function cargarObservaciones(){
    obsPorId.clear(); obsPorInsumo.clear();
    (await BD.todos('observaciones')).forEach(o => indexarObs(ligera(o)));
    versionObs++;
  }
  function indexarObs(x){
    const previa = obsPorId.get(x.id);
    obsPorId.set(x.id, x);
    let l = obsPorInsumo.get(x.insumoId);
    if (!l){ l = []; obsPorInsumo.set(x.insumoId, l); }
    if (previa){ const i = l.findIndex(o => o.id === x.id); if (i >= 0) l[i] = x; else l.push(x); }
    else l.push(x);
  }

  /* ── Lectura genérica ── */
  function lista(a){ return Array.from(cache[a].values()); }
  function uno(a, id){ return cache[a].get(id) || null; }
  function memorizar(nombre, dependencias, fn){
    const firma = dependencias.map(d => d === 'obs' ? versionObs : (d === 'cons' ? versionCons : versiones[d])).join('|');
    if (memo[nombre] && memo[nombre].firma === firma) return memo[nombre].valor;
    const valor = fn();
    memo[nombre] = { firma, valor };
    return valor;
  }

  /* ── Escritura genérica ── */
  async function guardar(a, obj){
    await BD.poner(a, obj);
    cache[a].set(claveAlm(a, obj), obj); versiones[a]++;
    Eventos.emitir('cambio', { almacen:a });
    return obj;
  }
  async function guardarVarios(a, objs){
    if (!objs.length) return;
    await BD.ponerVarios(a, objs);
    objs.forEach(o => cache[a].set(claveAlm(a, o), o)); versiones[a]++;
    Eventos.emitir('cambio', { almacen:a });
  }
  async function borrar(a, id){
    await BD.borrar(a, id);
    cache[a].delete(id); versiones[a]++;
    Eventos.emitir('cambio', { almacen:a });
  }
  async function borrarVarios(a, ids){
    if (!ids.length) return;
    await BD.borrarVarios(a, ids);
    ids.forEach(id => cache[a].delete(id)); versiones[a]++;
    Eventos.emitir('cambio', { almacen:a });
  }

  /* ── Configuración: registros {id, valor} ── */
  function config(id, porDefecto){
    const r = cache.configuracion.get(id);
    return r ? r.valor : porDefecto;
  }
  async function fijarConfig(id, valor){ await guardar('configuracion', { id, valor, actualizado:ahoraISO() }); }

  /* ── Catálogo ── */
  function insumos(){ return memorizar('insumos', ['insumos'], () => lista('insumos').sort((a,b) => a.codigo < b.codigo ? -1 : (a.codigo > b.codigo ? 1 : 0))); }
  function insumosActivos(){ return memorizar('activos', ['insumos'], () => insumos().filter(i => i.activo !== false)); }
  function insumo(id){ return uno('insumos', id); }
  function insumosPorId(){ return memorizar('insPorId', ['insumos'], () => { const o = {}; lista('insumos').forEach(i => { o[i.id] = i; }); return o; }); }
  function taxonomia(){ return memorizar('tax', ['taxonomia'], () => lista('taxonomia').sort((a,b) => a.codigo < b.codigo ? -1 : 1)); }
  function grupo(codigo){ return uno('taxonomia', codigo); }
  function equivalencias(){ return lista('equivalenciasArken'); }
  /** Equivalencia vigente de un insumo: la exacta si la hay; si no, la propuesta. */
  function equivalencia(insumoId){
    const m = memorizar('eqPorIns', ['equivalenciasArken'], () => {
      const x = new Map();
      lista('equivalenciasArken').forEach(e => {
        const p = x.get(e.insumoId);
        if (!p || (p.estado !== 'exacta' && e.estado === 'exacta')) x.set(e.insumoId, e);
      });
      return x;
    });
    return m.get(insumoId) || null;
  }

  /* ── Ciudades ── */
  function ciudades(){ return memorizar('ciu', ['ciudades'], () => lista('ciudades').sort((a,b) => (b.esReferencia - a.esReferencia) || a.nombre.localeCompare(b.nombre, 'es'))); }
  function ciudadesActivas(){ return ciudades().filter(c => c.activa); }
  function ciudad(cod){ return uno('ciudades', cod); }
  function ciudadesPorCodigo(){ return memorizar('ciuPorCod', ['ciudades'], () => { const o = {}; lista('ciudades').forEach(c => { o[c.codigoDivipola] = c; }); return o; }); }
  function ciudadReferencia(){
    const cod = config('ciudadReferencia', Semilla.CIUDAD_REFERENCIA);
    return ciudad(cod) || ciudades().find(c => c.esReferencia) || ciudades()[0] || null;
  }
  function nombreCiudad(cod){ if (!cod) return 'Nacional'; const c = ciudad(cod); return c ? c.nombre : cod; }

  /* ── Fuentes ── */
  function fuentes(){ return memorizar('fue', ['fuentes'], () => lista('fuentes').sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'))); }
  function fuente(id){ return uno('fuentes', id); }
  function nombreFuente(id){ const f = fuente(id); return f ? f.nombre : (id || '—'); }

  /* ── Observaciones ── */
  function obs(insumoId){ return obsPorInsumo.get(insumoId) || []; }
  function obsTodas(){ return obsPorId; }
  function totalObs(){ return obsPorId.size; }
  /** Guarda observaciones nuevas o actualizadas (completas) y refresca la caché ligera. */
  async function guardarObservaciones(lista2){
    if (!lista2.length) return;
    for (let i = 0; i < lista2.length; i += 2000) await BD.ponerVarios('observaciones', lista2.slice(i, i + 2000));
    lista2.forEach(o => indexarObs(ligera(o)));
    versionObs++;
    Eventos.emitir('observaciones', { n:lista2.length });
  }
  async function borrarObservaciones(ids){
    if (!ids.length) return;
    for (let i = 0; i < ids.length; i += 2000) await BD.borrarVarios('observaciones', ids.slice(i, i + 2000));
    const set = new Set(ids);
    ids.forEach(id => obsPorId.delete(id));
    obsPorInsumo.forEach((l, k) => { const f = l.filter(o => !set.has(o.id)); if (f.length) obsPorInsumo.set(k, f); else obsPorInsumo.delete(k); });
    versionObs++;
    Eventos.emitir('observaciones', { borradas:ids.length });
  }
  async function observacionesCompletas(insumoId){ return BD.porIndice('observaciones', 'insumoId', insumoId); }
  async function observacion(id){ return BD.obtener('observaciones', id); }

  /* ── Consolidados ── */
  function consolidado(insumoId, ciudadCod){ return vigentes.get(insumoId + '|' + ciudadCod) || null; }
  function consolidados(){ return vigentes; }
  /** Guarda un lote de consolidados fechados: cada cálculo queda con su fecha
      y el de hoy reemplaza solo al de hoy del mismo insumo y ciudad. */
  async function guardarConsolidados(filas){
    if (!filas.length) return;
    for (let i = 0; i < filas.length; i += 2000) await BD.ponerVarios('consolidados', filas.slice(i, i + 2000));
    filas.forEach(c => { const k = c.insumoId + '|' + c.ciudad, x = vigentes.get(k); if (!x || String(c.fecha) >= String(x.fecha)) vigentes.set(k, c); });
    versionCons++;
    Eventos.emitir('consolidados', { n:filas.length });
  }
  async function borrarConsolidadosDe(predicado){
    const todos2 = await BD.todos('consolidados');
    const ids = todos2.filter(predicado).map(c => c.id);
    for (let i = 0; i < ids.length; i += 2000) await BD.borrarVarios('consolidados', ids.slice(i, i + 2000));
    await cargarConsolidados();
    return ids.length;
  }

  /* ── Cortes y precios adoptados ── */
  function cortes(){ return memorizar('cortes', ['cortes'], () => lista('cortes').sort((a,b) => String(b.fecha + b.creado) < String(a.fecha + a.creado) ? -1 : 1)); }
  function corte(id){ return uno('cortes', id); }
  function corteActivo(){ const id = config('corteActivo', null); return id ? corte(id) : null; }
  /** Precio adoptado vigente para un insumo en una ciudad, a una fecha. */
  function adoptado(insumoId, ciudadCod, fecha){
    const f = String(fecha || hoyISO()).slice(0,10);
    return lista('preciosAdoptados').filter(a => a.insumoId === insumoId && a.ciudad === ciudadCod && !a.retirado &&
      (!a.vigenteDesde || a.vigenteDesde <= f) && (!a.vigenteHasta || a.vigenteHasta >= f))
      .sort((a,b) => String(a.creado) < String(b.creado) ? 1 : -1)[0] || null;
  }

  /* ── Parámetros y usuarios ── */
  function parametros(){ return lista('parametros'); }
  function usuarios(){ return lista('usuarios'); }

  return { cargar, cargarObservaciones, cargarConsolidados, lista, uno, guardar, guardarVarios, borrar, borrarVarios, config, fijarConfig,
           insumos, insumosActivos, insumo, insumosPorId, taxonomia, grupo, equivalencias, equivalencia,
           ciudades, ciudadesActivas, ciudad, ciudadesPorCodigo, ciudadReferencia, nombreCiudad,
           fuentes, fuente, nombreFuente, obs, obsTodas, totalObs, guardarObservaciones, borrarObservaciones, observacionesCompletas, observacion,
           consolidado, consolidados, guardarConsolidados, borrarConsolidadosDe, cortes, corte, corteActivo, adoptado,
           parametros, usuarios, ligera, memorizar, PEQUENOS,
           get versionObs(){ return versionObs; }, get versionCons(){ return versionCons; } };
})();

/* ══════════════════════════════════════════════════════════════════════════
   AUDITORÍA
   Quién hizo qué y cuándo. No se edita ni se borra desde el programa.
   ══════════════════════════════════════════════════════════════════════════ */
const Auditoria = (function(){
  async function registrar(accion, detalle, extra){
    const u = Sesion.usuario;
    const reg = Object.assign({ id:uid('au'), fecha:ahoraISO(), usuario:u ? u.usuario : 'sistema', accion:String(accion), detalle:String(detalle || '') }, extra || {});
    try { await BD.poner('auditoria', reg); } catch(e){ RegistroTecnico.anotar('Auditoría', e); }
    return reg;
  }
  async function lista(limite){
    const todos = await BD.todos('auditoria');
    todos.sort((a,b) => a.fecha < b.fecha ? 1 : (a.fecha > b.fecha ? -1 : 0));
    return limite ? todos.slice(0, limite) : todos;
  }
  return { registrar, lista };
})();


/* ══════════════════════════════════════════════════════════════════════════
   INGRESO, CONTRASEÑAS Y SESIÓN
   Contraseñas con PBKDF2-HMAC-SHA256 (600.000 iteraciones, sal de 16 bytes)
   calculado con WebCrypto; nunca se guardan en texto plano. El primer
   ingreso es admin / arken y obliga a cambiar la contraseña. Cinco intentos
   fallidos bloquean ese usuario 15 minutos en este navegador.
   ══════════════════════════════════════════════════════════════════════════ */
const Auth = (function(){
  const ITERACIONES = 600000;
  const MAX_INTENTOS = 5, BLOQUEO_MIN = 15;
  const CLAVE_INICIAL = 'arken';
  let temporizador = null;

  async function derivar(contrasena, salHex, iteraciones){
    const sal = Cripto.deHex(salHex);
    if (window.crypto && crypto.subtle){
      try {
        const k = await crypto.subtle.importKey('raw', Cripto.utf8(contrasena), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:sal, iterations:iteraciones }, k, 256);
        return Cripto.hex(new Uint8Array(bits));
      } catch(e){ RegistroTecnico.anotar('PBKDF2 con WebCrypto (se usa la versión en JavaScript)', e); }
    }
    return Cripto.pbkdf2(contrasena, sal, iteraciones);
  }
  function salNueva(){
    const b = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
    else for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    return Cripto.hex(b);
  }
  /** Compara sin cortar en la primera diferencia. */
  function iguales(a, b){
    const x = String(a || ''), y = String(b || '');
    let d = x.length ^ y.length;
    for (let i = 0; i < Math.max(x.length, y.length); i++) d |= (x.charCodeAt(i) || 0) ^ (y.charCodeAt(i) || 0);
    return d === 0;
  }
  async function conContrasena(usuario, contrasena){
    const sal = salNueva();
    return Object.assign({}, usuario, { sal, iteraciones:ITERACIONES, hash:await derivar(contrasena, sal, ITERACIONES), claveCambiada:ahoraISO() });
  }
  async function verificar(usuario, contrasena){
    if (!usuario || !usuario.hash || !usuario.sal) return false;
    return iguales(await derivar(contrasena, usuario.sal, usuario.iteraciones || ITERACIONES), usuario.hash);
  }
  async function usuarioInicial(){
    return conContrasena({ id:'u-admin', usuario:'admin', nombre:'Administrador', rol:'administrador', activo:true,
                           cambiarClave:true, creado:ahoraISO() }, CLAVE_INICIAL);
  }

  /* ── Bloqueo por intentos (en este navegador, durante la sesión del navegador) ── */
  function leerIntentos(){ try { return JSON.parse(sessionStorage.getItem('arkenPrecios.intentos') || '{}'); } catch(e){ return Sesion.intentos; } }
  function guardarIntentos(o){ Sesion.intentos = o; try { sessionStorage.setItem('arkenPrecios.intentos', JSON.stringify(o)); } catch(e){} }
  function minutosBloqueo(nombre){
    const r = leerIntentos()[nombre];
    if (!r || !r.hasta) return 0;
    const falta = r.hasta - Date.now();
    return falta > 0 ? Math.ceil(falta / 60000) : 0;
  }
  function fallo(nombre){
    const o = leerIntentos(); const r = o[nombre] || { n:0 };
    r.n = (r.n || 0) + 1;
    if (r.n >= MAX_INTENTOS){ r.hasta = Date.now() + BLOQUEO_MIN * 60000; r.n = 0; }
    o[nombre] = r; guardarIntentos(o);
    return r;
  }
  function limpiarIntentos(nombre){ const o = leerIntentos(); delete o[nombre]; guardarIntentos(o); }

  /* ── Pantalla de ingreso ── */
  function error(msg){ $('#gateErr').innerHTML = msg ? '<div class="gate-err">' + esc(msg) + '</div>' : ''; }
  function pintarPista(){
    const admin = Datos.usuarios().find(u => u.usuario === 'admin' && u.cambiarClave);
    $('#gHint').innerHTML = admin ? 'Primer ingreso: <b>admin</b> / <b>arken</b>' : '';
  }
  function conectar(){
    $('#gAnio').textContent = hoyISO().slice(0,4);
    pintarPista();
    $('#gBtn').onclick = ingresar;
    $('#gPass').onkeydown = e => { if (e.key === 'Enter') ingresar(); };
    $('#gUser').onkeydown = e => { if (e.key === 'Enter') $('#gPass').focus(); };
    $('#gImport').onclick = () => Respaldos.restaurarDesdeIngreso();
  }
  let ocupado = false;
  async function ingresar(){
    if (ocupado) return;
    const nombre = normaliza($('#gUser').value), clave = $('#gPass').value;
    if (!nombre || !clave){ error('Escriba su usuario y su contraseña.'); return; }
    const min = minutosBloqueo(nombre);
    if (min){ error('Demasiados intentos fallidos. Este usuario queda bloqueado ' + min + ' minuto(s) más en este navegador.'); return; }
    ocupado = true; $('#gBtn').disabled = true; $('#gBtn').textContent = 'Verificando…';
    try {
      const u = Datos.usuarios().find(x => normaliza(x.usuario) === nombre && x.activo !== false);
      const ok = u ? await verificar(u, clave) : (await derivar(clave, salNueva(), 1000), false);
      if (!ok){
        const r = fallo(nombre);
        error(r.hasta ? 'Demasiados intentos fallidos: el usuario queda bloqueado ' + BLOQUEO_MIN + ' minutos.' :
              'Usuario o contraseña incorrectos. Le quedan ' + (MAX_INTENTOS - r.n) + ' intento(s).');
        await Auditoria.registrar('ingreso fallido', nombre);
        return;
      }
      limpiarIntentos(nombre); error('');
      $('#gPass').value = '';
      Sesion.usuario = u;
      if (u.cambiarClave) await cambioObligatorio(u);
      const actual = Datos.uno('usuarios', u.id) || u;
      await Datos.guardar('usuarios', Object.assign({}, actual, { ultimoIngreso:ahoraISO() }));
      Sesion.usuario = Datos.uno('usuarios', u.id);
      await Auditoria.registrar('ingreso', Sesion.usuario.usuario);
      await App.abrirSistema();
    } catch(e){
      RegistroTecnico.anotar('Ingreso', e);
      error('No fue posible ingresar: ' + (e.message || e));
    } finally {
      ocupado = false; $('#gBtn').disabled = false; $('#gBtn').textContent = 'Ingresar';
    }
  }

  /** Primer ingreso: no se sigue sin cambiar la contraseña. */
  function cambioObligatorio(u){
    return new Promise(res => {
      const m = UI.modal({
        titulo:'Cambie su contraseña', eyebrow:'Primer ingreso', fijo:true,
        cuerpo:'<p class="small muted">La contraseña inicial es pública. Escriba una nueva de al menos 5 caracteres; solo usted la conocerá.</p>' +
          '<div class="field"><label for="ccA">Nueva contraseña</label><input id="ccA" type="password" autocomplete="new-password"></div>' +
          '<div class="field" style="margin-top:10px"><label for="ccB">Repítala</label><input id="ccB" type="password" autocomplete="new-password"></div>',
        botones:[{ texto:'Guardar contraseña', clase:'primary', accion: async mm => {
          const a = $('#ccA', mm.el).value, b = $('#ccB', mm.el).value;
          if (a.length < 5){ UI.toast('La contraseña debe tener al menos 5 caracteres', 'bad'); return; }
          if (a !== b){ UI.toast('Las dos contraseñas no coinciden', 'bad'); return; }
          if (a === CLAVE_INICIAL){ UI.toast('Use una contraseña distinta de la inicial', 'bad'); return; }
          const nuevo = await conContrasena(Object.assign({}, Datos.uno('usuarios', u.id) || u, { cambiarClave:false }), a);
          await Datos.guardar('usuarios', nuevo);
          await Auditoria.registrar('cambio de contraseña', u.usuario);
          Sesion.usuario = nuevo;
          mm.cerrar(); res(nuevo);
        } }]
      });
      setTimeout(() => { const i = $('#ccA', m.el); if (i) i.focus(); }, 60);
    });
  }

  /** Cambio voluntario desde el riel. */
  async function cambiarPropia(){
    const u = Sesion.usuario; if (!u) return;
    const d = await UI.pedir({ titulo:'Cambiar mi contraseña', eyebrow:u.usuario, cols:1, campos:[
      { k:'actual', lab:'Contraseña actual', tipo:'password', req:true },
      { k:'nueva', lab:'Nueva contraseña (mínimo 5 caracteres)', tipo:'password', req:true },
      { k:'repite', lab:'Repita la nueva', tipo:'password', req:true }
    ], validar: d2 => d2.nueva.length < 5 ? 'La contraseña debe tener al menos 5 caracteres' : (d2.nueva !== d2.repite ? 'Las contraseñas no coinciden' : '') });
    if (!d) return;
    if (!(await verificar(Datos.uno('usuarios', u.id), d.actual))){ UI.toast('La contraseña actual no es correcta', 'bad'); return; }
    const nuevo = await conContrasena(Object.assign({}, Datos.uno('usuarios', u.id), { cambiarClave:false }), d.nueva);
    await Datos.guardar('usuarios', nuevo);
    Sesion.usuario = nuevo;
    await Auditoria.registrar('cambio de contraseña', u.usuario);
    UI.toast('Contraseña cambiada', 'ok');
  }

  /* ── Cierre de sesión e inactividad ── */
  function salir(motivo){
    if (!Sesion.usuario) return;
    const quien = Sesion.usuario.usuario;
    Auditoria.registrar(motivo === 'inactividad' ? 'cierre por inactividad' : 'salida', quien);
    Sesion.usuario = null;
    $$('#modales .overlay').forEach(o => o.remove());
    $('#topbar').style.display = 'none'; $('#ledger').style.display = 'none'; $('#shell').style.display = 'none';
    $('#stage').innerHTML = '';
    $('#gate').style.display = '';
    pintarPista();
    error(motivo === 'inactividad' ? 'La sesión se cerró por inactividad. Ingrese de nuevo.' : '');
    setTimeout(() => $('#gUser').focus(), 50);
  }
  function vigilarInactividad(){
    const marcar = () => { Sesion.ultimaActividad = Date.now(); };
    ['mousemove','keydown','click','touchstart','scroll'].forEach(t => window.addEventListener(t, marcar, { passive:true }));
    if (temporizador) clearInterval(temporizador);
    temporizador = setInterval(() => {
      const min = Number(Datos.config('inactividadMin', 30)) || 0;
      if (!Sesion.usuario || !min) return;
      if (Date.now() - Sesion.ultimaActividad > min * 60000) salir('inactividad');
    }, 30000);
  }

  return { conectar, salir, vigilarInactividad, conContrasena, verificar, usuarioInicial, cambiarPropia, pintarPista, ITERACIONES };
})();


/* ══════════════════════════════════════════════════════════════════════════
   UI · piezas de interfaz de ARKEN CONTROL

const UI = (function(){

  /* ─────────── Modal ─────────── */
  let zIndex = 600;
  function modal(cfg){
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.style.zIndex = (++zIndex);
    const botones = (cfg.botones || []).map((b,i) =>
      '<button class="btn ' + (b.clase || '') + '" data-b="' + i + '" type="button"' + (b.deshabilitado ? ' disabled' : '') +
      (b.id ? ' id="' + esc(b.id) + '"' : '') + '>' + esc(b.texto) + '</button>').join('');
    ov.innerHTML =
      '<div class="modal ' + (cfg.ancho || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(cfg.titulo || '') + '">' +
        '<div class="modal-head"><div>' +
          (cfg.eyebrow ? '<div class="eyebrow">' + esc(cfg.eyebrow) + '</div>' : '') +
          '<h3>' + esc(cfg.titulo || '') + '</h3></div>' +
          (cfg.fijo ? '' : '<button class="x" data-cerrar="1" type="button" aria-label="Cerrar">✕</button>') + '</div>' +
        '<div class="modal-body">' + (cfg.cuerpo || '') + '</div>' +
        (botones ? '<div class="modal-foot">' + botones + '</div>' : '') +
      '</div>';
    $('#modales').appendChild(ov);
    const anterior = document.activeElement;
    const api = {
      el: ov,
      cerrar(){ if (!ov.isConnected) return; ov.remove(); if (cfg.alCerrar) cfg.alCerrar(); try { if (anterior && anterior.focus) anterior.focus(); } catch(e){} },
      cuerpo(){ return $('.modal-body', ov); },
      pie(){ return $('.modal-foot', ov); }
    };
    const x = $('[data-cerrar]', ov);
    if (x) x.onclick = () => { if (cfg.alIntentarCerrar && cfg.alIntentarCerrar() === false) return; api.cerrar(); };
    ov.addEventListener('mousedown', e => {
      if (e.target === ov && !cfg.fijo){ if (cfg.alIntentarCerrar && cfg.alIntentarCerrar() === false) return; api.cerrar(); }
    });
    $$('[data-b]', ov).forEach(b => b.onclick = () => {
      const def = cfg.botones[+b.dataset.b];
      if (def.accion) def.accion(api);
      else api.cerrar();
    });
    document.addEventListener('keydown', function escape(e){
      if (!document.body.contains(ov)){ document.removeEventListener('keydown', escape); return; }
      if (e.key === 'Escape' && !cfg.fijo && ov.style.zIndex == zIndex){
        if (cfg.alIntentarCerrar && cfg.alIntentarCerrar() === false) return;
        api.cerrar(); document.removeEventListener('keydown', escape);
      }
    });
    if (cfg.alAbrir) setTimeout(() => { if (document.body.contains(ov)) cfg.alAbrir(api); }, 0);
    const f = $('input:not([type=hidden]),select,textarea', ov);
    if (f && !cfg.sinFoco) setTimeout(() => { try { f.focus(); } catch(e){} }, 40);
    return api;
  }
  function aviso(titulo, html, ancho){
    return modal({ titulo, ancho:ancho || '', cuerpo:html, botones:[{ texto:'Entendido', clase:'primary' }] });

  function confirmar(cfg){

          { texto:cfg.textoCancelar || 'Cancelar', accion: m => { listo = true; m.cerrar(); res(false); } },
          { texto:cfg.textoAceptar || 'Aceptar', clase:cfg.claseAceptar || 'primary', accion: m => { listo = true; m.cerrar(); res(true); } }
        ],
        alCerrar(){ if (!listo) res(false); }

  /** Borrado: nombre exacto, consecuencias y, si pesa, la palabra ELIMINAR. */

  /* ─────────── Formularios declarativos ───────────
     campos: [{ k, lab, tipo, val, opts, req, col, ayuda, min, max, step, ph, dis, filas }] */
  function campoHTML(c){
    const id = 'f_' + c.k;
    const col = c.col ? ' style="grid-column:span ' + c.col + '"' : '';
    let ctrl = '';
    const val = c.val === undefined || c.val === null ? '' : c.val;
    switch (c.tipo){
      case 'select':
        ctrl = '<select id="' + id + '" data-k="' + esc(c.k) + '"' + (c.dis ? ' disabled' : '') + '>' + selectOpts(c.opts || [], val) + '</select>';
        break;
      case 'textarea':
        ctrl = '<textarea id="' + id + '" data-k="' + esc(c.k) + '" rows="' + (c.filas || 3) + '"' +
          (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + (c.dis ? ' disabled' : '') + '>' + esc(val) + '</textarea>';
        break;
      case 'check':
        return '<label class="checkline"' + col + '><input type="checkbox" id="' + id + '" data-k="' + esc(c.k) +
          '" data-tipo="check"' + (val ? ' checked' : '') + (c.dis ? ' disabled' : '') + '> ' + esc(c.lab) + '</label>';
      case 'number': case 'money': case 'cantidad':
        ctrl = '<input id="' + id + '" data-k="' + esc(c.k) + '" data-tipo="' + c.tipo + '" type="number" value="' + esc(val) +
          '" step="' + (c.step || (c.tipo === 'cantidad' ? '0.0001' : (c.tipo === 'money' ? '0.001' : 'any'))) + '"' +
          (c.min !== undefined ? ' min="' + c.min + '"' : '') + (c.max !== undefined ? ' max="' + c.max + '"' : '') +
          (c.dis ? ' disabled' : '') + ' inputmode="decimal">';
        break;
      case 'date':
        ctrl = '<input id="' + id + '" data-k="' + esc(c.k) + '" type="date" value="' + esc(val) + '"' + (c.dis ? ' disabled' : '') + '>';
        break;
      case 'color':
        ctrl = '<input id="' + id + '" data-k="' + esc(c.k) + '" type="color" value="' + esc(val || '#41464C') + '">';
        break;
      case 'html':
        return '<div' + col + '>' + (c.html || '') + '</div>';
      default:
        ctrl = '<input id="' + id + '" data-k="' + esc(c.k) + '" type="' + (c.tipo === 'password' ? 'password' : 'text') + '" value="' + esc(val) + '"' +
          (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + (c.dis ? ' disabled' : '') + ' autocomplete="' + (c.tipo === 'password' ? 'new-password' : 'off') + '">';
    }
    return '<div class="field"' + col + '><label for="' + id + '">' + esc(c.lab) + (c.req ? ' *' : '') + '</label>' + ctrl +
      (c.ayuda ? '<div class="muted small">' + c.ayuda + '</div>' : '') + '</div>';
  }
  function formHTML(campos, cols){
    return '<div class="grid" style="grid-template-columns:repeat(' + (cols || 2) + ',minmax(0,1fr))">' + campos.map(campoHTML).join('') + '</div>';
  }
  function leerForm(raiz){
    const o = {};
    $$('[data-k]', raiz).forEach(e => {
      const k = e.dataset.k, t = e.dataset.tipo;
      if (t === 'check') o[k] = e.checked;
      else if (t === 'money') o[k] = redondear3(e.value || 0);
      else if (t === 'cantidad') o[k] = redondearDec(e.value || 0, 4);
      else if (e.type === 'number') o[k] = e.value === '' ? '' : Number(e.value);
      else o[k] = e.value;
    });
    return o;
  }
  function faltantes(campos, datos){
    return campos.filter(c => c.req && !String(datos[c.k] === undefined ? '' : datos[c.k]).trim()).map(c => c.lab);
  }
  /** Modal de formulario. Devuelve una promesa con los datos o null. */
  function pedir(cfg){
    return new Promise(res => {
      let listo = false;
      modal({
        titulo:cfg.titulo, eyebrow:cfg.eyebrow, ancho:cfg.ancho || '',
        cuerpo:(cfg.intro || '') + formHTML(cfg.campos, cfg.cols) + (cfg.extra || ''), fijo:cfg.fijo,
        botones:[
          { texto:'Cancelar', accion: mm => { listo = true; mm.cerrar(); res(null); } },
          { texto:cfg.textoAceptar || 'Guardar', clase:'primary', accion: mm => {
              const d = leerForm(mm.el);
              const f = faltantes(cfg.campos, d);
              if (f.length){ toast('Faltan campos obligatorios: ' + f.join(', '), 'bad'); return; }
              if (cfg.validar){ const err = cfg.validar(d, mm); if (err){ toast(err, 'bad'); return; } }
              listo = true; mm.cerrar(); res(d);
            } }
        ],
        alCerrar(){ if (!listo) res(null); },
        alAbrir:cfg.alAbrir
      });
    });
  }

  /* ─────────── Archivos ─────────── */
  /** Pide un archivo. modo: 'dataurl' (por defecto), 'texto' o 'binario' (ArrayBuffer). */
  function pedirArchivo(accept, cb, modo){
    const inp = $('#filePicker');
    inp.value = ''; inp.accept = accept || '';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => cb({ nombre:f.name, tipo:f.type, peso:f.size, datos:r.result, archivo:f });
      r.onerror = () => toast('No fue posible leer el archivo. Compruebe que no esté abierto en otro programa.', 'bad');
      if (modo === 'texto' || modo === true) r.readAsText(f);
      else if (modo === 'binario') r.readAsArrayBuffer(f);
      else r.readAsDataURL(f);
    };
    inp.click();
  }
  function descargar(nombre, contenido, mime){
    const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type:mime || 'application/octet-stream' });
    if (window.arkenApp && typeof window.arkenApp.descargar === 'function'){ window.arkenApp.descargar(nombre, blob); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
  }
  async function guardarComo(nombre, blob, tipos){
    if (window.showSaveFilePicker){
      try {
        const h = await window.showSaveFilePicker({ suggestedName:nombre, types:tipos });
        const w = await h.createWritable();
        await w.write(blob); await w.close();
        return true;
      } catch(e){ if (e && e.name === 'AbortError') return false; }
    }
    descargar(nombre, blob);
    return true;
  }

  /* ─────────── Tablas y listas ─────────── */
  function selectOpts(lista, val, vacio){
    let h = vacio !== undefined && vacio !== null ? '<option value="">' + esc(vacio) + '</option>' : '';
    h += (lista || []).map(o => {
      const v = (typeof o === 'object') ? o.v : o;
      const n = (typeof o === 'object') ? o.n : o;
      const sel = Array.isArray(val) ? val.map(String).indexOf(String(v)) >= 0 : String(v) === String(val);
      return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    return h;
  }
  function conectarOrden(tablaSel){
    const tb = typeof tablaSel === 'string' ? $(tablaSel) : tablaSel; if (!tb) return;
    $$('thead th', tb).forEach((th, i) => {
      if (th.dataset.noOrden !== undefined) return;
      th.style.cursor = 'pointer'; th.title = 'Ordenar por esta columna';
      th.onclick = () => {
        const cuerpo = $('tbody', tb); if (!cuerpo) return;
        const filas = Array.from(cuerpo.rows).filter(r => !r.dataset.fijo);
        const asc = th.dataset.dir !== 'asc';
        $$('thead th', tb).forEach(x => delete x.dataset.dir);
        th.dataset.dir = asc ? 'asc' : 'desc';
        filas.sort((a,b) => {
          const x = (a.cells[i] || {}).dataset ? (a.cells[i].dataset.v !== undefined ? a.cells[i].dataset.v : a.cells[i].textContent) : '';
          const y = (b.cells[i] || {}).dataset ? (b.cells[i].dataset.v !== undefined ? b.cells[i].dataset.v : b.cells[i].textContent) : '';
          const nx = parseFloat(String(x).replace(/[^\d.-]/g,'')), ny = parseFloat(String(y).replace(/[^\d.-]/g,''));
          const cmp = (!isNaN(nx) && !isNaN(ny) && /\d/.test(x) && /\d/.test(y)) ? (nx - ny) : String(x).localeCompare(String(y), 'es');
          return asc ? cmp : -cmp;
        });
        filas.forEach(f => cuerpo.appendChild(f));
      };
    });
  }
  function vacio(icono, titulo, texto){
    return '<div class="empty"><div class="ic">' + (icono || '○') + '</div><h4>' + esc(titulo) + '</h4><p class="small">' + (texto || '') + '</p></div>';
  }
  function tabs(lista, activo, onCambio, sub){
    const id = uid('tb');
    setTimeout(() => { $$('#' + id + ' .tab').forEach(b => b.onclick = () => onCambio(b.dataset.k)); }, 0);
    return '<div class="tabs' + (sub ? ' sub' : '') + '" id="' + id + '" role="tablist">' + lista.map(t =>
      '<button class="tab' + (t.k === activo ? ' active' : '') + '" data-k="' + esc(t.k) + '" type="button" role="tab" aria-selected="' + (t.k === activo) + '">' +
      esc(t.n) + '</button>').join('') + '</div>';
  }

  /** Paginador: «Anterior · página x de y · Siguiente». */
  function paginador(total, pagina, porPagina, onCambio){
    const paginas = Math.max(1, Math.ceil(total / porPagina));
    const p = Math.min(Math.max(1, pagina), paginas);
    if (paginas <= 1) return '<div class="paginador"><span class="muted">' + total + ' fila(s)</span></div>';
    const id = uid('pg');
    setTimeout(() => {
      $$('#' + id + ' [data-pg]').forEach(b => b.onclick = () => onCambio(Number(b.dataset.pg)));
    }, 0);
    return '<div class="paginador" id="' + id + '"><span class="muted">' + total + ' filas · página ' + p + ' de ' + paginas + '</span>' +
      '<div class="btn-row"><button class="btn sm" type="button" data-pg="1"' + (p === 1 ? ' disabled' : '') + '>Primera</button>' +
      '<button class="btn sm" type="button" data-pg="' + (p - 1) + '"' + (p === 1 ? ' disabled' : '') + '>Anterior</button>' +
      '<button class="btn sm" type="button" data-pg="' + (p + 1) + '"' + (p === paginas ? ' disabled' : '') + '>Siguiente</button>' +
      '<button class="btn sm" type="button" data-pg="' + paginas + '"' + (p === paginas ? ' disabled' : '') + '>Última</button></div></div>';
  }

  /** Selector múltiple en ventana flotante. */
  function multi(id, opciones, seleccion, rotulo){
    const sel = new Set((seleccion || []).map(String));
    const texto = () => {
      const n = sel.size;
      if (!n) return rotulo || 'Todas';
      if (n === 1){ const o = opciones.find(x => String(x.v) === Array.from(sel)[0]); return o ? o.n : '1 elegida'; }
      return n + ' elegidas';
    };
    setTimeout(() => {
      const raiz = document.getElementById(id); if (!raiz) return;
      const btn = $('button.multi-btn', raiz);
      btn.onclick = e => { e.stopPropagation(); raiz.classList.toggle('abierto'); };
      $$('input[type=checkbox]', raiz).forEach(c => c.onchange = () => {
        if (c.checked) sel.add(c.value); else sel.delete(c.value);
        $('.multi-txt', raiz).textContent = texto();
        raiz.dispatchEvent(new CustomEvent('cambio', { detail:Array.from(sel) }));
      });
      $$('[data-multi]', raiz).forEach(b => b.onclick = () => {
        const todos = b.dataset.multi === 'todos';
        $$('input[type=checkbox]', raiz).forEach(c => { c.checked = todos; if (todos) sel.add(c.value); else sel.delete(c.value); });
        $('.multi-txt', raiz).textContent = texto();
        raiz.dispatchEvent(new CustomEvent('cambio', { detail:Array.from(sel) }));
      });
      document.addEventListener('click', function fuera(ev){
        if (!document.body.contains(raiz)){ document.removeEventListener('click', fuera); return; }
        if (!raiz.contains(ev.target)) raiz.classList.remove('abierto');
      });
    }, 0);
    return '<div class="multi" id="' + id + '"><button class="btn multi-btn" type="button" aria-haspopup="listbox"><span class="multi-txt">' + esc(texto()) +
      '</span><span aria-hidden="true">▾</span></button><div class="multi-panel" role="listbox" aria-multiselectable="true">' +
      '<div class="multi-acc"><button class="btn xs" type="button" data-multi="todos">Todas</button><button class="btn xs" type="button" data-multi="ninguna">Ninguna</button></div>' +
      opciones.map(o => '<label class="checkline"><input type="checkbox" value="' + esc(o.v) + '"' + (sel.has(String(o.v)) ? ' checked' : '') + '> ' + esc(o.n) + '</label>').join('') +
      '</div></div>';
  }
  function valorMulti(id){
    const raiz = document.getElementById(id); if (!raiz) return [];
    return $$('input[type=checkbox]:checked', raiz).map(c => c.value);
  }

  /** Árbol de grupos y categorías con casillas. `conteo(grupo, categoria)` da {n, fecha}. */
  function arbol(id, seleccion, conteo){
    const sel = seleccion || { grupos:new Set(), categorias:new Set() };
    const h = Datos.taxonomia().map(g => {
      const cats = (g.categorias || []);
      const cg = conteo ? conteo(g.codigo) : null;
      return '<details' + (sel.grupos.has(g.codigo) ? '' : '') + '><summary><input type="checkbox" data-grupo="' + esc(g.codigo) + '"' +
        (sel.grupos.has(g.codigo) ? ' checked' : '') + ' aria-label="' + esc(g.nombre) + '"><span class="nm">' + esc(g.codigo + ' · ' + g.nombre) + '</span>' +
        (cg ? '<span class="ct">' + cg.n + ' insumos' + (cg.fecha ? ' · ' + fmtFecha(cg.fecha) : '') + '</span>' : '') + '</summary>' +
        cats.map(c => {
          const cc = conteo ? conteo(g.codigo, c) : null;
          const k = g.codigo + '|' + c;
          return '<label class="hoja"><input type="checkbox" data-cat="' + esc(k) + '"' + (sel.grupos.has(g.codigo) || sel.categorias.has(k) ? ' checked' : '') + '>' +
            '<span class="nm">' + esc(c) + '</span>' + (cc ? '<span class="ct">' + cc.n + (cc.fecha ? ' · ' + fmtFecha(cc.fecha) : '') + '</span>' : '') + '</label>';
        }).join('') + '</details>';
    }).join('');
    setTimeout(() => {
      const raiz = document.getElementById(id); if (!raiz) return;
      const sincronizar = g => {
        const hijos = $$('input[data-cat^="' + g + '|"]', raiz), padre = $('input[data-grupo="' + g + '"]', raiz);
        const n = hijos.filter(c => c.checked).length;
        padre.checked = n === hijos.length && n > 0; padre.indeterminate = n > 0 && n < hijos.length;
      };
      $$('input[data-grupo]', raiz).forEach(p => {
        p.onclick = e => e.stopPropagation();
        p.onchange = () => { $$('input[data-cat^="' + p.dataset.grupo + '|"]', raiz).forEach(c => { c.checked = p.checked; }); p.indeterminate = false; raiz.dispatchEvent(new CustomEvent('cambio')); };
        sincronizar(p.dataset.grupo);
      });
      $$('input[data-cat]', raiz).forEach(c => c.onchange = () => { sincronizar(c.dataset.cat.split('|')[0]); raiz.dispatchEvent(new CustomEvent('cambio')); });
    }, 0);
    return '<div class="arbol" id="' + id + '">' + h + '</div>';
  }
  /** Categorías elegidas en el árbol, como claves «grupo|categoría». */
  function leerArbol(id){
    const raiz = document.getElementById(id); if (!raiz) return [];
    return $$('input[data-cat]:checked', raiz).map(c => c.dataset.cat);
  }

  /** Autocompletar de insumos sobre un campo de texto. */
  function sugerirInsumo(input, alElegir, opciones){
    const o = opciones || {};
    const caja = document.createElement('div');
    caja.className = 'sugerir-lista'; caja.setAttribute('role', 'listbox');
    input.parentNode.classList.add('sugerir');
    input.parentNode.appendChild(caja);
    input.setAttribute('autocomplete', 'off');
    let lista = [], foco = -1;
    const pintar = () => {
      caja.innerHTML = lista.map((i, k) => '<button type="button" role="option" data-i="' + k + '"' + (k === foco ? ' class="foco"' : '') + '><span class="cod">' + esc(i.codigo) + '</span>' +
        esc(i.descripcion) + ' <span class="muted small">' + esc(i.unidad) + '</span></button>').join('');
      caja.classList.toggle('abierta', lista.length > 0);
      $$('button', caja).forEach(b => b.onmousedown = e => { e.preventDefault(); elegir(lista[+b.dataset.i]); });
    };
    const elegir = ins => { if (!ins) return; caja.classList.remove('abierta'); lista = []; if (o.limpiar !== false) input.value = ins.descripcion; alElegir(ins); };
    input.addEventListener('input', () => {
      const q = normaliza(input.value);
      if (q.length < 2){ lista = []; pintar(); return; }
      const partes = q.split(/\s+/).filter(Boolean);
      lista = Datos.insumosActivos().filter(i => {
        const t = normaliza(i.codigo + ' ' + i.descripcion + ' ' + (i.sinonimos || []).join(' ') + ' ' + (i.especificacion || ''));
        return partes.every(p => t.indexOf(p) >= 0);
      }).slice(0, o.limite || 12);
      foco = lista.length ? 0 : -1;
      pintar();
    });
    input.addEventListener('keydown', e => {
      if (!lista.length) return;
      if (e.key === 'ArrowDown'){ e.preventDefault(); foco = (foco + 1) % lista.length; pintar(); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); foco = (foco - 1 + lista.length) % lista.length; pintar(); }
      else if (e.key === 'Enter'){ e.preventDefault(); elegir(lista[foco]); }
      else if (e.key === 'Escape'){ lista = []; pintar(); }
    });
    input.addEventListener('blur', () => setTimeout(() => caja.classList.remove('abierta'), 150));
  }

  /** Ventana de progreso para trabajos largos. */
  function progreso(titulo, texto){
    const m = modal({ titulo, eyebrow:'Trabajando', fijo:true, sinFoco:true,
      cuerpo:'<p class="small muted" id="prTxt">' + esc(texto || '') + '</p><div class="barra-doc"><i id="prBar"></i></div>' });
    return {
      fijar(fr, t){ const b = $('#prBar', m.el); if (b) b.style.width = Math.round(Math.max(0, Math.min(1, fr)) * 100) + '%'; if (t !== undefined){ const x = $('#prTxt', m.el); if (x) x.textContent = t; } },
      cerrar(){ m.cerrar(); }
    };
  }

  /* ─────────── Etiquetas de precio ─────────── */
  const CLASE_CONF = { alta:'ok', media:'info', baja:'warn', referencia:'ref', 'sin dato':'sin' };
  const NOMBRE_CONF = { alta:'Alta', media:'Media', baja:'Baja', referencia:'Referencia', 'sin dato':'Sin dato' };
  function tagConfianza(c){ return '<span class="tag ' + (CLASE_CONF[c] || 'sin') + '">' + esc(NOMBRE_CONF[c] || c || 'Sin dato') + '</span>'; }
  const CLASE_ESTADO = { 'válida':'ok', 'atípica':'warn', 'descartada':'bad', 'pendiente de revisión':'info' };
  function tagEstado(e){ return '<span class="tag ' + (CLASE_ESTADO[e] || '') + '">' + esc(e || '—') + '</span>'; }
  function tagDemo(){ return '<span class="tag demo" title="Dato sintético de demostración: no es un precio de mercado">DEMO</span>'; }
  function tagCategoria(cat){ return '<span class="tag cat"><i style="background:' + (COLOR_CATEGORIA[cat] || '#767C83') + '"></i>' + esc(cat) + '</span>'; }
  function variacionHTML(fr){
    if (fr === null || fr === undefined || !isFinite(fr)) return '<span class="muted">—</span>';
    return '<span class="' + (fr > 0.0005 ? 'var-sube' : (fr < -0.0005 ? 'var-baja' : '')) + '">' + esc(pctVar(fr)) + '</span>';
  }

  return { toast, modal, aviso, confirmar, confirmarEliminar, pedir, formHTML, leerForm, campoHTML,
           pedirArchivo, descargar, guardarComo, selectOpts, conectarOrden, vacio, tabs, paginador, multi, valorMulti, arbol, leerArbol,
           sugerirInsumo, progreso, marcaGuardado, marcaSucio, bannerMemoria,
           tagConfianza, tagEstado, tagDemo, tagCategoria, variacionHTML, NOMBRE_CONF };
})();

/* ══════════════════════════════════════════════════════════════════════════
   GRÁFICAS · SVG puro, como el módulo 08 de ARKEN
   Cuadrícula en --line-soft, ejes en --steel, textos de 8 px en --slate y
   las mismas animaciones de entrada (clases g8-*). Cada gráfica trae su
   descripción en texto para quien no la puede ver.
   ══════════════════════════════════════════════════════════════════════════ */
const Graficas = (function(){
  const STAGGER_MS = 55;
  function color(i){ return PALETA[i % PALETA.length]; }
  function svg(w, h, inner, titulo, desc){
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" ' +
      'aria-label="' + esc(titulo || 'Gráfica') + '" font-family="Inter,Segoe UI,Arial,sans-serif">' +
      '<title>' + esc(titulo || '') + '</title>' + (desc ? '<desc>' + esc(desc) + '</desc>' : '') + inner + '</svg>';
  }
  /** Escala «bonita» para el eje: 4 divisiones redondas. */
  function escala(min, max){
    if (!(max > min)){ const c = isFinite(max) ? max : 1; min = c * 0.9; max = c * 1.1 || 1; }
    const paso0 = (max - min) / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(paso0)));
    const paso = [1, 2, 2.5, 5, 10].map(f => f * mag).find(p => p >= paso0) || paso0;
    const lo = Math.floor(min / paso) * paso, hi = Math.ceil(max / paso) * paso;
    return { lo, hi, paso };
  }
  function etiquetaNum(v){
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + ' M';
    if (a >= 1e4) return (v / 1e3).toFixed(0) + ' mil';
    return moneyPlano(v);
  }

  /** Evolución por ciudad: mediana mensual, banda mínimo–máximo y un punto por observación. */
  function evolucion(cfg){
    const W = cfg.w || 760, H = cfg.h || 300, ml = 58, mr = 14, mt = 14, mb = 38;
    const gw = W - ml - mr, gh = H - mt - mb;
    const meses = cfg.meses;
    const n = meses.length;
    let lo = Infinity, hi = -Infinity;
    cfg.series.forEach(s => {
      s.puntos.forEach(p => { lo = Math.min(lo, p.minimo, p.mediana); hi = Math.max(hi, p.maximo, p.mediana); });
      (s.obs || []).forEach(o => { lo = Math.min(lo, o.p); hi = Math.max(hi, o.p); });
    });
    if (!isFinite(lo)) return '';
    const e = escala(cfg.base100 ? lo : Math.max(0, lo - (hi - lo) * 0.1), hi);
    const px = fx => ml + (n > 1 ? gw * fx / (n - 1) : gw / 2);
    const py = v => mt + gh - (v - e.lo) / (e.hi - e.lo) * gh;
    const posMes = mes => meses.indexOf(mes);
    const posFecha = f => { const i = posMes(f.slice(0,7)); return i < 0 ? -1 : i + (Number(f.slice(8,10)) - 15) / 30; };
    let s = '';
    for (let v = e.lo; v <= e.hi + e.paso / 2; v += e.paso){
      const y = py(v);
      s += '<line x1="' + ml + '" y1="' + y.toFixed(1) + '" x2="' + (W - mr) + '" y2="' + y.toFixed(1) + '" stroke="var(--line-soft)"/>' +
        '<text x="' + (ml - 5) + '" y="' + (y + 3).toFixed(1) + '" font-size="8" fill="var(--slate)" text-anchor="end">' + esc(cfg.formato ? cfg.formato(v) : etiquetaNum(v)) + '</text>';
    }
    const cada = Math.ceil(n / 12);
    meses.forEach((m, i) => { if (i % cada === 0 || i === n - 1) s += '<text x="' + px(i).toFixed(1) + '" y="' + (mt + gh + 13) + '" font-size="8" fill="var(--slate)" text-anchor="middle">' + esc(fmtMes(m)) + '</text>'; });
    s += '<line x1="' + ml + '" y1="' + (mt + gh) + '" x2="' + (W - mr) + '" y2="' + (mt + gh) + '" stroke="var(--steel)"/>';
    cfg.series.forEach((se, k) => {
      const c = se.color || color(k);
      const pts = se.puntos.filter(p => posMes(p.mes) >= 0);
      if (pts.length > 1 && !cfg.sinBanda){
        const arriba = pts.map(p => px(posMes(p.mes)).toFixed(1) + ',' + py(p.maximo).toFixed(1));
        const abajo = pts.slice().reverse().map(p => px(posMes(p.mes)).toFixed(1) + ',' + py(p.minimo).toFixed(1));
        s += '<polygon points="' + arriba.concat(abajo).join(' ') + '" fill="' + c + '" opacity=".10"/>';
      }
      if (pts.length){
        const d = pts.map((p, i) => (i ? 'L' : 'M') + px(posMes(p.mes)).toFixed(1) + ',' + py(p.mediana).toFixed(1)).join(' ');
        s += '<path class="g8-linea" style="animation-delay:' + (k * STAGGER_MS) + 'ms" d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linejoin="round"/>';
        pts.forEach(p => { s += '<circle cx="' + px(posMes(p.mes)).toFixed(1) + '" cy="' + py(p.mediana).toFixed(1) + '" r="2.6" fill="' + c + '"><title>' +
          esc(se.nombre + ' · ' + fmtMes(p.mes) + ': mediana ' + money3(p.mediana) + ' (n = ' + p.n + ')') + '</title></circle>'; });
      }
      (se.obs || []).forEach(o => {
        const x = posFecha(o.f); if (x < -0.6) return;
        s += '<circle class="obs" data-obs="' + esc(o.id) + '" data-ins="' + esc(o.i || '') + '" cx="' + px(Math.max(0, Math.min(n - 1, x))).toFixed(1) + '" cy="' + py(o.p).toFixed(1) +
          '" r="2.2" fill="var(--surface)" stroke="' + c + '" stroke-width="1"><title>' + esc((o.fuente || 'Fuente') + ' · ' + money3(o.p) + ' · ' + fmtFecha(o.f) + (o.d ? ' · DEMO' : '') + ' · clic para ver la observación') + '</title></circle>';
      });
    });
    return svg(W, H, s, cfg.titulo, cfg.desc);
  }

  /** Barras horizontales centradas en cero (diferencias y variaciones). */
  function divergentes(items, cfg){
    const o = cfg || {};
    const W = o.w || 760, fila = 24, mt = 8, ml = o.ml || 190;
    const H = mt + items.length * fila + 10;
    const max = Math.max.apply(null, items.map(x => Math.abs(x.valor)).concat([0.0001]));
    const cx = ml + (W - ml - 70) / 2, semi = (W - ml - 70) / 2;
    let s = '<line x1="' + cx + '" y1="' + mt + '" x2="' + cx + '" y2="' + (H - 6) + '" stroke="var(--steel)"/>';
    items.forEach((x, i) => {
      const y = mt + i * fila, w = Math.max(1.5, Math.abs(x.valor) / max * semi);
      const c = x.valor > 0 ? 'var(--bad)' : 'var(--ok)';
      const x0 = x.valor >= 0 ? cx : cx - w;
      s += '<g class="' + (o.clase || '') + '"' + (x.dato ? ' data-dato="' + esc(x.dato) + '"' : '') + '>' +
        '<rect class="fondo" x="0" y="' + y + '" width="' + W + '" height="' + (fila - 2) + '" fill="transparent"/>' +
        '<text x="' + (ml - 8) + '" y="' + (y + 14) + '" font-size="9.5" fill="var(--steel)" text-anchor="end">' + esc(String(x.nombre).slice(0, 34)) + '</text>' +
        '<rect class="g8-barra-h" style="animation-delay:' + (i * STAGGER_MS) + 'ms;transform-origin:' + (x.valor >= 0 ? 'left' : 'right') + '" x="' + x0.toFixed(1) + '" y="' + (y + 5) + '" width="' + w.toFixed(1) +
        '" height="12" rx="2" fill="' + c + '"><title>' + esc(x.nombre + ': ' + (o.formato ? o.formato(x.valor) : pctVar(x.valor)) + (x.nota ? ' · ' + x.nota : '')) + '</title></rect>' +
        '<text class="g8-etq" x="' + (x.valor >= 0 ? cx + w + 5 : cx - w - 5).toFixed(1) + '" y="' + (y + 14) + '" font-size="9" font-weight="700" fill="' + c + '" text-anchor="' + (x.valor >= 0 ? 'start' : 'end') + '">' +
        esc(o.formato ? o.formato(x.valor) : pctVar(x.valor)) + '</text></g>';
    });
    return svg(W, H, s, o.titulo, o.desc);
  }

  /** Minigráfica de tendencia (12 meses). */
  function sparkline(valores){
    const v = valores.filter(x => x > 0);
    if (v.length < 2) return '<span class="muted small">—</span>';
    const W = 84, H = 22, lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    const px = i => 2 + (W - 4) * i / (valores.length - 1);
    const py = x => H - 3 - (hi > lo ? (x - lo) / (hi - lo) * (H - 6) : (H - 6) / 2);
    let d = '', ultimo = null;
    valores.forEach((x, i) => { if (x > 0){ d += (d ? 'L' : 'M') + px(i).toFixed(1) + ',' + py(x).toFixed(1); ultimo = [px(i), py(x)]; } });
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path d="' + d + '"/>' +
      (ultimo ? '<circle cx="' + ultimo[0].toFixed(1) + '" cy="' + ultimo[1].toFixed(1) + '" r="2"/>' : '') + '</svg>';
  }

  /** Descarga una gráfica como SVG (con colores fijos) o como PNG. */
  function svgAutonomo(svgEl){
    const clon = svgEl.cloneNode(true);
    clon.querySelectorAll('.g8-linea,.g8-barra-h,.g8-barra-v,.g8-bar,.g8-slice,.g8-etq').forEach(el => { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; el.style.strokeDasharray = 'none'; });
    const cs = getComputedStyle(document.documentElement);
    let txt = new XMLSerializer().serializeToString(clon);
    txt = txt.replace(/var\(--([a-z0-9-]+)\)/g, (m, n) => (cs.getPropertyValue('--' + n) || '#767C83').trim());
    return txt;
  }
  function descargarSVG(svgEl, nombre){ UI.descargar(nombreArchivoSeguro(nombre) + '.svg', svgAutonomo(svgEl), 'image/svg+xml'); }
  async function descargarPNG(svgEl, nombre){
    const img = await Documentos.svgAImagen(svgEl, 2.5);
    if (!img){ UI.toast('No fue posible convertir la gráfica a imagen', 'bad'); return; }
    const bin = atob(img.dataUrl.split(',')[1]); const b = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    UI.descargar(nombreArchivoSeguro(nombre) + '.png', new Blob([b], { type:'image/png' }));
  }

  return { color, svg, escala, evolucion, divergentes, sparkline, svgAutonomo, descargarSVG, descargarPNG, STAGGER_MS };
})();


/* ══════════════════════════════════════════════════════════════════════════
   DOCUMENTOS · PDF, impresión y Excel con el estilo de ARKEN (§10.3, §10.4)
   Un documento se describe una vez, en bloques, y se pinta con jsPDF o con
   el motor de impresión del navegador. Encabezado con el logo de ARKEN,
   «ARKEN PRECIOS» y «OBSERVATORIO DE PRECIOS DE INSUMOS»; a la derecha la
   empresa, su NIT, el documento y la fecha; pie con quién lo generó,
   «ARKEN PRECIOS» y «Página x de y».
   ══════════════════════════════════════════════════════════════════════════ */
const Documentos = (function(){
  function hayJsPDF(){ return !!(window.jspdf && window.jspdf.jsPDF); }
  function hayAutoTable(){ try { return hayJsPDF() && typeof (new window.jspdf.jsPDF()).autoTable === 'function'; } catch(e){ return false; } }
  function hayXLSX(){ return typeof XLSX !== 'undefined'; }
  function logoArken(){ const i = $('#markArken'); return i ? i.getAttribute('src') : ''; }
  function esCelular(){ try { return window.matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 820; } catch(e){ return false; } }

  function avisoLibreria(nombre, alternativa){
    UI.aviso('Falta una librería',
      '<p>No fue posible cargar <b>' + esc(nombre) + '</b>. El navegador la descarga de cdnjs la primera vez y después la guarda; sin conexión y sin esa copia no está disponible.</p>' +
      '<p class="muted small">' + esc(alternativa || 'Conéctese a internet una vez y vuelva a intentarlo.') + '</p>');
  }

  function encabezado(cfg){
    const emp = Datos.config('empresa', {}) || {};
    const u = Sesion.usuario;
    return {
      documento:cfg.documento || cfg.titulo || '', contexto:cfg.contexto || '', fecha:fmtFechaLarga(hoyISO()),
      empresa:emp.razonSocial || 'Empresa constructora', nit:emp.nit ? ('NIT ' + emp.nit + (emp.dv ? '-' + emp.dv : '')) : '',
      logoEmpresa:emp.logo || '', usuario:u ? (u.nombre || u.usuario) : 'Sistema'
    };
  }

  /* ═══════════ PDF ═══════════ */
  async function generarPDF(cfg){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:cfg.orientacion === 'l' ? 'landscape' : 'portrait', unit:'mm', format:'letter' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 11, BOT = 14;
    const enc = encabezado(cfg);
    const apariencia = Datos.config('apariencia', {}) || {};
    const factorLogo = (Number(apariencia.escalaLogo) || 200) / 100;
    const CAJA_W = 26 * factorLogo, CAJA_H = 10 * factorLogo;
    const yrBase = enc.logoEmpresa ? (6.5 + CAJA_H + 2.5) : 10.5;
    doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    const anchoDer = Math.min(Math.max(doc.getTextWidth(String(enc.empresa)) + 3, 42), (W - 2*M) * 0.46);
    const anchoIzq = (W - 2*M) - anchoDer - 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.4);
    const lineasCtx = enc.contexto ? doc.splitTextToSize(enc.contexto, Math.max(40, anchoIzq - 14)) : [];
    const bajoIzquierda = 16.4 + lineasCtx.length * 3.9;
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    const lineasEmpresa = doc.splitTextToSize(String(enc.empresa), W * 0.42);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
    const lineasDoc = doc.splitTextToSize(enc.documento + ' · ' + enc.fecha, anchoDer);
    const bajoDerecha = yrBase + Math.max(0, lineasEmpresa.length - 1) * 3.9 + 3.6 + (enc.nit ? 3.4 : 0) + Math.max(0, lineasDoc.length - 1) * 3.4 + 2;
    const Y_REGLA = Math.max(24.5, bajoIzquierda + 2.8, bajoDerecha + 2.8, 18 + 2.8);
    const TOP = Y_REGLA + 5.5;
    let y = TOP;
    const conCabecera = new Set();
    const logo = logoArken();

    function dibujarCabecera(){
      try { if (logo) doc.addImage(logo, 'PNG', M, 7, 11, 11); } catch(e){}
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(22,24,26);
      doc.text('ARKEN PRECIOS', M + 14, 12.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6); doc.setTextColor(110,116,122);
      doc.text('OBSERVATORIO DE PRECIOS DE INSUMOS', M + 14, 16.4);
      if (lineasCtx.length){ doc.setFontSize(7.4); doc.setTextColor(60,64,68); doc.text(lineasCtx, M + 14, 20.6); }
      let yr = yrBase;
      if (enc.logoEmpresa){
        try {
          let w = CAJA_W, hh = CAJA_H;
          try { const pr = doc.getImageProperties(enc.logoEmpresa); if (pr && pr.width && pr.height){ const f = Math.min(CAJA_W / pr.width, CAJA_H / pr.height); w = pr.width * f; hh = pr.height * f; } } catch(e){}
          doc.addImage(enc.logoEmpresa, undefined, W - M - w, 6.5, w, hh, undefined, 'FAST');
        } catch(e){ yr = 10.5; }
      }
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(22,24,26);
      lineasEmpresa.forEach((ln, k) => doc.text(ln, W - M, yr + k * 3.9, { align:'right' }));
      let yd = yr + (lineasEmpresa.length - 1) * 3.9 + 3.6;
      doc.setFont('helvetica','normal'); doc.setFontSize(6.6); doc.setTextColor(110,116,122);
      if (enc.nit){ doc.text(enc.nit, W - M, yd, { align:'right' }); yd += 3.4; }
      doc.text(lineasDoc, W - M, yd, { align:'right' });
      doc.setDrawColor(22,24,26); doc.setLineWidth(0.5);
      doc.line(M, Y_REGLA, W - M, Y_REGLA);
      doc.setTextColor(22,24,26);
    }
    function cabecera(){ const p = doc.internal.getNumberOfPages(); if (conCabecera.has(p)) return; conCabecera.add(p); dibujarCabecera(); }
    function pie(pag, total){
      doc.setDrawColor(217,219,220); doc.setLineWidth(0.2);
      doc.line(M, H - 10, W - M, H - 10);
      doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(110,116,122);
      doc.text('Generado por: ' + enc.usuario, M, H - 6.5);
      doc.text('ARKEN PRECIOS', W / 2, H - 6.5, { align:'center' });
      doc.text('Página ' + pag + ' de ' + total, W - M, H - 6.5, { align:'right' });
    }
    function nuevaPagina(){ doc.addPage(); cabecera(); y = TOP; }
    function espacio(alto){ if (y + alto > H - BOT){ nuevaPagina(); return true; } return false; }

    cabecera();
    if (cfg.titulo){ doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(22,24,26); doc.text(cfg.titulo, M, y); y += 5.5; }
    if (cfg.subtitulo){
      doc.setFont('helvetica','normal'); doc.setFontSize(8.4); doc.setTextColor(110,116,122);
      const ls = doc.splitTextToSize(cfg.subtitulo, W - 2*M); doc.text(ls, M, y); y += ls.length * 4;
    }
    y += 2;

    const bloques = (cfg.bloques || []).filter(Boolean);
    let ultimoRespiro = Date.now();
    for (let i = 0; i < bloques.length; i++){
      const b = bloques[i];
      switch (b.t){
        case 'sec': {
          y += 1.2;
          doc.setFont('helvetica','bold'); doc.setFontSize(8.2);
          const ls = doc.splitTextToSize(String(b.txt || '').toUpperCase(), W - 2*M);
          espacio(ls.length * 4 + 9); y += 3;
          doc.setTextColor(22,24,26); ls.forEach((l, k) => doc.text(l, M, y + k * 4)); y += (ls.length - 1) * 4;
          doc.setDrawColor(150,155,160); doc.setLineWidth(0.2); doc.line(M, y + 1.4, W - M, y + 1.4);
          y += 6; break;
        }
        case 'kv': {
          const cols = b.cols || 2, anchoCol = (W - 2*M) / cols, pares = b.pares || [], filas = Math.ceil(pares.length / cols);
          doc.setFontSize(8);
          const medido = pares.map(par => {
            const et = String(par[0]) + ':', val = String(par[1] === undefined || par[1] === null ? '—' : par[1]);
            doc.setFont('helvetica','bold');
            const ae = Math.min(anchoCol * 0.46, Math.max(18, doc.getTextWidth(et) + 2.5));
            const le = doc.splitTextToSize(et, ae - 1.5);
            doc.setFont('helvetica','normal');
            return { ae, le, lv:doc.splitTextToSize(val, Math.max(12, anchoCol - ae - 4)) };
          });
          for (let f = 0; f < filas; f++){
            let n = 1;
            for (let c = 0; c < cols; c++){ const m2 = medido[f*cols + c]; if (m2) n = Math.max(n, m2.lv.length, m2.le.length); }
            const alto = n * 4.1 + 1.4;
            espacio(alto + 1);
            for (let c = 0; c < cols; c++){
              const m2 = medido[f*cols + c]; if (!m2) continue;
              const x = M + c * anchoCol;
              doc.setFont('helvetica','bold'); doc.setTextColor(110,116,122); m2.le.forEach((l, k) => doc.text(l, x, y + k * 4.1));
              doc.setFont('helvetica','normal'); doc.setTextColor(22,24,26); m2.lv.forEach((l, k) => doc.text(l, x + m2.ae, y + k * 4.1));
            }
            y += alto;
          }
          y += 2; break;
        }
        case 'texto': {
          doc.setFont('helvetica', b.negrita ? 'bold' : 'normal');
          doc.setFontSize(b.tam || 8.6); doc.setTextColor(b.gris ? 110 : 22, b.gris ? 116 : 24, b.gris ? 122 : 26);
          const ls = doc.splitTextToSize(String(b.txt || ''), W - 2*M), alto = Math.max(3, (b.tam || 8.6) * 0.42);
          ls.forEach(l => { espacio(alto + 1); doc.text(l, M, y); y += alto; });
          y += 2; doc.setTextColor(22,24,26); break;
        }
        case 'tabla': {
          espacio(14);
          doc.autoTable({
            head:b.head, body:(b.body || []).map(r => r.celdas || r), foot:b.foot,
            startY:y, margin:{ left:M, right:M, top:TOP, bottom:BOT },
