/* ══════════════════════════════════════════════════════════════════════════
   LECTOR DE PRECIOS COLOMBIANOS (§8.1)
   Un precio de obra llega escrito de muchas formas: «$ 32.900», «32,900.50»,
   «COP 32900», «32 mil», «antes $40.000 ahora $32.900», «desde $…», rangos,
   «+ IVA». El lector devuelve el precio vigente con todo lo que dice el texto
   alrededor, y nunca inventa: si no hay un precio claro, lo dice.
   ══════════════════════════════════════════════════════════════════════════ */
const LectorPrecios = (function(){

  /** Número con separadores colombianos, estadounidenses o mezclados. */
  function numero(txt){
    let s = String(txt||'').replace(/[’'´`]/g, '').replace(/\s+/g, '');
    if (!/^\d[\d.,]*$/.test(s)) return NaN;
    const puntos = (s.match(/\./g)||[]).length, comas = (s.match(/,/g)||[]).length;
    if (puntos && comas){
      // El último separador es el decimal: 32.900,50 o 32,900.50
      const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
      const mil = dec === '.' ? ',' : '.';
      const partes = s.split(dec);
      if (partes.length !== 2) return NaN;
      const ent = partes[0].split(mil);
      if (ent.slice(1).some(p => p.length !== 3)) return NaN;
      return Number(ent.join('') + '.' + partes[1]);
    }
    const sep = puntos ? '.' : (comas ? ',' : '');
    if (!sep) return Number(s);
    const partes = s.split(sep);
    if (partes.length > 2){
      // Varios separadores iguales son de miles: 1.234.567
      return partes.slice(1).every(p => p.length === 3) ? Number(partes.join('')) : NaN;
    }
    // Uno solo: con tres cifras detrás es de miles (32.900); con una o dos, decimal (32,5)
    return partes[1].length === 3 ? Number(partes[0] + partes[1]) : Number(partes[0] + '.' + partes[1]);
  }

  const MULT = { mil:1e3, k:1e3, millon:1e6, 'millón':1e6, millones:1e6, mm:1e6 };
  const RE_CAND = /(US\s?\$|U\$S|USD|COP\s?\$?|COL\s?\$|\$)?[ \t]*(\d{1,3}(?:[.,'’]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d+)?)(?:[ \t]*(millones|mill[oó]n|mil|mm|k)\b)?(?:[ \t]*(\d{1,3})[ \t]*mil\b)?([ \t]*(?:pesos|cop\b|m\/?cte))?/gi;

  /** Partes del texto que tienen números y no son precios: fechas, medidas
      (60x60), fracciones (1/2"), calibres, RDE y porcentajes. Se tapan con
      espacios para conservar las posiciones. */
  function taparNoPrecios(t){
    const tapar = m => ' '.repeat(m.length);
    return t
      .replace(/\b\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}\b/g, tapar)                          // fechas
      .replace(/\b\d+(?:[.,]\d+)?\s*[x×]\s*\d+(?:[.,]\d+)?(?:\s*[x×]\s*\d+(?:[.,]\d+)?)?(?:\s*(?:cm|mm|m)\b)?/gi, tapar) // 60x60 cm
      .replace(/\b\d+\s+\d\/\d+\s*(?:"|”|''|pulg(?:adas?)?)?/gi, tapar)              // 1 1/2"
      .replace(/\b\d\/\d+\s*(?:"|”|''|pulg(?:adas?)?)?/gi, tapar)                    // 1/2"
      .replace(/\b(?:no\.?|n[°º.]|#|rde|cal\.?|calibre|ref\.?|referencia|modelo|tipo|serie|clase)\s*\d+(?:[.,]\d+)?\b/gi, tapar)
      .replace(/-?\d+(?:[.,]\d+)?\s*%/g, tapar)                                      // porcentajes
      .replace(/\b\d+(?:[.,]\d+)?\s*(?:psi|mpa|kva|kw|hp|btu|w|amp|amperios)\b/gi, tapar); // especificaciones
  }

  const RE_MEDIDA_DESPUES = /^[ \t]*(?:kg|kilos?|kilogramos?|gr?\b|m\b|mts?\b|metros?|mm\b|cm\b|m2|m²|m3|m³|"|”|''|pulg|l\b|lts?\b|litros?|gal|galones|ml\b|cc\b|ton|toneladas?|und|unidades|uds|piezas|horas?|dias?|meses)/;
  const RE_ROTULO_ANTES = /(precio|valor|vr\.?|total|costo|tarifa|ahora|antes|oferta|desde|hasta|normal|regular|hoy|especial)\s*[:\-=]?\s*$/;

  function candidatos(t, p){
    const out = [];
    const tapado = taparNoPrecios(t);
    RE_CAND.lastIndex = 0;
    let m;
    while ((m = RE_CAND.exec(tapado))){
      if (!m[2]) continue;
      let v = numero(m[2]);
      if (!isFinite(v)) continue;

      if (!marcado && RE_ROTULO_ANTES.test(antes)) marcado = true;
      if (!marcado && (RE_MEDIDA_DESPUES.test(despues) || v < 100 || (Number.isInteger(v) && v >= 1990 && v <= 2100))) continue;
      out.push({ ini, fin, texto: t.slice(ini, fin).trim(), valor: v, marcado,
                 moneda: /us|usd|u\$s/i.test(pref) ? 'USD' : 'COP', antes, despues });
    }

  }

  const RE_IVA_NO = /^\s*[(\-–]?\s*(?:(?:\+|mas)\s*iva|(?:antes de|sin|no incluye|excluido|excl\.?|exc\.?)\s*iva|iva\s*no\s*incluido|netos?\b)/;
  const RE_IVA_SI = /^\s*\(?\s*(?:iva\s*incluido|con\s*iva|incluye\s*iva|iva\s*inc\b|inc\.?\s*iva|i\.v\.a\.?\s*incluido)/;

  function clasificar(c){
    const a = c.antes.replace(/antes de iva/g, '       ');
    c.ahorro    = /(ahorr[ao]s?|ahorre|descuento de|dto\.? de|te ahorras|economiza)\s*[:\-]?\s*\$?\s*$/.test(c.antes);
    c.impuesto  = /(^|[^a-z])(iva|impuesto)\s*(\(\s*\d+\s*%?\s*\))?\s*[:\-]?\s*\$?\s*$/.test(c.antes) && !/(con|sin|mas|\+|incluido|antes de)\s*iva\s*[:\-]?\s*\$?\s*$/.test(c.antes);
    c.subtotal  = /sub\s?-?total\s*[:\-]?\s*\$?\s*$/.test(c.antes);
    c.total     = !c.subtotal && /total\s*(a pagar)?\s*[:\-]?\s*\$?\s*$/.test(c.antes);

    c.desde     = /\bdesde\s*[:\-]?\s*\$?\s*$/.test(c.antes);
