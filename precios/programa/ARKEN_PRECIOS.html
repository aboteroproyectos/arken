    const fila = (titulo, texto, botones) => '<div class="card" style="margin-bottom:10px"><div class="card-body"><div class="row" style="justify-content:space-between;gap:12px;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:220px"><b>' + esc(titulo) + '</b><div class="small muted">' + texto + '</div></div><div class="btn-row">' + botones + '</div></div></div></div>';
    z.innerHTML = (ult ? '<p class="small">Último respaldo descargado: <b>' + esc(fmtSello(ult)) + '</b>.</p>' : '<div class="alert warn"><div class="ic">!</div><div class="bd">Todavía no se ha descargado ningún respaldo. Los datos viven en este navegador: si se borran los datos del sitio, se pierden.</div></div>') +
      fila('Respaldo completo', 'Todos los datos de este equipo, incluidos usuarios (con contraseñas cifradas). Nunca lleva claves de API.',
        '<button class="btn sm primary" id="adResp" type="button">Descargar respaldo</button><button class="btn sm" id="adRest" type="button">Restaurar…</button>') +
      fila('Paquete de precios', 'Catálogo, equivalencias y cortes cerrados, para llevarlos a otro equipo con ARKEN PRECIOS. Al importarlo solo se agrega lo que no existe.',
        '<button class="btn sm" id="adPaqE" type="button">Exportar…</button><button class="btn sm" id="adPaqI" type="button">Importar…</button>') +
      fila('Copia del programa con datos', 'Un archivo HTML de ARKEN PRECIOS con el catálogo, las equivalencias y el corte activo adentro. Quien lo abra en otro equipo arranca con esos precios.',
        '<button class="btn sm" id="adCopia" type="button">Guardar copia…</button>');
    $('#adResp', z).onclick = () => Respaldos.descargar();
    $('#adRest', z).onclick = () => Respaldos.restaurar();
    $('#adPaqE', z).onclick = () => { $$('#modales .overlay').forEach(o => o.remove()); App.ir('08', { exportar:{ tipo:'paquete' } }); };
    $('#adPaqI', z).onclick = () => Respaldos.importarPaquete();
    $('#adCopia', z).onclick = () => Respaldos.guardarCopia();
  }

  /* ── Demostración ── */
  function hayDemo(){ return Datos.lista('fuentes').some(f => f.esDemo) || Datos.cortes().some(c => c.incluyeDemo); }
  function demostracion(z, m, repintar){
    const n = Array.from(Datos.obsTodas().values()).filter(o => o.esDemo).length;
    const conRef = Datos.insumosActivos().filter(i => Datos.obs(i.id).some(o => o.tipoPrecio === 'referencia' && !o.esDemo)).length;
    z.innerHTML = '<div class="demo-banda"><b>DEMOSTRACIÓN</b><span>Datos sintéticos para conocer el programa. No son precios de mercado.</span></div>' +
      '<p class="small">La demostración genera, para los <b>' + conRef + '</b> insumos que tienen precio de referencia de ARKEN, observaciones sintéticas de los últimos 12 meses en hasta ' + CIUDADES_DEMO.length +
      ' ciudades, de tres fuentes rotuladas «DEMO». Luego actualiza la base y crea un corte DEMO. Todo queda marcado DEMO en pantallas, Excel y PDF, y los documentos que la incluyen lo dicen.</p>' +
      '<p class="small">Los insumos nuevos del catálogo (sin precio de referencia) no reciben precios de demostración: el programa no inventa precios.</p>' +
      (hayDemo() ? '<div class="alert info"><div class="ic">i</div><div class="bd">La demostración está cargada: <b>' + n + '</b> observaciones sintéticas.</div></div>' +
          '<div class="btn-row" style="margin-top:10px"><button class="btn danger" id="adDemoB" type="button">Borrar la demostración</button></div>'
        : '<div class="btn-row" style="margin-top:10px"><button class="btn primary" id="adDemoC" type="button">Cargar la demostración</button></div>');
    if ($('#adDemoC', z)) $('#adDemoC', z).onclick = async () => { await cargarDemo(); repintar(); };
    if ($('#adDemoB', z)) $('#adDemoB', z).onclick = async () => { await borrarDemo(); repintar(); };
  }
  async function cargarDemo(opciones){
    const o = Object.assign({ meses:12, cobertura:0.65, recientes:4, silencioso:false }, opciones || {});
    if (!Permisos.esAdmin()){ Permisos.exigir('__', 'cargar la demostración'); return null; }
    if (Motor.enCurso()){ UI.toast('Hay una actualización en curso. Espere a que termine.', 'bad'); return null; }
    if (hayDemo()){ UI.toast('La demostración ya está cargada.', 'bad'); return null; }
    const ahora = ahoraISO();
    const ref = Datos.ciudadReferencia();
    let ciudades = CIUDADES_DEMO.filter(c => Datos.ciudad(c[0])).map(c => ({ codigo:c[0], factor:c[1] }));
    if (ref && !ciudades.some(c => c.codigo === ref.codigoDivipola)) ciudades.unshift({ codigo:ref.codigoDivipola, factor:1 });
    else if (ref) ciudades = ciudades.filter(c => c.codigo === ref.codigoDivipola).concat(ciudades.filter(c => c.codigo !== ref.codigoDivipola));
    const base = [];
    Datos.insumosActivos().forEach(ins => {
      const r = Datos.obs(ins.id).find(x => x.tipoPrecio === 'referencia' && !x.esDemo && x.precioConIva > 0);
      if (r) base.push({ insumo:ins, precio:r.precioConIva });
    });
    if (!base.length){ UI.aviso('No hay con qué armar la demostración', '<p>Ningún insumo tiene precio de referencia.</p>'); return null; }
    const pr = UI.progreso('Cargando la demostración', 'Generando observaciones sintéticas…');
    try {
      await Datos.guardarVarios('fuentes', Demo.FUENTES.map(f => ({ id:f.id, nombre:f.nombre, tipo:f.tipo, urlBase:'', ciudades:ciudades.map(c => c.codigo), alcance:'ciudad', categorias:[],
        metodo:'manual', configuracion:{}, revisionLegal:{ robotsTxt:'', terminos:'', fecha:'', responsable:'', resultado:'no aplica' }, limitePorMinuto:0,
        confiabilidad:f.confiabilidad, salud:'activa', ultimaPrueba:null, notas:'Fuente sintética de la demostración. Sus precios no son de mercado.', esDemo:true, creado:ahora })));
      const capturas = Demo.generar(base, ciudades, { meses:o.meses, hasta:hoyISO(), cobertura:o.cobertura, recientes:o.recientes });
      pr.fijar(0.05, 'Registrando ' + moneyPlano(capturas.length) + ' observaciones sintéticas…');
      const r = await Registro.registrar(capturas, { origen:'demostración', sinFundir:true, sinValidar:true, silencioso:true, alAvanzar: f => pr.fijar(0.05 + f * 0.45) });
      pr.fijar(0.5, 'Actualizando la base con la demostración…');
      const ej = await Motor.ejecutar({ tipo:'demo', descripcion:'Demostración', insumoIds:base.map(b => b.insumo.id), ciudades:ciudades.map(c => c.codigo) },
        { avance: f => pr.fijar(0.5 + f * 0.4) });
      pr.fijar(0.92, 'Creando el corte de demostración…');
      const corte = await CortesSrv.crear({ nombre:'DEMO · Corte ' + fmtMes(mesDe(hoyISO())), ciudades:ciudades.map(c => c.codigo), cerrar:true, activar:!Datos.corteActivo() });
      await Auditoria.registrar('cargar demostración', r.nuevas.length + ' observaciones sintéticas · ' + ciudades.length + ' ciudades · ejecución ' + ej.id + ' · ' + corte.nombre);
      pr.cerrar();
      if (!o.silencioso) UI.aviso('Demostración cargada', '<p><b>' + moneyPlano(r.nuevas.length) + '</b> observaciones sintéticas en ' + ciudades.length + ' ciudades, la base actualizada y el corte «' + esc(corte.nombre) + '».</p>' +
        '<p class="small muted">Todo está rotulado DEMO. Para quitarla: Administración › Demostración › «Borrar la demostración», o el botón de la banda superior.</p>');
      Tablero.invalidar(); App.refrescar();
      return { observaciones:r.nuevas.length, ciudades:ciudades.map(c => c.codigo), corteId:corte.id, ejecucion:ej.id };
    } catch(e){
      pr.cerrar(); RegistroTecnico.anotar('Cargar demostración', e);
      UI.aviso('La demostración no terminó de cargar', '<p>' + esc(e.message || e) + '</p><p class="small muted">Use «Borrar la demostración» para quitar lo que alcanzó a cargar.</p>');
      return null;
    }
  }
  async function borrarDemo(sinPreguntar){
    if (!Permisos.esAdmin()){ Permisos.exigir('__', 'borrar la demostración'); return false; }
    if (Motor.enCurso()){ UI.toast('Hay una actualización en curso. Espere a que termine.', 'bad'); return false; }
    if (!sinPreguntar){
      const ok = await UI.confirmar({ titulo:'¿Borrar la demostración?', textoAceptar:'Borrar la demostración', claseAceptar:'danger',
        mensaje:'Se borran las observaciones sintéticas, sus fuentes, los precios calculados con ellas, los cortes DEMO y los precios adoptados de la demostración. Sus datos reales no se tocan.' });
      if (!ok) return false;
    }
    const pr = UI.progreso('Borrando la demostración', 'Quitando los datos sintéticos…');
    try {
      const ids = []; Datos.obsTodas().forEach(o => { if (o.esDemo) ids.push(o.id); });
      await Datos.borrarObservaciones(ids); pr.fijar(0.4);
      const cons = await Datos.borrarConsolidadosDe(c => !!c.dependeDemo); pr.fijar(0.6);
      for (const c of Datos.cortes().filter(x => x.incluyeDemo)) await CortesSrv.eliminar(c.id);
      await Datos.borrarVarios('preciosAdoptados', Datos.lista('preciosAdoptados').filter(a => a.esDemo).map(a => a.id));
      await Datos.borrarVarios('ejecuciones', Datos.lista('ejecuciones').filter(e => e.alcance && e.alcance.tipo === 'demo').map(e => e.id));
      await Datos.borrarVarios('fuentes', Datos.lista('fuentes').filter(f => f.esDemo).map(f => f.id));
      pr.fijar(1);
      await Auditoria.registrar('borrar demostración', ids.length + ' observaciones sintéticas y ' + cons + ' precios calculados con ellas');
      pr.cerrar();
      UI.toast('Demostración borrada: ' + moneyPlano(ids.length) + ' observaciones sintéticas', 'ok');
      Tablero.invalidar(); App.refrescar();
      return true;
    } catch(e){
      pr.cerrar(); RegistroTecnico.anotar('Borrar demostración', e);
      UI.aviso('No se terminó de borrar la demostración', '<p>' + esc(e.message || e) + '</p><p class="small muted">Vuelva a intentarlo: lo que ya se borró no se repite.</p>');
      return false;
    }
  }

  /* ── Registro técnico ── */
  function tecnico(z){
    const l = RegistroTecnico.entradas();
    z.innerHTML = '<p class="small muted">Detalle técnico de los errores de esta sesión del navegador, para quien tenga que revisarlos. Se borra al cerrar el programa.</p>' +
      '<div class="kv c2" style="margin-bottom:10px"><div class="k">Versión</div><div class="v">' + esc(VERSION_PROGRAMA) + ' · semilla ' + esc(Datos.config('semillaVersion', '')) + '</div>' +
      '<div class="k">Base local</div><div class="v">' + esc(BD.backend === 'indexeddb' ? 'IndexedDB' : 'En memoria (no se guarda al cerrar)') + '</div>' +
      '<div class="k">Observaciones</div><div class="v">' + moneyPlano(Datos.totalObs()) + '</div><div class="k">Cálculo</div><div class="v">' + (Trabajador.enPagina ? 'En la página' : 'En segundo plano (Worker)') + '</div>' +
      '<div class="k">Librerías</div><div class="v">' + ['jsPDF ' + (Documentos.hayJsPDF() ? '✓' : '✕'), 'AutoTable ' + (Documentos.hayAutoTable() ? '✓' : '✕'), 'SheetJS ' + (Documentos.hayXLSX() ? '✓' : '✕'),
        'pdf.js ' + (typeof pdfjsLib !== 'undefined' ? '✓' : '✕')].join(' · ') + '</div></div>' +
      (l.length ? '<div class="tw" style="max-height:50vh;overflow:auto"><table class="t"><thead><tr><th>Fecha</th><th>Contexto</th><th>Mensaje</th></tr></thead><tbody>' +
        l.map(x => '<tr><td class="nowrap small">' + esc(fmtSello(x.fecha)) + '</td><td>' + esc(x.contexto) + '</td><td class="small"><b>' + esc(x.mensaje) + '</b>' +
          (x.pila ? '<details><summary class="muted">pila</summary><pre class="mono small" style="white-space:pre-wrap">' + esc(x.pila) + '</pre></details>' : '') + '</td></tr>').join('') + '</tbody></table></div>'
        : UI.vacio('✓', 'Sin errores en esta sesión', ''));
  }

  return { abrir, cargarDemo, borrarDemo, hayDemo, CIUDADES_DEMO };
})();

/* ══════════════════════════════════════════════════════════════════════════
   INICIO
   La base local se abre y se siembra mientras se ve el escudo; el ingreso
   queda listo detrás. El escudo se ve completo (dos segundos como mínimo,
   como en ARKEN CONTROL) y luego se desvanece y entrega el foco al usuario.
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const inicioCarga = Date.now();
  const ESPERA_MINIMA_MS = 2000;
  Arranque.iniciar().then(() => {
    document.documentElement.dataset.listo = '1';
    const falta = Math.max(0, ESPERA_MINIMA_MS - (Date.now() - inicioCarga));
    setTimeout(ocultarSplash, falta);
  }).catch(e => {
    RegistroTecnico.anotar('Inicio', e);
    document.body.innerHTML = '<div style="padding:40px;font-family:system-ui;max-width:640px;margin:auto">' +
      '<h2>ARKEN PRECIOS no pudo iniciar</h2><p>' + esc(e && e.message ? e.message : String(e)) + '</p>' +
      '<p>Intente recargar la página. Si el problema continúa, abra el programa en Chrome o Edge recientes; si tiene un respaldo, podrá restaurarlo desde la pantalla de ingreso.</p></div>';
  });
});

/** Desvanece la pantalla de bienvenida y entrega el foco al formulario de ingreso. */
function ocultarSplash(){
  const sp = document.getElementById('splash');
  if (!sp) return;
  sp.classList.add('arken-splash-oculto');
  setTimeout(() => {
    sp.remove();
    const u = document.getElementById('gUser');
    if (u && document.getElementById('gate').style.display !== 'none') u.focus();
  }, 1550);
}

</script>
