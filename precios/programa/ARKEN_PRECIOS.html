            styles:{ font:'helvetica', fontSize:b.tam || 7.2, cellPadding:1.3, lineColor:[185,185,185], lineWidth:0.1, textColor:[22,24,26], overflow:'linebreak', valign:'middle' },
            headStyles:{ fillColor:[228,228,228], textColor:[22,24,26], fontStyle:'bold', fontSize:(b.tam || 7.2) - 0.6, halign:'left' },
            footStyles:{ fillColor:[239,239,239], textColor:[22,24,26], fontStyle:'bold' },
            alternateRowStyles:{ fillColor:[251,251,251] },
            columnStyles:b.anchos || {},
            rowPageBreak:'avoid', showHead:'everyPage',
            didParseCell: d => {
              if (d.section !== 'body') return;
              const fila = (b.body || [])[d.row.index];
              const clase = fila && fila._clase;
              if (clase === 'cap'){ d.cell.styles.fillColor = [34,38,42]; d.cell.styles.textColor = [255,255,255]; d.cell.styles.fontStyle = 'bold'; }
              else if (clase === 'sub'){ d.cell.styles.fillColor = [219,221,222]; d.cell.styles.fontStyle = 'bold'; }
              if (b.didParseCell) b.didParseCell(d);
            },
            didDrawPage: () => { cabecera(); }
          });
          y = doc.lastAutoTable.finalY + 4; break;
        }
        case 'img': {
          const w = b.w || (W - 2*M), h = b.h || 60;
          espacio(h + 4);
          try { doc.addImage(b.dataUrl, 'PNG', b.centrar ? (W - w) / 2 : M, y, w, h); } catch(e){}
          y += h + 4; break;
        }
        case 'nota': {
          doc.setFont('helvetica','italic'); doc.setFontSize(6.8);
          const ls = doc.splitTextToSize(String(b.txt || ''), W - 2*M - 6), h = ls.length * 3.1 + 5;
          if (h < (H - TOP - BOT)) espacio(h + 4); else espacio(14);
          doc.setFillColor(248,248,246); doc.setDrawColor(220,207,180); doc.rect(M, y, W - 2*M, h, 'FD');
          doc.setTextColor(90,95,100); ls.forEach((l, k) => doc.text(l, M + 3, y + 4 + k * 3.1));
          y += h + 4; doc.setTextColor(22,24,26); break;
        }
        case 'salto': nuevaPagina(); break;
        case 'espacio': y += (b.alto || 6); break;
      }
      if (cfg.alAvanzar) cfg.alAvanzar((i + 1) / bloques.length);
      if (Date.now() - ultimoRespiro > 40){ await pausa(0); ultimoRespiro = Date.now(); }
    }
    const total = doc.internal.getNumberOfPages();
    for (let p = 1; p <= total; p++){
      doc.setPage(p);
      if (!conCabecera.has(p)){ conCabecera.add(p); dibujarCabecera(); }
      pie(p, total);
    }
    return doc;
  }

  /* ═══════════ HTML para vista previa e impresión ═══════════ */
  function bloquesAHTML(cfg){
    const enc = encabezado(cfg);
    let h = '<div class="p-doc">';
    h += '<div class="p-head"><div class="l"><img class="mk" src="' + logoArken() + '" alt="">' +
         '<div><div class="ttl">ARKEN PRECIOS</div><div class="sb">Observatorio de precios de insumos</div>' +
         (enc.contexto ? '<div class="sb" style="letter-spacing:0;text-transform:none">' + esc(enc.contexto) + '</div>' : '') + '</div></div>' +
         '<div class="r">' + (enc.logoEmpresa ? '<img src="' + esc(enc.logoEmpresa) + '" alt="">' : '') +
         '<b>' + esc(enc.empresa) + '</b><br>' + (enc.nit ? esc(enc.nit) + '<br>' : '') + esc(enc.documento) + ' · ' + esc(enc.fecha) + '</div></div>';
    if (cfg.titulo) h += '<div class="p-title">' + esc(cfg.titulo) + '</div>';
    if (cfg.subtitulo) h += '<div class="p-sub">' + esc(cfg.subtitulo) + '</div>';
    (cfg.bloques || []).filter(Boolean).forEach(b => {
      switch (b.t){
        case 'sec': h += '<div class="p-sec">' + esc(b.txt) + '</div>'; break;
        case 'kv':
          h += '<div class="p-kv" style="grid-template-columns:repeat(' + (b.cols || 2) + ',auto 1fr)">' +
            (b.pares || []).map(x => '<div class="k">' + esc(x[0]) + '</div><div>' + esc(x[1] === undefined || x[1] === null ? '—' : x[1]) + '</div>').join('') + '</div>';
          break;
        case 'texto': h += '<p style="font-size:' + (b.tam ? b.tam + 'pt' : '9pt') + ';' + (b.negrita ? 'font-weight:700;' : '') + (b.gris ? 'color:#555;' : '') + 'margin:4px 0 8px">' + esc(b.txt).replace(/\n/g,'<br>') + '</p>'; break;
        case 'tabla': {
          const celda = (c, tag) => {
            const o = (typeof c === 'object' && c !== null) ? c : { content:c };
            const der = o.styles && o.styles.halign === 'right';
            return '<' + tag + (der ? ' class="n"' : '') + (o.colSpan ? ' colspan="' + o.colSpan + '"' : '') + '>' + esc(o.content === undefined || o.content === null ? '' : o.content) + '</' + tag + '>';
          };
          h += '<table class="pt"><thead>' + (b.head || []).map(r => '<tr>' + r.map(c => celda(c, 'th')).join('') + '</tr>').join('') + '</thead><tbody>' +
            (b.body || []).map(r => '<tr' + (r._clase ? ' class="' + r._clase + '"' : '') + '>' + (r.celdas || r).map(c => celda(c, 'td')).join('') + '</tr>').join('') + '</tbody>' +
            (b.foot ? '<tfoot>' + b.foot.map(r => '<tr>' + r.map(c => celda(c, 'td')).join('') + '</tr>').join('') + '</tfoot>' : '') + '</table>';
          break;
        }
        case 'img': h += '<div style="text-align:' + (b.centrar ? 'center' : 'left') + ';margin:8px 0"><img src="' + b.dataUrl + '" style="max-width:100%;' + (b.w ? 'width:' + (b.w * 3.78) + 'px;' : '') + '" alt="' + esc(b.alt || 'Gráfica') + '"></div>'; break;
        case 'nota': h += '<div style="border:1px solid #DCCFB4;background:#FAFAF6;padding:6px 9px;font-size:7.5pt;font-style:italic;color:#5A5F64;margin:8px 0">' + esc(b.txt) + '</div>'; break;
        case 'salto': h += '<div class="p-break"></div>'; break;
        case 'espacio': h += '<div style="height:' + (b.alto || 6) + 'px"></div>'; break;
      }
    });
    h += '<div style="margin-top:14px;border-top:1px solid #B9B9B9;padding-top:4px;font-size:7pt;color:#666;display:flex;justify-content:space-between">' +
         '<span>Generado por: ' + esc(enc.usuario) + '</span><span>ARKEN PRECIOS</span><span>' + esc(fmtSello(Date.now())) + '</span></div></div>';
    return h;
  }

  /** Impresión del navegador: carta, con el pie de ARKEN PRECIOS y «Página x
      de y» en las cajas de margen de @page (Chrome y Edge las pintan). */
  function imprimirHTML(cfg){
    const enc = encabezado(cfg);
    const q = t => '"' + String(t).replace(/[\\"]/g, '\\$&').replace(/[\r\n]+/g, ' ') + '"';
    const letra = 'font:7pt Helvetica,Arial,sans-serif;color:#666;';
    $('#printPageStyle').textContent = '@page{ size: letter ' + (cfg.orientacion === 'l' ? 'landscape' : 'portrait') + '; margin: 12mm 11mm 15mm;' +
      ' @bottom-left{ content:' + q('Generado por: ' + enc.usuario) + '; ' + letra + ' }' +
      ' @bottom-center{ content:"ARKEN PRECIOS"; ' + letra + ' }' +
      ' @bottom-right{ content:"Página " counter(page) " de " counter(pages); ' + letra + ' } }';
    $('#printRoot').innerHTML = bloquesAHTML(cfg);
    setTimeout(() => { window.print(); }, 120);
  }

  /** Punto único de salida: 'pdf' guarda el archivo; 'imprimir' va a la impresora
      (en el celular, abre el PDF, como hace la capa de app de ARKEN). */
  async function emitir(cfg, modo){
    const accion = modo || 'pdf';
    if (accion === 'imprimir' && !esCelular()){ imprimirHTML(cfg); await Auditoria.registrar('imprimir', cfg.titulo || ''); return null; }
    if (!hayAutoTable()){
      avisoLibreria('jsPDF', 'Mientras tanto, el documento se abre en la vista de impresión del navegador, desde donde puede guardarlo como PDF.');
      imprimirHTML(cfg); return null;
    }
    const pr = UI.progreso('Generando el documento', cfg.titulo || '');
    try {
      const doc = await generarPDF(Object.assign({}, cfg, { alAvanzar: f => pr.fijar(f) }));
      const nombre = (cfg.nombre || 'ARKEN_PRECIOS_documento') + '.pdf';
      if (accion === 'imprimir'){
        const url = URL.createObjectURL(doc.output('blob'));
        const w = window.open(url, '_blank');
        if (!w) UI.descargar(nombre, doc.output('blob'));
      } else {
        await UI.guardarComo(nombre, doc.output('blob'), [{ description:'Documento PDF', accept:{ 'application/pdf':['.pdf'] } }]);
      }
      await Auditoria.registrar('exportar PDF', nombre);
      return doc;
    } catch(e){
      RegistroTecnico.anotar('Generar PDF', e);
      UI.aviso('No fue posible generar el PDF', '<p>' + esc(e.message || e) + '</p><p class="muted small">Pruebe con «Imprimir», que usa el motor del navegador.</p>');
      return null;
    } finally { pr.cerrar(); }
  }
  function previsualizar(cfg){
    UI.modal({
      titulo:cfg.titulo || 'Vista previa', eyebrow:'Vista previa del documento', ancho:'xwide',
      cuerpo:'<div class="doc-view">' + bloquesAHTML(cfg) + '</div>',
      botones:[
        { texto:'Cerrar' },
        { texto:'Imprimir', accion: m => { m.cerrar(); emitir(cfg, 'imprimir'); } },
        { texto:'Guardar PDF', clase:'primary', accion: m => { m.cerrar(); emitir(cfg, 'pdf'); } }
      ]
    });
  }

  /* ═══════════ Excel ═══════════
     Números como números, anchos de columna, formato numérico y autofiltro.
     SheetJS 0.18.5 no aplica colores ni fuentes al escribir. */
  function hoja(def){
    const ws = XLSX.utils.aoa_to_sheet(def.filas);
    if (def.anchos) ws['!cols'] = def.anchos.map(w => ({ wch:w }));
    if (def.formatos && def.filaEncabezado !== undefined){
      const rango = XLSX.utils.decode_range(ws['!ref'] || 'A1');
      Object.keys(def.formatos).forEach(col => {
        const c = Number(col);
        for (let r = def.filaEncabezado + 1; r <= rango.e.r; r++){
          const cel = ws[XLSX.utils.encode_cell({ r, c })];
          if (cel && cel.t === 'n') cel.z = def.formatos[col];
        }
      });
    }
    if (def.filaEncabezado !== undefined && !def.sinFiltro && def.filas.length > def.filaEncabezado + 1){
      let ultimaCol = 0;
      for (let r = def.filaEncabezado; r < def.filas.length; r++) ultimaCol = Math.max(ultimaCol, (def.filas[r] || []).length - 1);
      ws['!autofilter'] = { ref:XLSX.utils.encode_range({ s:{ r:def.filaEncabezado, c:0 }, e:{ r:def.filas.length - 1, c:Math.max(0, ultimaCol) } }) };
    }
    return ws;
  }
  function libro(hojas){
    const wb = XLSX.utils.book_new();
    hojas.forEach(h => XLSX.utils.book_append_sheet(wb, hoja(h), String(h.nombre || 'Hoja').slice(0, 31)));
    return wb;
  }
  function libroABytes(wb){ return XLSX.write(wb, { type:'array', bookType:'xlsx' }); }
  async function guardarLibro(wb, nombre){
    const blob = new Blob([libroABytes(wb)], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const ok = await UI.guardarComo(nombre, blob, [{ description:'Libro de Excel', accept:{ 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'] } }]);
    if (ok) await Auditoria.registrar('exportar Excel', nombre);
    return ok;
  }
  /** Encabezado informativo de un libro de análisis (cuatro filas, como ARKEN). */
  function filasInformativas(titulo, extra){
    const emp = (Datos.config('empresa', {}) || {}).razonSocial || 'Empresa constructora';
    return [['ARKEN PRECIOS — ' + emp], [titulo], ['Generado', fmtSello(Date.now()), 'Usuario', Sesion.usuario ? Sesion.usuario.usuario : '']].concat(extra || []).concat([[]]);
  }

  /* ═══════════ Gráfica SVG a imagen ═══════════ */
  function svgAImagen(svgEl, escala){
    return new Promise(res => {
      try {
        const txt = Graficas.svgAutonomo(svgEl);
        const w = (svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.width) || svgEl.clientWidth || 600;
        const h = (svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.height) || svgEl.clientHeight || 400;
        const k = escala || 2.5;
        const img = new Image();
        const url = URL.createObjectURL(new Blob([txt], { type:'image/svg+xml;charset=utf-8' }));
        img.onload = () => {
          const c = document.createElement('canvas'); c.width = w * k; c.height = h * k;
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url); res({ dataUrl:c.toDataURL('image/png'), w, h });
        };
        img.onerror = () => { URL.revokeObjectURL(url); res(null); };
        img.src = url;
      } catch(e){ res(null); }
    });
  }

  return { hayJsPDF, hayAutoTable, hayXLSX, avisoLibreria, generarPDF, bloquesAHTML, imprimirHTML, emitir, previsualizar,
           hoja, libro, libroABytes, guardarLibro, filasInformativas, svgAImagen, esCelular, logoArken };
})();

/* ══════════════════════════════════════════════════════════════════════════
   RESPALDOS, PAQUETES Y COPIA HTML (§5 y §10.5)
   Respaldo completo en .json (gzip cuando el navegador lo permite); paquete
   de precios con catálogo, equivalencias y cortes; copia del programa con
   el catálogo y el último corte embebidos. Todo lleva hash, nada lleva
   claves de API, y todo se restaura con una revisión previa.
   ══════════════════════════════════════════════════════════════════════════ */
const Respaldos = (function(){
  /** Plantilla del programa tal como se abrió: de aquí sale «Guardar copia». */
  const PLANTILLA = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  async function comprimir(texto){
    if (typeof CompressionStream === 'undefined') return null;
    const cs = new Blob([texto]).stream().pipeThrough(new CompressionStream('gzip'));
    return await new Response(cs).blob();
  }
  async function descomprimir(buffer){
    const b = new Uint8Array(buffer);
    if (b[0] === 0x1f && b[1] === 0x8b){
      if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador no puede abrir archivos .gz. Ábralo en Chrome, Edge o Firefox recientes.');
      const ds = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(ds).text();
    }
    return new TextDecoder().decode(b);
  }
  function verificarSinClaves(texto){
    if (contieneClave(texto)) throw new Error('El archivo contendría algo con forma de clave de API. Se detuvo la exportación.');
  }

  /* ── Respaldo completo ── */
  async function armar(){
    const almacenes = {};
    for (const a of BD.ALMACENES) almacenes[a] = await BD.todos(a);
    return Formatos.envolver(Formatos.RESPALDO, { almacenes }, { programa:'ARKEN PRECIOS', versionPrograma:VERSION_PROGRAMA });
  }
  async function descargar(){
    if (!(Permisos.esAdmin() || Permisos.puede('actualizar'))){ Permisos.exigir('__', 'descargar el respaldo completo'); return; }
    const pr = UI.progreso('Preparando el respaldo', 'Reuniendo todos los datos…');
    try {
      const obj = await armar();
      pr.fijar(0.6, 'Comprimiendo…');
      const texto = JSON.stringify(obj);
      verificarSinClaves(texto);
      const gz = await comprimir(texto);
      const base = 'ARKEN_PRECIOS_respaldo_' + hoyISO();
      if (gz) UI.descargar(base + '.json.gz', gz);
      else UI.descargar(base + '.json', texto, 'application/json');
      await Datos.fijarConfig('ultimoRespaldo', ahoraISO());
      await Auditoria.registrar('respaldo', base);
      UI.toast('Respaldo descargado', 'ok');
    } catch(e){ RegistroTecnico.anotar('Respaldo', e); UI.aviso('No fue posible preparar el respaldo', '<p>' + esc(e.message || e) + '</p>'); }
    finally { pr.cerrar(); }
  }

  function leerArchivo(){
    return new Promise(res => UI.pedirArchivo('.json,.gz,application/json,application/gzip', async f => {
      try { res(JSON.parse(await descomprimir(f.datos))); }
      catch(e){ UI.aviso('No fue posible leer el archivo', '<p>' + esc(e.message || e) + '</p><p class="muted small">Elija un respaldo .json o .json.gz generado por ARKEN PRECIOS.</p>'); res(null); }
    }, 'binario'));
  }
  function resumenAlmacenes(almacenes){
    return '<div class="tw"><table class="t"><thead><tr><th>Datos</th><th class="n">En el archivo</th><th class="n">En este equipo</th></tr></thead><tbody>' +
      Object.keys(almacenes).filter(a => BD.ALMACENES.indexOf(a) >= 0).map(a => '<tr><td>' + esc(a) + '</td><td class="n">' + (almacenes[a] || []).length +
        '</td><td class="n" data-cuenta="' + esc(a) + '">…</td></tr>').join('') + '</tbody></table></div>';
  }
  async function contarLocales(raiz){
    for (const td of $$('[data-cuenta]', raiz)) td.textContent = String(await BD.contar(td.dataset.cuenta));
  }

  /** Restaurar con revisión: reemplazar todo o combinar sin pisar lo existente. */
  async function restaurar(desdeIngreso){
    if (!desdeIngreso && !Permisos.esAdmin()){ Permisos.exigir('__', 'restaurar respaldos'); return; }
    const obj = await leerArchivo(); if (!obj) return;
    const v = Formatos.verificar(obj, Formatos.RESPALDO);
    if (!v.ok){ UI.aviso('El respaldo no se puede usar', '<p>' + esc(v.motivo) + '</p>'); return; }
    const alm = obj.contenido.almacenes || {};
    let modo = 'combinar';
    const m = UI.modal({
      titulo:'Revisar el respaldo antes de restaurar', eyebrow:'Respaldo del ' + fmtSello(obj.generado), ancho:'wide',
      cuerpo:'<p class="small">Formato y hash verificados. Elija cómo restaurar; nada se escribe hasta que confirme.</p>' + resumenAlmacenes(alm) +
        '<div class="stack" style="margin-top:12px;gap:6px">' +
        (desdeIngreso ? '' : '<label class="checkline"><input type="radio" name="rsModo" value="combinar" checked> Combinar: agrega lo que no existe y conserva lo de este equipo cuando el mismo registro está en los dos.</label>') +
        '<label class="checkline"><input type="radio" name="rsModo" value="reemplazar"' + (desdeIngreso ? ' checked' : '') + '> Reemplazar todo: borra los datos de este equipo y deja exactamente los del respaldo (incluidos usuarios y contraseñas).</label></div>',
      botones:[{ texto:'Cancelar' }, { texto:'Continuar', clase:'primary', accion: async mm => {
        modo = ($('input[name=rsModo]:checked', mm.el) || {}).value || 'combinar';
        mm.cerrar();
        if (modo === 'reemplazar'){
          const ok = await UI.confirmarEliminar({ nombre:'todos los datos de este equipo', fuerte:true, textoAceptar:'Reemplazar todo',
            detalle:'Se reemplazan por los del respaldo del ' + fmtSello(obj.generado) + '. Descargue antes un respaldo de lo actual si lo quiere conservar.' });
          if (!ok) return;
        }
        await aplicar(alm, modo, obj);
      } }]
    });
    contarLocales(m.el);
  }
  async function aplicar(alm, modo, obj){
    const pr = UI.progreso('Restaurando', 'Escribiendo en la base local…');
    try {
      let agregados = 0, conservados = 0;
      const nombres = BD.ALMACENES.filter(a => Array.isArray(alm[a]));
      for (let k = 0; k < nombres.length; k++){
        const a = nombres[k], filas = alm[a];
        if (modo === 'reemplazar'){ await BD.vaciar(a); for (let i = 0; i < filas.length; i += 2000) await BD.ponerVarios(a, filas.slice(i, i + 2000)); agregados += filas.length; }
        else {
          const existentes = new Set((await BD.todos(a)).map(o => o[BD.ESQUEMA[a].keyPath]));
          const nuevas = filas.filter(o => !existentes.has(o[BD.ESQUEMA[a].keyPath]));
          conservados += filas.length - nuevas.length;
          for (let i = 0; i < nuevas.length; i += 2000) await BD.ponerVarios(a, nuevas.slice(i, i + 2000));
          agregados += nuevas.length;
        }
        pr.fijar((k + 1) / nombres.length);
      }
      await Datos.cargar();
      await Auditoria.registrar('restaurar respaldo', (modo === 'reemplazar' ? 'Reemplazo total' : 'Combinación') + ' · respaldo del ' + fmtSello(obj.generado) + ' · ' + agregados + ' registros escritos');
      pr.cerrar();
      UI.aviso('Respaldo restaurado', '<p>Se escribieron <b>' + agregados + '</b> registros.' + (modo === 'combinar' ? ' Se conservaron <b>' + conservados + '</b> registros que ya existían en este equipo.' : '') + '</p>' +
        (Sesion.usuario ? '' : '<p class="small muted">Ingrese con un usuario del respaldo.</p>'));
      if (Sesion.usuario){
        const u = Datos.uno('usuarios', Sesion.usuario.id);
        if (!u){ Auth.salir(); return; }
        Sesion.usuario = u; App.aplicarConfig(); App.refrescar();
      } else Auth.pintarPista();
    } catch(e){ pr.cerrar(); RegistroTecnico.anotar('Restaurar', e); UI.aviso('La restauración no terminó', '<p>' + esc(e.message || e) + '</p>'); }
  }
  function restaurarDesdeIngreso(){ restaurar(true); }

  /* ── Paquete de precios: catálogo, equivalencias y cortes ── */
  async function exportarPaquete(idsCortes){
    const cortes = (idsCortes && idsCortes.length ? idsCortes.map(id => Datos.corte(id)).filter(Boolean) : Datos.cortes().filter(c => c.cerrado).slice(0, 1));
    const contenido = { insumos:Datos.insumos(), taxonomia:Datos.taxonomia(), equivalenciasArken:Datos.equivalencias(), ciudades:Datos.ciudades(),
                        fuentes:Datos.fuentes().filter(f => !f.esDemo), cortes };
    const obj = Formatos.envolver(Formatos.PAQUETE, contenido, { programa:'ARKEN PRECIOS', descripcion:cortes.map(c => c.nombre).join(' · ') || 'Catálogo y equivalencias' });
    const texto = JSON.stringify(obj);
    verificarSinClaves(texto);
    const nombre = nombreArchivoSeguro('ARKEN_PRECIOS_paquete_' + (cortes[0] ? cortes[0].nombre : 'catalogo')) + '.json';
    UI.descargar(nombre, texto, 'application/json');
    await Auditoria.registrar('exportar paquete', nombre);
    return nombre;
  }
  async function importarPaquete(objDado){
    if (!(Permisos.esAdmin() || Permisos.puede('cortes'))){ Permisos.exigir('cortes', 'importar paquetes de precios'); return; }
    const obj = objDado || await leerArchivo(); if (!obj) return;
    const v = Formatos.verificar(obj, Formatos.PAQUETE);
    if (!v.ok){ UI.aviso('El paquete no se puede usar', '<p>' + esc(v.motivo) + '</p>'); return; }
    const c = obj.contenido;
    const nuevosIns = (c.insumos || []).filter(i => !Datos.insumo(i.id));
    const nuevasEq = (c.equivalenciasArken || []).filter(e => !Datos.uno('equivalenciasArken', e.id));
    const nuevosCortes = (c.cortes || []).filter(x => !Datos.corte(x.id));
    const repetidos = (c.cortes || []).length - nuevosCortes.length;
    const nuevasCiudades = (c.ciudades || []).filter(x => !Datos.ciudad(x.codigoDivipola));
    const nuevasFuentes = (c.fuentes || []).filter(x => !Datos.fuente(x.id));
    const ok = await UI.confirmar({ titulo:'Importar paquete de precios', eyebrow:obj.descripcion || 'Paquete', ancho:'wide', textoAceptar:'Importar lo nuevo',
      cuerpo:'<p class="small">Formato y hash verificados. Solo se agrega lo que no existe; nada de este equipo se sobrescribe.</p>' +
        '<div class="kv"><div class="k">Insumos nuevos</div><div class="v">' + nuevosIns.length + '</div>' +
        '<div class="k">Equivalencias nuevas</div><div class="v">' + nuevasEq.length + '</div>' +
        '<div class="k">Ciudades nuevas</div><div class="v">' + nuevasCiudades.length + '</div>' +
        '<div class="k">Fuentes nuevas</div><div class="v">' + nuevasFuentes.length + '</div>' +
        '<div class="k">Cortes nuevos</div><div class="v">' + nuevosCortes.map(x => esc(x.nombre)).join('<br>') + (nuevosCortes.length ? '' : '0') + '</div>' +
        (repetidos ? '<div class="k">Cortes que ya existen</div><div class="v">' + repetidos + ' (no se tocan)</div>' : '') + '</div>' });
    if (!ok) return;
    await BD.escribir({ poner:{ insumos:nuevosIns, equivalenciasArken:nuevasEq, ciudades:nuevasCiudades, fuentes:nuevasFuentes,
                                cortes:nuevosCortes.map(x => Object.assign({}, x, { cerrado:true, importado:ahoraISO() })) } });
    await Datos.cargar();
    await Auditoria.registrar('importar paquete', (obj.descripcion || '') + ' · ' + nuevosCortes.length + ' corte(s), ' + nuevosIns.length + ' insumo(s)');
    UI.toast('Paquete importado', 'ok');
    App.refrescar();
  }

  /* ── Copia del programa con datos embebidos ── */
  async function guardarCopia(){
    if (!Permisos.esAdmin()){ Permisos.exigir('__', 'guardar una copia con datos'); return; }
    const corte = Datos.corteActivo() || Datos.cortes().find(c => c.cerrado) || null;
    const datos = { formato:'ARKEN-PRECIOS-COPIA', version:1, generado:ahoraISO(),
      contenido:{ insumos:Datos.insumos(), taxonomia:Datos.taxonomia(), equivalenciasArken:Datos.equivalencias(), ciudades:Datos.ciudades(),
                  fuentes:Datos.fuentes().filter(f => !f.esDemo), parametros:Datos.parametros(), cortes:corte ? [corte] : [],
                  configuracion:Datos.lista('configuracion').filter(r => ['consolidacion','apariencia','empresa','ciudadReferencia'].indexOf(r.id) >= 0) } };
    datos.contenido = limpiarClaves(datos.contenido);
    datos.hash = Cripto.sha256Hex(Cripto.jsonCanonico(datos.contenido));
    const json = JSON.stringify(datos).replace(/</g, '\\u003c');
    const html = PLANTILLA.replace(/(<script id="arken-precios-datos" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
    verificarSinClaves(html);
    const nombre = 'ARKEN_PRECIOS_copia_' + hoyISO() + '.html';
    await UI.guardarComo(nombre, new Blob([html], { type:'text/html' }), [{ description:'Programa ARKEN PRECIOS', accept:{ 'text/html':['.html'] } }]);
    await Auditoria.registrar('guardar copia HTML', nombre + (corte ? ' · ' + corte.nombre : ''));
    UI.toast('Copia guardada: catálogo, equivalencias' + (corte ? ' y ' + corte.nombre : ''), 'ok');
  }
  /** Datos embebidos en este archivo (o null). */
  function embebidos(){
    try {
      const t = ($('#arken-precios-datos') || {}).textContent || 'null';
      const d = JSON.parse(t);
      if (!d || d.formato !== 'ARKEN-PRECIOS-COPIA' || !d.contenido) return null;
      if (Cripto.sha256Hex(Cripto.jsonCanonico(d.contenido)) !== d.hash){ RegistroTecnico.anotar('Datos embebidos', new Error('El hash no coincide')); return null; }
      return d;
    } catch(e){ RegistroTecnico.anotar('Datos embebidos', e); return null; }
  }

  return { descargar, restaurar, restaurarDesdeIngreso, exportarPaquete, importarPaquete, guardarCopia, embebidos, armar, PLANTILLA_LONGITUD:PLANTILLA.length };
})();


/* ══════════════════════════════════════════════════════════════════════════
   TRABAJADOR (Web Worker)
   La consolidación y los agregados del tablero corren en un Worker hecho
   con el texto del bloque «núcleo»: el mismo código que decide cada precio,
   fuera del hilo de la pantalla. Si el navegador no permite el Worker, se
   corre en la página por tramos cortos, sin congelarla.
   ══════════════════════════════════════════════════════════════════════════ */

/** Consultas del tablero sobre los agregados (§13). Se ejecuta en el Worker
    (se copia con toString) o, si no hay Worker, en la página. Solo usa sus
    argumentos y Nucleo. */
function consultaTablero(E, f){
  const N = Nucleo, A = N.Agregados, t0 = Date.now();
  const desdeMes = f.desde ? f.desde.slice(0,7) : null, hastaMes = (f.hasta || N.hoyISO()).slice(0,7);
  // 1 · Agregados según fuente, tipo de precio y demostración
  const claveFiltro = (f.fuentes || []).join(',') + '|' + (f.tipo || '') + '|' + (f.incluirDemo ? 1 : 0);
  let ag = E.ag;
  if (claveFiltro !== '||1'){
    if (!E.memo.has(claveFiltro)){
      const fs = new Set(f.fuentes || []);
      E.memo.set(claveFiltro, A.construir(E.obs.filter(o => (!fs.size || fs.has(o.s)) && (!f.tipo || o.t === f.tipo) && (f.incluirDemo || !o.d))));
    }
    ag = E.memo.get(claveFiltro);
  }
  // 2 · Insumos del filtro
  const grupos = new Set(f.grupos || []), cats = new Set(f.categorias || []);
  let ids;
  if (f.insumos && f.insumos.length) ids = f.insumos.slice();
  else ids = Array.from(ag.porInsumo.keys()).filter(id => {
    const i = E.insumos[id]; if (!i) return false;
    if (f.categoriaArken && i.a !== f.categoriaArken) return false;
    if (grupos.size || cats.size) return grupos.has(i.g) || cats.has(i.g + '|' + i.c);
    return true;
  });
  const ciudades = f.ciudades || [];
  const setC = new Set(ciudades);
  // 3 · Meses del periodo
  let primero = desdeMes;
  if (!primero){ primero = hastaMes; ids.forEach(id => (ag.porInsumo.get(id) || []).forEach(x => { if (x.m < primero) primero = x.m; })); }
  const meses = []; for (let m = primero; m <= hastaMes && meses.length < 240; m = N.sumaMeses(m, 1)) meses.push(m);
  const est = f.est || 'med';
  // 4 · Índice de la canasta (Jevons) y sus variaciones
  const indice = meses.length ? A.indice(ag, ids, ciudades, meses, est) : [];
  const conIndice = indice.filter(p => p.indice !== null);
  const ultimo = conIndice[conIndice.length - 1] || null;
  const valorMes = mes => { const p = indice.find(x => x.mes === mes); return p && p.indice !== null ? p.indice : null; };
  const rel = (a, b) => (a > 0 && b > 0 ? a / b - 1 : null);
  const ind = ultimo ? {
    mes:ultimo.mes, valor:ultimo.indice, insumos:ultimo.insumos,
    mensual:rel(ultimo.indice, valorMes(N.sumaMeses(ultimo.mes, -1))),
    anio:rel(ultimo.indice, valorMes((Number(ultimo.mes.slice(0,4)) - 1) + '-12')),
    doce:rel(ultimo.indice, valorMes(N.sumaMeses(ultimo.mes, -12)))
  } : null;
  // 5 · Cobertura: insumos con una observación de los últimos 30 días
  const limite = N.sumaDias(f.hasta || N.hoyISO(), -30);
  const recientes = new Set();
  E.obs.forEach(o => { if (o.f >= limite && o.f <= (f.hasta || '9999') && (!setC.size || setC.has(o.c)) && (f.incluirDemo || !o.d) && o.t !== 'referencia') recientes.add(o.i); });
  const idsSet = new Set(ids);
  let conDato = 0; recientes.forEach(id => { if (idsSet.has(id) || (!(f.insumos || []).length && E.insumos[id] && (!f.categoriaArken || E.insumos[id].a === f.categoriaArken) && (!(grupos.size || cats.size) || grupos.has(E.insumos[id].g) || cats.has(E.insumos[id].g + '|' + E.insumos[id].c)))) conDato++; });
  // 6 · Alzas y bajas
  const ext = A.extremos(ag, ids, ciudades, desdeMes, hastaMes, 10);
  const todas = A.extremos(ag, ids, ciudades, desdeMes, hastaMes, 100000);
  const nAlza = todas.alzas.filter(x => x.variacion > (f.umbralAlza || 0.05)).length;
  // 7 · Comparación entre ciudades: último mes del periodo de cada insumo, frente a la referencia
  const porCiudad = {};
  ids.forEach(id => {
    const ult = {};
    (ag.porInsumo.get(id) || []).forEach(x => {
      if ((desdeMes && x.m < desdeMes) || x.m > hastaMes || !x.c) return;
      if (!ult[x.c] || x.m > ult[x.c].m) ult[x.c] = x;
    });
    const ref = ult[f.referencia];
    if (!ref || !(ref[est] > 0)) return;
    Object.keys(ult).forEach(c => {
      if (c === f.referencia || (setC.size && !setC.has(c))) return;
      if (ult[c][est] > 0) (porCiudad[c] = porCiudad[c] || []).push(ult[c][est] / ref[est]);
    });
  });
  const comparacion = Object.keys(porCiudad).map(c => {
    const r = N.Estadistica.mediaGeometrica(porCiudad[c]);
    return { ciudad:c, diferencia:r - 1, insumos:porCiudad[c].length };
  }).sort((a,b) => b.diferencia - a.diferencia);
  // 8 · Evolución de los insumos elegidos (o del más observado)
  let evolIds = (f.insumos || []).slice(0, 6), elegidoAuto = false;
  if (!evolIds.length){
    let mejor = null, nMejor = 0;
    ids.forEach(id => { const n = (ag.porInsumo.get(id) || []).reduce((s, x) => s + ((!setC.size || setC.has(x.c)) && (!desdeMes || x.m >= desdeMes) && x.m <= hastaMes ? x.n : 0), 0); if (n > nMejor){ nMejor = n; mejor = id; } });
    if (mejor){ evolIds = [mejor]; elegidoAuto = true; }
  }
  const series = [];
  evolIds.forEach(id => {
    const s = A.serie(ag, id, ciudades, desdeMes, hastaMes);
    Object.keys(s).filter(c => c).sort((a,b) => (a === f.referencia ? -1 : (b === f.referencia ? 1 : s[b].length - s[a].length)))
      .slice(0, evolIds.length > 1 ? 2 : 6).forEach(c => series.push({ insumoId:id, ciudad:c, puntos:s[c].map(p => ({ mes:p.mes, n:p.n, minimo:p.minimo, maximo:p.maximo,
        mediana:est === 'prom' ? p.promedio : (est === 'min' ? p.minimo : (est === 'max' ? p.maximo : p.mediana)) })) }));
  });
  const claveSerie = new Set(series.map(s => s.insumoId + '|' + s.ciudad));
  const fs2 = new Set(f.fuentes || []);
  const puntos = E.obs.filter(o => claveSerie.has(o.i + '|' + o.c) && (!f.desde || o.f >= f.desde) && o.f <= (f.hasta || '9999') &&
    (!fs2.size || fs2.has(o.s)) && (!f.tipo || o.t === f.tipo) && (f.incluirDemo || !o.d) && o.t !== 'referencia').slice(-900)
    .map(o => ({ i:o.i, c:o.c, f:o.f, p:o.p, id:o.id, s:o.s, d:o.d }));
  return { meses, indice, ind, conDato, alzas:ext.alzas, bajas:ext.bajas, nAlza, comparacion, evol:{ series, puntos, elegidoAuto },
           nInsumos:ids.length, ms:Date.now() - t0 };
}

const Trabajador = (function(){
  let w = null, siguiente = 0, falla = false;
  const pendientes = new Map();
  const estadoLocal = { obs:[], insumos:{}, ag:null, memo:new Map() };

  const MANEJADOR = `
var E = { obs:[], insumos:{}, ag:null, memo:new Map() };
self.onmessage = function(ev){
  var m = ev.data, r;
  try {
    if (m.tipo === 'consolidar') r = Nucleo.Consolidacion.consolidarLote(m.insumos, m.ciudades, m.fecha, m.obsPorInsumo, m.contexto);
    else if (m.tipo === 'agregados'){ E.obs = m.obs; E.insumos = m.insumos; E.ag = Nucleo.Agregados.construir(E.obs); E.memo = new Map(); r = { total:E.obs.length }; }
    else if (m.tipo === 'tablero') r = consultaTablero(E, m.filtros);
    else if (m.tipo === 'factores') r = Nucleo.Consolidacion.factoresRegionales(m.obs, m.insumos, m.fecha, m.dias);
    self.postMessage({ id:m.id, ok:true, r:r });
  } catch(e){ self.postMessage({ id:m.id, ok:false, error:String(e && e.message || e) }); }
};`;

  function crear(){
    if (w || falla) return w;
    try {
      const nucleo = document.getElementById('arken-precios-nucleo').textContent;
      const codigo = nucleo + '\n' + consultaTablero.toString() + '\n' + MANEJADOR;
      const url = URL.createObjectURL(new Blob([codigo], { type:'text/javascript' }));
      w = new Worker(url);
      w.onmessage = ev => {
        const p = pendientes.get(ev.data.id); if (!p) return;
        pendientes.delete(ev.data.id);
        if (ev.data.ok) p.res(ev.data.r); else p.rej(new Error(ev.data.error));
      };
      w.onerror = ev => {
        RegistroTecnico.anotar('Worker', ev.message || ev);
        falla = true; w = null;
        pendientes.forEach(p => p.rej(new Error('El proceso en segundo plano se detuvo: ' + (ev.message || ''))));
        pendientes.clear();
      };
    } catch(e){ RegistroTecnico.anotar('Crear Worker (se calcula en la página)', e); falla = true; w = null; }
    return w;
  }
  /** Ejecuta en la página lo mismo que haría el Worker. */
  async function local(m){
    await pausa(0);
    if (m.tipo === 'consolidar') return Consolidacion.consolidarLote(m.insumos, m.ciudades, m.fecha, m.obsPorInsumo, m.contexto);
    if (m.tipo === 'agregados'){ estadoLocal.obs = m.obs; estadoLocal.insumos = m.insumos; estadoLocal.ag = Agregados.construir(m.obs); estadoLocal.memo = new Map(); return { total:m.obs.length }; }
    if (m.tipo === 'tablero') return consultaTablero(estadoLocal, m.filtros);
    if (m.tipo === 'factores') return Consolidacion.factoresRegionales(m.obs, m.insumos, m.fecha, m.dias);
    throw new Error('Tarea desconocida: ' + m.tipo);
  }
  function pedir(m){
    const t = crear();
    if (!t) return local(m);
    return new Promise((res, rej) => {
      const id = ++siguiente;
      pendientes.set(id, { res, rej });
      try { t.postMessage(Object.assign({ id }, m)); }
      catch(e){ pendientes.delete(id); RegistroTecnico.anotar('Enviar al Worker', e); local(m).then(res, rej); }
    }).catch(e => { if (falla) return local(m); throw e; });
  }
  return { pedir, get enPagina(){ return falla; } };
})();

/* ══════════════════════════════════════════════════════════════════════════
   REGISTRO DE OBSERVACIONES (§6, §8.4)
   Todo precio que entra (cotización, precio manual, lista histórica, demo)
   pasa por aquí: se normaliza a la unidad canónica con y sin IVA, se valida
   contra su historia y se registra por cambios. El dato original queda
   intacto; una corrección es un registro nuevo con motivo y usuario.
   ══════════════════════════════════════════════════════════════════════════ */
const Registro = (function(){
  function parametrosLaborales(fecha){ return Laboral.enFecha(Datos.parametros(), fecha || hoyISO()); }

  /** Arma la observación completa a partir de lo capturado. */
  function preparar(d){
    const ins = Datos.insumo(d.insumoId);
    if (!ins) return { ok:false, motivo:'El insumo no existe en el catálogo.' };
    const precio = Number(d.precioPublicado);
    if (!(precio > 0)) return { ok:false, motivo:'El precio debe ser un número mayor que cero.' };
    const fecha = String(d.fechaCaptura || hoyISO()).slice(0,10);
    const n = Observaciones.normalizar({ precioPublicado:precio, unidadPublicada:d.unidadPublicada || ins.unidad, presentacion:d.presentacion || null,
                                         incluyeIva:d.incluyeIva, tarifaIva:d.tarifaIva, aiu:d.aiu }, ins, parametrosLaborales(fecha));
    if (!n.ok) return { ok:false, motivo:n.advertencias.join(' ') };
    const ahora = ahoraISO();
    const o = {
      id:d.id || uid('obs'), insumoId:ins.id, fuenteId:d.fuenteId || 'manual', vinculoId:d.vinculoId || null, ciudad:d.ciudad || null,
      alcance:d.ciudad ? 'ciudad' : (d.alcance || 'nacional'), fechaCaptura:fecha, fechaPublicada:d.fechaPublicada || null,
      precioPublicado:redondear3(precio), textoLiteral:String(d.textoLiteral || '').slice(0, 2000), unidadPublicada:Unidades.normalizar(d.unidadPublicada) || d.unidadPublicada || ins.unidad,
      presentacion:d.presentacion || null, factorConversion:n.factorConversion, metodoConversion:n.metodoConversion, incluyeIva:d.incluyeIva === undefined ? null : d.incluyeIva,
      tarifaIva:n.tarifaIva, precioSinIva:n.precioSinIva, precioConIva:n.precioConIva, aiu:d.aiu || null,
      tipoPrecio:d.tipoPrecio || 'lista', condiciones:String(d.condiciones || ''), disponibilidad:String(d.disponibilidad || ''), proveedor:String(d.proveedor || ''),
      url:urlSegura(d.url), hashEvidencia:'', evidencia:d.evidencia || '', metodo:d.metodo || 'manual', ejecucionId:d.ejecucionId || null,
      confianza:Number(d.confianza) > 0 ? Number(d.confianza) : ((Datos.fuente(d.fuenteId || 'manual') || {}).confiabilidad || 0.6), estado:'válida', motivoEstado:'', historialEstado:[],
      vistaPorPrimeraVez:ahora, vistaPorUltimaVez:ahora, vecesVista:1, esDemo:!!d.esDemo, esDesde:!!d.esDesde, corrigeA:d.corrigeA || null,
      cotizacionId:d.cotizacionId || null, advertencias:n.advertencias, registradoPor:Sesion.usuario ? Sesion.usuario.usuario : 'sistema', creado:ahora
    };
    return { ok:true, obs:o };
  }

  /** Registra una lista de capturas. Devuelve el balance de lo que pasó con cada una. */
  async function registrar(capturas, opciones){
    const op = opciones || {};
    const P = Consolidacion.parametros(Datos.config('consolidacion', {}));
    const nuevas = [], fundidas = [], rechazadas = [], duplicadas = [];
    const insumos = new Set();
    const lote = new Map();          // observaciones nuevas de este lote, por insumo (para validar entre ellas)
    for (let i = 0; i < capturas.length; i++){
      const p = preparar(capturas[i]);
      if (!p.ok){ rechazadas.push({ fila:i, motivo:p.motivo, captura:capturas[i] }); continue; }
      const o = p.obs;
      const existentes = Datos.obs(o.insumoId).concat(lote.get(o.insumoId) || []);
      const c = Observaciones.comparar(o, existentes);
      if (c.accion === 'duplicado'){ duplicadas.push({ fila:i, existente:c.existente.id }); continue; }
      if (c.accion === 'fundir' && !op.sinFundir){
        const previa = (lote.get(o.insumoId) || []).find(x => x.id === c.existente.id) || await Datos.observacion(c.existente.id);
        if (previa){
          const f = Object.assign({}, previa, { vistaPorUltimaVez:ahoraISO(), vecesVista:(previa.vecesVista || 1) + 1,
            fechaUltimaVista:o.fechaCaptura });
          fundidas.push(f); insumos.add(o.insumoId); continue;
        }
      }
      if (o.esDemo || op.sinValidar){ o.estado = op.estado || 'válida'; }
      else {
        const v = Observaciones.validar(o, existentes, P);
        o.estado = v.estado; o.motivoEstado = v.motivo;
        if (o.tipoPrecio === 'promoción' || o.esDesde) o.motivoEstado = (o.motivoEstado ? o.motivoEstado + ' ' : '') + 'Fuera del recomendado por defecto (' + (o.esDesde ? 'precio «desde»' : 'promoción') + ').';
      }
      nuevas.push(o); insumos.add(o.insumoId);
      if (!lote.has(o.insumoId)) lote.set(o.insumoId, []);
      lote.get(o.insumoId).push(o);
      if (op.alAvanzar && i % 500 === 0){ op.alAvanzar(i / capturas.length); await pausa(0); }
    }
    await Datos.guardarObservaciones(nuevas.concat(fundidas));
    if (!op.silencioso) await Auditoria.registrar('registrar precios', (op.origen || 'captura') + ': ' + nuevas.length + ' nueva(s), ' + fundidas.length + ' repetida(s) sin cambio, ' +
      duplicadas.length + ' duplicada(s), ' + rechazadas.length + ' rechazada(s)');
    return { nuevas, fundidas, duplicadas, rechazadas, atipicas:nuevas.filter(o => o.estado === 'atípica'), insumos:Array.from(insumos) };
  }

  /** Cambia el estado de una observación. El precio no cambia; el cambio queda con motivo, usuario y fecha. */
  async function cambiarEstado(id, estado, motivo){
    const o = await Datos.observacion(id); if (!o) throw new Error('La observación no existe.');
    const h = (o.historialEstado || []).concat([{ fecha:ahoraISO(), usuario:Sesion.usuario ? Sesion.usuario.usuario : '', de:o.estado, a:estado, motivo:String(motivo || '') }]);
    const n = Object.assign({}, o, { estado, motivoEstado:String(motivo || ''), historialEstado:h });
    await Datos.guardarObservaciones([n]);
    await Auditoria.registrar('cambiar estado de observación', id + ': ' + o.estado + ' → ' + estado + (motivo ? ' (' + motivo + ')' : ''));
    return n;
  }
  /** Corrección: registro nuevo que remite al original; el original queda descartado con el motivo. */
  async function corregir(id, cambios, motivo){
    const o = await Datos.observacion(id); if (!o) throw new Error('La observación no existe.');
    const datos = Object.assign({}, o, cambios, { id:uid('obs'), corrigeA:o.id, metodo:'corrección' });
    delete datos.historialEstado;
    const p = preparar(datos);
    if (!p.ok) throw new Error(p.motivo);
    p.obs.motivoEstado = 'Corrige la observación ' + o.id + ': ' + motivo;
    const original = Object.assign({}, o, { estado:'descartada', motivoEstado:'Corregida por ' + p.obs.id + ': ' + motivo,
      historialEstado:(o.historialEstado || []).concat([{ fecha:ahoraISO(), usuario:Sesion.usuario ? Sesion.usuario.usuario : '', de:o.estado, a:'descartada', motivo:'Corrección: ' + motivo }]) });
    await Datos.guardarObservaciones([original, p.obs]);
    await Auditoria.registrar('corregir observación', o.id + ' → ' + p.obs.id + ': ' + motivo);
    return p.obs;
  }

  /** Fuente para un proveedor que cotiza: se crea una sola vez por NIT o razón social. */
  async function fuenteProveedor(razonSocial, nit, ciudad){
    const clave = 'prov-' + (normaliza(nit).replace(/[^0-9a-z]/g,'') || normaliza(razonSocial).replace(/[^0-9a-z]+/g,'-').slice(0, 40));
    let f = Datos.fuente(clave);
    if (!f){
      f = { id:clave, nombre:String(razonSocial || 'Proveedor') + (nit ? ' (NIT ' + nit + ')' : ''), tipo:'cotización', urlBase:'', ciudades:ciudad ? [ciudad] : [],
            alcance:'ciudad', categorias:[], metodo:'manual', configuracion:{}, revisionLegal:{ robotsTxt:'', terminos:'', fecha:'', responsable:'', resultado:'no aplica' },
            limitePorMinuto:0, confiabilidad:0.9, salud:'activa', ultimaPrueba:null, notas:'Proveedor que cotizó directamente a la empresa.', esDemo:false, creado:ahoraISO() };
      await Datos.guardar('fuentes', f);
    } else if (ciudad && (f.ciudades || []).indexOf(ciudad) < 0){
      f = Object.assign({}, f, { ciudades:(f.ciudades || []).concat([ciudad]) });
      await Datos.guardar('fuentes', f);
    }
    return f;
  }

  return { preparar, registrar, cambiarEstado, corregir, fuenteProveedor, parametrosLaborales };
})();

/* ══════════════════════════════════════════════════════════════════════════
   MOTOR LOCAL DE ACTUALIZACIÓN
   En la Fase 1, «Actualizar precios» recalcula la consolidación con las
   observaciones que ya están en la base (cotizaciones, precios manuales,
   listas). Trabaja por categorías: solo toca el alcance pedido, las demás
   categorías conservan sus precios y sus fechas, y nada borra historia.
   ══════════════════════════════════════════════════════════════════════════ */
const Motor = (function(){
  let control = null;

  function contexto(factores){
    return { parametros:Consolidacion.parametros(Datos.config('consolidacion', {})), ciudades:Datos.ciudadesPorCodigo(), factores:factores || {} };
  }
  async function factoresRegionales(fecha){
    const obs = Array.from(Datos.obsTodas().values()).filter(o => o.ciudad && o.tipoPrecio !== 'referencia');
    const ins = {}; Datos.insumos().forEach(i => { ins[i.id] = { id:i.id, grupo:i.grupo, categoriaArken:i.categoriaArken }; });
    if (!obs.length) return {};
    return Trabajador.pedir({ tipo:'factores', obs, insumos:ins, fecha, dias:180 });
  }
  /** Insumos del alcance agrupados por categoría (el tramo de trabajo). */
  function tramos(insumos){
    const m = new Map();
    insumos.forEach(i => { const k = i.grupo + '|' + i.categoria; if (!m.has(k)) m.set(k, []); m.get(k).push(i); });
    return Array.from(m.entries()).map(([k, l]) => ({ clave:k, grupo:k.split('|')[0], categoria:k.split('|')[1], insumos:l }));
  }
  /** Consolida un insumo en una ciudad sin guardar (para la ficha y los cortes). */
  function consolidarAhora(insumo, ciudadCod, fecha){
    return Consolidacion.consolidar(insumo, ciudadCod, fecha || hoyISO(), Datos.obs(insumo.id), contexto({}));
  }

  /** Ejecuta una actualización local. `alcance` = { tipo, descripcion, insumoIds, ciudades }. */
  async function ejecutar(alcance, ganchos){
    const g = ganchos || {};
    control = { pausado:false, cancelado:false };
    const fecha = hoyISO();
    const insumos = alcance.insumoIds.map(id => Datos.insumo(id)).filter(i => i && i.activo !== false);
    const ciudades = alcance.ciudades.slice();
    const ej = { id:uid('ej'), inicio:ahoraISO(), fin:null, modo:'local', alcance:{ tipo:alcance.tipo, descripcion:alcance.descripcion, insumos:insumos.length, ciudades },
                 usuario:Sesion.usuario ? Sesion.usuario.usuario : '', solicitudes:0, observacionesNuevas:0, cambiosDePrecio:0, atipicas:0, sinDato:0, pares:0,
                 errores:[], costoIa:null, estado:'en curso', cambios:[], categorias:[] };
    const log = t => { if (g.registro) g.registro(fmtSello(Date.now()).slice(11) + '  ' + t); };
    log('Inicio: ' + insumos.length + ' insumos × ' + ciudades.length + ' ciudades (' + alcance.descripcion + ').');
    const factores = await factoresRegionales(fecha);
    log('Factores regionales calculados: ' + Object.keys(factores).length + ' (grupo y ciudad).');
    const ctx = contexto(factores);
    const lista = tramos(insumos);
    for (let k = 0; k < lista.length; k++){
      const t = lista[k];
      while (control.pausado && !control.cancelado) await pausa(250);
      if (control.cancelado){ log('Cancelado por el usuario. Lo ya calculado queda guardado; el resto conserva sus precios.'); break; }
      if (g.tramo) g.tramo(k, lista.length, t, 'en curso');
      try {
        const obsPorInsumo = {};
        t.insumos.forEach(i => { obsPorInsumo[i.id] = Datos.obs(i.id); });
        const filas = await Trabajador.pedir({ tipo:'consolidar', insumos:t.insumos, ciudades, fecha, obsPorInsumo, contexto:ctx });
        const guardar = [];
        let cambios = 0, sinDato = 0, atipicas = 0;
        filas.forEach(r => {
          const previo = Datos.consolidado(r.insumoId, r.ciudad);
          if (r.confianza === 'sin dato') sinDato++;
          atipicas += (r.observacionesAtipicas || []).length;
          if (!(r.n > 0) && !previo) return;          // sin mercado y sin historia: no hay nada que fechar
          r.id = r.insumoId + '|' + r.ciudad + '|' + fecha;
          r.calculado = ahoraISO(); r.ejecucionId = ej.id;
          guardar.push(r);
          const antes = previo ? previo.recomendado : null;
          if (!(antes > 0 && r.recomendado > 0 && igualDinero(antes, r.recomendado)) && (antes > 0 || r.recomendado > 0)){
            cambios++;
            if (ej.cambios.length < 3000) ej.cambios.push({ insumoId:r.insumoId, ciudad:r.ciudad, antes, despues:r.recomendado, confianza:r.confianza, n:r.n });
          }
        });
        await Datos.guardarConsolidados(guardar);
        ej.pares += filas.length; ej.cambiosDePrecio += cambios; ej.sinDato += sinDato; ej.atipicas += atipicas;
        ej.categorias.push({ clave:t.clave, insumos:t.insumos.length, guardados:guardar.length, cambios });
        log(t.grupo + ' · ' + t.categoria + ': ' + t.insumos.length + ' insumos, ' + cambios + ' precio(s) cambiaron, ' + sinDato + ' sin dato.');
        if (g.tramo) g.tramo(k, lista.length, t, 'terminado', { cambios, sinDato });
      } catch(e){
        RegistroTecnico.anotar('Consolidar ' + t.clave, e);
        ej.errores.push({ fuente:'consolidación', categoria:t.clave, mensaje:String(e.message || e) });
        log('Error en ' + t.clave + ': ' + (e.message || e));
        if (g.tramo) g.tramo(k, lista.length, t, 'error');
      }
      if (g.avance) g.avance((k + 1) / lista.length);
      await pausa(0);
    }
    ej.fin = ahoraISO();
    ej.estado = control.cancelado ? 'cancelada' : (ej.errores.length ? 'con errores' : 'terminada');
    await Datos.guardar('ejecuciones', ej);
    await Auditoria.registrar('actualizar precios', alcance.descripcion + ' · ' + ej.pares + ' pares · ' + ej.cambiosDePrecio + ' cambio(s) · ' + ej.estado);
    log('Fin: ' + ej.estado + '.');
    Tablero.invalidar();
    control = null;
    return ej;
  }
  function pausar(){ if (control) control.pausado = true; }
  function reanudar(){ if (control) control.pausado = false; }
  function cancelar(){ if (control) control.cancelado = true; }
  function enCurso(){ return !!control; }

  return { ejecutar, pausar, reanudar, cancelar, enCurso, consolidarAhora, contexto };
})();

/* ══════════════════════════════════════════════════════════════════════════
   PRECIOS VIGENTES, CORTES Y EQUIVALENCIAS
   El precio que se muestra para un insumo en una ciudad es el último
   consolidado guardado; si nunca se ha calculado, el de referencia de la
   semilla, rotulado «sin actualizar». Un corte congela esos precios.
   ══════════════════════════════════════════════════════════════════════════ */
const Precios = (function(){
  /** Precio vigente: el último consolidado guardado. Si el par nunca se ha
      actualizado, solo la referencia de la semilla (rotulada): un precio
      nuevo no cambia la base hasta que alguien actualiza ese insumo. */
  function vigente(insumo, ciudadCod){
    const c = Datos.consolidado(insumo.id, ciudadCod);
    if (c) return Object.assign({ guardado:true }, c);
    const refs = Datos.obs(insumo.id).filter(o => o.tipoPrecio === 'referencia');
    const r = Consolidacion.consolidar(insumo, ciudadCod, hoyISO(), refs, Motor.contexto({}));
    return Object.assign({ guardado:false, sinActualizar:true }, r);
  }
  /** Momento del último precio de mercado registrado de cada insumo. */
  function ultimosRegistros(){
    return Datos.memorizar('ultimoRegistro', ['obs'], () => {
      const m = new Map();
      Datos.obsTodas().forEach(o => {
        if (o.tipoPrecio === 'referencia' || o.estado !== 'válida') return;
        const t = String(o.vistaPorUltimaVez || '');
        if (!m.has(o.insumoId) || t > m.get(o.insumoId)) m.set(o.insumoId, t);
      });
      return m;
    });
  }
  /** ¿Hay precios registrados después de la última actualización de este par? */
  function pendiente(insumoId, ciudadCod){
    const t = ultimosRegistros().get(insumoId);
    if (!t) return false;
    const c = Datos.consolidado(insumoId, ciudadCod);
    return !c || String(c.calculado || '') < t;
  }
  /** Insumos con precios nuevos que aún no entran a la base, en una ciudad. */
  function pendientes(ciudadCod){
    const out = [];
    ultimosRegistros().forEach((t, id) => { if (pendiente(id, ciudadCod)) out.push(id); });
    return out;
  }
  /** Último corte cerrado que trae el par (para «variación frente al corte anterior»). */
  function enCorteAnterior(insumoId, ciudadCod){
    const mapa = Datos.memorizar('ultimoCorte', ['cortes'], () => {
      const m = new Map();
      Datos.cortes().filter(c => c.cerrado).forEach(c => (c.precios || []).forEach(p => { const k = p.insumoId + '|' + p.ciudad; if (!m.has(k)) m.set(k, p); }));
      return m;
    });
    return mapa.get(insumoId + '|' + ciudadCod) || null;
  }
  /** Mediana mensual de los últimos 12 meses en una ciudad (minigráfica). */
  function tendencia(insumoId, ciudadCod){
    const hasta = mesDe(hoyISO()), meses = [];
    for (let k = 11; k >= 0; k--) meses.push(sumaMeses(hasta, -k));
    const porMes = {};
    Datos.obs(insumoId).forEach(o => {
      if (o.ciudad !== ciudadCod || o.estado !== 'válida' || o.tipoPrecio === 'referencia' || !(o.precioConIva > 0)) return;
      const m = mesDe(o.fechaCaptura); (porMes[m] = porMes[m] || []).push(o.precioConIva);
    });
    return meses.map(m => porMes[m] ? Estadistica.mediana(porMes[m]) : 0);
  }
  return { vigente, enCorteAnterior, tendencia, pendiente, pendientes };
})();

const CortesSrv = (function(){
  /** Filas del corte para unas ciudades: consolidados guardados y, donde no
      hay, la referencia calculada al vuelo. Lo que está «sin dato» no entra. */
  function precios(ciudades){
    const out = [];
    const fecha = hoyISO();
    Datos.insumosActivos().forEach(ins => {
      ciudades.forEach(c => {
        const v = Precios.vigente(ins, c);
        if (!(v.recomendado > 0)) return;
        const a = Datos.adoptado(ins.id, c, fecha);
        out.push({ insumoId:ins.id, ciudad:c, fecha:v.fecha || fecha, n:v.n || 0, nFuentes:v.nFuentes || 0, minimo:v.minimo, p25:v.p25, mediana:v.mediana,
          promedio:v.promedio, p75:v.p75, maximo:v.maximo, coefVariacion:v.coefVariacion || 0, recomendado:v.recomendado, recomendadoSinIva:v.recomendadoSinIva,
          confianza:v.confianza, nivel:v.nivel, ambito:v.ambito, factorRegional:v.factorRegional, metodo:v.metodo, tarifaIva:v.tarifaIva,
          observacionesUsadas:v.observacionesUsadas || [], dependeDemo:!!v.dependeDemo, soloReferencia:!!v.soloReferencia, edadMediana:v.edadMediana,
          variacion30:v.variacion30 === undefined ? null : v.variacion30, sinActualizar:!v.guardado,
          adoptado:a ? { precio:a.precio, justificacion:a.justificacion, usuario:a.usuario, vigenteHasta:a.vigenteHasta || '' } : null });
      });
    });
    return out;
  }
  async function crear(d){
    const filas = precios(d.ciudades);
    const corte = Cortes.crear({ nombre:d.nombre, fecha:hoyISO(), ciudades:d.ciudades, parametros:Consolidacion.parametros(Datos.config('consolidacion', {})),
                                 precios:filas, cerrado:!!d.cerrar, creadoPor:Sesion.usuario ? Sesion.usuario.usuario : '' });
    corte.conMercado = filas.filter(p => p.n > 0).length;
    corte.soloReferencia = filas.filter(p => p.soloReferencia).length;
    await Datos.guardar('cortes', corte);
    if (d.activar) await Datos.fijarConfig('corteActivo', corte.id);
    await Auditoria.registrar('crear corte', corte.nombre + ' · ' + filas.length + ' precios' + (corte.cerrado ? ' · cerrado' : ''));
    return corte;
  }
  async function cerrar(id){
    const c = Datos.corte(id); if (!c || c.cerrado) return c;
    const n = Object.assign({}, c, { cerrado:true, cerradoEn:ahoraISO(), cerradoPor:Sesion.usuario ? Sesion.usuario.usuario : '' });
    await Datos.guardar('cortes', n);
    await Auditoria.registrar('cerrar corte', c.nombre);
    return n;
  }
  async function eliminar(id){
    const c = Datos.corte(id); if (!c) return;
    if (c.cerrado && !c.incluyeDemo) throw new Error('Un corte cerrado es inmutable: no se puede eliminar.');
    await Datos.borrar('cortes', id);
    if (Datos.config('corteActivo', null) === id) await Datos.fijarConfig('corteActivo', null);
    await Auditoria.registrar('eliminar corte', c.nombre);
  }
  return { precios, crear, cerrar, eliminar };
})();

const Equivalencias = (function(){
  /** Cómo va un insumo en el Excel para ARKEN: con la descripción, unidad y
      categoría exactas de allá cuando ya existe; si no, con las propias. */
  function paraArken(insumo){
    const e = Datos.equivalencia(insumo.id);
    if (e && e.estado === 'exacta') return { ok:true, existe:true, descripcion:e.descripcionArken, unidad:e.unidadArken, categoria:e.categoriaArken,
                                             factor:Number(e.factor) > 0 ? Number(e.factor) : 1, codigoArken:e.codigoArken || '' };
    if (e && e.estado === 'propuesta') return { ok:false, motivo:'Equivalencia con ARKEN por confirmar (Módulo 09)' };
    return { ok:true, existe:false, descripcion:insumo.descripcion, unidad:insumo.unidad, categoria:insumo.categoriaArken, factor:1, codigoArken:'' };
  }
  /** Lista de ARKEN contra la que se valida: la lista maestra importada o, si
      no hay, el catálogo semilla de ARKEN (lo que trae todo proyecto nuevo). */
  function listaArken(){
    const l = Datos.lista('listasArken').sort((a,b) => String(a.importada) < String(b.importada) ? 1 : -1)[0];
    if (l && l.filas && l.filas.length) return { origen:'Lista maestra importada el ' + fmtSello(l.importada) + (l.nombre ? ' (' + l.nombre + ')' : ''),
      filas:l.filas.map(f => ({ nombre:f.descripcion, unidad:f.unidad, categoria:f.categoria })) };
    return { origen:'Catálogo semilla de ARKEN (no se ha importado la lista maestra de su proyecto)',
      filas:Datos.equivalencias().filter(e => e.origen === 'semilla').map(e => ({ nombre:e.descripcionArken, unidad:e.unidadArken, categoria:e.categoriaArken })) };
  }
  return { paraArken, listaArken };
})();


/* ══════════════════════════════════════════════════════════════════════════
   INFORMES Y EXPORTACIONES (§10)
   Filas de precios de una ciudad (de un corte o de la base vigente), el
   Excel para ARKEN con su validador obligatorio, el Excel de análisis y el
   PDF de la base por categorías.
   ══════════════════════════════════════════════════════════════════════════ */
const Informes = (function(){
  const NOMBRE_PRECIO = { adoptado:'Adoptado (si no hay, el recomendado)', recomendado:'Recomendado', mediana:'Mediana', minimo:'Mínimo', promedio:'Promedio' };

  /** Ciudades que tienen al menos una observación de mercado. */
  function ciudadesConMercado(){
    return Datos.memorizar('ciuMercado', ['obs'], () => {
      const s = new Set();
      Datos.obsTodas().forEach(o => { if (o.ciudad && o.tipoPrecio !== 'referencia') s.add(o.ciudad); });
      return Array.from(s);
    });
  }
  /** Ciudades por defecto para actualizar y para un corte: la de referencia y las que tienen mercado. */
  function ciudadesPorDefecto(){
    const ref = Datos.ciudadReferencia();
    const out = ref ? [ref.codigoDivipola] : [];
    ciudadesConMercado().forEach(c => { if (out.indexOf(c) < 0 && Datos.ciudad(c) && Datos.ciudad(c).activa) out.push(c); });
    return out;
  }

  /** Precio que se exporta de una fila, según la elección del usuario. */
  function elegirPrecio(v, ad, modo){
    const m = modo || 'adoptado';
    if (m === 'adoptado' && ad && ad.precio > 0) return { valor:redondear3(ad.precio), origen:'adoptado' };
    if (!v) return { valor:null, origen:'sin dato' };
    const campo = { mediana:'mediana', minimo:'minimo', promedio:'promedio' }[m] || 'recomendado';
    let x = v[campo] > 0 ? v[campo] : null;
    if (!x && campo !== 'recomendado' && v.recomendado > 0 && v.soloReferencia) x = v.recomendado;
    return { valor:x, origen: x ? (v.soloReferencia ? 'referencia' : campo) : 'sin dato' };
  }
  /** Referencia de la semilla, calculada al vuelo (para cuando se excluye la demostración). */
  function soloReferencia(ins, ciudad){
    const refs = Datos.obs(ins.id).filter(o => o.tipoPrecio === 'referencia' && !o.esDemo);
    return Object.assign(Consolidacion.consolidar(ins, ciudad, hoyISO(), refs, Motor.contexto({})), { sinActualizar:true, sustituyeDemo:true });
  }

  /** Filas de precios de una ciudad. op = { ciudad, corteId, filtro(ins), precio, incluirDemo }. */
  function filas(op){
    const corte = op.corteId ? Datos.corte(op.corteId) : null;
    const porInsumo = corte ? new Map((corte.precios || []).filter(p => p.ciudad === op.ciudad).map(p => [p.insumoId, p])) : null;
    const out = [];
    Datos.insumosActivos().forEach(ins => {
      if (op.filtro && !op.filtro(ins)) return;
      let v = corte ? (porInsumo.get(ins.id) || null) : Precios.vigente(ins, op.ciudad);
      if (v && v.dependeDemo && !op.incluirDemo) v = soloReferencia(ins, op.ciudad);
      let ad = corte ? (v && v.adoptado) : Datos.adoptado(ins.id, op.ciudad);
      if (ad && ad.esDemo && !op.incluirDemo) ad = null;
      out.push({ ins, v, adoptado:ad || null, precio:elegirPrecio(v, ad, op.precio) });
    });
    return { corte, filas:out };
  }

  /** Filtro de insumos a partir de categorías elegidas en el árbol («grupo|categoría»). */
  function filtroCategorias(claves, extra){
    const set = new Set(claves || []);
    return ins => (!set.size || set.has(ins.grupo + '|' + ins.categoria)) && (!extra || extra(ins));
  }

  /* ═══════════ Excel para ARKEN (§10.1) ═══════════ */
  function aBase64(buf){
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s);
  }
  /** Arma los renglones: equivalencia exacta con ARKEN o insumo nuevo; lo que no puede ir, con su motivo. */
  function renglonesArken(op){
    const { corte, filas:fs } = filas(op);
    const ciudadNombre = Datos.nombreCiudad(op.ciudad);
    const renglones = [], excluidos = [], vistas = new Map();
    fs.forEach(f => {
      const ins = f.ins;
      if (!(f.precio.valor > 0)){
        if (op.listarSinPrecio !== false) excluidos.push({ descripcion:ins.descripcion, motivo:'Sin precio ' + (corte ? 'en el corte' : 'en la base') + ' para ' + ciudadNombre });
        return;
      }
      if (f.precio.origen === 'referencia' && !op.incluirReferencia){
        if (op.listarSinPrecio !== false) excluidos.push({ descripcion:ins.descripcion, motivo:'Solo tiene el precio de partida de ARKEN, sin observaciones de mercado' +
          (f.v && f.v.sustituyeDemo ? ' (sin contar la demostración)' : '') + '. No se exporta salvo que lo pida' });
        return;
      }
      const e = Equivalencias.paraArken(ins);
      if (!e.ok){ excluidos.push({ descripcion:ins.descripcion, motivo:e.motivo }); return; }
      if (op.alcanceArken === 'existentes' && !e.existe) return;
      if (op.alcanceArken === 'nuevos' && e.existe) return;
      if (ins.investigable === false && !op.incluirNoInvestigables){
        excluidos.push({ descripcion:ins.descripcion, motivo:'No investigable (valor pactado o porcentual): no se exporta salvo que lo pida' });
        return;
      }
      if (CATEGORIAS_ARKEN.indexOf(e.categoria) < 0){ excluidos.push({ descripcion:ins.descripcion, motivo:'Su categoría ARKEN («' + e.categoria + '») no es una de las siete' }); return; }
      const desc = String(e.descripcion || '').trim();
      if (!desc){ excluidos.push({ descripcion:ins.codigo, motivo:'Sin descripción' }); return; }
      const k = normaliza(desc);
      if (vistas.has(k)){ excluidos.push({ descripcion:desc, motivo:'Descripción repetida con el insumo ' + vistas.get(k) + ' (ARKEN las uniría)' }); return; }
      vistas.set(k, ins.codigo);
      const v = f.v || {};
      const fuentes = new Set(), enlaces = new Set();
      (v.observacionesUsadas || []).forEach(id => {
        const o = Datos.obsTodas().get(id);
        if (!o) return;
        fuentes.add(Datos.nombreFuente(o.fuenteId));
        if (o.url) enlaces.add(o.url);
      });
      renglones.push({
        categoria:e.categoria, unidad:String(e.unidad || '').trim() || 'UN', descripcion:desc,
        precioArken:redondear3(f.precio.valor * e.factor), codigoInterno:ins.codigo, codigoArken:e.codigoArken || '',
        tarifaIva:ins.baseIva === 'precio' ? ins.tarifaIva : 0, factor:e.factor, unidadCanonica:ins.unidad,
        n:v.n || 0, minimo:v.minimo, mediana:v.mediana, maximo:v.maximo,
        confianza:f.precio.origen === 'adoptado' ? 'adoptado' : (v.confianza || ''), nivel:v.nivel || '',
        fuentes:Array.from(fuentes).slice(0, 8), enlaces:Array.from(enlaces).slice(0, 5),
        dependeDemo:!!(v.dependeDemo || (f.adoptado && f.adoptado.esDemo)), existe:e.existe, origenPrecio:f.precio.origen
      });
    });
    renglones.sort((a,b) => (CATEGORIAS_ARKEN.indexOf(a.categoria) - CATEGORIAS_ARKEN.indexOf(b.categoria)) ||
      (a.codigoInterno < b.codigoInterno ? -1 : (a.codigoInterno > b.codigoInterno ? 1 : 0)));
    return { corte, renglones, excluidos, ciudadNombre };
  }

  /** Construye el libro y lo valida leyéndolo como lo leerá ARKEN. Nada se guarda si falla. */
  function excelArken(op){
    if (!Documentos.hayXLSX()) throw new Error('No está disponible la librería de Excel (SheetJS). Conéctese a internet una vez y vuelva a intentarlo.');
    const r = renglonesArken(op);
    const lista = Equivalencias.listaArken();
    const nombreRedondeo = { peso:'al peso', centena:'a la centena', ninguno:'' }[op.redondeo || 'ninguno'];
    const def = ContratoArken.armarLibro({
      ciudadNombre:r.ciudadNombre,
      corteNombre:r.corte ? r.corte.nombre : 'Precios vigentes al ' + fmtFecha(hoyISO()),
      corteFecha:r.corte ? r.corte.fecha : '',
      precioExportado:NOMBRE_PRECIO[op.precio || 'adoptado'], redondeo:op.redondeo || 'ninguno', redondeoNombre:nombreRedondeo,
      usuario:Sesion.usuario ? Sesion.usuario.usuario : '', incluyeDemo:r.renglones.some(x => x.dependeDemo),
      renglones:r.renglones, excluidos:r.excluidos
    });
    const idxEnc = def.hojas[0].filas.findIndex(f => f[0] === 'Categoría');
    const wb = Documentos.libro([
      { nombre:'Insumos', filas:def.hojas[0].filas, anchos:def.hojas[0].anchos, filaEncabezado:idxEnc, formatos:{ 3:'#,##0.000' }, sinFiltro:true },
      { nombre:'Detalle', filas:def.hojas[1].filas, anchos:def.hojas[1].anchos, filaEncabezado:0, formatos:{ 7:'#,##0.000', 8:'#,##0.000', 13:'#,##0.000', 14:'#,##0.000', 15:'#,##0.000' } },
      { nombre:'Notas', filas:def.hojas[2].filas, anchos:def.hojas[2].anchos }
    ]);
    const bytes = Documentos.libroABytes(wb);
    const wb2 = XLSX.read(aBase64(bytes), { type:'base64' });
    const filasLeidas = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], { header:1 });
    const validacion = ContratoArken.validar(filasLeidas, def.esperado, lista.filas);
    const existentes = r.renglones.filter(x => x.existe).length;
    return { bytes, nombre:def.nombreArchivo, validacion, renglones:r.renglones, excluidos:r.excluidos, corte:r.corte,
             listaOrigen:lista.origen, existentes, nuevos:r.renglones.length - existentes, ciudadNombre:r.ciudadNombre };
  }

  /** Archivo de intercambio ARKEN-PRECIOS (JSON con hash) con los mismos renglones. */
  function intercambio(op){
    const r = renglonesArken(op);
    const obj = Formatos.envolver(Formatos.INTERCAMBIO, {
      ciudad:{ codigo:op.ciudad, nombre:r.ciudadNombre }, corte:r.corte ? { id:r.corte.id, nombre:r.corte.nombre, fecha:r.corte.fecha } : null,
      precioExportado:NOMBRE_PRECIO[op.precio || 'adoptado'],
      renglones:r.renglones.map(x => ({ categoria:x.categoria, unidad:x.unidad, descripcion:x.descripcion, precio:x.precioArken, codigoInterno:x.codigoInterno,
        codigoArken:x.codigoArken, tarifaIva:x.tarifaIva, n:x.n, confianza:x.confianza, fuentes:x.fuentes, enlaces:x.enlaces, demostracion:x.dependeDemo }))
    }, { programa:'ARKEN PRECIOS' });
    return { texto:JSON.stringify(obj, null, 1), nombre:nombreArchivoSeguro('ARKEN_PRECIOS_' + r.ciudadNombre + '_' + (r.corte ? r.corte.nombre : hoyISO())) + '.json' };
  }
